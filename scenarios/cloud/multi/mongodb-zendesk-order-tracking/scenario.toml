[scenario]
id = "cloud/multi/mongodb-zendesk-order-tracking"
title = "Find the tracking details in MongoDB for the order a Zendesk ticket asks about"
now = "2026-10-29T15:00:00Z"
seed = "cloud-multi-mongodb-zendesk-order-tracking"
services = ["mongodb", "zendesk"]
tags = ["lookup", "multi-service", "mongodb", "zendesk", "disambiguation"]
timeout_sec = 1200

[scenario.family]
schema_version = 1
primary = "entity_ambiguity"
secondary = ["cross_system_identity", "stale_state"]
dependency_depth = 3
rationale = "Hana Sato has orders 10598 (delivered, solved ticket 4208), 10601 (shipped UPS, open ticket 4222) and 10605; Diego's 10603 is the same headphones that day and shop_staging has a fake-tracking 10601."

# Open ticket 4222: the Studio X2 headphones Hana ordered on October 21 = shop.orders 10601,
# shipped, UPS 1Z4X97W80391827364. Look-alikes: her solved ticket 4208 (order 10598, USPS),
# her other open order 10605 (processing), Diego Alvarez's headphones order 10603 the same day
# (FedEx), and a shop_staging copy of 10601 marked delivered with a fake tracking number.
[expect]
version = 2
audit_history = true

# The order is the production shop.orders document created on October 21, 2026 (the order
# date the ticket body gives) whose customer email is that of the Zendesk user Hana Sato.
# "not yet delivered" is a true aside about a shipped order.
[expect.answer.record_facts]
requirement = "State the order number, current status, carrier and tracking number of the production shop.orders order that Zendesk requester Hana Sato placed on October 21, 2026."
mode = "statements"
context = [
  "but has not yet been delivered",
  "but has not been delivered",
  "hasn't yet been delivered",
  "hasn't been delivered",
  "not yet been delivered",
  "not yet delivered",
  "not delivered yet",
  "on Oct 23",
  "on 2026-10-23",
  "ETA Oct 31",
  "estimated delivery 2026-10-31",
]

[expect.answer.record_facts.selector]
collection = "/services/mongodb/db.shop.orders"
field_patterns = { "/createdAt/$date" = "^2026-10-21T" }

[[expect.answer.record_facts.selector.references]]
source_field = "/customer/email"
target_field = "/email"

[expect.answer.record_facts.selector.references.target]
collection = "/services/zendesk/users"
matching = { name = "Hana Sato" }

[expect.answer.record_facts.facts.order]
field = "/orderNumber"
kind = "identifier"

[expect.answer.record_facts.facts.status]
field = "/status"
kind = "text"

[expect.answer.record_facts.facts.carrier]
field = "/shipping/carrier"
kind = "text"

[expect.answer.record_facts.facts.tracking]
field = "/shipping/trackingNumber"
kind = "identifier"

[[expect.forbidden_calls]]
service = "zendesk"
path = "/_mcp/tools/call"
body = { name = "create_ticket_comment" }

[[expect.forbidden_calls]]
service = "zendesk"
path = "/_mcp/tools/call"
body = { name = "update_ticket" }

[[expect.forbidden_calls]]
service = "mongodb"
path = "/_mcp/tools/call"
body = { name = "update-many" }

[[expect.forbidden_calls]]
service = "mongodb"
path = "/_mcp/tools/call"
body = { name = "delete-many" }

[[expect.forbidden_calls]]
service = "mongodb"
path = "/_mcp/tools/call"
body = { name = "insert-many" }

[[solution.call]]
endpoint = "zendesk"
tool = "get_tickets"
arguments = {}

[[solution.call]]
endpoint = "zendesk"
tool = "get_ticket_comments"
arguments = { ticket_id = 4222 }

[[solution.call]]
endpoint = "mongodb"
tool = "find"
arguments = { connectionId = "preconfigured", database = "shop", collection = "orders", filter = { "customer.email" = "hana.sato@example.org" } }

[solution]
answer = "Order 10601: shipped, UPS, tracking 1Z4X97W80391827364."
