[scenario]
id = "cloud/multi/okta-offboard-linear-slack"
title = "Offboard Lena Fischer across Okta, Linear and Slack (not Lena Fisher in Sales)"
now = "2026-10-29T15:00:00Z"
seed = "cloud-multi-okta-offboard-linear-slack"
services = ["okta", "linear", "slack"]
tags = ["write", "multi-service", "okta", "linear", "slack", "disambiguation"]
timeout_sec = 1200

[scenario.family]
schema_version = 1
primary = "entity_ambiguity"
secondary = ["cross_system_identity", "tool_ambiguity"]
dependency_depth = 3
rationale = "Okta has Lena Fischer (Product, 00u1lnfschr3Ab4Cd5x7) and Lena Fisher (Sales, 00u1lnfshr07Ef8Gh9x7); lifecycle calls on Fisher and user DELETE are forbidden; Fischer is matched to Linear by email."

# Okta has Lena Fischer (Product, 00u1lnfschr3Ab4Cd5x7) and the look-alike Lena Fisher
# (Sales, 00u1lnfshr07Ef8Gh9x7). Fischer is deactivated, not deleted, and keeps her groups. In
# Linear she is in Payments (c60777c7...) and Web App (b66a35a6...); every membership of hers goes
# and nobody else's changes. The notice lands in #it-ops (C0ITOPS5LF2), not the archived
# #it-requests-archive, and is causally after both outcomes it reports: the Okta deactivation and
# the actual absence of every Linear membership of hers (a record-count prerequisite).

[expect]
version = 2
audit_history = true

[[expect.records]]
selector = { collection = "/services/okta/users", matching = { profile = { login = "lena.fischer@octo-corp.example", firstName = "Lena", lastName = "Fischer", department = "Product" } } }
equals = 1
fields = { "/id" = "00u1lnfschr3Ab4Cd5x7", "/status" = "DEPROVISIONED" }

[[expect.records]]
selector = { collection = "/services/okta/users", matching = { profile = { login = "lena.fisher@octo-corp.example" } } }
equals = 1
fields = { "/id" = "00u1lnfshr07Ef8Gh9x7", "/status" = "ACTIVE" }

[[expect.records]]
selector = { collection = "/services/linear/users", matching = { id = "3dbdd473-1a04-5dda-ad95-4c583313bccd", name = "Lena Fischer", email = "lena.fischer@octo-corp.example" } }
equals = 1
fields = { "/active" = true }

[[expect.records]]
selector = { collection = "/services/linear/team_memberships", matching = { userId = "3dbdd473-1a04-5dda-ad95-4c583313bccd" } }
equals = 0

[[expect.records]]
selector = { collection = "/services/slack/posted", created = true }
equals = 1
fields = { "/user" = "U02CMORG8RK", "/channel" = "C0ITOPS5LF2" }

[expect.records.reviewed_text."/text"]
requirement = "Post a short notice that Lena Fischer (Product) has been offboarded, saying her Okta account was deactivated and that she was removed from Linear. A deletion claim, the look-alike Lena Fisher, a missing Okta or Linear outcome and a premature announcement are not acceptable. The channel supplies context; Linear team names are optional but must be true when stated. Unlisted nonempty wording requires adjudication."
accepted = [
  "Offboarding notice: Lena Fischer (Product) has been offboarded. Her Okta account is deactivated (not deleted) and she has been removed from the Payments and Web App teams in Linear.",
  "Lena Fischer has been offboarded: Okta deactivated, removed from Linear.",
  "Lena Fischer has been offboarded (Okta deactivated, removed from Linear).",
  "Offboarding notice: Lena Fischer has been offboarded. Okta deactivated, removed from Linear.",
  "Lena Fischer (Product) has been offboarded. Okta account deactivated (not deleted); removed from the Payments and Web App teams in Linear.",
]
rejected = [
  "Lena Fisher has been offboarded. Her Okta account is deactivated and she has been removed from Linear.",
  "Lena Fischer has been offboarded. Her Okta account was deleted and she has been removed from Linear.",
]

[[expect.records]]
selector = { collection = "/services/slack/messages", created = true }
equals = 1

[[expect.relations]]
source = { collection = "/services/slack/posted", created = true }
source_field = "/channel"
target = { collection = "/services/slack/channels", matching = { id = "C0ITOPS5LF2", name = "it-ops", is_archived = false } }
target_field = "/id"
kind = "foreign_key"

[[expect.relations]]
source = { collection = "/services/slack/posted", created = true }
source_field = "/ts"
target = { collection = "/services/slack/messages", created = true }
target_field = "/ts"
kind = "bijection"
fields = [
  { source_field = "/channel", target_field = "/channel", kind = "equals" },
  { source_field = "/text", target_field = "/text", kind = "equals" },
]

[[expect.ordering]]
prerequisite = { selector = { collection = "/services/okta/users", matching = { profile = { login = "lena.fischer@octo-corp.example" } } }, field = "/status", equals = "DEPROVISIONED" }
action = { selector = { collection = "/services/slack/posted", created = true }, field = "/text", nonempty_text = true }

[[expect.ordering]]
prerequisite = { selector = { collection = "/services/linear/team_memberships", matching = { userId = "3dbdd473-1a04-5dda-ad95-4c583313bccd" } }, record_count = 0 }
action = { selector = { collection = "/services/slack/posted", created = true }, field = "/text", nonempty_text = true }

[[expect.forbidden_calls]]
service = "okta"
method = "DELETE"
path_regex = "^/api/v1/users/"

[[expect.forbidden_calls]]
service = "okta"
path_regex = "(?i)^/api/v1/users/(00u1lnfshr07Ef8Gh9x7|lena\\.fisher(@|%40)octo-corp\\.example)/lifecycle/"

[[expect.preservation.allow]]
pointer = "/services/okta/users/00u1lnfschr3Ab4Cd5x7/status"
matching = { status = "DEPROVISIONED" }
cause = { service = "okta", methods = ["POST"], path_regex = "(?i)^/api/v1/users/(00u1lnfschr3Ab4Cd5x7|lena\\.fischer(@|%40)octo-corp\\.example)/lifecycle/deactivate$" }

[[expect.preservation.allow]]
pointer = "/services/okta/users/00u1lnfschr3Ab4Cd5x7/activated"
matching = { status = "DEPROVISIONED" }
cause = { service = "okta", methods = ["POST"], path_regex = "(?i)^/api/v1/users/(00u1lnfschr3Ab4Cd5x7|lena\\.fischer(@|%40)octo-corp\\.example)/lifecycle/deactivate$" }

[[expect.preservation.allow]]
pointer = "/services/okta/users/00u1lnfschr3Ab4Cd5x7/statusChanged"
cause = { service = "okta", methods = ["POST"], path_regex = "(?i)^/api/v1/users/(00u1lnfschr3Ab4Cd5x7|lena\\.fischer(@|%40)octo-corp\\.example)/lifecycle/deactivate$" }

[[expect.preservation.allow]]
pointer = "/services/okta/users/00u1lnfschr3Ab4Cd5x7/lastUpdated"
cause = { service = "okta", methods = ["POST"], path_regex = "(?i)^/api/v1/users/(00u1lnfschr3Ab4Cd5x7|lena\\.fischer(@|%40)octo-corp\\.example)/lifecycle/deactivate$" }

[[expect.preservation.allow]]
pointer = "/services/okta/logs/*"
kind = "create"
matching = { eventType = "user.lifecycle.deactivate", outcome = { result = "SUCCESS" }, actor = { id = "0oa8wq4n2Yc6Ds7Rt0x7" } }
references = [{ source_field = "/target/0/id", target = { collection = "/services/okta/users", matching = { profile = { login = "lena.fischer@octo-corp.example" } } }, target_field = "/id" }]
count_scope = "per_commit"
cause = { service = "okta", methods = ["POST"], path_regex = "(?i)^/api/v1/users/(00u1lnfschr3Ab4Cd5x7|lena\\.fischer(@|%40)octo-corp\\.example)/lifecycle/deactivate$" }

[[expect.preservation.allow]]
pointer = "/services/linear/team_memberships/*"
kind = "delete"
matching = { userId = "3dbdd473-1a04-5dda-ad95-4c583313bccd" }
max_count = "all_matching"

[[expect.preservation.allow]]
pointer = "/services/slack/posted/*"
kind = "create"
matching = { user = "U02CMORG8RK", channel = "C0ITOPS5LF2" }

[[expect.preservation.allow]]
pointer = "/services/slack/messages/*"
kind = "create"
matching = { user = "U02CMORG8RK", channel = "C0ITOPS5LF2" }

[[solution.call]]
endpoint = "okta"
tool = "list_users"
arguments = { search = 'profile.firstName eq "Lena"' }

[[solution.call]]
endpoint = "okta"
tool = "deactivate_user"
arguments = { user_id = "00u1lnfschr3Ab4Cd5x7" }

[[solution.call]]
endpoint = "linear"
tool = "linear_getUsers"
arguments = {}

[[solution.call]]
endpoint = "linear"
tool = "linear_getTeams"
arguments = {}

[[solution.call]]
endpoint = "linear"
tool = "linear_removeUserFromTeam"
arguments = { teamId = "5854633b-d1e9-52b6-b3c7-d309bfb881cb", userId = "3dbdd473-1a04-5dda-ad95-4c583313bccd" }

[[solution.call]]
endpoint = "linear"
tool = "linear_removeUserFromTeam"
arguments = { teamId = "6da75b4c-0e7c-5ac7-a415-f09a129582b1", userId = "3dbdd473-1a04-5dda-ad95-4c583313bccd" }

[[solution.call]]
endpoint = "slack"
tool = "slack_search_channels"
arguments = { keywords = ["it-ops"], natural_language_query = "IT ops channel for offboarding notices" }

[[solution.call]]
endpoint = "slack"
tool = "slack_send_message"
arguments = { channel_id = "C0ITOPS5LF2", message = "Offboarding notice: Lena Fischer (Product) has been offboarded. Her Okta account is deactivated (not deleted) and she has been removed from the Payments and Web App teams in Linear." }
