[scenario]
id = "cloud/multi/aws-jira-decommission-worker"
title = "Work a Jira decommission ticket: stop and tag the prod EC2 worker, then close the ticket"
now = "2026-10-29T15:00:00Z"
seed = "cloud-multi-aws-jira-decommission-worker"
services = ["aws", "jira"]
tags = ["write", "multi-service", "aws", "jira", "disambiguation"]
timeout_sec = 1200

[scenario.family]
schema_version = 1
primary = "entity_ambiguity"
secondary = ["tool_ambiguity", "cross_system_identity"]
dependency_depth = 3
rationale = "Ticket OPS-34 names reporting-worker-legacy, which matches prod i-07b9d1f3a5c8e2046 and staging twin i-0e4a6c8b2d1f35790; contract forbids TerminateInstances and rejects a staging stop; OPS-33 is the done look-alike."

# OPS-34 (In Progress, assigned to the caller jordan.lee) asks to stop, not terminate, the prod
# reporting-worker-legacy (i-07b9d1f3a5c8e2046), keep its disk and tag it DecommissionTicket=OPS-34.
# The staging twin i-0e4a6c8b2d1f35790 keeps running. OPS-33 (Done) is the earlier scheduler
# decommission; its stopped instance keeps its OPS-33 tag. The user then wants a truthful comment on
# OPS-34 and the ticket closed as Done, so both are causally after the stop and the tag.

[expect]
version = 2
audit_history = true

[[expect.records]]
selector = { collection = "/services/aws/instances", matching = { instanceId = "i-07b9d1f3a5c8e2046" } }
equals = 1
fields = { "/instanceState/name" = "stopped", "/instanceState/code" = 80, "/rootDeviceType" = "ebs" }

[[expect.records]]
selector = { collection = "/services/aws/instances/i-07b9d1f3a5c8e2046/tagSet", identity_field = "/key", matching = { key = "DecommissionTicket" } }
equals = 1
fields = { "/value" = "OPS-34" }

[[expect.records]]
selector = { collection = "/services/aws/volumes", matching = { attachmentSet = [{ instanceId = "i-07b9d1f3a5c8e2046" }] } }
min_count = 1
fields = { "/status" = "in-use" }

[[expect.relations]]
source = { collection = "/services/aws/instances/i-07b9d1f3a5c8e2046/blockDeviceMapping", identity_field = "/deviceName", key_prefix = "/dev/" }
source_field = "/ebs/volumeId"
target = { collection = "/services/aws/volumes", matching = { attachmentSet = [{ instanceId = "i-07b9d1f3a5c8e2046" }] } }
target_field = "/volumeId"
kind = "foreign_key"

[[expect.state]]
pointer = "/services/jira/issues/OPS-34/fields/status"
equals = "Done"

[[expect.state]]
pointer = "/services/jira/issues/OPS-34/fields/resolution"
equals = "Done"

[[expect.state]]
pointer = "/services/jira/issues/OPS-34/fields/resolutiondate"
exists = true
is_null = false

[[expect.records]]
selector = { collection = "/services/jira/comments", created = true }
equals = 1
fields = { "/issue" = "OPS-34", "/author" = "jordan.lee" }

[expect.records.reviewed_text."/body"]
requirement = "Tell the OPS-34 ticket what was done: the production reporting-worker-legacy instance was stopped, not terminated, and tagged DecommissionTicket=OPS-34. The ticket association supplies context. The instance ID, retained disk and untouched staging copy are optional but must be true when stated. Termination, a staging stop or an omitted stop or tag claim is not acceptable. Unlisted nonempty wording requires adjudication."
accepted = [
  "Stopped (not terminated) the production instance reporting-worker-legacy (i-07b9d1f3a5c8e2046) and tagged it DecommissionTicket=OPS-34. Its EBS volume is kept. The staging copy (i-0e4a6c8b2d1f35790) is still running.",
  "Stopped (not terminated) the production instance reporting-worker-legacy (i-07b9d1f3a5c8e2046) and tagged it DecommissionTicket=OPS-34. Its EBS volume is kept.",
  "Stopped (not terminated) the production instance reporting-worker-legacy (i-07b9d1f3a5c8e2046) and tagged it DecommissionTicket=OPS-34. The staging copy (i-0e4a6c8b2d1f35790) is still running.",
  "Stopped (not terminated) the production instance reporting-worker-legacy and tagged it DecommissionTicket=OPS-34.",
  "Stopped production reporting-worker-legacy (i-07b9d1f3a5c8e2046) without terminating it and tagged it DecommissionTicket=OPS-34.",
  "Stopped the prod reporting-worker-legacy instance (kept, not terminated) and tagged it DecommissionTicket=OPS-34. Staging was left running.",
]
rejected = [
  "Terminated the production instance reporting-worker-legacy (i-07b9d1f3a5c8e2046) and tagged it DecommissionTicket=OPS-34.",
  "Stopped the staging instance reporting-worker-legacy (i-0e4a6c8b2d1f35790) and tagged it DecommissionTicket=OPS-34.",
]

[[expect.ordering]]
prerequisite = { selector = { collection = "/services/aws/instances", matching = { instanceId = "i-07b9d1f3a5c8e2046" } }, field = "/instanceState/name", equals = "stopped" }
action = { selector = { collection = "/services/jira/comments", created = true }, field = "/body", nonempty_text = true }

[[expect.ordering]]
prerequisite = { selector = { collection = "/services/aws/instances", matching = { instanceId = "i-07b9d1f3a5c8e2046" } }, field = "/tagSet", has_value = { key = "DecommissionTicket", value = "OPS-34" } }
action = { selector = { collection = "/services/jira/comments", created = true }, field = "/body", nonempty_text = true }

[[expect.ordering]]
prerequisite = { selector = { collection = "/services/aws/instances", matching = { instanceId = "i-07b9d1f3a5c8e2046" } }, field = "/instanceState/name", equals = "stopped" }
action = { selector = { collection = "/services/jira/issues", matching = { key = "OPS-34" } }, field = "/fields/status", equals = "Done" }

[[expect.ordering]]
prerequisite = { selector = { collection = "/services/aws/instances", matching = { instanceId = "i-07b9d1f3a5c8e2046" } }, field = "/tagSet", has_value = { key = "DecommissionTicket", value = "OPS-34" } }
action = { selector = { collection = "/services/jira/issues", matching = { key = "OPS-34" } }, field = "/fields/status", equals = "Done" }

[[expect.forbidden_calls]]
service = "aws"
body_contains = "Action=TerminateInstances"

[[expect.forbidden_calls]]
service = "jira"
method = "DELETE"

[[expect.preservation.allow]]
pointer = "/services/aws/instances/i-07b9d1f3a5c8e2046/instanceState/name"
matching = { instanceState = { name = "stopped", code = 80 } }

[[expect.preservation.allow]]
pointer = "/services/aws/instances/i-07b9d1f3a5c8e2046/instanceState/code"
matching = { instanceState = { name = "stopped", code = 80 } }

[[expect.preservation.allow]]
pointer = "/services/aws/instances/i-07b9d1f3a5c8e2046/reason"
matching = { instanceState = { name = "stopped", code = 80 } }

[[expect.preservation.allow]]
pointer = "/services/aws/instances/i-07b9d1f3a5c8e2046/publicIpAddress"
kind = "remove_field"
matching = { instanceState = { name = "stopped", code = 80 } }

[[expect.preservation.allow]]
pointer = "/services/aws/instances/i-07b9d1f3a5c8e2046/ipAddress"
kind = "remove_field"
matching = { instanceState = { name = "stopped", code = 80 } }

[[expect.preservation.allow]]
pointer = "/services/aws/instances/i-07b9d1f3a5c8e2046/tagSet"
kind = "append"
identity_field = "/key"
matching = { key = "DecommissionTicket", value = "OPS-34" }

[[expect.preservation.allow]]
pointer = "/services/jira/issues/OPS-34/fields/status"

[[expect.preservation.allow]]
pointer = "/services/jira/issues/OPS-34/fields/resolution"

[[expect.preservation.allow]]
pointer = "/services/jira/issues/OPS-34/fields/resolutiondate"

[[expect.preservation.allow]]
pointer = "/services/jira/issues/OPS-34/fields/updated"

[[expect.preservation.allow]]
pointer = "/services/jira/issues/OPS-34/changelog"

[[expect.preservation.allow]]
pointer = "/services/jira/comments/*"
kind = "create"
matching = { issue = "OPS-34" }

[[solution.call]]
endpoint = "atlassian"
tool = "jira_search"
arguments = { jql = "project = OPS AND assignee = currentUser() AND statusCategory != Done", fields = "summary,status,description" }

[[solution.call]]
endpoint = "atlassian"
tool = "jira_get_issue"
arguments = { issue_key = "OPS-34" }

[[solution.call]]
endpoint = "aws-api"
tool = "call_aws"
arguments = { cli_command = "aws ec2 describe-instances --filters Name=tag:Name,Values=reporting-worker-legacy" }

[[solution.call]]
endpoint = "aws-api"
tool = "call_aws"
arguments = { cli_command = [
  "aws ec2 stop-instances --instance-ids i-07b9d1f3a5c8e2046",
  "aws ec2 create-tags --resources i-07b9d1f3a5c8e2046 --tags Key=DecommissionTicket,Value=OPS-34",
] }

[[solution.call]]
endpoint = "atlassian"
tool = "jira_add_comment"
arguments = { issue_key = "OPS-34", body = "Stopped (not terminated) the production instance reporting-worker-legacy (i-07b9d1f3a5c8e2046) and tagged it DecommissionTicket=OPS-34. Its EBS volume is kept. The staging copy (i-0e4a6c8b2d1f35790) is still running." }

[[solution.call]]
endpoint = "atlassian"
tool = "jira_transition_issue"
arguments = { issue_key = "OPS-34", transition_id = "31", fields = "{\"resolution\": {\"name\": \"Done\"}}" }
