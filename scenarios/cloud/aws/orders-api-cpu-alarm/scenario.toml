[scenario]
id = "cloud/aws/orders-api-cpu-alarm"
title = "Create a CPU alarm for the production orders-api instance"
now = "2026-03-14T09:00:00Z"
seed = "cloud-aws-orders-api-cpu-alarm"
services = ["aws"]
tags = ["write", "single-service", "aws"]
timeout_sec = 900

[expect]
version = 2
audit_history = true

[[expect.records]]
selector = { collection = "/services/aws/alarms", matching = { AlarmName = "orders-api-high-cpu", _region = "us-east-1" } }
equals = 1
fields = { "/AlarmArn" = "arn:aws:cloudwatch:us-east-1:481562039417:alarm:orders-api-high-cpu", "/ActionsEnabled" = true, "/AlarmActions" = ["arn:aws:sns:us-east-1:481562039417:ops-pager"] }
optional_fields = { "/OKActions" = [], "/InsufficientDataActions" = [] }
metric_alarm = { account = "481562039417", namespace = "AWS/EC2", metric = "CPUUtilization", dimensions = { InstanceId = "i-04c1a7e2b9d35f018" }, statistic = "Average", period = 300, evaluation_periods = 3, threshold = 80, comparison = "GreaterThanThreshold", unit = "Percent" }

[[expect.preservation.allow]]
pointer = "/services/aws/alarms/*"
kind = "create"
matching = { AlarmName = "orders-api-high-cpu", AlarmArn = "arn:aws:cloudwatch:us-east-1:481562039417:alarm:orders-api-high-cpu", _region = "us-east-1" }

