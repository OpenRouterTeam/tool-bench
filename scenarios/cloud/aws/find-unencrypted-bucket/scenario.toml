[scenario]
id = "cloud/aws/find-unencrypted-bucket"
title = "Find the S3 bucket whose default encryption does not meet the KMS policy"
now = "2026-03-14T09:00:00Z"
seed = "cloud-aws-find-unencrypted-bucket"
services = ["aws"]
tags = ["lookup", "single-service", "aws"]
timeout_sec = 900

[scenario.family]
schema_version = 1
primary = "entity_ambiguity"
secondary = []
dependency_depth = 2
rationale = "Of 7 buckets only northwind-legacy-exports is AES256; look-alike northwind-legacy-exports-2019 is KMS with BucketKeyEnabled false too, and the anchored answer regex rejects the -2019 name."

# Exactly the bucket name: "northwind-legacy-exports-2019" (encrypted) does not match.
[expect]
version = 2
audit_history = true

[expect.answer]

[expect.answer.record_facts]
requirement = "Name the S3 bucket whose default encryption is SSE-S3 (SSEAlgorithm AES256) instead of SSE-KMS, and no other bucket."
mode = "statements"
# Words that say the bucket already meets the policy. A bare "KMS" is not a cue: a correct
# answer may say the bucket uses SSE-S3 instead of SSE-KMS.
contradictions = ["uses kms", "uses sse-kms", "uses aws:kms"]

context = [
  "(default encryption SSE-S3, AES256)",
  "(AES256)",
]
assertions = [
  "${bucket}",
  "The bucket is ${bucket}.",
  "${bucket} defaults to SSE-S3 instead of the required SSE-KMS.",
  "${bucket} defaults to SSE-S3 instead of SSE-KMS.",
]

[expect.answer.record_facts.selector]
collection = "/services/aws/buckets"
matching = { Encryption = { SSEAlgorithm = "AES256" } }

[expect.answer.record_facts.facts.bucket]
field = "/Name"
kind = "identifier"

[[expect.required_calls]]
service = "aws"
method = "GET"
path = "/northwind-legacy-exports"
query_contains = "encryption"
response_status = [200]

[[expect.records]]
selector = { collection = "/services/aws/buckets", matching = { Encryption = { SSEAlgorithm = "AES256" } } }
equals = 1
fields = { "/Name" = "northwind-legacy-exports" }

# Read-only task: no bucket configuration changes.
[[expect.forbidden_calls]]
service = "aws"
method = "PUT"

[[expect.forbidden_calls]]
service = "aws"
method = "DELETE"

[[solution.call]]
endpoint = "aws-api"
tool = "call_aws"
arguments = { cli_command = "aws s3api list-buckets" }

[[solution.call]]
endpoint = "aws-api"
tool = "call_aws"
arguments = { cli_command = [
  "aws s3api get-bucket-encryption --bucket northwind-app-assets",
  "aws s3api get-bucket-encryption --bucket northwind-cloudtrail-logs",
  "aws s3api get-bucket-encryption --bucket northwind-data-lake-raw",
  "aws s3api get-bucket-encryption --bucket northwind-legacy-exports",
  "aws s3api get-bucket-encryption --bucket northwind-legacy-exports-2019",
  "aws s3api get-bucket-encryption --bucket northwind-terraform-state",
  "aws s3api get-bucket-encryption --bucket northwind-eu-backups",
] }

[solution]
answer = "northwind-legacy-exports\n"
