[scenario]
id = "cloud/aws/stop-legacy-reporting-worker"
title = "Stop and tag the production legacy reporting worker, not its staging twin"
now = "2026-03-14T09:00:00Z"
seed = "cloud-aws-stop-legacy-reporting-worker"
services = ["aws"]
tags = ["write", "single-service", "aws", "disambiguation"]
timeout_sec = 900

[expect]
version = 2
audit_history = true

[[expect.records]]
selector = { collection = "/services/aws/instances", matching = { instanceId = "i-07b9d1f3a5c8e2046" } }
equals = 1
fields = { "/instanceState/name" = "stopped", "/instanceState/code" = 80, "/rootDeviceType" = "ebs" }

[[expect.records]]
selector = { collection = "/services/aws/instances/i-07b9d1f3a5c8e2046/tagSet", identity_field = "/key", matching = { key = "DecommissionTicket" } }
equals = 1
fields = { "/value" = "OPS-4821" }

[[expect.records]]
selector = { collection = "/services/aws/volumes", matching = { attachmentSet = [{ instanceId = "i-07b9d1f3a5c8e2046" }] } }
min_count = 1
fields = { "/status" = "in-use" }

[[expect.relations]]
source = { collection = "/services/aws/instances/i-07b9d1f3a5c8e2046/blockDeviceMapping", identity_field = "/deviceName", key_prefix = "/dev/" }
source_field = "/ebs/volumeId"
target = { collection = "/services/aws/volumes", matching = { attachmentSet = [{ instanceId = "i-07b9d1f3a5c8e2046" }] } }
target_field = "/volumeId"
kind = "foreign_key"

[[expect.preservation.allow]]
pointer = "/services/aws/instances/i-07b9d1f3a5c8e2046/instanceState/name"
matching = { instanceState = { name = "stopped", code = 80 } }

[[expect.preservation.allow]]
pointer = "/services/aws/instances/i-07b9d1f3a5c8e2046/instanceState/code"
matching = { instanceState = { name = "stopped", code = 80 } }

[[expect.preservation.allow]]
pointer = "/services/aws/instances/i-07b9d1f3a5c8e2046/reason"
matching = { instanceState = { name = "stopped", code = 80 } }

[[expect.preservation.allow]]
pointer = "/services/aws/instances/i-07b9d1f3a5c8e2046/publicIpAddress"
kind = "remove_field"
matching = { instanceState = { name = "stopped", code = 80 } }

[[expect.preservation.allow]]
pointer = "/services/aws/instances/i-07b9d1f3a5c8e2046/ipAddress"
kind = "remove_field"
matching = { instanceState = { name = "stopped", code = 80 } }

[[expect.preservation.allow]]
pointer = "/services/aws/instances/i-07b9d1f3a5c8e2046/tagSet"
kind = "append"
identity_field = "/key"
matching = { key = "DecommissionTicket", value = "OPS-4821" }

[[solution.call]]
endpoint = "aws-api"
tool = "call_aws"
arguments = { cli_command = "aws ec2 describe-instances --filters Name=tag:Name,Values=reporting-worker-legacy" }

[[solution.call]]
endpoint = "aws-api"
tool = "call_aws"
arguments = { cli_command = [
  "aws ec2 stop-instances --instance-ids i-07b9d1f3a5c8e2046",
  "aws ec2 create-tags --resources i-07b9d1f3a5c8e2046 --tags Key=DecommissionTicket,Value=OPS-4821",
] }
