[scenario]
id = "cloud/aws/grant-auditor-access"
title = "Grant the external auditor's IAM user SecurityAudit and auditors-group access"
now = "2026-03-14T09:00:00Z"
seed = "cloud-aws-grant-auditor-access"
services = ["aws"]
tags = ["write", "single-service", "aws", "disambiguation"]
timeout_sec = 900

[expect]
version = 2
audit_history = true

[[expect.state]]
pointer = "/services/aws/users/priya.raman-audit/AttachedPolicies"
contains = "arn:aws:iam::aws:policy/SecurityAudit"

[[expect.state]]
pointer = "/services/aws/groups/auditors/Members"
contains = "priya.raman-audit"

[[expect.records]]
selector = { collection = "/services/aws/users", matching = { UserName = "priya.raman-audit", Path = "/external/" } }
equals = 1
fields = { "/Arn" = "arn:aws:iam::481562039417:user/external/priya.raman-audit" }

[[expect.preservation.allow]]
pointer = "/services/aws/users/priya.raman-audit/AttachedPolicies"
add_set_values = ["arn:aws:iam::aws:policy/SecurityAudit"]

[[expect.preservation.allow]]
pointer = "/services/aws/groups/auditors/Members"
add_set_values = ["priya.raman-audit"]

[[solution.call]]
endpoint = "aws-iam"
tool = "get_group"
arguments = { group_name = "auditors" }

[[solution.call]]
endpoint = "aws-api"
tool = "call_aws"
arguments = { cli_command = "aws iam list-users --path-prefix /external/" }

[[solution.call]]
endpoint = "aws-api"
tool = "call_aws"
arguments = { cli_command = [
  "aws iam attach-user-policy --user-name priya.raman-audit --policy-arn arn:aws:iam::aws:policy/SecurityAudit",
  "aws iam add-user-to-group --group-name auditors --user-name priya.raman-audit",
] }
