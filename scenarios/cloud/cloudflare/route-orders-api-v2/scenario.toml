[scenario]
id = "cloud/cloudflare/route-orders-api-v2"
title = "Route /v2 API traffic to the new Worker"
now = "2026-10-28T15:00:00Z"
seed = "cloud-cloudflare-route-orders-api-v2"
services = ["cloudflare"]
tags = ["write", "single-service", "cloudflare"]
timeout_sec = 900

[scenario.family]
schema_version = 1
primary = "baseline"
secondary = []
dependency_depth = 1
rationale = "Pattern api.octo-corp.com/v2/* and script orders-api-v2 are given verbatim; only the octo-corp.com zone id is looked up, and the staging script and octo-corp.dev route have different exact names."

[expect]
version = 2
audit_history = true

[[expect.records]]
selector = { collection = "/services/cloudflare/workers_routes", created = true }
min_count = 1
max_count = 3
fields = { "/zone_id" = "023e105f4ecef8ad9ca31a8372d0c353", "/script" = "orders-api-v2" }
url_host_fields = ["/pattern"]
value_sets = { "/pattern" = [
  ["api.octo-corp.com/v2/*"],
  ["http://api.octo-corp.com/v2/*", "https://api.octo-corp.com/v2/*"],
  ["api.octo-corp.com/v2/*", "http://api.octo-corp.com/v2/*"],
  ["api.octo-corp.com/v2/*", "https://api.octo-corp.com/v2/*"],
  ["api.octo-corp.com/v2/*", "http://api.octo-corp.com/v2/*", "https://api.octo-corp.com/v2/*"],
] }

[[expect.relations]]
source = { collection = "/services/cloudflare/workers_routes", created = true }
source_field = "/zone_id"
target = { collection = "/services/cloudflare/zones", matching = { id = "023e105f4ecef8ad9ca31a8372d0c353", name = "octo-corp.com" } }
target_field = "/id"
kind = "foreign_key"

[[expect.relations]]
source = { collection = "/services/cloudflare/workers_routes", created = true }
source_field = "/script"
target = { collection = "/services/cloudflare/workers_scripts", key_prefix = "4f8a2c1e9b7d6a5f3e2d1c0b9a8f7e6d/", matching = { id = "orders-api-v2", account_id = "4f8a2c1e9b7d6a5f3e2d1c0b9a8f7e6d" } }
target_field = "/id"
kind = "foreign_key"

[[expect.preservation.allow]]
pointer = "/services/cloudflare/workers_routes/*"
kind = "create"
matching = { zone_id = "023e105f4ecef8ad9ca31a8372d0c353", pattern = "api.octo-corp.com/v2/*", script = "orders-api-v2" }
url_host_fields = ["/pattern"]

[[expect.preservation.allow]]
pointer = "/services/cloudflare/workers_routes/*"
kind = "create"
matching = { zone_id = "023e105f4ecef8ad9ca31a8372d0c353", pattern = "http://api.octo-corp.com/v2/*", script = "orders-api-v2" }
url_host_fields = ["/pattern"]

[[expect.preservation.allow]]
pointer = "/services/cloudflare/workers_routes/*"
kind = "create"
matching = { zone_id = "023e105f4ecef8ad9ca31a8372d0c353", pattern = "https://api.octo-corp.com/v2/*", script = "orders-api-v2" }
url_host_fields = ["/pattern"]

[[expect.preservation.allow]]
pointer = "/services/cloudflare/workers_routes/*"
kind = "create"
matching = { zone_id = "023e105f4ecef8ad9ca31a8372d0c353", pattern = "api.octo-corp.com/v2/*", script = "orders-api" }
url_host_fields = ["/pattern"]

[[expect.preservation.allow]]
pointer = "/services/cloudflare/workers_routes/*"
kind = "create"
matching = { zone_id = "023e105f4ecef8ad9ca31a8372d0c353", pattern = "http://api.octo-corp.com/v2/*", script = "orders-api" }
url_host_fields = ["/pattern"]

[[expect.preservation.allow]]
pointer = "/services/cloudflare/workers_routes/*"
kind = "create"
matching = { zone_id = "023e105f4ecef8ad9ca31a8372d0c353", pattern = "https://api.octo-corp.com/v2/*", script = "orders-api" }
url_host_fields = ["/pattern"]

[[solution.call]]
endpoint = "cloudflare"
tool = "execute"
arguments = { code = """
async () => {
  const zone = (await cloudflare.request({ method: 'GET', path: '/zones', query: { name: 'octo-corp.com' } })).result[0];
  const routes = (await cloudflare.request({ method: 'GET', path: `/zones/${zone.id}/workers/routes` })).result;
  return { zone: zone.id, routes };
}
""" }

[[solution.call]]
endpoint = "cloudflare"
tool = "execute"
arguments = { code = """
async () => {
  const r = await cloudflare.request({
    method: 'POST',
    path: '/zones/023e105f4ecef8ad9ca31a8372d0c353/workers/routes',
    body: { pattern: 'api.octo-corp.com/v2/*', script: 'orders-api-v2' },
  });
  return r.result;
}
""" }
