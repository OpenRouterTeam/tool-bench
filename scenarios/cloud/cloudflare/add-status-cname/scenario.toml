[scenario]
id = "cloud/cloudflare/add-status-cname"
title = "Add a DNS-only CNAME for the new status page"
now = "2026-10-28T15:00:00Z"
seed = "cloud-cloudflare-add-status-cname"
services = ["cloudflare"]
tags = ["write", "single-service", "cloudflare"]
timeout_sec = 900

[expect]
version = 2
audit_history = true

[[expect.records]]
selector = { collection = "/services/cloudflare/dns_records", created = true }
equals = 1
fields = { "/zone_id" = "023e105f4ecef8ad9ca31a8372d0c353", "/type" = "CNAME", "/name" = "status.octo-corp.com", "/content" = "octocorp.statuspage.io", "/proxied" = false }

[[expect.relations]]
source = { collection = "/services/cloudflare/dns_records", created = true }
source_field = "/zone_id"
target = { collection = "/services/cloudflare/zones", matching = { id = "023e105f4ecef8ad9ca31a8372d0c353", name = "octo-corp.com" } }
target_field = "/id"
kind = "foreign_key"

[[expect.preservation.allow]]
pointer = "/services/cloudflare/dns_records/*"
kind = "create"
matching = { zone_id = "023e105f4ecef8ad9ca31a8372d0c353", type = "CNAME", name = "status.octo-corp.com", content = "octocorp.statuspage.io", proxied = false }

[[solution.call]]
endpoint = "cloudflare"
tool = "execute"
arguments = { code = "async () => (await cloudflare.request({ method: 'GET', path: '/zones', query: { name: 'octo-corp.com' } })).result.map(z => ({ id: z.id, name: z.name }))" }

[[solution.call]]
endpoint = "cloudflare"
tool = "execute"
arguments = { code = """
async () => {
  const zone = '023e105f4ecef8ad9ca31a8372d0c353';
  const created = await cloudflare.request({
    method: 'POST',
    path: `/zones/${zone}/dns_records`,
    body: { type: 'CNAME', name: 'status.octo-corp.com', content: 'octocorp.statuspage.io', proxied: false, ttl: 1, comment: 'Atlassian Statuspage' },
  });
  return created.result;
}
""" }
