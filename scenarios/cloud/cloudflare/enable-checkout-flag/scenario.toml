[scenario]
id = "cloud/cloudflare/enable-checkout-flag"
title = "Roll out a feature flag in the production account's KV store"
now = "2026-10-28T15:00:00Z"
seed = "cloud-cloudflare-enable-checkout-flag"
services = ["cloudflare"]
tags = ["write", "single-service", "cloudflare", "disambiguation"]
timeout_sec = 900

[scenario.family]
schema_version = 1
primary = "entity_ambiguity"
secondary = []
dependency_depth = 3
rationale = "KV namespace title storefront-flags exists in both Octo Corp and Octo Corp Staging accounts plus storefront-flags-preview, each with a checkout_v2 key; only namespace c8f1b5e9... may change."

[expect]
version = 2
audit_history = true

[expect.preservation]
json_strings = ["/services/cloudflare/kv_values/c8f1b5e9a3d7c2f6b0e4a8d2c6f0b4e8~1checkout_v2/value"]

[[expect.records]]
selector = { collection = "/services/cloudflare/kv_values", matching = { namespace_id = "c8f1b5e9a3d7c2f6b0e4a8d2c6f0b4e8", key = "checkout_v2" } }
equals = 1
json_fields = { "/value" = { enabled = true, rollout = 25, owner = "payments", fallback = "checkout_v1" } }
optional_fields = { "/metadata" = { updated_by = "deploy-bot", ticket = "PAY-2210" } }

[[expect.relations]]
source = { collection = "/services/cloudflare/kv_values", matching = { namespace_id = "c8f1b5e9a3d7c2f6b0e4a8d2c6f0b4e8", key = "checkout_v2" } }
source_field = "/namespace_id"
target = { collection = "/services/cloudflare/kv_namespaces", matching = { id = "c8f1b5e9a3d7c2f6b0e4a8d2c6f0b4e8", title = "storefront-flags", account_id = "4f8a2c1e9b7d6a5f3e2d1c0b9a8f7e6d" } }
target_field = "/id"

[[expect.preservation.allow]]
pointer = "/services/cloudflare/kv_values/c8f1b5e9a3d7c2f6b0e4a8d2c6f0b4e8~1checkout_v2/value/enabled"

[[expect.preservation.allow]]
pointer = "/services/cloudflare/kv_values/c8f1b5e9a3d7c2f6b0e4a8d2c6f0b4e8~1checkout_v2/value/rollout"

[[expect.preservation.allow]]
pointer = "/services/cloudflare/kv_values/c8f1b5e9a3d7c2f6b0e4a8d2c6f0b4e8~1checkout_v2/value_json/enabled"

[[expect.preservation.allow]]
pointer = "/services/cloudflare/kv_values/c8f1b5e9a3d7c2f6b0e4a8d2c6f0b4e8~1checkout_v2/value_json/rollout"

[[expect.preservation.allow]]
pointer = "/services/cloudflare/kv_values/c8f1b5e9a3d7c2f6b0e4a8d2c6f0b4e8~1checkout_v2/metadata"
kind = "remove_field"

[[expect.preservation.allow]]
pointer = "/services/cloudflare/kv_values/c8f1b5e9a3d7c2f6b0e4a8d2c6f0b4e8~1checkout_v2/metadata"
kind = "restore_field"

[[solution.call]]
endpoint = "cloudflare"
tool = "execute"
arguments = { code = "async () => (await cloudflare.request({ method: 'GET', path: '/accounts' })).result.map(a => ({ id: a.id, name: a.name }))" }

[[solution.call]]
endpoint = "cloudflare"
tool = "execute"
arguments = { account_id = "4f8a2c1e9b7d6a5f3e2d1c0b9a8f7e6d", code = """
async () => {
  const namespaces = (await cloudflare.request({ method: 'GET', path: `/accounts/${accountId}/storage/kv/namespaces` })).result;
  const ns = namespaces.find(n => n.title === 'storefront-flags');
  const path = `/accounts/${accountId}/storage/kv/namespaces/${ns.id}/values/checkout_v2`;
  const current = JSON.parse((await cloudflare.request({ method: 'GET', path })).result);
  const next = { ...current, enabled: true, rollout: 25 };
  const metadata = (await cloudflare.request({ method: 'GET', path: `/accounts/${accountId}/storage/kv/namespaces/${ns.id}/metadata/checkout_v2` })).result;
  const form = new FormData();
  form.set('value', JSON.stringify(next));
  form.set('metadata', JSON.stringify(metadata));
  await cloudflare.request({ method: 'PUT', path, body: form });
  return { namespace: ns.id, before: current, after: next };
}
""" }
