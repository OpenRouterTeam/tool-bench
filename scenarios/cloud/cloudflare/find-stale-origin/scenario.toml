[scenario]
id = "cloud/cloudflare/find-stale-origin"
title = "Find the hostname still proxied to a retired origin"
now = "2026-10-28T15:00:00Z"
seed = "cloud-cloudflare-find-stale-origin"
services = ["cloudflare"]
tags = ["lookup", "single-service", "cloudflare", "disambiguation"]
timeout_sec = 900

[scenario.family]
schema_version = 1
primary = "entity_ambiguity"
secondary = []
dependency_depth = 2
rationale = "Only checkout.octo-shop.com is proxied to 203.0.113.40; legacy-reports.octo-corp.com has the same IP DNS-only, cdn.octo-shop.com is .41, preview.octo-corp.dev is .4, and a TXT mentions the IP."

# checkout.octo-shop.com is the only proxied record with content 203.0.113.40. Look-alikes:
# legacy-reports.octo-corp.com (same IP, DNS only), cdn.octo-shop.com (203.0.113.41),
# preview.octo-corp.dev (203.0.113.4) and a TXT record mentioning the address. The answer
# must be that hostname alone, so listing look-alikes too fails.
[expect]
version = 2
audit_history = true

[expect.answer.record_facts]
requirement = "Name the hostname of the proxied Cloudflare DNS record whose content is exactly 203.0.113.40, and no other hostname."
mode = "statements"
# Words that clear the record instead of naming it as the stale one.
contradictions = ["is fine", "is okay"]

context = [
  "(A record, proxied, content 203.0.113.40)",
]

[expect.answer.record_facts.selector]
collection = "/services/cloudflare/dns_records"
matching = { content = "203.0.113.40", proxied = true }

[expect.answer.record_facts.facts.hostname]
field = "/name"
kind = "identifier"

[[expect.forbidden_calls]]
service = "cloudflare"
method = "POST"
path_regex = "^/client/v4/"

[[expect.forbidden_calls]]
service = "cloudflare"
method = "PUT"
path_regex = "^/client/v4/"

[[expect.forbidden_calls]]
service = "cloudflare"
method = "PATCH"
path_regex = "^/client/v4/"

[[expect.forbidden_calls]]
service = "cloudflare"
method = "DELETE"
path_regex = "^/client/v4/"

[[solution.call]]
endpoint = "cloudflare"
tool = "search"
arguments = { code = "async () => Object.entries(spec.paths).filter(([p]) => p.includes('dns_records')).map(([p, item]) => ({ path: p, methods: Object.keys(item) }))" }

[[solution.call]]
endpoint = "cloudflare"
tool = "execute"
arguments = { code = """
async () => {
  const zones = (await cloudflare.request({ method: 'GET', path: '/zones', query: { per_page: 50 } })).result;
  const hits = [];
  for (const zone of zones) {
    const records = await cloudflare.request({
      method: 'GET',
      path: `/zones/${zone.id}/dns_records`,
      query: { content: '203.0.113.40', proxied: true },
    });
    for (const r of records.result) hits.push({ zone: zone.name, name: r.name, type: r.type, proxied: r.proxied });
  }
  return hits;
}
""" }

[solution]
answer = "checkout.octo-shop.com\n"
