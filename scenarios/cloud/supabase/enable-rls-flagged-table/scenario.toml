[scenario]
id = "cloud/supabase/enable-rls-flagged-table"
title = "Enable RLS on the table the security advisor flags in production"
now = "2026-04-02T09:00:00Z"
seed = "cloud-supabase-enable-rls-flagged-table"
services = ["supabase"]
tags = ["write", "single-service", "supabase"]
timeout_sec = 900

[scenario.family]
schema_version = 1
primary = "tool_ambiguity"
secondary = ["entity_ambiguity"]
dependency_depth = 2
rationale = "The RLS change on prod public.invoices is only allowed when caused by POST database/migrations and a migration row must be created, so execute_sql fails; staging invoices also has RLS off."

[expect]
version = 2
audit_history = true

[[expect.records]]
selector = { collection = "/services/supabase/tables", key_prefix = "qmvbxtzkplrnwdhyfaco.", matching = { schema = "public", name = "invoices" } }
equals = 1
fields = { "/rls_enabled" = true, "/policies" = [] }

[[expect.records]]
selector = { collection = "/services/supabase/migrations", key_prefix = "qmvbxtzkplrnwdhyfaco/", created = true, field_patterns = { "/version" = '\S', "/statements/0" = '\S' } }
min_count = 1

[[expect.preservation.allow]]
pointer = "/services/supabase/tables/qmvbxtzkplrnwdhyfaco.public.invoices/rls_enabled"
matching = { rls_enabled = true }
cause = { service = "supabase", methods = ["POST"], path_regex = "^/v1/projects/qmvbxtzkplrnwdhyfaco/database/migrations$" }

[[expect.preservation.allow]]
pointer = "/services/supabase/migrations/*"
kind = "create"
field_patterns = { "/version" = '\S' }
max_count = 1
count_scope = "per_commit"
cause = { service = "supabase", methods = ["POST"], path_regex = "^/v1/projects/qmvbxtzkplrnwdhyfaco/database/migrations$" }

[[solution.call]]
endpoint = "supabase"
tool = "get_advisors"
arguments = { project_id = "qmvbxtzkplrnwdhyfaco", type = "security" }

[[solution.call]]
endpoint = "supabase"
tool = "apply_migration"
arguments = { project_id = "qmvbxtzkplrnwdhyfaco", name = "enable_rls_on_invoices", query = "alter table public.invoices enable row level security;" }
