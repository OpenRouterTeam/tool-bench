[scenario]
id = "cloud/supabase/pause-legacy-marketing-project"
title = "Pause the legacy marketing site project"
now = "2026-04-02T09:00:00Z"
seed = "cloud-supabase-pause-legacy-marketing-project"
services = ["supabase"]
tags = ["write", "single-service", "supabase", "disambiguation"]
timeout_sec = 900

[scenario.family]
schema_version = 1
primary = "entity_ambiguity"
secondary = ["stale_state"]
dependency_depth = 1
rationale = "Projects marketing-site (bdnfrjsk..., created 2026-01) and marketing-site-legacy (wgtplxkq..., created 2024-06) are both ACTIVE_HEALTHY in northwind-marketing; only the legacy one may be paused."

[expect]
version = 2
audit_history = true

[[expect.records]]
selector = { collection = "/services/supabase/projects", matching = { id = "wgtplxkqrzvnmbcdhfye", name = "marketing-site-legacy", organization_id = "northwind-marketing" } }
equals = 1
fields = { "/status" = "INACTIVE" }

[[expect.preservation.allow]]
pointer = "/services/supabase/projects/wgtplxkqrzvnmbcdhfye/status"
field_patterns = { "/status" = "^(PAUSING|GOING_DOWN|INACTIVE)$" }
cause = { service = "supabase", methods = ["POST"], path_regex = "^/v1/projects/wgtplxkqrzvnmbcdhfye/pause$" }

[[solution.call]]
endpoint = "supabase"
tool = "list_projects"
arguments = {}

[[solution.call]]
endpoint = "supabase"
tool = "pause_project"
arguments = { project_id = "wgtplxkqrzvnmbcdhfye" }

[[solution.call]]
endpoint = "supabase"
tool = "get_project"
arguments = { id = "wgtplxkqrzvnmbcdhfye" }
