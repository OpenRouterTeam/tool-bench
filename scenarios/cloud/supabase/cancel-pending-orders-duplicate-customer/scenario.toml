[scenario]
id = "cloud/supabase/cancel-pending-orders-duplicate-customer"
title = "Cancel the unpaid orders of the right Priya Shah"
now = "2026-04-02T09:00:00Z"
seed = "cloud-supabase-cancel-pending-orders-duplicate-customer"
services = ["supabase"]
tags = ["write", "single-service", "supabase", "disambiguation"]
timeout_sec = 900

[expect]
version = 2
audit_history = true

[[expect.records]]
selector = { collection = "/services/supabase/db.qmvbxtzkplrnwdhyfaco.public.customers", matching = { email = "priya.shah@fastmail.com" } }
equals = 1

[[expect.records]]
selector = { collection = "/services/supabase/db.qmvbxtzkplrnwdhyfaco.public.orders", matching = { status = "pending" }, references = [{ source_field = "/customer_id", target = { collection = "/services/supabase/db.qmvbxtzkplrnwdhyfaco.public.customers", matching = { email = "priya.shah@fastmail.com" } }, target_field = "/id" }] }
equals = 0

[[expect.preservation.allow]]
pointer = "/services/supabase/db.qmvbxtzkplrnwdhyfaco.public.orders/*/status"
matching = { status = "cancelled" }
initial_matching = { status = "pending" }
initial_references = [{ source_field = "/customer_id", target = { collection = "/services/supabase/db.qmvbxtzkplrnwdhyfaco.public.customers", matching = { email = "priya.shah@fastmail.com" } }, target_field = "/id" }]
max_count = "all_matching"

[[expect.preservation.allow]]
pointer = "/services/supabase/migrations/*"
kind = "create"
field_patterns = { "/version" = '\S' }
max_count = 1
count_scope = "per_commit"
cause = { service = "supabase", methods = ["POST"], path_regex = "^/v1/projects/qmvbxtzkplrnwdhyfaco/database/migrations$" }

[[solution.call]]
endpoint = "supabase"
tool = "execute_sql"
arguments = { project_id = "qmvbxtzkplrnwdhyfaco", query = "select id, full_name, email from public.customers where full_name ilike 'priya%'" }

[[solution.call]]
endpoint = "supabase"
tool = "execute_sql"
arguments = { project_id = "qmvbxtzkplrnwdhyfaco", query = "update public.orders set status = 'cancelled' where status = 'pending' and customer_id = (select id from public.customers where email = 'priya.shah@fastmail.com') returning id, status, total" }
