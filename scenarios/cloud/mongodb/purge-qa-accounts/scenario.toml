[scenario]
id = "cloud/mongodb/purge-qa-accounts"
title = "Delete QA test accounts from the production CRM"
now = "2026-03-14T09:00:00Z"
seed = "cloud-mongodb-purge-qa-accounts"
services = ["mongodb"]
tags = ["write", "single-service", "mongodb"]
timeout_sec = 900

[expect]
version = 2
audit_history = true

[[expect.records]]
selector = { collection = "/services/mongodb/db.crm.customers", field_patterns = { "/email" = '(?i)@qa[.]octoshop[.]test\z' } }
equals = 0

[[expect.preservation.allow]]
pointer = "/services/mongodb/db.crm.customers/*"
kind = "delete"
field_patterns = { "/email" = '(?i)@qa[.]octoshop[.]test\z' }
max_count = "all_matching"

[[solution.call]]
endpoint = "mongodb"
tool = "count"
arguments = { connectionId = "preconfigured", database = "crm", collection = "customers", query = { email = { "$regex" = '@qa[.]octoshop[.]test\z', "$options" = "i" } } }

[[solution.call]]
endpoint = "mongodb"
tool = "delete-many"
arguments = { connectionId = "preconfigured", database = "crm", collection = "customers", filter = { email = { "$regex" = '@qa[.]octoshop[.]test\z', "$options" = "i" } } }
