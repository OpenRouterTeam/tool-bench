[scenario]
id = "cloud/mongodb/pause-idle-staging-cluster"
title = "Pause an idle Atlas staging cluster in the right project"
now = "2026-03-14T09:00:00Z"
seed = "cloud-mongodb-pause-idle-staging-cluster"
services = ["mongodb"]
tags = ["write", "single-service", "mongodb", "disambiguation"]
timeout_sec = 900

[expect]
version = 2
audit_history = true

[[expect.records]]
selector = { collection = "/services/mongodb/clusters", matching = { groupId = "65c0ffee0000000000000002", name = "analytics-staging" } }
equals = 1
fields = { "/paused" = true }

[[expect.preservation.allow]]
pointer = "/services/mongodb/clusters/65c0ffee0000000000000002~1analytics-staging/paused"
matching = { paused = true }

[[solution.call]]
endpoint = "mongodb"
tool = "atlas-list-projects"
arguments = { orgId = "65a1b2c3d4e5f60718293a4b" }

[[solution.call]]
endpoint = "mongodb"
tool = "atlas-list-clusters"
arguments = { projectId = "65c0ffee0000000000000002" }

[[solution.call]]
endpoint = "mongodb"
tool = "atlas-pause-resume-cluster"
arguments = { projectId = "65c0ffee0000000000000002", clusterName = "analytics-staging", action = "PAUSE" }
