[scenario]
id = "cloud/mongodb/refund-order"
title = "Mark a customer's order as refunded"
now = "2026-03-14T09:00:00Z"
seed = "cloud-mongodb-refund-order"
services = ["mongodb"]
tags = ["write", "single-service", "mongodb"]
timeout_sec = 900

[expect]
version = 2
audit_history = true

[[expect.records]]
selector = { collection = "/services/mongodb/db.shop.orders", matching = { orderNumber = 10482, customer = { customerId = { "$oid" = "65d1c0000000000000000001" } } } }
equals = 1
fields = { "/status" = "refunded", "/refund/reason" = "damaged in transit" }

[[expect.relations]]
source = { collection = "/services/mongodb/db.shop.orders", matching = { orderNumber = 10482, customer = { customerId = { "$oid" = "65d1c0000000000000000001" } } } }
source_field = "/refund/amount"
target = { collection = "/services/mongodb/db.shop.orders", matching = { orderNumber = 10482, customer = { customerId = { "$oid" = "65d1c0000000000000000001" } } } }
target_field = "/total"
kind = "bson_numeric_equals"

[[expect.preservation.allow]]
pointer = "/services/mongodb/db.shop.orders/65f1a000000000000000000a/status"
matching = { status = "refunded" }

[[expect.preservation.allow]]
pointer = "/services/mongodb/db.shop.orders/65f1a000000000000000000a/refund/reason"
matching = { refund = { reason = "damaged in transit" } }

[[expect.preservation.allow]]
pointer = "/services/mongodb/db.shop.orders/65f1a000000000000000000a/refund/amount"

[[solution.call]]
endpoint = "mongodb"
tool = "find"
arguments = { connectionId = "preconfigured", database = "shop", collection = "orders", filter = { orderNumber = 10482, "customer.name" = "Priya Natarajan" } }
capture = [
  { name = "order_id", pointer = "/structuredContent/documents/0/_id" },
  { name = "order_total", pointer = "/structuredContent/documents/0/total" },
]

[[solution.call]]
endpoint = "mongodb"
tool = "update-many"
template = true
arguments = { connectionId = "preconfigured", database = "shop", collection = "orders", filter = { "_id" = "${order_id}" }, update = { "$set" = { status = "refunded", "refund.reason" = "damaged in transit", "refund.amount" = "${order_total}" } } }
