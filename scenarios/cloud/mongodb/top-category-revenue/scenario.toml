[scenario]
id = "cloud/mongodb/top-category-revenue"
title = "Find February's top product category by delivered revenue"
now = "2026-03-14T09:00:00Z"
seed = "cloud-mongodb-top-category-revenue"
services = ["mongodb"]
tags = ["lookup", "single-service", "mongodb"]
timeout_sec = 900

[scenario.family]
schema_version = 1
primary = "entity_ambiguity"
secondary = []
dependency_depth = 1
rationale = "Delivered February orders give outdoor 1457.5, but February cancelled 10452, refunded 10470 and shipped 10488 make electronics win at 2208 if counted; shop_staging holds placeholder-price copies."

# Delivered February orders in shop.orders: outdoor 1457.5, electronics 1309, kitchen 798,
# apparel 436. Counting cancelled/refunded/shipped orders too makes electronics win (2208);
# the stale shop_staging copy has placeholder prices.
[expect]
version = 2
audit_history = true

[expect.answer.record_facts]
requirement = "Name the product category with the largest revenue (unit price times quantity over order lines) among delivered shop.orders created in February 2026 UTC, and state that revenue in US dollars."
mode = "statements"
# Words that say the opposite of most revenue.
contradictions = ["the least", "the lowest", "the smallest", "least revenue", "lowest revenue"]

[expect.answer.record_facts.selector]
collection = "/services/mongodb/db.shop.orders"
matching = { status = "delivered" }
field_patterns = { "/createdAt/$date" = "^2026-02-" }

[expect.answer.record_facts.selection.group]
unnest = "/items"
by = "/item/category"
measure = { sum_product = ["/item/price", "/item/qty"] }
pick = "largest"

[expect.answer.record_facts.facts.category]
field = "/key"
kind = "text"

[expect.answer.record_facts.facts.revenue]
field = "/value"
kind = "money"

[[expect.forbidden_calls]]
service = "mongodb"
path = "/_mcp/tools/call"
body = { name = "update-many" }

[[expect.forbidden_calls]]
service = "mongodb"
path = "/_mcp/tools/call"
body = { name = "delete-many" }

[[solution.call]]
endpoint = "mongodb"
tool = "aggregate"
arguments = { connectionId = "preconfigured", database = "shop", collection = "orders", pipeline = [
  { "$match" = { status = "delivered", createdAt = { "$gte" = { "$date" = "2026-02-01T00:00:00.000Z" }, "$lt" = { "$date" = "2026-03-01T00:00:00.000Z" } } } },
  { "$unwind" = "$items" },
  { "$group" = { _id = "$items.category", revenue = { "$sum" = { "$multiply" = ["$items.price", "$items.qty"] } } } },
  { "$sort" = { revenue = -1 } },
] }

[solution]
answer = "Top category: outdoor, with $1,457.50 in revenue."
