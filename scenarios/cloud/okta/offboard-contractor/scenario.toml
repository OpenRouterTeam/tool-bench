[scenario]
id = "cloud/okta/offboard-contractor"
title = "Offboard the right Alex Kim when a contract ends"
now = "2026-03-14T09:00:00Z"
seed = "cloud-okta-offboard-contractor"
services = ["okta"]
tags = ["write", "single-service", "okta", "disambiguation"]
timeout_sec = 900

[expect]
version = 2
audit_history = true

[[expect.records]]
selector = { collection = "/services/okta/users", matching = { profile = { login = "alex.kim@northwind-consulting.example", organization = "Northwind Consulting" } } }
equals = 1
fields = { "/status" = "DEPROVISIONED" }

[[expect.state]]
pointer = "/services/okta/users/00u1alxkmct4St1Uv2x7/transitioningToStatus"
exists = false

[[expect.records]]
selector = { collection = "/services/okta/group_members", matching = { groupId = "00g2cntrsf6Op3Qr4x7" }, references = [{ source_field = "/userId", target_field = "/id", target = { collection = "/services/okta/users", matching = { profile = { login = "alex.kim@northwind-consulting.example" } } } }] }
equals = 0

[[expect.forbidden_calls]]
service = "okta"
method = "DELETE"
path_regex = "^/api/v1/users/"

[expect.preservation]
allow = [
  { pointer = "/services/okta/users/00u1alxkmct4St1Uv2x7/status", matching = { status = "DEPROVISIONED" }, cause = { service = "okta", methods = ["POST"], path_regex = "(?i)^/api/v1/users/(00u1alxkmct4St1Uv2x7|alex\\.kim(@|%40)northwind-consulting\\.example)/lifecycle/deactivate$" } },
  { pointer = "/services/okta/users/00u1alxkmct4St1Uv2x7/activated", matching = { status = "DEPROVISIONED" }, cause = { service = "okta", methods = ["POST"], path_regex = "(?i)^/api/v1/users/(00u1alxkmct4St1Uv2x7|alex\\.kim(@|%40)northwind-consulting\\.example)/lifecycle/deactivate$" } },
  { pointer = "/services/okta/users/00u1alxkmct4St1Uv2x7/statusChanged", cause = { service = "okta", methods = ["POST"], path_regex = "(?i)^/api/v1/users/(00u1alxkmct4St1Uv2x7|alex\\.kim(@|%40)northwind-consulting\\.example)/lifecycle/deactivate$" } },
  { pointer = "/services/okta/users/00u1alxkmct4St1Uv2x7/lastUpdated", cause = { service = "okta", methods = ["POST"], path_regex = "(?i)^/api/v1/users/(00u1alxkmct4St1Uv2x7|alex\\.kim(@|%40)northwind-consulting\\.example)/lifecycle/deactivate$" } },
  { pointer = "/services/okta/users/00u1alxkmct4St1Uv2x7/transitioningToStatus", kind = "remove_field", cause = { service = "okta", methods = ["POST"], path_regex = "(?i)^/api/v1/users/(00u1alxkmct4St1Uv2x7|alex\\.kim(@|%40)northwind-consulting\\.example)/lifecycle/deactivate$" } },
  { pointer = "/services/okta/group_members/00g2cntrsf6Op3Qr4x7~100u1alxkmct4St1Uv2x7", kind = "delete", cause = { service = "okta", methods = ["DELETE"], path_regex = "^/api/v1/groups/00g2cntrsf6Op3Qr4x7/users/00u1alxkmct4St1Uv2x7$" } },
  { pointer = "/services/okta/groups/00g2cntrsf6Op3Qr4x7/lastMembershipUpdated", cause = { service = "okta", methods = ["DELETE"], path_regex = "^/api/v1/groups/00g2cntrsf6Op3Qr4x7/users/00u1alxkmct4St1Uv2x7$" } },
  { pointer = "/services/okta/logs/*", kind = "create", matching = { eventType = "user.lifecycle.deactivate", outcome = { result = "SUCCESS" }, actor = { id = "0oa8wq4n2Yc6Ds7Rt0x7" } }, references = [{ source_field = "/target/0/id", target_field = "/id", target = { collection = "/services/okta/users", matching = { profile = { login = "alex.kim@northwind-consulting.example" } } } }], count_scope = "per_commit", cause = { service = "okta", methods = ["POST"], path_regex = "(?i)^/api/v1/users/(00u1alxkmct4St1Uv2x7|alex\\.kim(@|%40)northwind-consulting\\.example)/lifecycle/deactivate$" } },
  { pointer = "/services/okta/logs/*", kind = "create", matching = { eventType = "group.user_membership.remove", outcome = { result = "SUCCESS" }, actor = { id = "0oa8wq4n2Yc6Ds7Rt0x7" } }, references = [{ source_field = "/target/0/id", target_field = "/id", target = { collection = "/services/okta/users", matching = { profile = { login = "alex.kim@northwind-consulting.example" } } } }, { source_field = "/target/1/id", target_field = "/id", target = { collection = "/services/okta/groups", matching = { profile = { name = "Contractors - Salesforce" } } } }], count_scope = "per_commit", cause = { service = "okta", methods = ["DELETE"], path_regex = "^/api/v1/groups/00g2cntrsf6Op3Qr4x7/users/00u1alxkmct4St1Uv2x7$" } },
]

[[solution.call]]
endpoint = "okta"
tool = "list_users"
arguments = { search = 'profile.lastName eq "Kim"' }

[[solution.call]]
