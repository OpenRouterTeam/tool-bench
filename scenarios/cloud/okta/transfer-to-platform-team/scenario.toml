endpoint = "okta"
tool = "list_users"
arguments = { q = "Maria" }

[[solution.call]]
endpoint = "okta"
tool = "update_user"
arguments = { user_id = "00u1mrgnzlz6Wx3Yz4x7", profile = { title = "Site Reliability Engineer", department = "Platform Engineering" } }

