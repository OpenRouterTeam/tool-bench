[scenario]
id = "cloud/okta/transfer-to-platform-team"
title = "Move a support lead to the Platform Engineering team in Okta"
now = "2026-03-14T09:00:00Z"
seed = "cloud-okta-transfer-to-platform-team"
services = ["okta"]
tags = ["write", "single-service", "okta"]
timeout_sec = 900

[scenario.family]
schema_version = 1
primary = "baseline"
secondary = []
dependency_depth = 1
rationale = "Only one Maria Gonzalez exists (00u1mrgnzlz6Wx3Yz4x7) and the groups Platform Engineering and Support Agents are named exactly; each id is a direct lookup followed by the writes."

[expect]
version = 2
audit_history = true

[[expect.records]]
selector = { collection = "/services/okta/users", matching = { profile = { login = "maria.gonzalez@octo-corp.example" } } }
equals = 1
fields = { "/profile/title" = "Site Reliability Engineer", "/profile/department" = "Platform Engineering", "/status" = "ACTIVE" }

[[expect.records]]
selector = { collection = "/services/okta/group_members", references = [{ source_field = "/userId", target_field = "/id", target = { collection = "/services/okta/users", matching = { profile = { login = "maria.gonzalez@octo-corp.example" } } } }, { source_field = "/groupId", target_field = "/id", target = { collection = "/services/okta/groups", matching = { type = "OKTA_GROUP", profile = { name = "Platform Engineering" } } } }] }
equals = 1

[[expect.records]]
selector = { collection = "/services/okta/group_members", matching = { groupId = "00g2spprt12Ac5Ef6x7" }, references = [{ source_field = "/userId", target_field = "/id", target = { collection = "/services/okta/users", matching = { profile = { login = "maria.gonzalez@octo-corp.example" } } } }] }
equals = 0

[[expect.forbidden_calls]]
service = "okta"
method = "POST"
path_regex = "^/api/v1/users/[^/]+/lifecycle/"

[[expect.forbidden_calls]]
service = "okta"
method = "DELETE"
path_regex = "^/api/v1/(users/|groups/[^/]+$)"

[expect.preservation]
