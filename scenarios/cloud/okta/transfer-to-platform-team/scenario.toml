  { pointer = "/services/okta/users/00u1mrgnzlz6Wx3Yz4x7/profile/department", matching = { profile = { department = "Platform Engineering" } }, cause = { service = "okta", methods = ["POST", "PUT"], path_regex = "(?i)^/api/v1/users/(00u1mrgnzlz6Wx3Yz4x7|maria\\.gonzalez((@|%40)octo-corp\\.example)?)$" } },
  { pointer = "/services/okta/users/00u1mrgnzlz6Wx3Yz4x7/lastUpdated", cause = { service = "okta", methods = ["POST", "PUT"], path_regex = "(?i)^/api/v1/users/(00u1mrgnzlz6Wx3Yz4x7|maria\\.gonzalez((@|%40)octo-corp\\.example)?)$" } },
  { pointer = "/services/okta/group_members/00g2pltfrm7Gh8Ij9x7~100u1mrgnzlz6Wx3Yz4x7", kind = "create", matching = { groupId = "00g2pltfrm7Gh8Ij9x7", userId = "00u1mrgnzlz6Wx3Yz4x7" }, cause = { service = "okta", methods = ["PUT"], path_regex = "^/api/v1/groups/00g2pltfrm7Gh8Ij9x7/users/00u1mrgnzlz6Wx3Yz4x7$" } },
  { pointer = "/services/okta/group_members/00g2spprt12Ac5Ef6x7~100u1mrgnzlz6Wx3Yz4x7", kind = "delete", cause = { service = "okta", methods = ["DELETE"], path_regex = "^/api/v1/groups/00g2spprt12Ac5Ef6x7/users/00u1mrgnzlz6Wx3Yz4x7$" } },
  { pointer = "/services/okta/groups/00g2pltfrm7Gh8Ij9x7/lastMembershipUpdated", cause = { service = "okta", methods = ["PUT"], path_regex = "^/api/v1/groups/00g2pltfrm7Gh8Ij9x7/users/00u1mrgnzlz6Wx3Yz4x7$" } },
  { pointer = "/services/okta/groups/00g2spprt12Ac5Ef6x7/lastMembershipUpdated", cause = { service = "okta", methods = ["DELETE"], path_regex = "^/api/v1/groups/00g2spprt12Ac5Ef6x7/users/00u1mrgnzlz6Wx3Yz4x7$" } },
  { pointer = "/services/okta/logs/*", kind = "create", matching = { eventType = "user.account.update_profile", outcome = { result = "SUCCESS" }, actor = { id = "0oa8wq4n2Yc6Ds7Rt0x7" } }, references = [{ source_field = "/target/0/id", target_field = "/id", target = { collection = "/services/okta/users", matching = { profile = { login = "maria.gonzalez@octo-corp.example" } } } }], count_scope = "per_commit", cause = { service = "okta", methods = ["POST", "PUT"], path_regex = "(?i)^/api/v1/users/(00u1mrgnzlz6Wx3Yz4x7|maria\\.gonzalez((@|%40)octo-corp\\.example)?)$" } },
  { pointer = "/services/okta/logs/*", kind = "create", matching = { eventType = "group.user_membership.add", outcome = { result = "SUCCESS" }, actor = { id = "0oa8wq4n2Yc6Ds7Rt0x7" } }, references = [{ source_field = "/target/0/id", target_field = "/id", target = { collection = "/services/okta/users", matching = { profile = { login = "maria.gonzalez@octo-corp.example" } } } }, { source_field = "/target/1/id", target_field = "/id", target = { collection = "/services/okta/groups", matching = { profile = { name = "Platform Engineering" } } } }], count_scope = "per_commit", cause = { service = "okta", methods = ["PUT"], path_regex = "^/api/v1/groups/00g2pltfrm7Gh8Ij9x7/users/00u1mrgnzlz6Wx3Yz4x7$" } },
  { pointer = "/services/okta/logs/*", kind = "create", matching = { eventType = "group.user_membership.remove", outcome = { result = "SUCCESS" }, actor = { id = "0oa8wq4n2Yc6Ds7Rt0x7" } }, references = [{ source_field = "/target/0/id", target_field = "/id", target = { collection = "/services/okta/users", matching = { profile = { login = "maria.gonzalez@octo-corp.example" } } } }, { source_field = "/target/1/id", target_field = "/id", target = { collection = "/services/okta/groups", matching = { profile = { name = "Support Agents" } } } }], count_scope = "per_commit", cause = { service = "okta", methods = ["DELETE"], path_regex = "^/api/v1/groups/00g2spprt12Ac5Ef6x7/users/00u1mrgnzlz6Wx3Yz4x7$" } },
]

