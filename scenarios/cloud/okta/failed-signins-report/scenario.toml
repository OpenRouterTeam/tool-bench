[scenario]
id = "cloud/okta/failed-signins-report"
title = "Find the account with the most failed Okta sign-ins yesterday"
now = "2026-03-14T09:00:00Z"
seed = "cloud-okta-failed-signins-report"
services = ["okta"]
tags = ["lookup", "single-service", "okta"]
timeout_sec = 900

[scenario.family]
schema_version = 1
primary = "entity_ambiguity"
secondary = []
dependency_depth = 1
rationale = "On 2026-03-13 jordyn.patel has 6 FAILURE sign-ins; near-miss logins jordan.patel (2) and jordan.pate (4 policy DENY), plus lee.wong 8 on 03-10 and alex.kim 7 on 03-14, are distractors the answer must avoid."

# Failed (outcome FAILURE) sign-ins on 2026-03-13 UTC: Jordyn Patel 6 from 203.0.113.77,
# Marcus Chen 3, Jordan Patel 2, Priya Raman 1. Distractors: Jordan Pate's 4 policy DENYs,
# Lee Wong's 8 failures on 03-10, Alex Kim's 7 failures just after midnight on 03-14.
[expect]
version = 2
audit_history = true

[expect.answer.record_facts]
requirement = "State the login of the Okta account with the most failed sign-in events (user.session.start with outcome FAILURE) published on 2026-03-13 UTC, the number of those failed attempts, and the client IP address they all came from."
mode = "statements"


[expect.answer.record_facts.selector]
collection = "/services/okta/logs"
matching = { eventType = "user.session.start", outcome = { result = "FAILURE" } }
field_patterns = { "/published" = "^2026-03-13T" }

[expect.answer.record_facts.selection.group]
by = "/actor/alternateId"
measure = "count"
pick = "largest"

[expect.answer.record_facts.facts.login]
field = "/key"
kind = "identifier"

[expect.answer.record_facts.facts.attempts]
field = "/value"
kind = "number"
# The request asks for three values, so a table row, a JSON object or three bare lines is a
# complete reply: the count needs no unit word. The units still mark another account's count.
units = ["attempts", "attempt", "failed", "failures", "failure", "fails", "unsuccessful", "times", "sign-ins", "sign-in", "logins", "login"]

[expect.answer.record_facts.facts.ip]
field = "/member/client/ipAddress"
kind = "identifier"

# Read-only task.
[[expect.forbidden_calls]]
service = "okta"
method = "POST"
path_regex = "^/api/v1/"

[[expect.forbidden_calls]]
service = "okta"
method = "PUT"

[[expect.forbidden_calls]]
service = "okta"
method = "DELETE"

[[solution.call]]
endpoint = "okta"
tool = "get_logs"
arguments = { filter = 'outcome.result eq "FAILURE"', since = "2026-03-13T00:00:00.000Z", until = "2026-03-14T00:00:00.000Z", limit = 100 }

[solution]
answer = "jordyn.patel@octo-corp.example had 6 failures, every one from 203.0.113.77."
