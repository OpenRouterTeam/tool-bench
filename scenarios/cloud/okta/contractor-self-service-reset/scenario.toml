[scenario]
id = "cloud/okta/contractor-self-service-reset"
title = "Turn off self-service password reset and unlock for contractors"
now = "2026-03-14T09:00:00Z"
seed = "cloud-okta-contractor-self-service-reset"
services = ["okta"]
tags = ["write", "single-service", "okta"]
timeout_sec = 900

[scenario.family]
schema_version = 1
primary = "dependency_depth"
secondary = []
dependency_depth = 3
rationale = "Contractors Password Policy 00p4pwcntr2Uv9Wx0x7 is named exactly; the fix needs policy id, then rule 0pr5rule0tr2Uv9Wx0x7, then its current body, then a PUT keeping passwordChange ALLOW."

[expect]
version = 2
audit_history = true

[[expect.records]]
selector = { collection = "/services/okta/policies", matching = { id = "00p4pwcntr2Uv9Wx0x7", name = "Contractors Password Policy", type = "PASSWORD" } }
equals = 1
fields = { "/status" = "ACTIVE" }

[[expect.records]]
selector = { collection = "/services/okta/policy_rules", matching = { id = "0pr5rule0tr2Uv9Wx0x7", type = "PASSWORD" }, key_prefix = "00p4pwcntr2Uv9Wx0x7/" }
equals = 1
fields = { "/status" = "ACTIVE", "/actions/passwordChange/access" = "ALLOW", "/actions/selfServicePasswordReset/access" = "DENY", "/actions/selfServiceUnlock/access" = "DENY" }

[[expect.forbidden_calls]]
service = "okta"
method = "DELETE"
path_regex = "^/api/v1/policies"

[expect.preservation]
allow = [
  { pointer = "/services/okta/policy_rules/00p4pwcntr2Uv9Wx0x7~10pr5rule0tr2Uv9Wx0x7/actions/selfServicePasswordReset/access", matching = { actions = { selfServicePasswordReset = { access = "DENY" } } }, cause = { service = "okta", methods = ["PUT"], path_regex = "^/api/v1/policies/00p4pwcntr2Uv9Wx0x7/rules/0pr5rule0tr2Uv9Wx0x7$" } },
  { pointer = "/services/okta/policy_rules/00p4pwcntr2Uv9Wx0x7~10pr5rule0tr2Uv9Wx0x7/actions/selfServiceUnlock/access", matching = { actions = { selfServiceUnlock = { access = "DENY" } } }, cause = { service = "okta", methods = ["PUT"], path_regex = "^/api/v1/policies/00p4pwcntr2Uv9Wx0x7/rules/0pr5rule0tr2Uv9Wx0x7$" } },
  { pointer = "/services/okta/policy_rules/00p4pwcntr2Uv9Wx0x7~10pr5rule0tr2Uv9Wx0x7/lastUpdated", cause = { service = "okta", methods = ["PUT"], path_regex = "^/api/v1/policies/00p4pwcntr2Uv9Wx0x7/rules/0pr5rule0tr2Uv9Wx0x7$" } },
  { pointer = "/services/okta/logs/*", kind = "create", matching = { eventType = "policy.rule.update", outcome = { result = "SUCCESS" }, actor = { id = "0oa8wq4n2Yc6Ds7Rt0x7" } }, references = [{ source_field = "/target/0/id", target_field = "/id", target = { collection = "/services/okta/policy_rules", matching = { id = "0pr5rule0tr2Uv9Wx0x7" }, key_prefix = "00p4pwcntr2Uv9Wx0x7/" } }, { source_field = "/target/1/id", target_field = "/id", target = { collection = "/services/okta/policies", matching = { id = "00p4pwcntr2Uv9Wx0x7", type = "PASSWORD" } } }], count_scope = "per_commit", cause = { service = "okta", methods = ["PUT"], path_regex = "^/api/v1/policies/00p4pwcntr2Uv9Wx0x7/rules/0pr5rule0tr2Uv9Wx0x7$" } },
]

[[solution.call]]
endpoint = "okta"
tool = "list_policies"
arguments = { type = "PASSWORD" }

[[solution.call]]
endpoint = "okta"
tool = "list_policy_rules"
arguments = { policy_id = "00p4pwcntr2Uv9Wx0x7" }

[[solution.call]]
endpoint = "okta"
tool = "get_policy_rule"
arguments = { policy_id = "00p4pwcntr2Uv9Wx0x7", rule_id = "0pr5rule0tr2Uv9Wx0x7" }
capture = [{ name = "contractor_rule", pointer = "/content/0/text", json_pointer = "", constraint = { type = "object", required = ["id", "actions"] } }]

[[solution.call]]
endpoint = "okta"
tool = "update_policy_rule"
template = true
arguments = { policy_id = "00p4pwcntr2Uv9Wx0x7", rule_id = "0pr5rule0tr2Uv9Wx0x7", rule_data = "${contractor_rule}" }
replacements = [
  { pointer = "/rule_data/actions/selfServicePasswordReset/access", value = "DENY" },
  { pointer = "/rule_data/actions/selfServiceUnlock/access", value = "DENY" },
]

[[solution.call]]
endpoint = "okta"
tool = "get_policy_rule"
arguments = { policy_id = "00p4pwcntr2Uv9Wx0x7", rule_id = "0pr5rule0tr2Uv9Wx0x7" }
