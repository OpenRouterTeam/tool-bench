[scenario]
id = "search/exa/enrich-lead-list"
title = "Enrich a lead list with an Exa Agent run"
now = "2026-10-29T13:20:00Z"
seed = "search-exa-enrich-lead-list"
services = ["exa"]
tags = ["write", "single-service", "exa"]
timeout_sec = 900

[scenario.family]
schema_version = 1
primary = "tool_ambiguity"
secondary = ["entity_ambiguity"]
dependency_depth = 1
rationale = "Contract requires exactly one agent_run whose output equals enrich-three-leads; a single-company run returns enrich-corvane-only, and search surfaces look-alike corvane.io (Lisbon, 45 employees)."

[expect]
version = 2
audit_history = true

[[expect.records]]
selector = { collection = "/services/exa/agent_runs", created = true }
equals = 1
fields = { "/object" = "agent_run", "/status" = "completed" }

[[expect.relations]]
source = { collection = "/services/exa/agent_runs", created = true }
source_field = "/output"
target = { collection = "/services/exa/agent_outputs", matching = { id = "enrich-three-leads" } }
target_field = "/output"
kind = "equals"

[[expect.preservation.allow]]
pointer = "/services/exa/agent_runs/*"
kind = "create"
matching = { object = "agent_run", status = "completed" }
max_count = 1

[[expect.forbidden_calls]]
service = "exa"
method = "DELETE"

[expect.answer.source_facts]
requirement = "Report every lead with its own headquarters city and approximate employee headcount as related by the authored enrichment output, without swapping, omitting or negating any row."
source = { selector = { collection = "/services/exa/agent_outputs", matching = { id = "enrich-three-leads" } }, field = "/output/content" }
key = "company"
rows = "all"
claims = [
  "${company}: HQ ${city}; about ${employees} employees",
  "${company}: HQ ${city}; ~${employees} employees",
  "${company}: HQ ${city}, about ${employees} employees",
  "${company}: ${city}, about ${employees} employees",
  "${company}: ${city}; about ${employees} employees",
  "${company}: ${city}, ~${employees} employees",
  "${company} — ${city} — ~${employees} employees",
  "${company} is headquartered in ${city} and has about ${employees} employees.",
  "${company} is headquartered in ${city} with about ${employees} employees.",
]
rejected = [
  "${company} is not headquartered in ${city}.",
  "${company} does not have about ${employees} employees.",
]

[expect.answer.source_facts.aliases]
"United Kingdom" = ["UK", "U.K.", "England"]
USA = ["US", "U.S.", "U.S.A.", "United States"]
PA = ["Pennsylvania"]
TX = ["Texas"]

[expect.answer.source_facts.columns.company]
header = "Company"
kind = "name"
short_names = true
answer_headers = ["Company name", "Name", "Lead", "Organization"]

[expect.answer.source_facts.columns.city]
header = "HQ city"
kind = "place"
answer_headers = ["HQ", "Headquarters", "Headquarters city", "HQ location", "City", "Location"]

[expect.answer.source_facts.columns.employees]
header = "Employees (approx.)"
kind = "number"
answer_headers = ["Employees", "Headcount", "Employee count", "Approx. headcount", "Approximate headcount", "Approx. employees", "Approximate employees"]

[solution]
answer = "| Company | HQ city | Employees |\n|---|---|---|\n| Corvane Robotics | Pittsburgh, PA | ~340 |\n| Lumetric Health | Austin, TX | ~1,150 |\n| Bramblewood Foods | Leeds, UK | ~2,600 |\n"

[[solution.call]]
endpoint = "exa"
tool = "agent_run"
arguments = { query = "For each company in the input, find its headquarters city and approximate employee headcount, with a source URL.", input = { data = [{ companyName = "Corvane Robotics" }, { companyName = "Lumetric Health" }, { companyName = "Bramblewood Foods" }] } }
