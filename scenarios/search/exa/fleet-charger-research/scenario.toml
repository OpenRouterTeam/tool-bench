[scenario]
id = "search/exa/fleet-charger-research"
title = "Commission a pro deep-research report on depot V2G chargers in Germany"
now = "2026-10-22T08:30:00Z"
seed = "search-exa-fleet-charger-research"
services = ["exa"]
tags = ["write", "single-service", "exa"]
timeout_sec = 900

[scenario.family]
schema_version = 1
primary = "baseline"
secondary = []
dependency_depth = 2
rationale = "The request states the pro research model (not fast or standard) and asks for one depot V2G report; the forbidden fast and standard calls only check that stated constraint."

[expect]
version = 2
audit_history = true

[[expect.records]]
selector = { collection = "/services/exa/research", created = true }
equals = 1
fields = { "/model" = "exa-research-pro", "/status" = "completed" }

[[expect.relations]]
source = { collection = "/services/exa/research", created = true }
source_field = "/output/content"
target = { collection = "/services/exa/research_reports", matching = { id = "report-bidirectional-depot-chargers-de" } }
target_field = "/content"
kind = "equals"

[[expect.relations]]
source = { collection = "/services/exa/research", created = true }
source_field = "/citations"
target = { collection = "/services/exa/research_reports", matching = { id = "report-bidirectional-depot-chargers-de" } }
target_field = "/citations"
kind = "equals"

[[expect.preservation.allow]]
pointer = "/services/exa/research/*"
kind = "create"
matching = { model = "exa-research-pro" }
max_count = 1

[[expect.required_calls]]
service = "exa"
method = "POST"
path = "/research/v1"
body = { model = "exa-research-pro" }

[[expect.required_calls]]
service = "exa"
method = "GET"
path_regex = "^/research/v1/r_[0-9A-Za-z]+$"

[[expect.forbidden_calls]]
service = "exa"
method = "POST"
path = "/research/v1"
body = { model = "exa-research-fast" }

[[expect.forbidden_calls]]
service = "exa"
method = "POST"
path = "/research/v1"
body = { model = "exa-research" }

[expect.answer.source_facts]
requirement = "Name the vendor with the largest installed share in the authored depot report and attribute that same vendor's typical 22 kW bidirectional unit price to it, without negation or misattribution."
source = { selector = { collection = "/services/exa/research_reports", matching = { id = "report-bidirectional-depot-chargers-de" } }, field = "/content" }
key = "vendor"
rows = { largest = "share" }

[expect.answer.source_facts.columns.vendor]
header = "Vendor"
kind = "name"

[expect.answer.source_facts.columns.hq]
header = "HQ"
kind = "place"
required = false

[expect.answer.source_facts.columns.share]
header = "Share of installed depot V2G units (DE)"
kind = "percent"
required = false

[expect.answer.source_facts.columns.price]
header = "Typical price, 22 kW AC bidirectional unit"
kind = "money"

[solution]
answer = "Market leader: VoltHaven (Hamburg), about 31% of installed depot V2G units in Germany. Typical price of its 22 kW AC bidirectional unit: EUR 6,900.\n"

[[solution.call]]
endpoint = "exa"
tool = "deep_researcher_start"
arguments = { instructions = "Research the market for bidirectional (V2G) chargers for commercial fleet depots in Germany: the main vendors, their market share, and typical unit prices.", model = "exa-research-pro" }

[[solution.call]]
endpoint = "exa"
tool = "deep_researcher_check"
arguments = { researchId = "r_01k4fOjR4gU5lXF1HsNUQMnA" }
