[scenario]
id = "search/multi/api-key-deletion-audit-github"
title = "Trace a deleted API key from the audit logs to the GitHub PR that rotates it"
now = "2026-10-30T09:30:00Z"
seed = "search-multi-api-key-deletion-audit-github"
services = ["elasticsearch", "github"]
tags = ["lookup", "multi-service", "elasticsearch", "github", "disambiguation"]
timeout_sec = 900

[scenario.family]
schema_version = 1
primary = "cross_system_identity"
secondary = ["entity_ambiguity", "stale_state"]
dependency_depth = 3
rationale = "Audit actor m.okafor maps by email m.okafor@octo-org.example to GitHub login mokafor, not sam (Sam Okafor); look-alikes are j.doe denied delete, r.chen staging key, a.santos legacy delete, PRs 57 and 44."

# Audit: m.okafor deleted ci-deploy-bot at 2026-10-29T16:42:57Z (j.doe's attempt was denied,
# r.chen deleted ci-deploy-bot-staging, a.santos deleted a same-named key on the legacy
# cluster in August). GitHub: m.okafor@octo-org.example is `mokafor` (Mira Okafor), not
# `sam` (Sam Okafor). Her PR is octo-org/deploy-pipeline#58, still open (unmerged).
# Look-alikes: #57 (rchen, staging key, merged) and #44 (asantos, legacy key, merged).
[expect]
version = 2
audit_history = true

# The audit event names its actor by the local part of their email; the GitHub account is the
# user whose email has that local part, and the pull request is the one that account opened.
[expect.answer.record_facts]
requirement = "Name the actor of the successful api_key.delete audit event for the key ci-deploy-bot on 2026-10-29 UTC and the UTC time (hour and minute) of that event, the login of the GitHub user whose email local part is that actor, the number of the pull request that user opened, and whether it is merged or still open."
mode = "statements"
context = [
  "| User | Time | GitHub | PR | Status |",
  "not ${namesake_login}",
  "(${denied_actor}'s delete attempt at ${denied_time} was denied.)",
  "She created ${replacement_key} at ${replacement_time}",
  "review requested from ${reviewer}",
]

[expect.answer.record_facts.selector]
collection = "/services/elasticsearch/docs"
matching = { event_action = "api_key.delete", event_outcome = "success", target_name = "ci-deploy-bot" }
field_patterns = { "/@timestamp" = "^2026-10-29T" }

[expect.answer.record_facts.related.account]
collection = "/services/github/users"
on = { "/email" = "/actor" }
capture = { "/email" = '^([^@]+)@' }

[expect.answer.record_facts.related.pull]
from = "account"
collection = "/services/github/pulls"
on = { "/user" = "/login" }

[expect.answer.record_facts.facts.user]
field = "/actor"
kind = "identifier"

[expect.answer.record_facts.facts.time]
field = "/@timestamp"
kind = "text"
clock = true

[expect.answer.record_facts.facts.login]
record = "account"
field = "/login"
kind = "identifier"

[expect.answer.record_facts.facts.pull_request]
record = "pull"
field = "/number"
kind = "number"
units = ["#", "pr", "request", "number"]
require_unit = true

# `merged` is the coded value; the pull request's own `state` names the same thing.
[expect.answer.record_facts.facts.merged]
record = "pull"
field = "/merged"
also = ["/state"]
kind = "text"

[expect.answer.record_facts.facts.merged.wordings]
false = [
  "not merged",
  "not yet merged",
  "not been merged",
  "not yet been merged",
  "hasn't been merged",
  "hasn't yet been merged",
  "isn't merged",
  "yet to be merged",
  "unmerged",
  "merged: no",
]
true = ["merged", "merged: yes"]

[expect.answer.record_facts.related.denied_event]
collection = "/services/elasticsearch/docs"
filter = { matching = { "/event_action" = "api_key.delete", "/event_outcome" = "failure", "/target_name" = "ci-deploy-bot" }, patterns = { "/@timestamp" = "^2026-10-29T" } }

[expect.answer.record_facts.related.replacement_event]
collection = "/services/elasticsearch/docs"
filter = { matching = { "/event_action" = "api_key.create", "/actor" = "m.okafor" }, patterns = { "/@timestamp" = "^2026-10-29T" } }

[expect.answer.record_facts.facts.denied_actor]
record = "denied_event"
field = "/actor"
kind = "identifier"
optional = true

[expect.answer.record_facts.facts.denied_time]
record = "denied_event"
field = "/@timestamp"
kind = "text"
clock = true
optional = true

[expect.answer.record_facts.facts.replacement_key]
record = "replacement_event"
field = "/target_name"
kind = "identifier"
optional = true

[expect.answer.record_facts.facts.replacement_time]
record = "replacement_event"
field = "/@timestamp"
kind = "text"
clock = true
optional = true

[expect.answer.record_facts.facts.reviewer]
record = "requested_review"
field = "/requested_reviewers/0"
kind = "identifier"
optional = true

[expect.answer.record_facts.related.requested_review]
from = "pull"
collection = "/services/github/pulls"
on = { "/number" = "/number" }
filter = { present = ["/requested_reviewers/0"] }
allow_absence = true

[expect.answer.record_facts.related.namesake]
collection = "/services/github/users"
filter = { matching = { "/name" = "Sam Okafor" } }
allow_absence = true

[expect.answer.record_facts.facts.namesake_login]
record = "namesake"
field = "/login"
kind = "identifier"
optional = true

[[expect.required_calls]]
service = "elasticsearch"
method = "POST"
path_regex = "(_search|_query)$"

[[expect.required_calls]]
service = "github"
method = "GET"

[[expect.forbidden_calls]]
service = "github"
method = "PUT"

[[expect.forbidden_calls]]
service = "github"
method = "PATCH"

[[expect.forbidden_calls]]
service = "github"
method = "POST"
path_regex = "^/api/v3/repos/"

[solution]
answer = "m.okafor deleted the key at 16:42 UTC. On GitHub she is mokafor, and her PR #58 has not been merged yet."

[[solution.call]]
endpoint = "elasticsearch"
tool = "list_indices"
arguments = { index_pattern = "audit-*" }

[[solution.call]]
endpoint = "elasticsearch"
tool = "esql"
arguments = { query = "FROM audit-security-2026.10 | WHERE target_name == \"ci-deploy-bot\" AND event_action == \"api_key.delete\" | SORT @timestamp | KEEP @timestamp, actor, event_outcome, details" }

[[solution.call]]
endpoint = "github"
tool = "search_pull_requests"
arguments = { query = "ci-deploy-bot-v2", owner = "octo-org" }

[[solution.call]]
endpoint = "github"
tool = "pull_request_read"
arguments = { method = "get", owner = "octo-org", repo = "deploy-pipeline", pullNumber = 58 }
