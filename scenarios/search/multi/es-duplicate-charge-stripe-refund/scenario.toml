[scenario]
id = "search/multi/es-duplicate-charge-stripe-refund"
title = "Find a customer's double charge in the orders index and refund the duplicate in Stripe"
now = "2026-10-30T10:00:00Z"
seed = "search-multi-es-duplicate-charge-stripe-refund"
services = ["elasticsearch", "stripe"]
tags = ["write", "multi-service", "elasticsearch", "stripe", "disambiguation"]
timeout_sec = 900

[scenario.family]
schema_version = 1
primary = "entity_ambiguity"
secondary = ["cross_system_identity"]
dependency_depth = 2
rationale = "Jordan Lee's pair ORD-109002 and ORD-109003 (86.40, 28 s apart) sits beside Jordan Leigh's 129.99 pair, J. Lee's 86.40 order and refunded ORD-109311; only charge ch_3Qb2Mj... of 109003 may be refunded."

# The orders index has the Stripe charge id of every order. Jordan Lee's double charge is
# ORD-109002 (original, ch_3Qb2Kj…) and ORD-109003 (duplicate, ch_3Qb2Mj…), 86.40 USD 28 s
# apart. Look-alikes: Jordan Leigh's 129.99 pair, J. Lee's (j.lee@example.com) 86.40 order
# the same evening, and Jordan Lee's own already-refunded ORD-109311.

[expect]
version = 2
audit_history = true

[[expect.state]]
pointer = "/services/stripe/charges/ch_3Qb2MjLee109003aQs9uD/refunded"
equals = true

[[expect.state]]
pointer = "/services/stripe/charges/ch_3Qb2MjLee109003aQs9uD/amount_refunded"
equals = 8640

[[expect.records]]
selector = { collection = "/services/stripe/refunds", matching = { charge = "ch_3Qb2MjLee109003aQs9uD" }, created = true }
min_count = 1
max_count = 8640
fields = { "/currency" = "usd", "/reason" = "duplicate", "/status" = "succeeded", "/payment_intent" = "pi_3Qb2MjLee109003bXz4aE" }
totals = { "/amount" = 8640 }
integer_bounds = { "/amount" = { min = 1, max = 8640 } }

[[expect.records]]
selector = { collection = "/services/stripe/balance_transactions", matching = { type = "refund" }, created = true }
min_count = 1
max_count = 8640
fields = { "/currency" = "usd", "/fee" = 0, "/fee_details" = [], "/status" = "available" }
totals = { "/amount" = -8640, "/net" = -8640 }
integer_bounds = { "/amount" = { min = -8640, max = -1 }, "/net" = { min = -8640, max = -1 } }

[[expect.records]]
selector = { collection = "/services/stripe/events", matching = { type = "refund.created" }, created = true }
min_count = 1
max_count = 8640
fields = { "/data/object/charge" = "ch_3Qb2MjLee109003aQs9uD", "/data/object/reason" = "duplicate", "/data/object/currency" = "usd" }
totals = { "/data/object/amount" = 8640 }
integer_bounds = { "/data/object/amount" = { min = 1, max = 8640 } }

[[expect.records]]
selector = { collection = "/services/stripe/events", matching = { type = "charge.refunded" }, created = true }
min_count = 1
max_count = 8640
fields = { "/data/object/id" = "ch_3Qb2MjLee109003aQs9uD", "/data/object/currency" = "usd" }
integer_bounds = { "/data/object/amount_refunded" = { min = 1, max = 8640 } }

[[expect.relations]]
source = { collection = "/services/stripe/refunds", matching = { charge = "ch_3Qb2MjLee109003aQs9uD" }, created = true }
source_field = "/balance_transaction"
target = { collection = "/services/stripe/balance_transactions", matching = { type = "refund" }, created = true }
target_field = "/id"
kind = "bijection"
fields = [
  { source_field = "/amount", target_field = "/amount", kind = "negated_integer" },
  { source_field = "/amount", target_field = "/net", kind = "negated_integer" },
  { source_field = "/currency", target_field = "/currency", kind = "equals" },
]

[[expect.relations]]
source = { collection = "/services/stripe/balance_transactions", matching = { type = "refund" }, created = true }
source_field = "/source"
target = { collection = "/services/stripe/refunds", matching = { charge = "ch_3Qb2MjLee109003aQs9uD" }, created = true }
target_field = "/id"
kind = "bijection"

[[expect.relations]]
source = { collection = "/services/stripe/refunds", matching = { charge = "ch_3Qb2MjLee109003aQs9uD" }, created = true }
source_field = "/id"
target = { collection = "/services/stripe/events", matching = { type = "refund.created" }, created = true }
target_field = "/data/object/id"
kind = "bijection"

[[expect.relations]]
source = { collection = "/services/stripe/events", matching = { type = "refund.created" }, created = true }
source_field = "/request/id"
target = { collection = "/services/stripe/events", matching = { type = "charge.refunded" }, created = true }
target_field = "/request/id"
kind = "bijection"

[[expect.relations]]
source = { collection = "/services/stripe/refunds", created = true }
source_field = "/charge"
target = { collection = "/services/elasticsearch/docs", matching = { order_id = "ORD-109003", customer_email = "jordan.lee@example.com" } }
target_field = "/stripe_charge_id"
kind = "foreign_key"

[[expect.relations]]
source = { collection = "/services/stripe/refunds", created = true }
source_field = "/payment_intent"
target = { collection = "/services/elasticsearch/docs", matching = { order_id = "ORD-109003", customer_email = "jordan.lee@example.com" } }
target_field = "/payment_intent"
kind = "foreign_key"

[[expect.preservation.allow]]
pointer = "/services/stripe/charges/ch_3Qb2MjLee109003aQs9uD/amount_refunded"

[[expect.preservation.allow]]
pointer = "/services/stripe/charges/ch_3Qb2MjLee109003aQs9uD/refunded"

[[expect.preservation.allow]]
pointer = "/services/stripe/refunds/*"
kind = "create"
matching = { charge = "ch_3Qb2MjLee109003aQs9uD", reason = "duplicate", currency = "usd", status = "succeeded" }
max_count = 8640

[[expect.preservation.allow]]
pointer = "/services/stripe/balance_transactions/*"
kind = "create"
matching = { type = "refund", currency = "usd" }
max_count = 8640

[[expect.preservation.allow]]
pointer = "/services/stripe/events/*"
kind = "create"
matching = { type = "refund.created", data = { object = { charge = "ch_3Qb2MjLee109003aQs9uD", reason = "duplicate", currency = "usd" } } }
max_count = 8640

[[expect.preservation.allow]]
pointer = "/services/stripe/events/*"
kind = "create"
matching = { type = "charge.refunded", data = { object = { id = "ch_3Qb2MjLee109003aQs9uD" } } }
max_count = 8640

[[solution.call]]
endpoint = "elasticsearch"
tool = "list_indices"
arguments = { index_pattern = "orders-*" }

[[solution.call]]
endpoint = "elasticsearch"
tool = "search"
arguments = { index = "orders-2026", query_body = { query = { term = { customer_email = "jordan.lee@example.com" } }, sort = [{ created_at = "asc" }], size = 20 } }

[[solution.call]]
endpoint = "stripe"
tool = "stripe_api_read"
arguments = { stripe_api_operation_id = "GetChargesCharge", parameters = { charge = "ch_3Qb2MjLee109003aQs9uD" }, stripe_context = "acct_1LkSpG8rT4vWq2Nx", livemode = false }

[[solution.call]]
endpoint = "stripe"
tool = "stripe_api_write"
arguments = { stripe_api_operation_id = "PostRefunds", parameters = { charge = "ch_3Qb2MjLee109003aQs9uD", reason = "duplicate" }, stripe_context = "acct_1LkSpG8rT4vWq2Nx", livemode = false }
