  "Hi Priya,\n\nQuillstream's current API documentation (v3) says the Business plan allows 750 requests per minute.\n\nRita",
  "Hi Priya,\n\nQuillstream's current API documentation (v3) says the Business plan allows 750 requests per minute, with bursts of up to 120.\n\nRita",
  "Hi Priya,\n\nQuillstream's current API documentation (v3) says the Business plan allows 750 requests per minute per workspace, shared across all API keys in that workspace.\n\nRita",
  "Quillstream's current API documentation (v3) says the Business plan allows 750 requests per minute.",
  "Hi Priya,\n\nThe Quillstream Business plan allows 750 requests per minute according to their current API documentation (v3), with a burst of up to 120. The limit is per workspace, so other integrations in the same workspace count towards it.\n\nThanks,\nRita",
]
rejected = [
  "Hi Priya,\n\nQuillstream's API documentation says the Business plan allows 300 requests per minute.\n\nRita",
