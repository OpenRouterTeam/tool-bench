[scenario]
id = "search/multi/vendor-rate-limit-zendesk-reply"
title = "Look up a vendor's current rate limit and answer the customer's ticket with it"
now = "2026-10-29T15:00:00Z"
seed = "search-multi-vendor-rate-limit-zendesk-reply"
services = ["tavily", "zendesk"]
tags = ["write", "multi-service", "tavily", "zendesk", "disambiguation"]
timeout_sec = 900

[scenario.family]
schema_version = 1
primary = "stale_state"
secondary = ["entity_ambiguity"]
dependency_depth = 2
rationale = "Quillstream v3 docs (2026-09-14) say Business 750 rpm; deprecated v2 docs and a 2025 review say 300, a forum post 500; Quillpad says 400; tickets 5287, 5298 and 5301 are look-alikes of 5302."

# Quillstream's current v3 docs: Business = 750 requests/minute (burst 120), per workspace.
# Stale numbers: deprecated v2 docs and a 2025 review (300), a forum post (500); Quillpad is a
# different vendor (400). The right ticket is 5302 (Priya Shah, open). Look-alikes: her solved
# ticket 5287, Priya Sharma's Quillpad ticket 5298, and Tomas's Quillstream ticket 5301.
[expect]
version = 2
audit_history = true

[[expect.state]]
pointer = "/services/zendesk/tickets/5302/status"
equals = "pending"

[[expect.records]]
selector = { collection = "/services/zendesk/comments", created = true }
equals = 1
fields = { "/ticket_id" = 5302, "/public" = true }

[expect.records.reviewed_text."/body"]
requirement = "Give Priya Shah, on her open Quillstream 429 ticket, the requests-per-minute figure from Quillstream's current v3 documentation for the Business plan: 750 requests per minute. The 120 burst, per-workspace sharing, Retry-After header, advice to space the sync, greeting and signature are accurate optional context, not requirements. The older v2 (300), forum (500) and review (300) numbers and Quillpad's 400 are stale or unrelated and are not the answer."
accepted = [
  "Hi Priya,\n\nAccording to Quillstream's current API documentation (v3, updated September 14, 2026), the Business plan allows 750 requests per minute, with bursts of up to 120. The limit is shared across the whole Quillstream workspace, not per API key, so any other integrations using the same workspace count towards it. When you go over it, Quillstream returns 429 with a Retry-After header.\n\nIf you space your sync below 750 requests per minute (including other tools on that workspace), the 429s should stop. Let us know how it goes!\n\nRita",
  "Hi Priya,\n\nQuillstream's current API documentation (v3) says the Business plan allows 750 requests per minute.\n\nRita",
  "Hi Priya,\n\nQuillstream's current API documentation (v3) says the Business plan allows 750 requests per minute, with bursts of up to 120.\n\nRita",
  "Hi Priya,\n\nQuillstream's current API documentation (v3) says the Business plan allows 750 requests per minute per workspace, shared across all API keys in that workspace.\n\nRita",
  "Quillstream's current API documentation (v3) says the Business plan allows 750 requests per minute.",
  "Hi Priya,\n\nThe Quillstream Business plan allows 750 requests per minute according to their current API documentation (v3), with a burst of up to 120. The limit is per workspace, so other integrations in the same workspace count towards it.\n\nThanks,\nRita",
]
rejected = [
  "Hi Priya,\n\nQuillstream's API documentation says the Business plan allows 300 requests per minute.\n\nRita",
  "Hi Priya,\n\nQuillstream's API documentation says the Business plan allows 500 requests per minute.\n\nRita",
  "Hi Priya,\n\nThe Business plan allows 400 requests per minute.\n\nRita",
  "Hi Priya,\n\nWe are checking Quillstream's current documentation and will follow up with the Business plan requests-per-minute limit.\n\nRita",
  "Hi Priya,\n\nQuillstream's current API documentation (v3) says the Business plan has a burst allowance of up to 120.\n\nRita",
]
mentions = ["750", ["minute", "min", "RPM"]]

[expect.records.reviewed_text."/html_body"]
format = "zendesk_html"
requirement = "Give Priya Shah, on her open Quillstream 429 ticket, the requests-per-minute figure from Quillstream's current v3 documentation for the Business plan: 750 requests per minute. The 120 burst, per-workspace sharing, Retry-After header, advice to space the sync, greeting and signature are accurate optional context, not requirements. The older v2 (300), forum (500) and review (300) numbers and Quillpad's 400 are stale or unrelated and are not the answer."
accepted = [
