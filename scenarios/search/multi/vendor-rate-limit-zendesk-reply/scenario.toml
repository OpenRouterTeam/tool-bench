mentions = ["750", ["minute", "min", "RPM"]]

[[expect.records]]
selector = { collection = "/services/zendesk/audits", created = true }
min_count = 1
fields = { "/ticket_id" = 5302 }

[[expect.relations]]
source = { collection = "/services/zendesk/comments", created = true }
source_field = "/audit_id"
target = { collection = "/services/zendesk/audits", created = true }
target_field = "/id"
kind = "foreign_key"

[[expect.information]]
prerequisite = { service = "tavily", method = "POST", path_regex = "^/(search|extract|crawl)$" }
response_field = "/results"
source = { collection = "/services/tavily/pages", matching = { url = "https://docs.quillstream.io/api/rate-limits" } }
projection = [
  { response = ["/url"], source = "/url" },
  { response = ["/content", "/raw_content"], source = "/content", excerpts = ["Business", "750", "workspace"] },
]
action = { service = "zendesk", method = "POST", path = "/_mcp/tools/call" }
action_effect = { selector = { collection = "/services/zendesk/comments", created = true }, field = "/body", nonempty_text = true }

[[expect.information]]
prerequisite = { service = "tavily", method = "POST", path_regex = "^/(search|extract|crawl)$" }
response_field = "/results"
source = { collection = "/services/tavily/pages", matching = { url = "https://docs.quillstream.io/api/rate-limits" } }
projection = [
  { response = ["/url"], source = "/url" },
  { response = ["/content", "/raw_content"], source = "/content", excerpts = ["Business", "750", "workspace"] },
]
action = { service = "zendesk", method = "PUT", path_regex = "^/api/v2/tickets/[0-9]+(\\.json)?$" }
action_effect = { selector = { collection = "/services/zendesk/comments", created = true }, field = "/body", nonempty_text = true }

[[expect.preservation.allow]]
pointer = "/services/zendesk/tickets/5302/status"

[[expect.preservation.allow]]
pointer = "/services/zendesk/tickets/5302/updated_at"

[[expect.preservation.allow]]
pointer = "/services/zendesk/comments/*"
kind = "create"
matching = { ticket_id = 5302, public = true }

[[expect.preservation.allow]]
pointer = "/services/zendesk/audits/*"
kind = "create"
matching = { ticket_id = 5302 }
count_scope = "per_commit"

[[solution.call]]
endpoint = "tavily"
tool = "tavily_search"
arguments = { query = "Quillstream API rate limit Business plan requests per minute" }

[[solution.call]]
endpoint = "tavily"
tool = "tavily_extract"
arguments = { urls = ["https://docs.quillstream.io/api/rate-limits"] }

[[solution.call]]
endpoint = "zendesk"
tool = "get_tickets"
arguments = {}

[[solution.call]]
endpoint = "zendesk"
tool = "get_ticket_comments"
arguments = { ticket_id = 5302 }

[[solution.call]]
endpoint = "zendesk"
tool = "create_ticket_comment"
arguments = { ticket_id = 5302, public = true, comment = "Hi Priya,\n\nAccording to Quillstream's current API documentation (v3, updated September 14, 2026), the Business plan allows 750 requests per minute, with bursts of up to 120. The limit is shared across the whole Quillstream workspace, not per API key, so any other integrations using the same workspace count towards it. When you go over it, Quillstream returns 429 with a Retry-After header.\n\nIf you space your sync below 750 requests per minute (including other tools on that workspace), the 429s should stop. Let us know how it goes!\n\nRita" }

[[solution.call]]
endpoint = "zendesk"
tool = "update_ticket"
arguments = { ticket_id = 5302, status = "pending" }
