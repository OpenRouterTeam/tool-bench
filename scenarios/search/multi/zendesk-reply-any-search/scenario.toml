# Replaces `search/multi/vendor-rate-limit-zendesk-reply`, which is archived under
# `releases/archive/tool-bench-public-dev-1/`. Release `tool-bench-public-dev-2`.
#
# What changed: the same pages are served by all four connected web-search services
# (Brave, Exa, Firecrawl, Tavily), and a read through any of them is accepted. The
# instruction is the original, word for word.
#
# Why: the instruction asks for a kind of lookup and names no vendor, while the original
# kept each page on one vendor (Tavily), so no other could answer. This task scores
# what the instruction asks. The pages exist on no public site, so an answer from outside
# the tool servers still fails, and `mcp_only` still rejects a request that reaches the
# world around them.
#
# Only the search half is opened. The Zendesk half is the original contract, unchanged:
# ticket 5302 pending, exactly one new public comment on it with the reviewed text, its
# audit, and nothing else changed. The read-before-write rule also stays: the reply is
# accepted only after a response that carried the current rate-limit page with the
# Business figure. `alternatives` lets that response come from Exa, Brave or Firecrawl
# as well as Tavily; the page, the passages and the order are the same.
#
# Known limit: a Brave web search filtered to exclude web results, or a Firecrawl search
# that asks only for news or images, returns no web result list. Made before the reply,
# the grader reads such a response as an environment fault, not as a pass or a fail.
[scenario]
id = "search/multi/zendesk-reply-any-search"
title = "Look up a vendor's current rate limit and answer the customer's ticket with it (any connected search vendor)"
now = "2026-10-29T15:00:00Z"
seed = "search-multi-zendesk-reply-any-search"
services = ["brave", "exa", "firecrawl", "tavily", "zendesk"]
tags = ["write", "multi-service", "any-search-vendor", "zendesk", "disambiguation", "route:unnamed"]
timeout_sec = 900

[scenario.family]
schema_version = 1
primary = "stale_state"
secondary = ["entity_ambiguity"]
dependency_depth = 2
rationale = "Quillstream v3 docs (2026-09-14) say Business 750 rpm; deprecated v2 docs and a 2025 review say 300, a forum post 500; Quillpad says 400; tickets 5287, 5298 and 5301 are look-alikes of 5302."

# Quillstream's current v3 docs: Business = 750 requests/minute (burst 120), per workspace.
# Stale numbers: deprecated v2 docs and a 2025 review (300), a forum post (500); Quillpad is a
# different vendor (400). The right ticket is 5302 (Priya Shah, open). Look-alikes: her solved
# ticket 5287, Priya Sharma's Quillpad ticket 5298, and Tomas's Quillstream ticket 5301.
[expect]
version = 2
audit_history = true

[[expect.state]]
pointer = "/services/zendesk/tickets/5302/status"
equals = "pending"

[[expect.records]]
selector = { collection = "/services/zendesk/comments", created = true }
equals = 1
fields = { "/ticket_id" = 5302, "/public" = true }

[expect.records.reviewed_text."/body"]
requirement = "Give Priya Shah, on her open Quillstream 429 ticket, the requests-per-minute figure from Quillstream's current v3 documentation for the Business plan: 750 requests per minute. The 120 burst, per-workspace sharing, Retry-After header, advice to space the sync, greeting and signature are accurate optional context, not requirements. The older v2 (300), forum (500) and review (300) numbers and Quillpad's 400 are stale or unrelated and are not the answer."
accepted = [
  "Hi Priya,\n\nAccording to Quillstream's current API documentation (v3, updated September 14, 2026), the Business plan allows 750 requests per minute, with bursts of up to 120. The limit is shared across the whole Quillstream workspace, not per API key, so any other integrations using the same workspace count towards it. When you go over it, Quillstream returns 429 with a Retry-After header.\n\nIf you space your sync below 750 requests per minute (including other tools on that workspace), the 429s should stop. Let us know how it goes!\n\nRita",
  "Hi Priya,\n\nQuillstream's current API documentation (v3) says the Business plan allows 750 requests per minute.\n\nRita",
  "Hi Priya,\n\nQuillstream's current API documentation (v3) says the Business plan allows 750 requests per minute, with bursts of up to 120.\n\nRita",
  "Hi Priya,\n\nQuillstream's current API documentation (v3) says the Business plan allows 750 requests per minute per workspace, shared across all API keys in that workspace.\n\nRita",
  "Quillstream's current API documentation (v3) says the Business plan allows 750 requests per minute.",
  "Hi Priya,\n\nThe Quillstream Business plan allows 750 requests per minute according to their current API documentation (v3), with a burst of up to 120. The limit is per workspace, so other integrations in the same workspace count towards it.\n\nThanks,\nRita",
]
rejected = [
  "Hi Priya,\n\nQuillstream's API documentation says the Business plan allows 300 requests per minute.\n\nRita",
  "Hi Priya,\n\nQuillstream's API documentation says the Business plan allows 500 requests per minute.\n\nRita",
  "Hi Priya,\n\nThe Business plan allows 400 requests per minute.\n\nRita",
  "Hi Priya,\n\nWe are checking Quillstream's current documentation and will follow up with the Business plan requests-per-minute limit.\n\nRita",
  "Hi Priya,\n\nQuillstream's current API documentation (v3) says the Business plan has a burst allowance of up to 120.\n\nRita",
]
mentions = ["750", ["minute", "min", "RPM"]]

[expect.records.reviewed_text."/html_body"]
format = "zendesk_html"
requirement = "Give Priya Shah, on her open Quillstream 429 ticket, the requests-per-minute figure from Quillstream's current v3 documentation for the Business plan: 750 requests per minute. The 120 burst, per-workspace sharing, Retry-After header, advice to space the sync, greeting and signature are accurate optional context, not requirements. The older v2 (300), forum (500) and review (300) numbers and Quillpad's 400 are stale or unrelated and are not the answer."
accepted = [
  "Hi Priya,\n\nAccording to Quillstream's current API documentation (v3, updated September 14, 2026), the Business plan allows 750 requests per minute, with bursts of up to 120. The limit is shared across the whole Quillstream workspace, not per API key, so any other integrations using the same workspace count towards it. When you go over it, Quillstream returns 429 with a Retry-After header.\n\nIf you space your sync below 750 requests per minute (including other tools on that workspace), the 429s should stop. Let us know how it goes!\n\nRita",
  "Hi Priya,\n\nQuillstream's current API documentation (v3) says the Business plan allows 750 requests per minute.\n\nRita",
  "Hi Priya,\n\nQuillstream's current API documentation (v3) says the Business plan allows 750 requests per minute, with bursts of up to 120.\n\nRita",
  "Hi Priya,\n\nQuillstream's current API documentation (v3) says the Business plan allows 750 requests per minute per workspace, shared across all API keys in that workspace.\n\nRita",
  "Quillstream's current API documentation (v3) says the Business plan allows 750 requests per minute.",
  "Hi Priya,\n\nThe Quillstream Business plan allows 750 requests per minute according to their current API documentation (v3), with a burst of up to 120. The limit is per workspace, so other integrations in the same workspace count towards it.\n\nThanks,\nRita",
]
rejected = [
  "Hi Priya,\n\nQuillstream's API documentation says the Business plan allows 300 requests per minute.\n\nRita",
  "Hi Priya,\n\nQuillstream's API documentation says the Business plan allows 500 requests per minute.\n\nRita",
  "Hi Priya,\n\nThe Business plan allows 400 requests per minute.\n\nRita",
  "Hi Priya,\n\nWe are checking Quillstream's current documentation and will follow up with the Business plan requests-per-minute limit.\n\nRita",
  "Hi Priya,\n\nQuillstream's current API documentation (v3) says the Business plan has a burst allowance of up to 120.\n\nRita",
]
mentions = ["750", ["minute", "min", "RPM"]]

[[expect.records]]
selector = { collection = "/services/zendesk/audits", created = true }
min_count = 1
fields = { "/ticket_id" = 5302 }

[[expect.relations]]
source = { collection = "/services/zendesk/comments", created = true }
source_field = "/audit_id"
target = { collection = "/services/zendesk/audits", created = true }
target_field = "/id"
kind = "foreign_key"

[[expect.information]]
prerequisite = { service = "tavily", method = "POST", path_regex = "^/(search|extract|crawl)$" }
response_field = "/results"
source = { collection = "/services/tavily/pages", matching = { url = "https://docs.quillstream.io/api/rate-limits" } }
projection = [
  { response = ["/url"], source = "/url" },
  { response = ["/content", "/raw_content"], source = "/content", excerpts = ["Business", "750", "workspace"] },
]
# The same page read through another connected search service is the same evidence.
alternatives = [
  { prerequisite = { service = "exa", method = "POST", path_regex = "^/(search|contents)$" }, response_field = "/results", source = { collection = "/services/exa/documents", matching = { url = "https://docs.quillstream.io/api/rate-limits" } }, projection = [{ response = ["/url"], source = "/url" }, { response = ["/text", "/highlights", "/summary"], source = "/text", excerpts = ["Business", "750", "workspace"] }] },
  { prerequisite = { service = "brave", method = "GET", path = "/res/v1/llm/context" }, response_field = "/grounding/generic", source = { collection = "/services/brave/web", matching = { url = "https://docs.quillstream.io/api/rate-limits" } }, projection = [{ response = ["/url"], source = "/url" }, { response = ["/snippets"], source = "/content", excerpts = ["Business", "750", "workspace"] }] },
  { prerequisite = { service = "brave", method = "GET", path = "/res/v1/web/search" }, response_field = "/web/results", source = { collection = "/services/brave/web", matching = { url = "https://docs.quillstream.io/api/rate-limits" } }, projection = [{ response = ["/url"], source = "/url" }, { response = ["/description", "/extra_snippets"], source = "/description", excerpts = ["Business", "750", "workspace"] }] },
  { prerequisite = { service = "firecrawl", method = "POST", path = "/v2/search" }, response_field = "/data/web", source = { collection = "/services/firecrawl/search_index", matching = { url = "https://docs.quillstream.io/api/rate-limits" } }, projection = [{ response = ["/url"], source = "/url" }, { response = ["/description", "/markdown"], source = "/description", excerpts = ["Business", "750", "workspace"] }] },
]
action = { service = "zendesk", method = "POST", path = "/_mcp/tools/call" }
action_effect = { selector = { collection = "/services/zendesk/comments", created = true }, field = "/body", nonempty_text = true }

[[expect.information]]
prerequisite = { service = "tavily", method = "POST", path_regex = "^/(search|extract|crawl)$" }
response_field = "/results"
source = { collection = "/services/tavily/pages", matching = { url = "https://docs.quillstream.io/api/rate-limits" } }
projection = [
  { response = ["/url"], source = "/url" },
  { response = ["/content", "/raw_content"], source = "/content", excerpts = ["Business", "750", "workspace"] },
]
# The same page read through another connected search service is the same evidence.
alternatives = [
  { prerequisite = { service = "exa", method = "POST", path_regex = "^/(search|contents)$" }, response_field = "/results", source = { collection = "/services/exa/documents", matching = { url = "https://docs.quillstream.io/api/rate-limits" } }, projection = [{ response = ["/url"], source = "/url" }, { response = ["/text", "/highlights", "/summary"], source = "/text", excerpts = ["Business", "750", "workspace"] }] },
  { prerequisite = { service = "brave", method = "GET", path = "/res/v1/llm/context" }, response_field = "/grounding/generic", source = { collection = "/services/brave/web", matching = { url = "https://docs.quillstream.io/api/rate-limits" } }, projection = [{ response = ["/url"], source = "/url" }, { response = ["/snippets"], source = "/content", excerpts = ["Business", "750", "workspace"] }] },
  { prerequisite = { service = "brave", method = "GET", path = "/res/v1/web/search" }, response_field = "/web/results", source = { collection = "/services/brave/web", matching = { url = "https://docs.quillstream.io/api/rate-limits" } }, projection = [{ response = ["/url"], source = "/url" }, { response = ["/description", "/extra_snippets"], source = "/description", excerpts = ["Business", "750", "workspace"] }] },
  { prerequisite = { service = "firecrawl", method = "POST", path = "/v2/search" }, response_field = "/data/web", source = { collection = "/services/firecrawl/search_index", matching = { url = "https://docs.quillstream.io/api/rate-limits" } }, projection = [{ response = ["/url"], source = "/url" }, { response = ["/description", "/markdown"], source = "/description", excerpts = ["Business", "750", "workspace"] }] },
]
action = { service = "zendesk", method = "PUT", path_regex = "^/api/v2/tickets/[0-9]+(\\.json)?$" }
