[scenario]
id = "search/firecrawl/monitor-competitor-pricing"
title = "Create a daily monitor on a competitor's pricing page"
now = "2026-10-28T16:30:00Z"
seed = "search-firecrawl-monitor-competitor-pricing"
services = ["firecrawl"]
tags = ["write", "single-service", "firecrawl"]
timeout_sec = 900

[expect]
version = 2
audit_history = true

[[expect.records]]
selector = { collection = "/services/firecrawl/monitors", created = true }
equals = 1
firecrawl_monitor = { name = "Fabrikam pricing", url = "https://www.fabrikam.io/pricing", recipient = "pricing-intel@contoso.example", judged_goal = { requirement = "When an active monitor's judging is enabled, the criterion must retain all price and plan-limit changes on the pricing page. Paused setup edits may be revised before reactivation. Broad unjudged markdown tracking is also valid. Unreviewed active filtering requires adjudication.", accepted = ["Alert when Fabrikam changes any plan price or plan limit.", "Notify when prices or plan limits change.", "Alert on any change to the pricing page."], rejected = ["Alert only about careers. Ignore prices and plan limits.", "Only alert about prices, never plan limits."] } }

[[expect.records]]
selector = { collection = "/services/firecrawl/monitor_checks", created = true }
max_count = 1
fields = { "/trigger" = "manual" }

[[expect.relations]]
kind = "foreign_key"
source = { collection = "/services/firecrawl/monitor_checks", created = true }
source_field = "/monitorId"
target = { collection = "/services/firecrawl/monitors", created = true }
target_field = "/id"

[expect.preservation]
allow = [
  { pointer = "/services/firecrawl/monitors/*", kind = "create", matching = { name = "Fabrikam pricing" }, cause = { service = "firecrawl", methods = ["POST"], path_regex = "^/v2/monitor$" } },
  { pointer = "/services/firecrawl/monitors/*/notification", references = [{ source_field = "/id", target_field = "/id", target = { collection = "/services/firecrawl/monitors", created = true } }], cause = { service = "firecrawl", methods = ["PATCH"], path_regex = "^/v2/monitor/[^/]+$" } },
  { pointer = "/services/firecrawl/monitors/*/goal", references = [{ source_field = "/id", target_field = "/id", target = { collection = "/services/firecrawl/monitors", created = true } }], cause = { service = "firecrawl", methods = ["PATCH"], path_regex = "^/v2/monitor/[^/]+$" } },
  { pointer = "/services/firecrawl/monitors/*/judgeEnabled", references = [{ source_field = "/id", target_field = "/id", target = { collection = "/services/firecrawl/monitors", created = true } }], cause = { service = "firecrawl", methods = ["PATCH"], path_regex = "^/v2/monitor/[^/]+$" } },
  { pointer = "/services/firecrawl/monitors/*/status", references = [{ source_field = "/id", target_field = "/id", target = { collection = "/services/firecrawl/monitors", created = true } }], cause = { service = "firecrawl", methods = ["PATCH"], path_regex = "^/v2/monitor/[^/]+$" } },
  { pointer = "/services/firecrawl/monitors/*/schedule", references = [{ source_field = "/id", target_field = "/id", target = { collection = "/services/firecrawl/monitors", created = true } }], cause = { service = "firecrawl", methods = ["PATCH"], path_regex = "^/v2/monitor/[^/]+$" } },
  { pointer = "/services/firecrawl/monitors/*/nextRunAt", references = [{ source_field = "/id", target_field = "/id", target = { collection = "/services/firecrawl/monitors", created = true } }], cause = { service = "firecrawl", methods = ["PATCH"], path_regex = "^/v2/monitor/[^/]+$" } },
  { pointer = "/services/firecrawl/monitors/*/updatedAt", references = [{ source_field = "/id", target_field = "/id", target = { collection = "/services/firecrawl/monitors", created = true } }], cause = { service = "firecrawl", methods = ["PATCH"], path_regex = "^/v2/monitor/[^/]+$" } },
  { pointer = "/services/firecrawl/monitors/*/lastRunAt", references = [{ source_field = "/id", target_field = "/id", target = { collection = "/services/firecrawl/monitors", created = true } }], cause = { service = "firecrawl", methods = ["POST"], path_regex = "^/v2/monitor/[^/]+/run$" } },
  { pointer = "/services/firecrawl/monitors/*/lastCheckId", references = [{ source_field = "/id", target_field = "/id", target = { collection = "/services/firecrawl/monitors", created = true } }], cause = { service = "firecrawl", methods = ["POST"], path_regex = "^/v2/monitor/[^/]+/run$" } },
  { pointer = "/services/firecrawl/monitor_checks/*", kind = "create", matching = { trigger = "manual" }, references = [{ source_field = "/monitorId", target_field = "/id", target = { collection = "/services/firecrawl/monitors", created = true } }], cause = { service = "firecrawl", methods = ["POST"], path_regex = "^/v2/monitor/[^/]+/run$" } },
  { pointer = "/services/firecrawl/monitor_checks/*/status", references = [{ source_field = "/monitorId", target_field = "/id", target = { collection = "/services/firecrawl/monitors", created = true } }], cause = { service = "firecrawl", methods = ["GET"], path_regex = "^/v2/monitor/[^/]+/checks/[^/]+$" } },
  { pointer = "/services/firecrawl/monitor_checks/*/startedAt", references = [{ source_field = "/monitorId", target_field = "/id", target = { collection = "/services/firecrawl/monitors", created = true } }], cause = { service = "firecrawl", methods = ["GET"], path_regex = "^/v2/monitor/[^/]+/checks/[^/]+$" } },
  { pointer = "/services/firecrawl/monitor_checks/*/completedAt", references = [{ source_field = "/monitorId", target_field = "/id", target = { collection = "/services/firecrawl/monitors", created = true } }], cause = { service = "firecrawl", methods = ["GET"], path_regex = "^/v2/monitor/[^/]+/checks/[^/]+$" } },
  { pointer = "/services/firecrawl/monitor_checks/*/summary", references = [{ source_field = "/monitorId", target_field = "/id", target = { collection = "/services/firecrawl/monitors", created = true } }], cause = { service = "firecrawl", methods = ["GET"], path_regex = "^/v2/monitor/[^/]+/checks/[^/]+$" } },
  { pointer = "/services/firecrawl/monitor_checks/*/pages", references = [{ source_field = "/monitorId", target_field = "/id", target = { collection = "/services/firecrawl/monitors", created = true } }], cause = { service = "firecrawl", methods = ["GET"], path_regex = "^/v2/monitor/[^/]+/checks/[^/]+$" } },
]

[[expect.forbidden_calls]]
service = "firecrawl"
method = "DELETE"
path_regex = "^/v2/monitor/"

[[expect.forbidden_calls]]
service = "firecrawl"
method = "PATCH"
path_regex = "^/v2/monitor/3f6b2a10-5c4e-4d21-9b7a-1e0c2d3f4a0[12]$"

[[solution.call]]
endpoint = "firecrawl"
tool = "firecrawl_monitor_list"
arguments = {}

[[solution.call]]
endpoint = "firecrawl"
tool = "firecrawl_monitor_create"
arguments = { name = "Fabrikam pricing", page = "https://www.fabrikam.io/pricing", goal = "Alert when Fabrikam changes any plan price or plan limit.", scheduleText = "daily", timezone = "UTC", email = "pricing-intel@contoso.example", includeDiffs = true }
