[scenario]
id = "search/firecrawl/crawl-api-reference"
title = "Crawl only the API reference section of a partner's docs"
now = "2026-10-29T10:00:00Z"
seed = "search-firecrawl-crawl-api-reference"
services = ["firecrawl"]
tags = ["write", "single-service", "firecrawl"]
timeout_sec = 900

[scenario.family]
schema_version = 1
primary = "baseline"
secondary = []
dependency_depth = 1
rationale = "Origin https://docs.lumenpay.dev and the /api/ prefix are given; the contract checks the one created crawl that plans pages, scoped to that prefix, beside at most three that planned none, with no competing record to choose between."

[expect]
version = 2
audit_history = true

# Firecrawl tests the start URL against includePaths too, so the natural first attempt (the
# site root given in the request with an /api/ filter) completes with no pages, and a crawl
# cannot be removed afterwards. Such a job indexes nothing and costs no credits, so up to three
# of them may accompany the requested crawl. Exactly one created crawl may plan any page, and
# it must plan exactly the API section.
[[expect.records]]
selector = { collection = "/services/firecrawl/crawls", created = true, field_patterns = { "/plannedPages/0" = "^https?://" } }
equals = 1
firecrawl_crawl = { origin = "https://docs.lumenpay.dev", path_prefix = "/api/" }

[expect.preservation]
allow = [
  { pointer = "/services/firecrawl/crawls/*", kind = "create", field_patterns = { "/status" = "^(queued|scraping|completed)$", "/plannedPages/0" = "^https?://" }, cause = { service = "firecrawl", methods = ["POST"], path_regex = "^/v2/crawl$" } },
  { pointer = "/services/firecrawl/crawls/*", kind = "create", matching = { total = 0, completed = 0, creditsUsed = 0 }, array_lengths = { "/plannedPages" = 0, "/pages" = 0 }, field_patterns = { "/status" = "^(queued|scraping|completed)$" }, max_count = 3, cause = { service = "firecrawl", methods = ["POST"], path_regex = "^/v2/crawl$" } },
  { pointer = "/services/firecrawl/crawls/*/status", references = [{ source_field = "/id", target_field = "/id", target = { collection = "/services/firecrawl/crawls", created = true } }], max_count = 4, cause = { service = "firecrawl", methods = ["GET"], path_regex = "^/v2/crawl/[^/]+$" } },
  { pointer = "/services/firecrawl/crawls/*/pages", references = [{ source_field = "/id", target_field = "/id", target = { collection = "/services/firecrawl/crawls", created = true } }], cause = { service = "firecrawl", methods = ["GET"], path_regex = "^/v2/crawl/[^/]+$" } },
  { pointer = "/services/firecrawl/crawls/*/scrapeIds", references = [{ source_field = "/id", target_field = "/id", target = { collection = "/services/firecrawl/crawls", created = true } }], cause = { service = "firecrawl", methods = ["GET"], path_regex = "^/v2/crawl/[^/]+$" } },
  { pointer = "/services/firecrawl/crawls/*/completed", references = [{ source_field = "/id", target_field = "/id", target = { collection = "/services/firecrawl/crawls", created = true } }], cause = { service = "firecrawl", methods = ["GET"], path_regex = "^/v2/crawl/[^/]+$" } },
  { pointer = "/services/firecrawl/crawls/*/creditsUsed", references = [{ source_field = "/id", target_field = "/id", target = { collection = "/services/firecrawl/crawls", created = true } }], cause = { service = "firecrawl", methods = ["GET"], path_regex = "^/v2/crawl/[^/]+$" } },
  { pointer = "/services/firecrawl/crawls/*/expiresAt", references = [{ source_field = "/id", target_field = "/id", target = { collection = "/services/firecrawl/crawls", created = true } }], cause = { service = "firecrawl", methods = ["GET"], path_regex = "^/v2/crawl/[^/]+$" } },
]

[[expect.forbidden_calls]]
service = "firecrawl"
method = "DELETE"
path_regex = "^/v2/crawl/"

[[solution.call]]
endpoint = "firecrawl"
tool = "firecrawl_map"
arguments = { url = "https://docs.lumenpay.dev" }

[[solution.call]]
endpoint = "firecrawl"
tool = "firecrawl_crawl"
arguments = { url = "https://docs.lumenpay.dev/api/overview", crawlEntireDomain = true, includePaths = ["^/api/.*"], limit = 50 }
