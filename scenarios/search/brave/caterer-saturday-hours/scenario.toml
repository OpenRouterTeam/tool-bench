[scenario]
id = "search/brave/caterer-saturday-hours"
title = "Find a local caterer's phone and Saturday hours among look-alike businesses"
now = "2026-10-26T16:30:00Z"
seed = "search-brave-caterer-saturday-hours"
services = ["brave"]
tags = ["lookup", "single-service", "brave", "disambiguation"]
timeout_sec = 900

[scenario.family]
schema_version = 1
primary = "entity_ambiguity"
secondary = ["stale_state", "tool_ambiguity"]
dependency_depth = 1
rationale = "Portland OR listing (503-555-0142, Sat 09:00-14:00) vs Portland ME namesake (207-555-0198) and Juniper Rye Bakery (503-555-0177); a 2023 Yelp page says Sat Closed; a local endpoint call is required."

# Right business: Portland, OR (+1 503-555-0142, Sat 09:00-14:00). Distractors: the
# Portland, ME namesake (207-555-0198, Sat 10:00-16:00), Juniper Rye Bakery (503-555-0177),
# and a stale review page saying "Sat Closed".
[expect]
version = 2
audit_history = true

[expect.answer]
 [expect.answer.record_facts]
 requirement = "State the phone number and Saturday opening hours of the Portland, Oregon caterer from local listing data."
 mode = "statements"
 order = ["opens", "closes"]

 [expect.answer.record_facts.selector]
 collection = "/services/brave/pois"
 matching = { postal_address = { addressRegion = "OR" } }
 field_patterns = { "/title" = "(?i)catering" }

 [expect.answer.record_facts.filter]
 patterns = { "/categories/0" = "(?i)caterer" }

 [expect.answer.record_facts.facts.phone]
 field = "/contact/telephone"
 kind = "phone"

 [expect.answer.record_facts.facts.opens]
 field = "/opening_hours/days/5/0/opens"
 kind = "text"

 [expect.answer.record_facts.facts.closes]
 field = "/opening_hours/days/5/0/closes"
 kind = "text"

# Phone numbers and hours only come from local listing data.
[[expect.required_calls]]
service = "brave"
method = "GET"
path_regex = "^/res/v1/local/"

[solution]
answer = "Phone: 503-555-0142. Saturday: 09:00-14:00."

[[solution.call]]
endpoint = "brave-search"
tool = "brave_local_search"
arguments = { query = "Juniper & Rye Catering Portland Oregon" }
