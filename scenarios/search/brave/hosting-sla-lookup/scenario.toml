[scenario]
id = "search/brave/hosting-sla-lookup"
title = "Look up a hosting provider's current Business-plan SLA"
now = "2026-10-26T14:00:00Z"
seed = "search-brave-hosting-sla-lookup"
services = ["brave"]
tags = ["lookup", "single-service", "brave"]
timeout_sec = 900

[scenario.family]
schema_version = 1
primary = "stale_state"
secondary = ["entity_ambiguity"]
dependency_depth = 1
rationale = "Current SLA (effective 2026-07-01) gives Business 99.95 and a 10 percent credit; the archived 2024 SLA page and a 2025 Reddit post say 99.9 and 5 percent; look-alike IronBank Hosting says 99.99 and 20."

# Current SLA: 99.95% / 10%. Distractors: archived 2024 SLA and a Reddit post (99.9% / 5%),
# a look-alike provider "IronBank Hosting" (99.99% / 20%).
[expect]
version = 2
audit_history = true

# The page is Ironbark Hosting's own SLA whose title carries no "archived" qualifier. Both
# facts are read from its Business plan entry; the patterns also read the prose entry of the
# archived version, whose values therefore count as another record's.
[expect.answer.record_facts]
requirement = "State the monthly uptime percentage that Ironbark Hosting's SLA in force commits to for the Business plan, and the service credit percentage due when uptime falls just below that commitment."
mode = "statements"
context = [
  "(SLA effective ${effective_date})",
  "${escalated_credit}% below ${escalated_threshold}%",
]
# Both facts are percentages, so a swap of the two roles is rejected outright.
rejected = [
  "uptime: ${credit}%",
  "uptime of ${credit}%",
  "uptime is ${credit}%",
  "${credit}% uptime",
  "${credit}% monthly uptime",
  "credit: ${uptime}%",
  "credit of ${uptime}%",
  "credit is ${uptime}%",
]

[expect.answer.record_facts.selector]
collection = "/services/brave/web"
field_patterns = { "/title" = '^Service Level Agreement \| Ironbark Hosting$' }

[expect.answer.record_facts.facts.uptime]
field = "/content"
capture = 'Business (?:\||plan:) (\d+(?:\.\d+)?)%'
kind = "number"
units = ["%", "percent", "pct"]
require_unit = true

[expect.answer.record_facts.facts.credit]
field = "/content"
capture = 'Business (?:\| [\d.]+% \||plan: [\d.]+% monthly uptime\. Service credit:) (\d+(?:\.\d+)?)% of the monthly fee'
kind = "number"
units = ["%", "percent", "pct"]
require_unit = true

[expect.answer.record_facts.facts.effective_date]
field = "/content"
capture = 'Effective ([A-Z][a-z]+ \d{1,2},? \d{4})'
kind = "date"
optional = true

[expect.answer.record_facts.facts.escalated_credit]
field = "/content"
capture = '; (\d+)% below'
kind = "number"
optional = true

[expect.answer.record_facts.facts.escalated_threshold]
field = "/content"
capture = '; \d+% below (\d+\.\d+)%'
kind = "number"
optional = true

[[expect.required_calls]]
service = "brave"
method = "GET"
path_regex = "^/res/v1/"

[solution]
answer = "Uptime: 99.95% Service credit: 10% of the monthly fee"

[[solution.call]]
endpoint = "brave-search"
tool = "brave_web_search"
arguments = { query = "Ironbark Hosting SLA Business plan uptime service credit", extra_snippets = true }
