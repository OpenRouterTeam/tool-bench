# Replaces `search/brave/keynote-recording`, which is archived under
# `releases/archive/tool-bench-public-dev-1/`. Release `tool-bench-public-dev-2`.
#
# What changed: the same pages are served by all four connected web-search services
# (Brave, Exa, Firecrawl, Tavily), and a read through any of them is accepted. The
# instruction is the original, word for word.
#
# Why: the instruction asks for a kind of lookup and names no vendor, while the original
# kept each page on one vendor (Brave), so no other could answer. This task scores
# what the instruction asks. The pages exist on no public site, so an answer from outside
# the tool servers still fails, and `mcp_only` still rejects a request that reaches the
# world around them.
#
# The single-vendor `required_calls` entry is gone, and no entry replaces it: an entry
# names one service and every entry must hold. The answer check carries the route, as it
# always has in `search/firecrawl/team-pricing-any-search` and its original.
[scenario]
id = "search/brave/keynote-any-search"
title = "Find the full official recording of a conference keynote among look-alike videos (any connected search vendor)"
now = "2026-10-30T08:45:00Z"
seed = "search-brave-keynote-any-search"
services = ["brave", "exa", "firecrawl", "tavily"]
tags = ["lookup", "single-service", "any-search-vendor", "disambiguation", "route:unnamed"]
timeout_sec = 900

[scenario.family]
schema_version = 1
primary = "entity_ambiguity"
secondary = ["stale_state"]
dependency_depth = 1
rationale = "Official video Zt4mQeL1x9c (47:12, PGConf Nordic channel) vs a 12:05 highlights re-cut, the 28:40 April 2025 meetup version by the same speaker and Tom Ekberg's 39:55 talk; answer must cite Zt4mQeL1x9c."

# Right video: Zt4mQeL1x9c, 47:12, Marta Lindqvist. Distractors: a 12:05 highlights re-cut,
# the 28:40 2025 meetup version, and a different speaker's similar talk (39:55).
[expect]
version = 2
audit_history = true

# The video is the full recording of the named keynote published by the conference's own
# channel; the speaker is read from the "<talk> - <speaker>" part of its title.
[expect.answer.record_facts]
requirement = "For the full recording of the keynote \"Scaling Postgres to 1M writes/s\" published by the PGConf Nordic channel, state the speaker, the video duration and the video URL."
mode = "statements"
context = [
  "Full official recording (PGConf Nordic channel):",
]

[expect.answer.record_facts.selector]
collection = "/services/brave/videos"
matching = { creator = "PGConf Nordic" }
field_patterns = { "/title" = 'Scaling Postgres to 1M writes/s', "/description" = '(?i)full recording' }

[expect.answer.record_facts.facts.speaker]
field = "/title"
capture = ' - ([A-Z][a-z]+ [A-Z][a-z]+)(?: \||$| \()'
kind = "text"

[expect.answer.record_facts.facts.duration]
field = "/duration"
kind = "identifier"

[expect.answer.record_facts.facts.url]
field = "/url"
kind = "identifier"

[solution]
answer = "Speaker: Marta Lindqvist. Duration: 47:12. Recording: https://www.youtube.com/watch?v=Zt4mQeL1x9c"

[[solution.call]]
endpoint = "brave-search"
tool = "brave_video_search"
arguments = { query = "Scaling Postgres to 1M writes/s keynote PGConf Nordic 2026" }
