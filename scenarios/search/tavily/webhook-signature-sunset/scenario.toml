[scenario]
id = "search/tavily/webhook-signature-sunset"
title = "Find the v1 webhook signature sunset date among look-alike deprecations"
now = "2026-10-30T09:15:00Z"
seed = "search-tavily-webhook-signature-sunset"
services = ["tavily"]
tags = ["lookup", "single-service", "tavily", "disambiguation"]
timeout_sec = 900

[scenario.family]
schema_version = 1
primary = "entity_ambiguity"
secondary = ["stale_state"]
dependency_depth = 2
rationale = "The v1 signature sunset is 2027-01-15 on the verify-signatures page; look-alike dates are v1 API keys 2026-12-01, SDK 3.x EOL 2026-11-30 and the archived v1 webhooks page saying June 30, 2026."

# Distractors: v1 API keys (2026-12-01), SDK 3.x EOL (2026-11-30), archived v1 page (2026-06-30).
[expect]
version = 2
audit_history = true

# The page is the webhook-signature guide on docs.ferrowave.dev. It holds exactly one date,
# the day v1 signatures stop being sent. The API-key guide and the archived v1 page also
# hold one date each, so those look-alike deadlines count as another record's value.
[expect.answer.record_facts]
requirement = "State the date on which Ferrowave stops sending v1 webhook signatures according to the webhook-signature guide of its current developer docs, and name the header that guide says to verify instead."
mode = "statements"
context = [
  "(v1 header: ${old_header})",
  "not ${old_header}",
  "not ${key_deadline}",
  "(${v2_algorithm} over timestamp and body)",
]
assertions = [
  "Date: ${date} Header: ${header}",
  "v1 signatures stop on ${date}; verify the ${header} header instead.",
  "${date} - ${header}",
  "Ferrowave will no longer send v1 signatures after ${date}; switch to ${header}.",
  "${date}",
  "verify ${header}",
  "${date}; verify ${header}",
]

[expect.answer.record_facts.selector]
collection = "/services/tavily/pages"
field_patterns = { "/url" = '^https://docs\.ferrowave\.dev/', "/title" = '(?i)webhook signatures' }

[expect.answer.record_facts.facts.date]
field = "/raw_content"
kind = "date"

[expect.answer.record_facts.facts.header]
field = "/raw_content"
capture = 'Switch your verification to `([^`]+)`'
kind = "identifier"

[expect.answer.record_facts.related.api_keys]
collection = "/services/tavily/pages"
filter = { matching = { "/url" = "https://docs.ferrowave.dev/guides/api-keys" } }
allow_absence = true

[expect.answer.record_facts.facts.key_deadline]
record = "api_keys"
field = "/raw_content"
kind = "date"
optional = true

[expect.answer.record_facts.facts.old_header]
field = "/raw_content"
capture = 'v1 `([^`]+)` header'
kind = "identifier"
optional = true

[expect.answer.record_facts.facts.v2_algorithm]
field = "/raw_content"
capture = 'v2=<hex (HMAC-SHA\d+)'
kind = "text"
optional = true

[[expect.required_calls]]
service = "tavily"
method = "POST"
path_regex = "^/(search|extract|crawl|map|research)$"

[solution]
answer = "Date: 2027-01-15 Header: Ferrowave-Signature-V2"

[[solution.call]]
endpoint = "tavily"
tool = "tavily_map"
arguments = { url = "https://docs.ferrowave.dev", max_depth = 2 }

[[solution.call]]
endpoint = "tavily"
tool = "tavily_extract"
arguments = { urls = ["https://docs.ferrowave.dev/guides/webhooks/verify-signatures", "https://docs.ferrowave.dev/changelog"] }
