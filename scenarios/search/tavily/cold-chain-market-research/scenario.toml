[scenario]
id = "search/tavily/cold-chain-market-research"
title = "Run a mini research task on Nordic cold-chain sensor vendors"
now = "2026-10-27T10:00:00Z"
seed = "search-tavily-cold-chain-market-research"
services = ["tavily"]
tags = ["write", "single-service", "tavily"]
timeout_sec = 900

[scenario.family]
schema_version = 1
primary = "baseline"
secondary = []
dependency_depth = 1
rationale = "The request names the mini research model outright and the report has one clear leader row (FrostLink, 38 percent, EUR 4.20); the forbidden pro and auto calls only check that stated constraint."

[expect]
version = 2
audit_history = true

[[expect.records]]
selector = { collection = "/services/tavily/research", created = true }
equals = 1
fields = { "/model" = "mini", "/status" = "completed" }

[[expect.relations]]
source = { collection = "/services/tavily/research", created = true }
source_field = "/content"
target = { collection = "/services/tavily/research_reports", matching = { id = "report-nordic-grocery-cold-chain" } }
target_field = "/content"
kind = "equals"

[[expect.relations]]
source = { collection = "/services/tavily/research", created = true }
source_field = "/sources"
target = { collection = "/services/tavily/research_reports", matching = { id = "report-nordic-grocery-cold-chain" } }
target_field = "/sources"
kind = "equals"

[[expect.preservation.allow]]
pointer = "/services/tavily/research/*"
kind = "create"
matching = { model = "mini" }
max_count = 1

[[expect.required_calls]]
service = "tavily"
method = "POST"
path = "/research"
body = { model = "mini" }

[[expect.forbidden_calls]]
service = "tavily"
method = "POST"
path = "/research"
body = { model = "pro" }

[[expect.forbidden_calls]]
service = "tavily"
method = "POST"
path = "/research"
body = { model = "auto" }

[expect.answer.source_facts]
requirement = "Name the vendor with the largest share in the authored Nordic grocery cold-chain report and attribute that same vendor's per-sensor monthly list price to it, without negation or misattribution."
source = { selector = { collection = "/services/tavily/research_reports", matching = { id = "report-nordic-grocery-cold-chain" } }, field = "/content" }
key = "vendor"
rows = { largest = "share" }
claims = [
  "Market leader: ${vendor} (${hq}), about ${share} of monitored grocery cold rooms in the Nordics. List price: ${price} per sensor per month.",
  "Market leader: ${vendor}, about ${share} of monitored grocery cold rooms in the Nordics. List price: ${price} per sensor per month.",
  "Market leader: ${vendor}. List price: ${price} per sensor per month.",
  "Largest market share: ${vendor}. List price: ${price} per sensor per month.",
  "${vendor} has the largest share (${share}) and lists at ${price} per sensor per month.",
  "${vendor} has the largest market share and lists at ${price} per sensor per month.",
  "${vendor} has the largest share. ${vendor} charges ${price} per sensor per month.",
  "${vendor} is the market leader at ${price} per sensor per month.",
]
neutral_claims = [
  "${vendor} — ${price} per sensor per month.",
  "${vendor} — ${price} pro Sensor und Monat.",
  "${vendor}: ${price} per sensor per month.",
]
rejected = [
  "${vendor} does not have the largest share.",
  "${vendor} is not the market leader.",
  "${vendor} is not the market leader. ${vendor} charges ${price} per sensor per month.",
]

[expect.answer.source_facts.columns.vendor]
header = "Vendor"
kind = "name"
answer_headers = ["Market leader", "Leader", "Largest vendor", "Leading vendor"]

[expect.answer.source_facts.columns.hq]
header = "HQ"
kind = "place"
required = false
answer_headers = ["Headquarters"]

[expect.answer.source_facts.columns.share]
header = "Est. share of monitored grocery cold rooms (Nordics)"
kind = "percent"
required = false
answer_headers = ["Share", "Market share", "Est. share"]

[expect.answer.source_facts.columns.price]
header = "List price"
kind = "money"
answer_headers = ["Price", "Price per sensor per month", "Monthly price per sensor", "List price per sensor per month", "Per-sensor monthly price"]

[solution]
answer = "Market leader: FrostLink (Oslo), about 38% of monitored grocery cold rooms in the Nordics. List price: EUR 4.20 per sensor per month.\n"

[[solution.call]]
endpoint = "tavily"
tool = "tavily_research"
arguments = { input = "Which vendors sell wireless cold-chain temperature monitoring sensors to grocery chains in the Nordic countries, what is each vendor's market share, and what do they charge per sensor per month?", model = "mini" }
