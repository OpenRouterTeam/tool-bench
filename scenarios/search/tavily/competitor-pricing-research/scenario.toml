[scenario]
id = "search/tavily/competitor-pricing-research"
title = "Commission pro research on the competitors from our compare page"
now = "2026-10-21T13:30:00Z"
seed = "search-tavily-competitor-pricing-research"
services = ["tavily"]
tags = ["write", "single-service", "tavily", "disambiguation"]
timeout_sec = 900

[scenario.family]
schema_version = 1
primary = "entity_ambiguity"
secondary = ["stale_state"]
dependency_depth = 1
rationale = "The compare page lists exactly Tallybook, Billfold and Sumwise; the G2 category page adds InvoiceNinja, Zervant and FreshBooks, and Ledgerize was dropped in 2025; inputs naming extras are rejected."

[expect]
version = 2
audit_history = true

[[expect.records]]
selector = { collection = "/services/tavily/research", created = true }
equals = 1
fields = { "/model" = "pro", "/status" = "completed" }

[expect.records.reviewed_text."/input"]
requirement = "Ask for one comprehensive report on the current pricing plans of exactly Tallybook, Billfold and Sumwise, the competitors on the Ledgerly compare page, without adding other tools: FreshBooks, InvoiceNinja and Zervant are not on that page and Ledgerize was dropped from it."
accepted = [
  "Compare the current pricing plans (plan names, monthly prices and what each plan includes) of the invoicing tools Tallybook, Billfold and Sumwise.",
  "Research the current pricing plans of Tallybook, Billfold and Sumwise.",
  "What are the current pricing plans of the invoicing tools Tallybook, Billfold and Sumwise?",
  "Research the current pricing plans of Tallybook, Billfold and Sumwise, but not FreshBooks.",
  "Research the current pricing plans of Tallybook, Billfold and Sumwise. Exclude Ledgerize, which is no longer on the compare page.",
]
rejected = [
  "Current pricing plans of Tallybook, Billfold, Sumwise and FreshBooks.",
  "Current pricing plans of Tallybook, Billfold, Sumwise and freshbooks.",
  "Current pricing plans of Tallybook, Billfold, Sumwise and Invoice Ninja.",
  "Current pricing plans of Tallybook, Billfold, Sumwise and Ledgerize.",
]
mentions = ["Tallybook", "Billfold", "Sumwise", ["pricing", "price", "prices", "priced", "plans", "cost", "costs"]]
forbids = ["FreshBooks", "Fresh Books", "InvoiceNinja", "Invoice Ninja", "Zervant", "Ledgerize"]

[[expect.records]]
selector = { collection = "/services/tavily/research", created = true, field_patterns = { "/input" = '(?i)\btallybook\b' } }
equals = 1

[[expect.records]]
selector = { collection = "/services/tavily/research", created = true, field_patterns = { "/input" = '(?i)\bbillfold\b' } }
equals = 1

[[expect.records]]
selector = { collection = "/services/tavily/research", created = true, field_patterns = { "/input" = '(?i)\bsumwise\b' } }
equals = 1

[[expect.relations]]
source = { collection = "/services/tavily/research", created = true }
source_field = "/content"
target = { collection = "/services/tavily/research_reports", matching = { id = "report-invoicing-competitor-pricing" } }
target_field = "/content"
kind = "equals"

[[expect.relations]]
source = { collection = "/services/tavily/research", created = true }
source_field = "/sources"
target = { collection = "/services/tavily/research_reports", matching = { id = "report-invoicing-competitor-pricing" } }
target_field = "/sources"
kind = "equals"

[[expect.preservation.allow]]
pointer = "/services/tavily/research/*"
kind = "create"
matching = { model = "pro" }
max_count = 1

[[expect.required_calls]]
service = "tavily"
method = "POST"
path = "/research"
body = { model = "pro" }

[[expect.information]]
prerequisite = { service = "tavily", method = "POST", path_regex = "^/(search|extract|crawl)$" }
response_field = "/results"
source = { collection = "/services/tavily/pages", matching = { url = "https://www.ledgerlyhq.com/compare" } }
projection = [
  { response = ["/url"], source = "/url" },
  { response = ["/content", "/raw_content"], source = "/content", excerpts = ["Tallybook", "Billfold", "Sumwise"] },
]
action = { service = "tavily", method = "POST", path = "/research" }
action_effect = { selector = { collection = "/services/tavily/research", created = true }, field = "/input", nonempty_text = true }

[[solution.call]]
endpoint = "tavily"
tool = "tavily_extract"
arguments = { urls = ["https://www.ledgerlyhq.com/compare"] }

[[solution.call]]
endpoint = "tavily"
tool = "tavily_research"
arguments = { input = "Compare the current pricing plans (plan names, monthly prices and what each plan includes) of the invoicing tools Tallybook, Billfold and Sumwise.", model = "pro" }
