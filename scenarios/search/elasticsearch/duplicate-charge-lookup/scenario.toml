[scenario]
id = "search/elasticsearch/duplicate-charge-lookup"
title = "Find a customer's duplicate charge in the orders index"
now = "2026-10-30T10:00:00Z"
seed = "search-elasticsearch-duplicate-charge-lookup"
services = ["elasticsearch"]
tags = ["lookup", "single-service", "elasticsearch", "disambiguation"]
timeout_sec = 900

[scenario.family]
schema_version = 1
primary = "entity_ambiguity"
secondary = []
dependency_depth = 1
rationale = "Jordan Lee's ORD-109002 and ORD-109003 (86.40, 28 s apart) vs Jordan Leigh's own 129.99 pair, j.lee@example.com's 86.40 order ORD-109010 and Jordan Lee's other orders; answer must list both IDs."

# Duplicates: ORD-109002 and ORD-109003 (86.40 USD, 28 s apart). Distractors: Jordan Leigh's
# own pair, j.lee@example.com's 86.40 order, and Jordan Lee's other orders.
[expect]
version = 2
audit_history = true

[expect.answer.record_facts]
requirement = "Among the orders of jordan.lee@example.com, state the order ID of every order that shares the one total charged more than once, and state that total in US dollars."
mode = "statements"

[expect.answer.record_facts.selector]
collection = "/services/elasticsearch/docs"
matching = { customer_email = "jordan.lee@example.com" }

[expect.answer.record_facts.selection.group]
by = "/total"
measure = "count"
pick = "largest"

[expect.answer.record_facts.facts.orders]
field = "/members/order_id"
kind = "identifier"

[expect.answer.record_facts.facts.amount]
field = "/key"
kind = "money"

[[expect.required_calls]]
service = "elasticsearch"
method = "POST"
path_regex = "(_search|_query)$"

[solution]
answer = "The double charge is ORD-109002 and ORD-109003, both $86.40."

[[solution.call]]
endpoint = "elasticsearch"
tool = "list_indices"
arguments = { index_pattern = "orders-*" }

[[solution.call]]
endpoint = "elasticsearch"
tool = "search"
arguments = { index = "orders-2026", query_body = { query = { term = { customer_email = "jordan.lee@example.com" } }, sort = [{ created_at = "asc" }], size = 20 } }
