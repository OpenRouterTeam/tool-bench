[scenario]
id = "business/multi/hubspot-won-to-salesforce-opportunity"
title = "Mirror a deal won in HubSpot onto the matching Salesforce opportunity"
now = "2026-10-29T14:00:00Z"
seed = "business-multi-hubspot-won-to-salesforce-opportunity"
services = ["hubspot", "salesforce"]
tags = ["write", "multi-service", "hubspot", "salesforce", "disambiguation"]
timeout_sec = 1200

[scenario.family]
schema_version = 1
primary = "reconciliation"
secondary = ["cross_system_identity", "entity_ambiguity"]
dependency_depth = 2
rationale = "HubSpot deal 9100104 is closedwon at 176500 on 2026-10-28 while Salesforce opp 0065g00000IDWm1AAH still shows Negotiation at 184000; contract relates both amounts; Initrode opp also carries 176500."

# HubSpot deal 9100104 "Initech – Data Warehouse Migration" moved to closedwon yesterday
# (closedate 2026-10-28) with a final amount of 176,500 (down from 184,000). The matching
# Salesforce opportunity is 0065g00000IDWm1AAH on the Initech account, still at
# Negotiation/Review for 184,000. Look-alikes: the Phase 0 Assessment deal (won in June, in
# both systems), Initech's open support renewal, and "Initrode - Data Warehouse Migration"
# (another account, whose amount happens to be 176,500).

[expect]
version = 2
audit_history = true

[[expect.records]]
selector = { collection = "/services/salesforce/Opportunity", matching = { Id = "0065g00000IDWm1AAH" } }
equals = 1
fields = { "/StageName" = "Closed Won", "/IsWon" = true, "/IsClosed" = true, "/CloseDate" = "2026-10-28" }
numeric_fields = { "/Amount" = 176500, "/Probability" = 100, "/ExpectedRevenue" = 176500 }

[[expect.records]]
selector = { collection = "/services/hubspot/notes", created = true }
equals = 1
fields = { "/archived" = false }
reviewed_text = { "/properties/hs_note_body" = { format = "html", requirement = "State that the Initech warehouse deal has been synced to Salesforce and identify its actual opportunity, 0065g00000IDWm1AAH (15-character form 0065g00000IDWm1). A bare ID, denial, wrong amount or incorrect date is not a truthful sync confirmation. Unlisted wording requires adjudication.", accepted = ["Synced to Salesforce opportunity 0065g00000IDWm1AAH.", "Synced to Salesforce opportunity 0065g00000IDWm1.", "Synced to Salesforce: opportunity 0065g00000IDWm1AAH marked Closed Won ($176,500, closed 2026-10-28)."] } }

[[expect.records]]
selector = { collection = "/services/hubspot/associations", created = true }
min_count = 1
max_count = 3
fields = { "/toObjectType" = "notes" }

[[expect.records]]
selector = { collection = "/services/hubspot/associations", created = true, matching = { fromObjectType = "deals", fromObjectId = "9100104", toObjectType = "notes", types = [{ associationCategory = "HUBSPOT_DEFINED", associationTypeId = 213 }] } }
equals = 1

[[expect.relations]]
source = { collection = "/services/hubspot/deals", matching = { id = "9100104" } }
source_field = "/properties/amount"
target = { collection = "/services/salesforce/Opportunity", matching = { Id = "0065g00000IDWm1AAH" } }
target_field = "/Amount"
kind = "numeric_equals"

[[expect.relations]]
source = { collection = "/services/hubspot/associations", created = true }
source_field = "/toObjectId"
target = { collection = "/services/hubspot/notes", created = true }
target_field = "/id"
kind = "foreign_key"

[[expect.ordering]]
prerequisite = { selector = { collection = "/services/salesforce/Opportunity", matching = { Id = "0065g00000IDWm1AAH" } }, field = "/StageName", equals = "Closed Won" }
action = { selector = { collection = "/services/hubspot/notes", created = true }, field = "/properties/hs_note_body", nonempty_text = true }

[[expect.ordering]]
prerequisite = { selector = { collection = "/services/salesforce/Opportunity", matching = { Id = "0065g00000IDWm1AAH" } }, field = "/Amount", numeric_equals = 176500 }
action = { selector = { collection = "/services/hubspot/notes", created = true }, field = "/properties/hs_note_body", nonempty_text = true }

[[expect.ordering]]
prerequisite = { selector = { collection = "/services/salesforce/Opportunity", matching = { Id = "0065g00000IDWm1AAH" } }, field = "/CloseDate", equals = "2026-10-28" }
action = { selector = { collection = "/services/hubspot/notes", created = true }, field = "/properties/hs_note_body", nonempty_text = true }

[[expect.preservation.allow]]
pointer = "/services/salesforce/Opportunity/0065g00000IDWm1AAH/StageName"

[[expect.preservation.allow]]
pointer = "/services/salesforce/Opportunity/0065g00000IDWm1AAH/Amount"

[[expect.preservation.allow]]
pointer = "/services/salesforce/Opportunity/0065g00000IDWm1AAH/CloseDate"

[[expect.preservation.allow]]
pointer = "/services/salesforce/Opportunity/0065g00000IDWm1AAH/IsWon"

[[expect.preservation.allow]]
pointer = "/services/salesforce/Opportunity/0065g00000IDWm1AAH/IsClosed"

[[expect.preservation.allow]]
pointer = "/services/salesforce/Opportunity/0065g00000IDWm1AAH/Probability"
matching = { StageName = "Closed Won", Probability = 100.0 }

[[expect.preservation.allow]]
pointer = "/services/salesforce/Opportunity/0065g00000IDWm1AAH/Probability"
matching = { StageName = "Closed Won", Probability = 100 }

[[expect.preservation.allow]]
pointer = "/services/salesforce/Opportunity/0065g00000IDWm1AAH/ExpectedRevenue"

[[expect.preservation.allow]]
pointer = "/services/salesforce/Opportunity/0065g00000IDWm1AAH/ForecastCategory"

[[expect.preservation.allow]]
pointer = "/services/salesforce/Opportunity/0065g00000IDWm1AAH/ForecastCategoryName"
matching = { StageName = "Closed Won", ForecastCategoryName = "Closed" }

[[expect.preservation.allow]]
pointer = "/services/salesforce/Opportunity/0065g00000IDWm1AAH/Fiscal"

[[expect.preservation.allow]]
pointer = "/services/salesforce/Opportunity/0065g00000IDWm1AAH/FiscalYear"

[[expect.preservation.allow]]
pointer = "/services/salesforce/Opportunity/0065g00000IDWm1AAH/FiscalQuarter"

[[expect.preservation.allow]]
pointer = "/services/salesforce/Opportunity/0065g00000IDWm1AAH/LastModifiedDate"

[[expect.preservation.allow]]
pointer = "/services/salesforce/Opportunity/0065g00000IDWm1AAH/LastModifiedById"

[[expect.preservation.allow]]
pointer = "/services/salesforce/Opportunity/0065g00000IDWm1AAH/SystemModstamp"

[[expect.preservation.allow]]
pointer = "/services/hubspot/notes/*"
kind = "create"
matching = { archived = false }

[[expect.preservation.allow]]
pointer = "/services/hubspot/associations/*"
kind = "create"
matching = { fromObjectType = "deals", fromObjectId = "9100104", toObjectType = "notes" }

[[expect.preservation.allow]]
pointer = "/services/hubspot/associations/*"
kind = "create"
matching = { fromObjectType = "contacts", fromObjectId = "512005", toObjectType = "notes" }

[[expect.preservation.allow]]
pointer = "/services/hubspot/associations/*"
kind = "create"
matching = { fromObjectType = "companies", fromObjectId = "18234002", toObjectType = "notes" }

[[solution.call]]
endpoint = "hubspot"
tool = "hubspot-search-objects"
arguments = { objectType = "deals", query = "Initech", properties = ["dealname", "amount", "dealstage", "closedate"] }

[[solution.call]]
endpoint = "salesforce"
tool = "salesforce_query_records"
arguments = { objectName = "Opportunity", fields = ["Id", "Name", "StageName", "Amount", "CloseDate", "Account.Name"], whereClause = "Account.Name = 'Initech'" }

[[solution.call]]
endpoint = "salesforce"
tool = "salesforce_dml_records"
arguments = { operation = "update", objectName = "Opportunity", records = [{ Id = "0065g00000IDWm1AAH", StageName = "Closed Won", Amount = 176500, CloseDate = "2026-10-28" }] }

[[solution.call]]
endpoint = "hubspot"
tool = "hubspot-create-engagement"
arguments = { type = "NOTE", ownerId = 81234501, timestamp = 1793282400000, associations = { dealIds = [9100104] }, metadata = { body = "Synced to Salesforce: opportunity 0065g00000IDWm1AAH marked Closed Won ($176,500, closed 2026-10-28)." } }
