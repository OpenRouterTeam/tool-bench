[scenario]
id = "business/multi/shopify-vip-stripe-coupon"
title = "Make the store's top spender a VIP in Shopify and discount their Stripe subscription"
now = "2026-05-18T14:00:00Z"
seed = "business-multi-shopify-vip-stripe-coupon"
services = ["shopify", "stripe"]
tags = ["write", "multi-service", "shopify", "stripe", "disambiguation"]
timeout_sec = 1200

# Shopify: the top spender is Priya Raman (7101, priya.raman@outlook.com, 1,130.00 over three
# orders). Distractors: Marcus Bell has the most orders, Elena Novak / Hannah Wright have big
# refunded or voided orders, Tom Achebe is second at 1,050.00.
# Stripe: two customers are named Priya Raman; the store customer is cus_PrRmOutlk01Ab (same
# email), whose Supply Club box is sub_PrRmOutlkMonthly0000001. She also pays for a gift
# subscription (sub_PrRmOutlkGift00000000001), which is not "her" box. The other Priya Raman
# (Raman Design Studio) has her own Monthly Box. Coupons: VIP15 is the current VIP coupon;
# VIP10-2025 is retired. Grade the actual new discount and its attachment.

[expect]
version = 2
audit_history = true

[[expect.state]]
pointer = "/services/shopify/customers/7101/tags"
member_ascii_ci = "VIP"

[[expect.state]]
pointer = "/services/stripe/coupons/VIP15/times_redeemed"
equals = 10

[[expect.records]]
selector = { collection = "/services/stripe/subscriptions", matching = { id = "sub_PrRmOutlkMonthly0000001" } }
equals = 1
fields = { "/status" = "active", "/customer" = "cus_PrRmOutlk01Ab" }
array_lengths = { "/discounts" = 1 }

[[expect.records]]
selector = { collection = "/services/stripe/discounts", created = true }
equals = 1
fields = { "/subscription" = "sub_PrRmOutlkMonthly0000001", "/customer" = "cus_PrRmOutlk01Ab", "/source/coupon" = "VIP15", "/source/type" = "coupon", "/start" = 1779112800 }
null_fields = ["/end"]

[[expect.relations]]
source = { collection = "/services/shopify/customers", matching = { id = 7101 } }
source_field = "/email"
target = { collection = "/services/stripe/customers", matching = { id = "cus_PrRmOutlk01Ab" } }
target_field = "/email"

[[expect.relations]]
source = { collection = "/services/stripe/subscriptions", matching = { id = "sub_PrRmOutlkMonthly0000001" } }
source_field = "/customer"
target = { collection = "/services/stripe/customers", matching = { id = "cus_PrRmOutlk01Ab" } }
target_field = "/id"

[[expect.relations]]
source = { collection = "/services/stripe/discounts", created = true }
source_field = "/id"
target = { collection = "/services/stripe/subscriptions", matching = { id = "sub_PrRmOutlkMonthly0000001" } }
target_field = "/discounts/0"

[[expect.preservation.allow]]
pointer = "/services/shopify/customers/7101/tags"
add_set_values = ["VIP"]
ascii_case_insensitive = true

[[expect.preservation.allow]]
pointer = "/services/shopify/customers/7101/updatedAt"

[[expect.preservation.allow]]
pointer = "/services/stripe/subscriptions/sub_PrRmOutlkMonthly0000001/discounts"

[[expect.preservation.allow]]
pointer = "/services/stripe/coupons/VIP15/times_redeemed"

[[expect.preservation.allow]]
pointer = "/services/stripe/discounts/*"
kind = "create"
matching = { subscription = "sub_PrRmOutlkMonthly0000001", customer = "cus_PrRmOutlk01Ab", source = { coupon = "VIP15", type = "coupon" } }

[[expect.preservation.allow]]
pointer = "/services/stripe/events/*"
kind = "create"
matching = { type = "customer.subscription.updated", data = { object = { id = "sub_PrRmOutlkMonthly0000001" } } }
count_scope = "per_commit"

[[solution.call]]
endpoint = "shopify"
tool = "get-customers"
arguments = { limit = 50 }

[[solution.call]]
endpoint = "shopify"
tool = "update-customer"
arguments = { id = "7101", tags = ["newsletter", "VIP"] }

[[solution.call]]
endpoint = "stripe"
tool = "stripe_api_read"
arguments = { stripe_api_operation_id = "GetCustomersSearch", parameters = { query = "email:\"priya.raman@outlook.com\"" }, stripe_context = "acct_1OctoGd7Rq2LmN4p", livemode = false }

[[solution.call]]
endpoint = "stripe"
tool = "stripe_api_read"
arguments = { stripe_api_operation_id = "GetSubscriptions", parameters = { customer = "cus_PrRmOutlk01Ab" }, stripe_context = "acct_1OctoGd7Rq2LmN4p", livemode = false }

[[solution.call]]
endpoint = "stripe"
tool = "stripe_api_read"
arguments = { stripe_api_operation_id = "GetCoupons", parameters = { limit = 20 }, stripe_context = "acct_1OctoGd7Rq2LmN4p", livemode = false }

[[solution.call]]
endpoint = "stripe"
tool = "stripe_api_write"
arguments = { stripe_api_operation_id = "PostSubscriptionsSubscriptionExposedId", parameters = { id = "sub_PrRmOutlkMonthly0000001", discounts = [{ coupon = "VIP15" }] }, stripe_context = "acct_1OctoGd7Rq2LmN4p", livemode = false }
