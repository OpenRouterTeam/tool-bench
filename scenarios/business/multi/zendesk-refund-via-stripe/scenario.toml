[scenario]
id = "business/multi/zendesk-refund-via-stripe"
title = "Refund a duplicate charge in Stripe from a help-desk ticket and close the loop with the customer"
now = "2026-03-18T15:00:00Z"
seed = "business-multi-zendesk-refund-via-stripe"
services = ["zendesk", "stripe"]
tags = ["write", "multi-service", "zendesk", "stripe", "disambiguation"]
timeout_sec = 1200

[scenario.family]
schema_version = 1
primary = "entity_ambiguity"
secondary = ["cross_system_identity"]
dependency_depth = 4
rationale = "Two 48000 charges for order #1077 (ch_ITHH original 17:14, ch_r1lx duplicate 17:16) plus #1080 and Northwind Traders 48000 charges; contract forbids refunding ch_ITHH and touching tickets 5104 and 5109."

# Zendesk ticket 5102 (Hannah Okafor, owner@northwindbakery.com) reports order #1077 charged
# twice on 2026-03-10. In Stripe, customer Northwind Bakery has two $480.00 charges for #1077:
# ch_ITHH… (17:14 UTC, original) and ch_r1lx… (17:16 UTC, duplicate). Look-alikes: order #1080
# ($480.00, same customer, four days later), Northwind Traders' $480.00 lease charge (whose
# Zendesk ticket 5104 is also open), and Hannah's other tickets 5088 (solved) and 5109 (pending).
[expect]
version = 2
audit_history = true

[[expect.state]]
pointer = "/services/stripe/charges/ch_r1lxhPeTsZKQxIfuhPANytDa/amount_refunded"
equals = 48000

[[expect.state]]
pointer = "/services/stripe/charges/ch_ITHHURD4dPMFtMW9vBBsbgLF/amount_refunded"
equals = 0

[[expect.state]]
pointer = "/services/stripe/charges/ch_L2nRrQf84XcsM4hBtIVCqlBW/amount_refunded"
equals = 0

[[expect.state]]
pointer = "/services/stripe/charges/ch_zoapAkuqpaPPo276IGPjweZf/amount_refunded"
equals = 0

[[expect.state]]
pointer = "/services/zendesk/tickets/5102/status"
equals = "solved"

[[expect.state]]
pointer = "/services/stripe/charges/ch_r1lxhPeTsZKQxIfuhPANytDa/refunded"
equals = true

[[expect.state]]
pointer = "/services/zendesk/tickets/5104/status"
equals = "open"

[[expect.state]]
pointer = "/services/zendesk/tickets/5109/status"
equals = "pending"

[[expect.records]]
selector = { collection = "/services/stripe/refunds", matching = { charge = "ch_r1lxhPeTsZKQxIfuhPANytDa" }, created = true }
min_count = 1
max_count = 48000
fields = { "/currency" = "usd", "/reason" = "duplicate", "/status" = "succeeded", "/payment_intent" = "pi_qZ8HsvmHI2loKwRfwA0eFYWI" }
totals = { "/amount" = 48000 }
integer_bounds = { "/amount" = { min = 1, max = 48000 } }

[[expect.records]]
selector = { collection = "/services/stripe/balance_transactions", matching = { type = "refund" }, created = true }
min_count = 1
max_count = 48000
fields = { "/fee" = 0, "/fee_details" = [], "/currency" = "usd", "/status" = "available" }
totals = { "/amount" = -48000, "/net" = -48000 }
integer_bounds = { "/amount" = { min = -48000, max = -1 }, "/net" = { min = -48000, max = -1 } }

[[expect.records]]
selector = { collection = "/services/zendesk/comments", created = true }
equals = 1
fields = { "/ticket_id" = 5102, "/public" = true }

[expect.records.reviewed_text."/body"]
requirement = "Tell the customer that the duplicate payment was refunded and cite every actual Stripe refund ID. The ticket supplies Hannah and the order; a greeting, signature, amount, order, date or statement about the original charge is not required. A bare ID does not say it was refunded."
mentions = ["${refund_ids}", ["refund", "refunded", "refunds", "refunding", "reversed", "returned", "credited"]]

[expect.records.reviewed_text."/body".bound]
examples = [
  "Hi Hannah,\n\nWe refunded the duplicate $480.00 charge for order #1077 in full. The Stripe refund reference is ${refund_ids}. The original charge remains in place.",
  "Hannah, the full duplicate payment of $480.00 for order #1077 has been refunded. Stripe refund references: ${refund_ids}. The original payment is unchanged.",
  "The duplicate charge has been refunded in full. Stripe refund reference: ${refund_ids}.",
  "Your duplicate payment was refunded. Stripe refund references: ${refund_ids}.",
]

[expect.records.reviewed_text."/body".bound.identities.refund_ids]
selector = { collection = "/services/stripe/refunds", matching = { charge = "ch_r1lxhPeTsZKQxIfuhPANytDa" }, created = true }
field = "/id"
separator = ", "

[expect.records.reviewed_text."/html_body"]
format = "zendesk_html"
requirement = "The rendered public reply must say the duplicate payment was refunded and show every actual Stripe refund ID, without hidden content. The ticket supplies Hannah and the order; a greeting, signature, amount, order, date or statement about the original charge is not required."
mentions = ["${refund_ids}", ["refund", "refunded", "refunds", "refunding", "reversed", "returned", "credited"]]

[expect.records.reviewed_text."/html_body".bound]
examples = [
  "Hi Hannah,\n\nWe refunded the duplicate $480.00 charge for order #1077 in full. The Stripe refund reference is ${refund_ids}. The original charge remains in place.",
  "Hannah, the full duplicate payment of $480.00 for order #1077 has been refunded. Stripe refund references: ${refund_ids}. The original payment is unchanged.",
  "The duplicate charge has been refunded in full. Stripe refund reference: ${refund_ids}.",
  "Your duplicate payment was refunded. Stripe refund references: ${refund_ids}.",
]

[expect.records.reviewed_text."/html_body".bound.identities.refund_ids]
selector = { collection = "/services/stripe/refunds", matching = { charge = "ch_r1lxhPeTsZKQxIfuhPANytDa" }, created = true }
field = "/id"
separator = ", "

[[expect.records]]
selector = { collection = "/services/stripe/events", matching = { type = "refund.created" }, created = true }
min_count = 1
max_count = 48000
fields = { "/data/object/charge" = "ch_r1lxhPeTsZKQxIfuhPANytDa", "/data/object/reason" = "duplicate", "/data/object/currency" = "usd" }
totals = { "/data/object/amount" = 48000 }
integer_bounds = { "/data/object/amount" = { min = 1, max = 48000 } }

[[expect.records]]
selector = { collection = "/services/stripe/events", matching = { type = "charge.refunded" }, created = true }
min_count = 1
max_count = 48000
fields = { "/data/object/id" = "ch_r1lxhPeTsZKQxIfuhPANytDa", "/data/object/currency" = "usd" }
integer_bounds = { "/data/object/amount_refunded" = { min = 1, max = 48000 } }

[[expect.relations]]
source = { collection = "/services/stripe/refunds", matching = { charge = "ch_r1lxhPeTsZKQxIfuhPANytDa" }, created = true }
source_field = "/balance_transaction"
target = { collection = "/services/stripe/balance_transactions", matching = { type = "refund" }, created = true }
target_field = "/id"
kind = "bijection"
fields = [
  { source_field = "/amount", target_field = "/amount", kind = "negated_integer" },
  { source_field = "/amount", target_field = "/net", kind = "negated_integer" },
  { source_field = "/currency", target_field = "/currency", kind = "equals" },
]

[[expect.relations]]
source = { collection = "/services/stripe/balance_transactions", matching = { type = "refund" }, created = true }
