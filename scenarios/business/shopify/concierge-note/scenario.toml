[scenario]
id = "business/shopify/concierge-note"
title = "Add a delivery note to the right customer's unshipped order"
now = "2026-05-18T14:00:00Z"
seed = "business-shopify-concierge-note"
services = ["shopify"]
tags = ["single-service", "write", "shopify", "disambiguation"]
timeout_sec = 900

[expect]
version = 2
audit_history = true

[[expect.state]]
pointer = "/services/shopify/orders/5563/note"
text_equals = "Leave with building concierge"

[[expect.preservation.allow]]
pointer = "/services/shopify/orders/5563/note"

[[expect.preservation.allow]]
pointer = "/services/shopify/orders/5563/updatedAt"

[[solution.call]]
endpoint = "shopify"
tool = "get-customers"
arguments = { searchQuery = "email:sam.ortiz@fastmail.com" }

[[solution.call]]
endpoint = "shopify"
tool = "get-customer-orders"
arguments = { customerId = "7301" }

[[solution.call]]
endpoint = "shopify"
tool = "update-order"
arguments = { id = "gid://shopify/Order/5563", note = "Leave with building concierge" }
