[scenario]
id = "business/shopify/tag-vip-latest-order"
title = "Mark a customer as VIP and flag their latest order"
now = "2026-05-18T14:00:00Z"
seed = "business-shopify-tag-vip-latest-order"
services = ["shopify"]
tags = ["single-service", "write", "shopify"]
timeout_sec = 900

[expect]
version = 2
audit_history = true

[[expect.state]]
pointer = "/services/shopify/customers/7202/tags"
member_ascii_ci = "VIP"

[[expect.state]]
pointer = "/services/shopify/orders/5234/tags"
member_ascii_ci = "VIP"

[[expect.preservation.allow]]
pointer = "/services/shopify/customers/7202/tags"
add_set_values = ["VIP"]
ascii_case_insensitive = true

[[expect.preservation.allow]]
pointer = "/services/shopify/customers/7202/updatedAt"

[[expect.preservation.allow]]
pointer = "/services/shopify/orders/5234/tags"
add_set_values = ["VIP"]
ascii_case_insensitive = true

[[expect.preservation.allow]]
pointer = "/services/shopify/orders/5234/updatedAt"

[[solution.call]]
endpoint = "shopify"
tool = "get-customers"
arguments = { searchQuery = "Marcus Bell" }

[[solution.call]]
endpoint = "shopify"
tool = "get-customer-orders"
arguments = { customerId = "7202" }

[[solution.call]]
endpoint = "shopify"
tool = "update-customer"
arguments = { id = "7202", tags = ["newsletter", "wholesale", "VIP"] }

[[solution.call]]
endpoint = "shopify"
tool = "update-order"
arguments = { id = "gid://shopify/Order/5234", tags = ["gift", "VIP"] }
