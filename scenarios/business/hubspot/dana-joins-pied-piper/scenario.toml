[scenario]
id = "business/hubspot/dana-joins-pied-piper"
title = "Move the right Dana Whitfield to Pied Piper"
now = "2026-10-29T14:00:00Z"
seed = "business-hubspot-dana-joins-pied-piper"
services = ["hubspot"]
tags = ["single-service", "write", "hubspot", "disambiguation"]
timeout_sec = 900

[scenario.family]
schema_version = 1
primary = "entity_ambiguity"
secondary = []
dependency_depth = 1
rationale = "Contacts 512001 (Hooli) and 512002 (Vandelay) are both Dana Whitfield, plus Dana Whitman 512003; companies 18234004 Pied Piper and 18234005 Pied Piper Pizza; contract pins 512001 and 18234004."

# Two contacts are named Dana Whitfield (512001 at Hooli, 512002 at Vandelay) and a Dana
# Whitman (512003) already works at Pied Piper. Two companies match "Pied Piper": the
# startup 18234004 (piedpiper.com) and Pied Piper Pizza 18234005.
[expect]
version = 2
audit_history = true

[[expect.state]]
pointer = "/services/hubspot/contacts/512001/properties/email"
equals = "dana.whitfield@piedpiper.com"

[[expect.records]]
selector = { collection = "/services/hubspot/associations", matching = { fromObjectType = "companies", fromObjectId = "18234004", toObjectType = "contacts", toObjectId = "512001", types = [{ associationCategory = "HUBSPOT_DEFINED", associationTypeId = 280 }] } }
equals = 1

[[expect.preservation.allow]]
pointer = "/services/hubspot/contacts/512001/properties/email"

[[expect.preservation.allow]]
pointer = "/services/hubspot/contacts/512001/properties/company"
matching = { properties = { company = "Pied Piper" } }

[[expect.preservation.allow]]
pointer = "/services/hubspot/contacts/512001/properties/lastmodifieddate"

[[expect.preservation.allow]]
pointer = "/services/hubspot/contacts/512001/updatedAt"

[[expect.preservation.allow]]
pointer = "/services/hubspot/associations/companies~118234004~1contacts~1512001"
kind = "create"
matching = { fromObjectType = "companies", fromObjectId = "18234004", toObjectType = "contacts", toObjectId = "512001", types = [{ associationCategory = "HUBSPOT_DEFINED", associationTypeId = 280 }] }

[[expect.preservation.allow]]
pointer = "/services/hubspot/associations/companies~118234004~1contacts~1512001/types"
matching = { types = [{ associationCategory = "HUBSPOT_DEFINED", associationTypeId = 280 }] }

[[expect.preservation.allow]]
pointer = "/services/hubspot/associations/companies~118234003~1contacts~1512001/types"
matching = { types = [{ associationCategory = "HUBSPOT_DEFINED", associationTypeId = 280 }] }

[[solution.call]]
endpoint = "hubspot"
tool = "hubspot-batch-update-objects"
arguments = { objectType = "contacts", inputs = [{ id = "512001", properties = { email = "dana.whitfield@piedpiper.com" } }] }

[[solution.call]]
endpoint = "hubspot"
tool = "hubspot-batch-create-associations"
arguments = { fromObjectType = "contacts", toObjectType = "companies", types = [{ associationCategory = "HUBSPOT_DEFINED", associationTypeId = 1 }], inputs = [{ from = { id = "512001" }, to = { id = "18234004" } }] }
