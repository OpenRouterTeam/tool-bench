[scenario]
id = "business/hubspot/largest-open-deal"
title = "Find the company with the largest open deal"
now = "2026-10-29T14:00:00Z"
seed = "business-hubspot-largest-open-deal"
services = ["hubspot"]
tags = ["single-service", "lookup", "hubspot"]
timeout_sec = 900

[scenario.family]
schema_version = 1
primary = "entity_ambiguity"
secondary = ["stale_state"]
dependency_depth = 2
rationale = "Open deal 9100106 Northwind Logistics 412000 competes with closed-won Northwind Traders 530000, closed-lost Vandelay 640000 and archived 900000 duplicate 9100114; answer must name Northwind Logistics."

# Northwind Logistics' Fleet Telemetry deal (412,000, Contract Sent) is the largest open
# deal. Distractors: Northwind Traders (530,000, closed won), Vandelay (640,000, closed
# lost), an archived 900,000 duplicate, and Hooli, whose three open deals sum to 450,000.
[expect]
version = 2
audit_history = true

[expect.answer.record_facts]
requirement = "Name the company associated with the largest non-archived HubSpot deal that is neither closed won nor closed lost, and state that deal's amount in US dollars."
mode = "statements"
selection = { largest = { field = "/properties/amount" } }

[expect.answer.record_facts.selector]
collection = "/services/hubspot/deals"
matching = { archived = false }

[expect.answer.record_facts.filter]
excluding = [{ "/properties/dealstage" = "closedwon" }, { "/properties/dealstage" = "closedlost" }]

[expect.answer.record_facts.related.link]
collection = "/services/hubspot/associations"
filter = { matching = { "/fromObjectType" = "companies", "/toObjectType" = "deals" } }
on = { "/toObjectId" = "/id" }

[expect.answer.record_facts.related.company]
from = "link"
collection = "/services/hubspot/companies"
on = { "/id" = "/fromObjectId" }

[expect.answer.record_facts.facts.amount]
field = "/properties/amount"
kind = "money"

[expect.answer.record_facts.facts.company]
record = "company"
field = "/properties/name"
kind = "text"

[[expect.forbidden_calls]]
service = "hubspot"
method = "POST"
path_regex = "/batch/(create|update)$"

[[expect.forbidden_calls]]
service = "hubspot"
method = "PATCH"

[solution]
answer = "Northwind Logistics has the largest open deal, worth $412,000."

[[solution.call]]
endpoint = "hubspot"
tool = "hubspot-search-objects"
arguments = { objectType = "deals", filterGroups = [{ filters = [{ propertyName = "dealstage", operator = "NOT_IN", values = ["closedwon", "closedlost"] }] }], sorts = [{ propertyName = "amount", direction = "DESCENDING" }], properties = ["dealname", "amount", "dealstage"], limit = 1 }

[[solution.call]]
endpoint = "hubspot"
tool = "hubspot-list-associations"
arguments = { objectType = "deals", objectId = "9100106", toObjectType = "companies" }
