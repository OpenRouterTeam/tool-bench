[scenario]
id = "business/hubspot/log-call-note-initech"
title = "Log a call note on the Initech data warehouse deal"
now = "2026-10-29T14:00:00Z"
seed = "business-hubspot-log-call-note-initech"
services = ["hubspot"]
tags = ["single-service", "write", "hubspot"]
timeout_sec = 900

[scenario.family]
schema_version = 1
primary = "entity_ambiguity"
secondary = []
dependency_depth = 1
rationale = "Deal 9100104 Initech Data Warehouse Migration has look-alike 9100105 (Phase 0 Assessment), both associated with Bill Lumbergh 512005; contract requires the one note association on 9100104."

[expect]
version = 2
audit_history = true

[[expect.records]]
selector = { collection = "/services/hubspot/notes", created = true }
equals = 1
fields = { "/archived" = false }
html_text = { "/properties/hs_note_body" = "Call with Bill Lumbergh: security review passed; procurement needs a revised SOW by Nov 14." }

[[expect.records]]
selector = { collection = "/services/hubspot/associations", created = true }
min_count = 1
max_count = 3
fields = { "/toObjectType" = "notes" }

[[expect.records]]
selector = { collection = "/services/hubspot/associations", created = true, matching = { fromObjectType = "deals", fromObjectId = "9100104", toObjectType = "notes", types = [{ associationCategory = "HUBSPOT_DEFINED", associationTypeId = 213 }] } }
equals = 1

[[expect.relations]]
source = { collection = "/services/hubspot/associations", created = true }
source_field = "/toObjectId"
target = { collection = "/services/hubspot/notes", created = true }
target_field = "/id"
kind = "foreign_key"

[[expect.preservation.allow]]
pointer = "/services/hubspot/notes/*"
kind = "create"
matching = { archived = false }

[[expect.preservation.allow]]
pointer = "/services/hubspot/associations/*"
kind = "create"
matching = { fromObjectType = "deals", fromObjectId = "9100104", toObjectType = "notes" }

[[expect.preservation.allow]]
pointer = "/services/hubspot/associations/*"
kind = "create"
matching = { fromObjectType = "contacts", fromObjectId = "512005", toObjectType = "notes" }

[[expect.preservation.allow]]
pointer = "/services/hubspot/associations/*"
kind = "create"
matching = { fromObjectType = "companies", fromObjectId = "18234002", toObjectType = "notes" }

[[solution.call]]
endpoint = "hubspot"
tool = "hubspot-create-engagement"
arguments = { type = "NOTE", ownerId = 81234501, timestamp = 1793282400000, associations = { dealIds = [9100104], contactIds = [512005] }, metadata = { body = "Call with Bill Lumbergh: security review passed; procurement needs a revised SOW by Nov 14." } }
