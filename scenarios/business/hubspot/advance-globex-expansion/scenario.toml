[scenario]
id = "business/hubspot/advance-globex-expansion"
title = "Move the Globex 2027 expansion deal to Contract Sent"
now = "2026-10-29T14:00:00Z"
seed = "business-hubspot-advance-globex-expansion"
services = ["hubspot"]
tags = ["single-service", "write", "hubspot"]
timeout_sec = 900

# Target: deal 9100101 "Globex – Platform Expansion 2027". Look-alikes on the same company:
# 9100103 "Globex – Platform Expansion 2026" (closed lost) and 9100102 (support renewal).
[expect]
version = 2
audit_history = true

[[expect.state]]
pointer = "/services/hubspot/deals/9100101/properties/dealstage"
equals = "contractsent"

[[expect.state]]
pointer = "/services/hubspot/deals/9100101/properties/closedate"
contains = "2026-11-20"

[[expect.preservation.allow]]
pointer = "/services/hubspot/deals/9100101/properties/dealstage"

[[expect.preservation.allow]]
pointer = "/services/hubspot/deals/9100101/properties/closedate"

[[expect.preservation.allow]]
pointer = "/services/hubspot/deals/9100101/properties/hs_lastmodifieddate"

[[expect.preservation.allow]]
pointer = "/services/hubspot/deals/9100101/updatedAt"

[[solution.call]]
endpoint = "hubspot"
tool = "hubspot-batch-update-objects"
arguments = { objectType = "deals", inputs = [{ id = "9100101", properties = { dealstage = "contractsent", closedate = "2026-11-20" } }] }
