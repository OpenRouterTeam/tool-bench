[scenario]
id = "business/salesforce/close-won-kestrel-renewal"
title = "Mark the right Kestrel renewal as Closed Won"
now = "2026-05-12T15:00:00Z"
seed = "business-salesforce-close-won-kestrel-renewal"
services = ["salesforce"]
tags = ["write", "single-service", "salesforce", "disambiguation"]
timeout_sec = 900

[expect]
version = 2
audit_history = true

[expect.preservation]
equivalent_numbers = ["/services/salesforce/Opportunity/0065g000006FoSrAAK/Amount"]

[[expect.state]]
pointer = "/services/salesforce/Opportunity/0065g000006FoSrAAK/StageName"
equals = "Closed Won"

[[expect.state]]
pointer = "/services/salesforce/Opportunity/0065g000006FoSrAAK/IsWon"
equals = true

[[expect.state]]
pointer = "/services/salesforce/Opportunity/0065g000006FoSrAAK/CloseDate"
equals = "2026-05-12"

[[expect.state]]
pointer = "/services/salesforce/Opportunity/0065g000006FoSrAAK/IsClosed"
equals = true

[[expect.preservation.allow]]
pointer = "/services/salesforce/Opportunity/0065g000006FoSrAAK/StageName"

[[expect.preservation.allow]]
pointer = "/services/salesforce/Opportunity/0065g000006FoSrAAK/CloseDate"

[[expect.preservation.allow]]
pointer = "/services/salesforce/Opportunity/0065g000006FoSrAAK/IsWon"

[[expect.preservation.allow]]
pointer = "/services/salesforce/Opportunity/0065g000006FoSrAAK/IsClosed"

[[expect.preservation.allow]]
pointer = "/services/salesforce/Opportunity/0065g000006FoSrAAK/Probability"
matching = { StageName = "Closed Won", Probability = 100.0 }

[[expect.preservation.allow]]
pointer = "/services/salesforce/Opportunity/0065g000006FoSrAAK/Probability"
matching = { StageName = "Closed Won", Probability = 100 }

[[expect.preservation.allow]]
pointer = "/services/salesforce/Opportunity/0065g000006FoSrAAK/ExpectedRevenue"

[[expect.preservation.allow]]
pointer = "/services/salesforce/Opportunity/0065g000006FoSrAAK/ForecastCategory"

[[expect.preservation.allow]]
pointer = "/services/salesforce/Opportunity/0065g000006FoSrAAK/ForecastCategoryName"
matching = { StageName = "Closed Won", ForecastCategoryName = "Closed" }

[[expect.preservation.allow]]
pointer = "/services/salesforce/Opportunity/0065g000006FoSrAAK/Fiscal"

[[expect.preservation.allow]]
pointer = "/services/salesforce/Opportunity/0065g000006FoSrAAK/FiscalYear"

[[expect.preservation.allow]]
pointer = "/services/salesforce/Opportunity/0065g000006FoSrAAK/FiscalQuarter"

[[expect.preservation.allow]]
pointer = "/services/salesforce/Opportunity/0065g000006FoSrAAK/LastModifiedDate"

[[expect.preservation.allow]]
pointer = "/services/salesforce/Opportunity/0065g000006FoSrAAK/LastModifiedById"

[[expect.preservation.allow]]
pointer = "/services/salesforce/Opportunity/0065g000006FoSrAAK/SystemModstamp"

[[solution.call]]
endpoint = "salesforce"
tool = "salesforce_query_records"
arguments = { objectName = "Opportunity", fields = ["Id", "Name", "StageName", "CloseDate", "Amount", "Account.Name", "Account.BillingCity"], whereClause = "Account.Name LIKE 'Kestrel%' AND IsClosed = false" }

[[solution.call]]
endpoint = "salesforce"
tool = "salesforce_dml_records"
arguments = { operation = "update", objectName = "Opportunity", records = [{ Id = "0065g000006FoSrAAK", StageName = "Closed Won", CloseDate = "2026-05-12" }] }
