[scenario]
id = "business/salesforce/open-pipeline-by-rep"
title = "Find the rep with the largest open pipeline closing this quarter"
now = "2026-05-12T15:00:00Z"
seed = "business-salesforce-open-pipeline-by-rep"
services = ["salesforce"]
tags = ["lookup", "single-service", "salesforce"]
timeout_sec = 900

[scenario.family]
schema_version = 1
primary = "entity_ambiguity"
secondary = []
dependency_depth = 2
rationale = "Priya Raman leads only on open Q2 deals (252500); counting closed deals makes Sofia Alvarez lead (415000) and ignoring the quarter makes Marcus Bell lead (450000); answer must name Priya Raman."

# Priya Raman: 120,000 + 85,000 + 47,500 open in Q2 2026.
# Distractors: counting closed deals makes Sofia Alvarez the leader (415,000), ignoring the
# quarter makes Marcus Bell the leader (450,000).
[expect]
version = 2
audit_history = true

[expect.answer.record_facts]
requirement = "Name the Salesforce user who owns the largest total Amount of open (not closed) opportunities with a close date in April-June 2026, and state that total in US dollars."
mode = "statements"
assertions = [
  "${rep} has the largest open pipeline: ${total}.",
  "${rep} - ${total}",
  "${rep}: ${total}",
  "Rep: ${rep}\nOpen Q2 pipeline: ${total}",
  "${rep} leads with ${total} of open pipeline closing in Q2.",
  "${rep} leads with ${total} of open pipeline.",
]

[expect.answer.record_facts.selector]
collection = "/services/salesforce/Opportunity"
matching = { IsClosed = false }
field_patterns = { "/CloseDate" = "^2026-0[456]-" }

[expect.answer.record_facts.filter]
present = ["/Amount"]

[expect.answer.record_facts.selection.group]
by = "/OwnerId"
measure = { sum = "/Amount" }
pick = "largest"

[expect.answer.record_facts.related.rep]
collection = "/services/salesforce/User"
on = { "/Id" = "/key" }

[expect.answer.record_facts.facts.rep]
record = "rep"
field = "/Name"
kind = "text"

[expect.answer.record_facts.facts.total]
field = "/value"
kind = "money"

[[solution.call]]
endpoint = "salesforce"
tool = "salesforce_aggregate_query"
arguments = { objectName = "Opportunity", selectFields = ["OwnerId", "SUM(Amount) openPipeline", "COUNT(Id) openDeals"], groupByFields = ["OwnerId"], whereClause = "IsClosed = false AND CloseDate = THIS_QUARTER", orderBy = "SUM(Amount) DESC" }

[[solution.call]]
endpoint = "salesforce"
tool = "salesforce_query_records"
arguments = { objectName = "User", fields = ["Id", "Name", "Title"], whereClause = "Id = '0055g00000MZfGEAA1'" }

[solution]
answer = "Priya Raman has the largest open pipeline: $252,500."
