[scenario]
id = "business/salesforce/log-call-on-contact"
title = "Log a completed call on the right contact"
now = "2026-05-12T15:00:00Z"
seed = "business-salesforce-log-call-on-contact"
services = ["salesforce"]
tags = ["write", "single-service", "salesforce", "disambiguation"]
timeout_sec = 900

[scenario.family]
schema_version = 1
primary = "entity_ambiguity"
secondary = []
dependency_depth = 2
rationale = "Dana Whitfield 0035g00000p3z7WAAQ at Northgate Analytics vs Dana Whitfield at Northgate Capital Partners and Dan Whitfield at the same account; contract requires WhoId 0035g00000p3z7WAAQ."

[expect]
version = 2
audit_history = true

[[expect.records]]
selector = { collection = "/services/salesforce/Task", created = true }
equals = 1
fields = { "/WhoId" = "0035g00000p3z7WAAQ", "/AccountId" = "0015g000008HFvFAAW", "/Subject" = "Renewal pricing call", "/Status" = "Completed", "/IsClosed" = true, "/IsDeleted" = false, "/ActivityDate" = "2026-05-12" }
optional_fields = { "/WhatId" = "0015g000008HFvFAAW" }
optional_choices = { "/TaskSubtype" = ["Call", "Task", ""], "/Type" = ["Call", ""] }
null_fields = ["/CallDurationInSeconds", "/CallType", "/CallDisposition"]
any_fields = [{ "/TaskSubtype" = "Call" }, { "/Type" = "Call" }]
reviewed_text = { "/Description" = { requirement = "Note that Dana wants a three-year quote by May 22, 2026. The linked contact and the subject supply who she is and the renewal topic.", accepted = ["Discussed renewal pricing. Dana wants a 3-year quote by May 22.", "Dana requested a three-year renewal quote by May 22, 2026.", "Dana Whitfield wants a 3-year renewal quote by 2026-05-22."], mentions = [["3-year", "three-year", "3 year", "three year", "3 years", "three years", "3-yr", "3 yr", "3yr", "36-month", "36 month", "36 months"], ["quote", "quotes", "quotation", "quoted", "pricing"], ["May 22", "May 22nd", "22 May", "22nd May", "22nd of May", "2026-05-22", "5/22", "05/22", "22/05"]] } }

[[expect.preservation.allow]]
pointer = "/services/salesforce/Task/*"
kind = "create"
matching = { WhoId = "0035g00000p3z7WAAQ" }

[[expect.preservation.allow]]
pointer = "/services/salesforce/Contact/0035g00000p3z7WAAQ/LastActivityDate"

[[expect.preservation.allow]]
pointer = "/services/salesforce/Account/0015g000008HFvFAAW/LastActivityDate"

[[solution.call]]
endpoint = "salesforce"
tool = "salesforce_query_records"
arguments = { objectName = "Contact", fields = ["Id", "Name", "Title", "Email", "Account.Name"], whereClause = "LastName = 'Whitfield'" }

[[solution.call]]
endpoint = "salesforce"
tool = "salesforce_dml_records"
arguments = { operation = "insert", objectName = "Task", records = [{ WhoId = "0035g00000p3z7WAAQ", WhatId = "0015g000008HFvFAAW", Subject = "Renewal pricing call", Status = "Completed", ActivityDate = "2026-05-12", TaskSubtype = "Call", Type = "Call", Description = "Discussed renewal pricing. Dana wants a 3-year quote by May 22." }] }
