[scenario]
id = "business/zendesk/create-ticket-for-caller"
title = "Open a ticket on behalf of a customer who phoned in"
now = "2026-10-30T10:15:00Z"
seed = "business-zendesk-create-ticket-for-caller"
services = ["zendesk"]
tags = ["write", "single-service", "zendesk", "disambiguation"]
timeout_sec = 900

[scenario.family]
schema_version = 1
primary = "baseline"
secondary = []
dependency_depth = 1
rationale = "Elena Petrova of Fjord Outfitters (9010301) is uniquely named; the only neighbour, Elena Park (9010302, Parkside Clinics), has a different surname; the contract checks one created ticket with that requester."

[expect]
version = 2
audit_history = true

[[expect.records]]
selector = { collection = "/services/zendesk/tickets", created = true }
equals = 1
fields = { "/subject" = "Barcode scanners not syncing after update", "/requester_id" = 9010301, "/priority" = "high", "/type" = "incident" }
any_fields = [{ "/status" = "new" }, { "/status" = "open" }]
reviewed_text = { "/description" = { requirement = "Record Elena Petrova's report that since this morning's app update, barcode scanners at Fjord Outfitters' Bergen warehouse have stopped syncing inventory counts, without contradictory or invented claims.", accepted = ["Elena Petrova (Fjord Outfitters) called in: since this morning's app update, the barcode scanners in their Bergen warehouse have stopped syncing inventory counts.", "Elena Petrova of Fjord Outfitters reports that the barcode scanners in the Bergen warehouse stopped syncing inventory counts after this morning's app update."] } }

[[expect.records]]
selector = { collection = "/services/zendesk/comments", created = true }
equals = 1

[[expect.records]]
selector = { collection = "/services/zendesk/audits", created = true }
min_count = 1

[[expect.relations]]
source = { collection = "/services/zendesk/comments", created = true }
source_field = "/ticket_id"
target = { collection = "/services/zendesk/tickets", created = true }
target_field = "/id"

[[expect.relations]]
source = { collection = "/services/zendesk/comments", created = true }
source_field = "/body"
target = { collection = "/services/zendesk/tickets", created = true }
target_field = "/description"

[[expect.relations]]
source = { collection = "/services/zendesk/audits", created = true }
source_field = "/ticket_id"
target = { collection = "/services/zendesk/tickets", created = true }
target_field = "/id"
kind = "foreign_key"

[[expect.relations]]
source = { collection = "/services/zendesk/comments", created = true }
source_field = "/audit_id"
target = { collection = "/services/zendesk/audits", created = true }
target_field = "/id"
kind = "foreign_key"

[[expect.preservation.allow]]
pointer = "/services/zendesk/tickets/*"
kind = "create"
matching = { requester_id = 9010301, status = "new" }

[[expect.preservation.allow]]
pointer = "/services/zendesk/tickets/*"
kind = "create"
matching = { requester_id = 9010301, status = "open" }

[[expect.preservation.allow]]
pointer = "/services/zendesk/comments/*"
kind = "create"
matching = { author_id = 9010001 }

[[expect.preservation.allow]]
pointer = "/services/zendesk/audits/*"
kind = "create"
matching = { author_id = 9010001 }
count_scope = "per_commit"

[[solution.call]]
endpoint = "zendesk"
tool = "get_tickets"
arguments = {}

[[solution.call]]
endpoint = "zendesk"
tool = "create_ticket"
arguments = { subject = "Barcode scanners not syncing after update", requester_id = 9010301, priority = "high", type = "incident", description = "Elena Petrova (Fjord Outfitters) called in: since this morning's app update, the barcode scanners in their Bergen warehouse have stopped syncing inventory counts." }
