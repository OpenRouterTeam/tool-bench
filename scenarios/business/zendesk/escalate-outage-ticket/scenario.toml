[scenario]
id = "business/zendesk/escalate-outage-ticket"
title = "Escalate a customer's open outage ticket with an internal note"
now = "2026-10-30T13:20:00Z"
seed = "business-zendesk-escalate-outage-ticket"
services = ["zendesk"]
tags = ["write", "single-service", "zendesk", "disambiguation"]
timeout_sec = 900

[scenario.family]
schema_version = 1
primary = "entity_ambiguity"
secondary = ["stale_state"]
dependency_depth = 1
rationale = "Open ticket 6230 (Dr. Osei, patient portal 502) vs her solved 6225 on the same issue, Northwind Traders solved 502 ticket 6201 and Cedar Pharmacy open 502 ticket 6233; only 6230 may change."

[expect]
version = 2
audit_history = true

[[expect.state]]
pointer = "/services/zendesk/tickets/6230/priority"
equals = "urgent"

[[expect.state]]
pointer = "/services/zendesk/tickets/6230/tags"
member_ascii_ci = "escalated"

[[expect.records]]
selector = { collection = "/services/zendesk/comments", created = true }
equals = 1
fields = { "/ticket_id" = 6230, "/public" = false }

[expect.records.reviewed_text."/body"]
requirement = "Say that the Northwind Health patient-portal outage has been escalated to on-call engineering under incident INC-4471, without contradictory or invented claims."
accepted = [
  "Escalated to on-call engineering under incident INC-4471. The 502s are blocking patient check-ins at Northwind Health.",
  "Escalated the Northwind Health patient portal outage to on-call engineering under incident INC-4471.",
]

[expect.records.reviewed_text."/html_body"]
format = "zendesk_html"
requirement = "The visible internal note must convey escalation to on-call engineering under incident INC-4471, without hidden, contradictory or invented claims."
accepted = [
  "Escalated to on-call engineering under incident INC-4471. The 502s are blocking patient check-ins at Northwind Health.",
  "Escalated the Northwind Health patient portal outage to on-call engineering under incident INC-4471.",
]

[[expect.records]]
selector = { collection = "/services/zendesk/audits", created = true }
min_count = 1
fields = { "/ticket_id" = 6230 }

[[expect.relations]]
source = { collection = "/services/zendesk/comments", created = true }
source_field = "/audit_id"
target = { collection = "/services/zendesk/audits", created = true }
target_field = "/id"
kind = "foreign_key"

[[expect.preservation.allow]]
pointer = "/services/zendesk/tickets/6230/priority"

[[expect.preservation.allow]]
pointer = "/services/zendesk/tickets/6230/tags"
add_set_values = ["escalated"]

[[expect.preservation.allow]]
pointer = "/services/zendesk/tickets/6230/updated_at"

[[expect.preservation.allow]]
pointer = "/services/zendesk/comments/*"
kind = "create"
matching = { ticket_id = 6230, public = false }

[[expect.preservation.allow]]
pointer = "/services/zendesk/audits/*"
kind = "create"
matching = { ticket_id = 6230 }
count_scope = "per_commit"

[[solution.call]]
endpoint = "zendesk"
tool = "get_tickets"
arguments = {}

[[solution.call]]
endpoint = "zendesk"
tool = "get_ticket"
arguments = { ticket_id = 6230 }

[[solution.call]]
endpoint = "zendesk"
tool = "update_ticket"
arguments = { ticket_id = 6230, priority = "urgent", tags = ["api", "patient_portal", "escalated"] }

[[solution.call]]
endpoint = "zendesk"
tool = "create_ticket_comment"
arguments = { ticket_id = 6230, public = false, comment = "Escalated to on-call engineering under incident INC-4471. The 502s are blocking patient check-ins at Northwind Health." }
