[scenario]
id = "business/zendesk/reply-refund-and-solve"
title = "Tell a customer his duplicate-charge refund went out and solve the ticket"
now = "2026-10-29T16:30:00Z"
seed = "business-zendesk-reply-refund-and-solve"
services = ["zendesk"]
tags = ["write", "single-service", "zendesk", "disambiguation"]
timeout_sec = 900

[scenario.family]
schema_version = 1
primary = "entity_ambiguity"
secondary = ["stale_state"]
dependency_depth = 1
rationale = "Open ticket 4217 (Marcus Chen, October double charge) vs his solved September ticket 4201 with refund RF-87002, his open seats ticket 4219 and Marcus Cheng's double-charge ticket 4220."

[expect]
version = 2
audit_history = true

[[expect.state]]
pointer = "/services/zendesk/tickets/4217/status"
equals = "solved"

[[expect.records]]
selector = { collection = "/services/zendesk/comments", created = true }
equals = 1
fields = { "/ticket_id" = 4217, "/public" = true }

[expect.records.reviewed_text."/body"]
requirement = "Tell Marcus Chen that billing issued the refund for his duplicate October charge, identify reference RF-88213, and state expected card arrival within 5-7 business days, without contradictory or invented claims. Invoice INV-55120 is corroborated by his ticket but need not be repeated."
accepted = [
  "Hi Marcus,\n\nGood news: our billing team has refunded the duplicate October charge for invoice INV-55120. The refund reference is RF-88213, and it should appear on your card within 5-7 business days.\n\nSorry for the trouble, and thanks for your patience.\n\nJordan",
  "Marcus, billing has issued the refund for the duplicate October charge. Reference RF-88213; it should reach your card within 5-7 business days.",
]

[expect.records.reviewed_text."/html_body"]
format = "zendesk_html"
requirement = "The visible customer reply must truthfully convey the issued duplicate-October-charge refund, reference RF-88213, and 5-7 business-day card arrival estimate, without hidden, contradictory or invented claims."
accepted = [
  "Hi Marcus,\n\nGood news: our billing team has refunded the duplicate October charge for invoice INV-55120. The refund reference is RF-88213, and it should appear on your card within 5-7 business days.\n\nSorry for the trouble, and thanks for your patience.\n\nJordan",
  "Marcus, billing has issued the refund for the duplicate October charge. Reference RF-88213; it should reach your card within 5-7 business days.",
]

[[expect.records]]
selector = { collection = "/services/zendesk/audits", created = true }
min_count = 1
fields = { "/ticket_id" = 4217 }

[[expect.relations]]
source = { collection = "/services/zendesk/comments", created = true }
source_field = "/audit_id"
target = { collection = "/services/zendesk/audits", created = true }
target_field = "/id"
kind = "foreign_key"

[[expect.preservation.allow]]
pointer = "/services/zendesk/tickets/4217/status"

[[expect.preservation.allow]]
pointer = "/services/zendesk/tickets/4217/updated_at"

[[expect.preservation.allow]]
pointer = "/services/zendesk/comments/*"
kind = "create"
matching = { ticket_id = 4217, public = true }

[[expect.preservation.allow]]
pointer = "/services/zendesk/audits/*"
kind = "create"
matching = { ticket_id = 4217 }
count_scope = "per_commit"

[[expect.ordering]]
prerequisite = { selector = { collection = "/services/zendesk/comments", matching = { ticket_id = 4217, public = true }, created = true }, field = "/public", equals = true }
action = { selector = { collection = "/services/zendesk/tickets", matching = { id = 4217 } }, field = "/status", equals = "solved" }
allow_same_commit = true

[[solution.call]]
endpoint = "zendesk"
tool = "get_tickets"
arguments = {}

[[solution.call]]
endpoint = "zendesk"
tool = "get_ticket_comments"
arguments = { ticket_id = 4217 }

[[solution.call]]
endpoint = "zendesk"
tool = "create_ticket_comment"
arguments = { ticket_id = 4217, public = true, comment = "Hi Marcus,\n\nGood news: our billing team has refunded the duplicate October charge for invoice INV-55120. The refund reference is RF-88213, and it should appear on your card within 5-7 business days.\n\nSorry for the trouble, and thanks for your patience.\n\nJordan" }

[[solution.call]]
endpoint = "zendesk"
tool = "update_ticket"
arguments = { ticket_id = 4217, status = "solved" }
