[scenario]
id = "business/stripe/refund-duplicate-charge"
title = "Refund the duplicate of a double-charged order"
now = "2026-03-18T15:00:00Z"
seed = "business-stripe-refund-duplicate-charge"
services = ["stripe"]
tags = ["write", "single-service", "stripe", "disambiguation"]
timeout_sec = 900

[scenario.family]
schema_version = 1
primary = "entity_ambiguity"
secondary = []
dependency_depth = 2
rationale = "Order #1077 has two 48000 charges 2 min apart (ch_ITHH original, ch_r1lx duplicate) plus look-alike #1080 and a Northwind Traders 48000 charge the same day; refunding ch_ITHH is a forbidden call."

# Northwind Bakery was charged $480.00 twice for order #1077 on 2026-03-10: at 17:14 UTC
# (ch_ITHH…, the original) and at 17:16 UTC (ch_r1lx…, the duplicate). Look-alikes: order
# #1080 for the same amount four days later, and Northwind Traders' $480.00 charge that day.
[expect]
version = 2
audit_history = true

[[expect.state]]
pointer = "/services/stripe/charges/ch_r1lxhPeTsZKQxIfuhPANytDa/refunded"
equals = true

[[expect.state]]
pointer = "/services/stripe/charges/ch_r1lxhPeTsZKQxIfuhPANytDa/amount_refunded"
equals = 48000

[[expect.state]]
pointer = "/services/stripe/charges/ch_ITHHURD4dPMFtMW9vBBsbgLF/amount_refunded"
equals = 0

[[expect.state]]
pointer = "/services/stripe/charges/ch_L2nRrQf84XcsM4hBtIVCqlBW/amount_refunded"
equals = 0

[[expect.state]]
pointer = "/services/stripe/charges/ch_zoapAkuqpaPPo276IGPjweZf/amount_refunded"
equals = 0

[[expect.state]]
pointer = "/services/stripe/charges/ch_5eR3UZB7YiJHlOYKOIERXTw9/amount_refunded"
equals = 0

[[expect.records]]
selector = { collection = "/services/stripe/refunds", matching = { charge = "ch_r1lxhPeTsZKQxIfuhPANytDa" }, created = true }
min_count = 1
max_count = 48000
fields = { "/currency" = "usd", "/reason" = "duplicate", "/status" = "succeeded", "/payment_intent" = "pi_qZ8HsvmHI2loKwRfwA0eFYWI" }
totals = { "/amount" = 48000 }
integer_bounds = { "/amount" = { min = 1, max = 48000 } }

[[expect.records]]
selector = { collection = "/services/stripe/balance_transactions", matching = { type = "refund" }, created = true }
min_count = 1
max_count = 48000
fields = { "/currency" = "usd", "/fee" = 0, "/fee_details" = [], "/status" = "available" }
totals = { "/amount" = -48000, "/net" = -48000 }
integer_bounds = { "/amount" = { min = -48000, max = -1 }, "/net" = { min = -48000, max = -1 } }

[[expect.records]]
selector = { collection = "/services/stripe/events", matching = { type = "refund.created" }, created = true }
min_count = 1
max_count = 48000
fields = { "/data/object/charge" = "ch_r1lxhPeTsZKQxIfuhPANytDa", "/data/object/reason" = "duplicate", "/data/object/currency" = "usd" }
totals = { "/data/object/amount" = 48000 }
integer_bounds = { "/data/object/amount" = { min = 1, max = 48000 } }

[[expect.records]]
selector = { collection = "/services/stripe/events", matching = { type = "charge.refunded" }, created = true }
min_count = 1
max_count = 48000
fields = { "/data/object/id" = "ch_r1lxhPeTsZKQxIfuhPANytDa", "/data/object/currency" = "usd" }
integer_bounds = { "/data/object/amount_refunded" = { min = 1, max = 48000 } }

[[expect.relations]]
source = { collection = "/services/stripe/refunds", matching = { charge = "ch_r1lxhPeTsZKQxIfuhPANytDa" }, created = true }
source_field = "/balance_transaction"
target = { collection = "/services/stripe/balance_transactions", matching = { type = "refund" }, created = true }
target_field = "/id"
kind = "bijection"
fields = [
  { source_field = "/amount", target_field = "/amount", kind = "negated_integer" },
  { source_field = "/amount", target_field = "/net", kind = "negated_integer" },
  { source_field = "/currency", target_field = "/currency", kind = "equals" },
]

[[expect.relations]]
source = { collection = "/services/stripe/balance_transactions", matching = { type = "refund" }, created = true }
source_field = "/source"
target = { collection = "/services/stripe/refunds", matching = { charge = "ch_r1lxhPeTsZKQxIfuhPANytDa" }, created = true }
target_field = "/id"
kind = "bijection"

[[expect.relations]]
source = { collection = "/services/stripe/refunds", matching = { charge = "ch_r1lxhPeTsZKQxIfuhPANytDa" }, created = true }
source_field = "/id"
target = { collection = "/services/stripe/events", matching = { type = "refund.created" }, created = true }
target_field = "/data/object/id"
kind = "bijection"

[[expect.relations]]
source = { collection = "/services/stripe/events", matching = { type = "refund.created" }, created = true }
source_field = "/request/id"
target = { collection = "/services/stripe/events", matching = { type = "charge.refunded" }, created = true }
target_field = "/request/id"
kind = "bijection"

[[expect.preservation.allow]]
pointer = "/services/stripe/charges/ch_r1lxhPeTsZKQxIfuhPANytDa/amount_refunded"

[[expect.preservation.allow]]
pointer = "/services/stripe/charges/ch_r1lxhPeTsZKQxIfuhPANytDa/refunded"

[[expect.preservation.allow]]
pointer = "/services/stripe/refunds/*"
kind = "create"
matching = { charge = "ch_r1lxhPeTsZKQxIfuhPANytDa", reason = "duplicate", currency = "usd", status = "succeeded" }
max_count = 48000

[[expect.preservation.allow]]
pointer = "/services/stripe/balance_transactions/*"
kind = "create"
matching = { type = "refund", currency = "usd" }
max_count = 48000

[[expect.preservation.allow]]
pointer = "/services/stripe/events/*"
kind = "create"
matching = { type = "refund.created", data = { object = { charge = "ch_r1lxhPeTsZKQxIfuhPANytDa", reason = "duplicate", currency = "usd" } } }
max_count = 48000

[[expect.preservation.allow]]
pointer = "/services/stripe/events/*"
kind = "create"
matching = { type = "charge.refunded", data = { object = { id = "ch_r1lxhPeTsZKQxIfuhPANytDa" } } }
max_count = 48000

[[expect.forbidden_calls]]
service = "stripe"
method = "POST"
path = "/_mcp/tools/call"
body = { name = "stripe_api_write", arguments = { stripe_api_operation_id = "PostRefunds", parameters = { charge = "ch_ITHHURD4dPMFtMW9vBBsbgLF" } } }

[[expect.forbidden_calls]]
service = "stripe"
method = "POST"
path = "/_mcp/tools/call"
body = { name = "stripe_api_write", arguments = { stripe_api_operation_id = "PostRefunds", parameters = { payment_intent = "pi_JRJx84PEvR5ilrJt2xAz9c5n" } } }

[[solution.call]]
endpoint = "stripe"
tool = "stripe_api_read"
arguments = { stripe_api_operation_id = "GetCustomersSearch", parameters = { query = "name:\"Northwind Bakery\"" }, stripe_context = "acct_1FwY8bQk2LmN4pRs", livemode = false }

[[solution.call]]
endpoint = "stripe"
tool = "stripe_api_read"
arguments = { stripe_api_operation_id = "GetCharges", parameters = { customer = "cus_DxFNB3AWMttAAW" }, stripe_context = "acct_1FwY8bQk2LmN4pRs", livemode = false }

[[solution.call]]
endpoint = "stripe"
tool = "stripe_api_write"
arguments = { stripe_api_operation_id = "PostRefunds", parameters = { charge = "ch_r1lxhPeTsZKQxIfuhPANytDa", reason = "duplicate" }, stripe_context = "acct_1FwY8bQk2LmN4pRs", livemode = false }
