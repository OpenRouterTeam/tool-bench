[scenario]
id = "business/stripe/customer-mrr"
title = "Report a customer's monthly recurring revenue across their subscriptions"
now = "2026-03-18T15:00:00Z"
seed = "business-stripe-customer-mrr"
services = ["stripe"]
tags = ["lookup", "single-service", "stripe", "disambiguation"]
timeout_sec = 900

[scenario.family]
schema_version = 1
primary = "entity_ambiguity"
secondary = ["stale_state"]
dependency_depth = 2
rationale = "Harbor & Pine Coffee Co. (439.00 MRR) has look-alike Harbor & Pine Roasters (252.50) plus its own canceled Starter and trialing Extra location subs that must be excluded; answer regex requires 439."

# Harbor & Pine Coffee Co. pays for two active subscriptions:
#   Team monthly $249.00 x1 + Additional seats $15.00 x6   = $339.00 / month
#   Analytics add-on $1,200.00 / year                      = $100.00 / month
# MRR = $439.00. Excluded: a canceled Starter plan ($99), a trialing Extra location ($49),
# and the look-alike customer Harbor & Pine Roasters ($252.50).
[expect]
version = 2
audit_history = true

[expect.answer]
 [expect.answer.record_facts]
 requirement = "State the monthly recurring revenue of Harbor & Pine Coffee Co., counting only active subscriptions and converting yearly billing to monthly."
 mode = "statements"
assertions = [
  "The MRR is ${mrr}.",
  "MRR: ${mrr}",
  "Monthly recurring revenue: ${mrr}.",
  "MRR is ${mrr}.",
  "${customer} has a monthly recurring revenue of ${mrr}.",
  "${customer}: MRR ${mrr}.",
]

 [expect.answer.record_facts.selector]
 collection = "/services/stripe/subscriptions"
 matching = { customer = "cus_mxxxdqMeoA1GEc", status = "active" }

 [expect.answer.record_facts.selection.group]
 unnest = "/items/data"
 measure = { sum_product_normalized = { fields = ["/item/quantity", "/row_related/price/unit_amount"], divisor = { field = "/row_related/price/recurring/interval", values = { "month" = "100", "year" = "1200" } } } }
 pick = "only"

 [expect.answer.record_facts.selection.group.row_related.price]
 collection = "/services/stripe/prices"
 on = { "/id" = "/item/price" }

 [expect.answer.record_facts.related.cust]
 collection = "/services/stripe/customers"
 filter = { matching = { "/id" = "cus_mxxxdqMeoA1GEc" } }

 [expect.answer.record_facts.facts.customer]
 record = "cust"
 field = "/name"
 kind = "text"
 optional = true

 [expect.answer.record_facts.facts.mrr]
 field = "/value"
 kind = "money"
 units = ["$", "usd"]

[[expect.forbidden_calls]]
service = "stripe"
method = "POST"
path = "/_mcp/tools/call"
body = { name = "stripe_api_write" }

[[solution.call]]
endpoint = "stripe"
tool = "stripe_api_read"
arguments = { stripe_api_operation_id = "GetCustomersSearch", parameters = { query = "name:\"Harbor & Pine Coffee Co.\"" }, stripe_context = "acct_1FwY8bQk2LmN4pRs", livemode = false }

[[solution.call]]
endpoint = "stripe"
tool = "stripe_api_read"
arguments = { stripe_api_operation_id = "GetSubscriptions", parameters = { customer = "cus_mxxxdqMeoA1GEc", status = "active" }, stripe_context = "acct_1FwY8bQk2LmN4pRs", livemode = false }

[solution]
answer = "The MRR is $439.00."
