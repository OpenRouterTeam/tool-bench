[scenario]
id = "collab/google/share-soc2-with-contoso"
title = "Share the current SOC 2 report view-only with the Contoso requester"
now = "2026-10-29T15:00:00Z"
seed = "collab-google-share-soc2-with-contoso"
services = ["google"]
tags = ["write", "multi-step", "single-service", "google", "gmail", "drive", "disambiguation"]
timeout_sec = 900

[expect]
version = 2
audit_history = true

[[expect.records]]
selector = { collection = "/services/google/drive_files/150dluRbaiTmEP9Spu-wAk0p_lQupubYY/permissions", identity_field = "/id", field_patterns = { "/emailAddress" = "(?i-u)^dana[.]whitfield@contoso[.]example$" } }
min_count = 1
fields = { "/type" = "user", "/role" = "reader" }

[[expect.preservation.allow]]
pointer = "/services/google/drive_files/150dluRbaiTmEP9Spu-wAk0p_lQupubYY/permissions"
kind = "append"
identity_field = "/id"
matching = { type = "user", role = "reader" }
field_patterns = { "/emailAddress" = "(?i-u)^dana[.]whitfield@contoso[.]example$" }
cause = { service = "google", methods = ["POST"], path_regex = "^/_mcp/tools/call$" }

[[expect.preservation.allow]]
pointer = "/services/google/drive_files/150dluRbaiTmEP9Spu-wAk0p_lQupubYY/permissions/*/role"
element_matching = { type = "user" }
element_field_patterns = { "/emailAddress" = "(?i-u)^dana[.]whitfield@contoso[.]example$" }
value_equals = "reader"
cause = { service = "google", methods = ["POST"], path_regex = "^/_mcp/tools/call$" }

[[expect.preservation.allow]]
pointer = "/services/google/drive_files/150dluRbaiTmEP9Spu-wAk0p_lQupubYY/shared"
matching = { shared = true }
cause = { service = "google", methods = ["POST"], path_regex = "^/_mcp/tools/call$" }

[[expect.preservation.allow]]
pointer = "/services/google/drive_files/150dluRbaiTmEP9Spu-wAk0p_lQupubYY/modifiedTime"
cause = { service = "google", methods = ["POST"], path_regex = "^/_mcp/tools/call$" }

[[expect.preservation.allow]]
pointer = "/services/google/drive_files/150dluRbaiTmEP9Spu-wAk0p_lQupubYY/lastModifyingUser"
matching = { lastModifyingUser = { displayName = "Ops Team", emailAddress = "ops@octo-corp.example" } }
cause = { service = "google", methods = ["POST"], path_regex = "^/_mcp/tools/call$" }

[[solution.call]]
endpoint = "google-workspace"
tool = "search_gmail_messages"
arguments = { query = "SOC 2 contoso" }

[[solution.call]]
endpoint = "google-workspace"
tool = "get_gmail_message_content"
arguments = { message_id = "fd9cbd3c80017bc0" }

[[solution.call]]
endpoint = "google-workspace"
tool = "search_drive_files"
arguments = { query = "name contains 'SOC 2'" }

[[solution.call]]
endpoint = "google-workspace"
tool = "manage_drive_access"
arguments = { file_id = "150dluRbaiTmEP9Spu-wAk0p_lQupubYY", action = "grant", share_with = "dana.whitfield@contoso.example", role = "reader", share_type = "user" }
