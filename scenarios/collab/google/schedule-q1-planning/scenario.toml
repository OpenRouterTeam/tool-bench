[scenario]
id = "collab/google/schedule-q1-planning"
title = "Schedule the Q1 planning sync Priya asked for by email"
now = "2026-10-29T15:00:00Z"
seed = "collab-google-schedule-q1-planning"
services = ["google"]
tags = ["write", "single-service", "google", "gmail", "calendar"]
timeout_sec = 900

[expect]
version = 2
audit_history = true

[[expect.records]]
selector = { collection = "/services/google/calendar_events", created = true }
equals = 1
fields = { "/creator/email" = "ops@octo-corp.example", "/organizer/email" = "ops@octo-corp.example" }
calendar_meeting = { calendar_id = "ops@octo-corp.example", summary = "Q1 planning sync", start = "2026-11-03T19:00:00Z", end = "2026-11-03T19:45:00Z", attendees = ["priya.natarajan@octo-corp.example", "marcus.webb@octo-corp.example"] }
reviewed_text = { "/description" = { optional = true, requirement = "Optional planning context must not contradict the requested Q1 planning sync, date/time, attendees, or meeting availability. Unreviewed wording requires adjudication.", accepted = ["Q1 planning sync with Priya and Marcus."], rejected = ["Meeting cancelled."] } }

[[expect.preservation.allow]]
pointer = "/services/google/calendar_events/*"
kind = "create"
matching = { calendarId = "ops@octo-corp.example", summary = "Q1 planning sync", status = "confirmed", creator = { email = "ops@octo-corp.example" }, organizer = { email = "ops@octo-corp.example" } }
cause = { service = "google", methods = ["POST"], path_regex = "^/_mcp/tools/call$" }

[[expect.preservation.allow]]
pointer = "/services/google/calendar_conferences/*"
kind = "create"
matching = { solution = "hangoutsMeet", status = "success", actor = "ops@octo-corp.example" }
references = [{ source_field = "/created_for", target_field = "/id", target = { collection = "/services/google/calendar_events", created = true } }]
cause = { service = "google", methods = ["POST"], path_regex = "^/_mcp/tools/call$" }

[[expect.preservation.allow]]
pointer = "/services/google/calendar_notification_requests/*"
kind = "create"
max_count = "all_matching"
matching = { delivery = "unobserved", actor = "ops@octo-corp.example" }
field_patterns = { "/mode" = "^(all|externalOnly|none)$" }
references = [{ source_field = "/eventId", target_field = "/id", target = { collection = "/services/google/calendar_events", created = true } }]
cause = { service = "google", methods = ["POST"], path_regex = "^/_mcp/tools/call$" }

[[expect.forbidden_calls]]
service = "google"
path = "/_mcp/tools/call"
body = { name = "send_gmail_message" }

[[solution.call]]
endpoint = "google-workspace"
tool = "search_gmail_messages"
arguments = { query = "from:priya.natarajan@octo-corp.example planning" }

[[solution.call]]
endpoint = "google-workspace"
tool = "get_gmail_message_content"
arguments = { message_id = "355ad002b14a79a3" }

[[solution.call]]
endpoint = "google-workspace"
tool = "manage_event"
arguments = { action = "create", summary = "Q1 planning sync", start_time = "2026-11-03T14:00:00", end_time = "2026-11-03T14:45:00", timezone = "America/New_York", attendees = ["priya.natarajan@octo-corp.example", "marcus.webb@octo-corp.example"], add_google_meet = true }
