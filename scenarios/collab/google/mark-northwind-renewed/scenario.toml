[scenario]
id = "collab/google/mark-northwind-renewed"
title = "Mark Northwind renewed in the 2026 vendor renewals sheet, per Lena's email"
now = "2026-10-29T15:00:00Z"
seed = "collab-google-mark-northwind-renewed"
services = ["google"]
tags = ["write", "single-service", "google", "gmail", "sheets", "disambiguation"]
timeout_sec = 900

[scenario.family]
schema_version = 1
primary = "stale_state"
secondary = ["entity_ambiguity"]
dependency_depth = 2
rationale = "Vendor renewals 2025 sheet also has a Northwind Traders/Lena Fischer row (already Renewed) beside the current 2026 sheet, which also lists Northwood Logistics as Pending; only the 2026 Northwind row may change."

[expect]
version = 2
audit_history = true

[[expect.records]]
selector = { collection = "/services/google/drive_files/1p91PmGrfYlol_BkGN9Op8j9dWzibNwgg/sheets/0/values", identity_field = "/0", field_patterns = { "/0" = "^Northwind Traders$", "/1" = "^Lena Fischer$" } }
equals = 1
fields = { "/3" = "Renewed" }
sheet_date_fields = { "/2" = "2027-11-30" }

[[expect.preservation.allow]]
pointer = "/services/google/drive_files/1p91PmGrfYlol_BkGN9Op8j9dWzibNwgg/sheets/0/values/*/2"
element_field_patterns = { "/0" = "^Northwind Traders$", "/1" = "^Lena Fischer$" }
cause = { service = "google", methods = ["POST"], path_regex = "^/_mcp/tools/call$" }

[[expect.preservation.allow]]
pointer = "/services/google/drive_files/1p91PmGrfYlol_BkGN9Op8j9dWzibNwgg/sheets/0/values/*/3"
element_field_patterns = { "/0" = "^Northwind Traders$", "/1" = "^Lena Fischer$" }
value_equals = "Renewed"
cause = { service = "google", methods = ["POST"], path_regex = "^/_mcp/tools/call$" }

[[expect.preservation.allow]]
pointer = "/services/google/drive_files/1p91PmGrfYlol_BkGN9Op8j9dWzibNwgg/sheets/0/values/*/3"
element_field_patterns = { "/0" = "^Northwind Traders$", "/1" = "^Lena Fischer$" }
value_equals = ""
cause = { service = "google", methods = ["POST"], path_regex = "^/_mcp/tools/call$" }

[[expect.preservation.allow]]
pointer = "/services/google/drive_files/1p91PmGrfYlol_BkGN9Op8j9dWzibNwgg/modifiedTime"
cause = { service = "google", methods = ["POST"], path_regex = "^/_mcp/tools/call$" }

[[expect.preservation.allow]]
pointer = "/services/google/drive_files/1p91PmGrfYlol_BkGN9Op8j9dWzibNwgg/lastModifyingUser"
matching = { lastModifyingUser = { displayName = "Ops Team", emailAddress = "ops@octo-corp.example" } }
cause = { service = "google", methods = ["POST"], path_regex = "^/_mcp/tools/call$" }

[[solution.call]]
endpoint = "google-workspace"
tool = "search_gmail_messages"
arguments = { query = "from:lena.fischer@octo-corp.example renewal" }

[[solution.call]]
endpoint = "google-workspace"
tool = "get_gmail_message_content"
arguments = { message_id = "a9de6f0a996bc25f" }

[[solution.call]]
endpoint = "google-workspace"
tool = "list_spreadsheets"
arguments = {}

[[solution.call]]
endpoint = "google-workspace"
tool = "read_sheet_values"
arguments = { spreadsheet_id = "1p91PmGrfYlol_BkGN9Op8j9dWzibNwgg", range_name = "Renewals!A1:E10" }

[[solution.call]]
endpoint = "google-workspace"
tool = "modify_sheet_values"
arguments = { spreadsheet_id = "1p91PmGrfYlol_BkGN9Op8j9dWzibNwgg", range_name = "Renewals!C2:D2", values = [["2027-11-30", "Renewed"]] }
