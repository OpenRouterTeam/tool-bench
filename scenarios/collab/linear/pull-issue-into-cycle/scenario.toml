[scenario]
id = "collab/linear/pull-issue-into-cycle"
title = "Pull the webhook-secret rotation issue into the current Payments cycle"
now = "2026-10-29T15:00:00Z"
seed = "collab-linear-pull-issue-into-cycle"
services = ["linear"]
tags = ["write", "single-service", "linear"]
timeout_sec = 900

[expect]
version = 2
audit_history = true

[[expect.state]]
pointer = "/services/linear/issues/PAY-121/cycleId"
equals = "627fb4e1-47ac-567a-99cd-3e236709e3b0"

[[expect.state]]
pointer = "/services/linear/issues/PAY-121/stateId"
equals = "41688e9c-05a3-5fce-be65-9c7049e13037"

[[expect.preservation.allow]]
pointer = "/services/linear/issues/PAY-121/cycleId"

[[expect.preservation.allow]]
pointer = "/services/linear/issues/PAY-121/stateId"

[[expect.preservation.allow]]
pointer = "/services/linear/issues/PAY-121/startedAt"

[[expect.preservation.allow]]
pointer = "/services/linear/issues/PAY-121/updatedAt"

[[expect.preservation.allow]]
pointer = "/services/linear/issue_history/*"
kind = "create"
matching = { issueId = "7e4438e4-5908-5977-84fd-cbf44bb6c977" }
count_scope = "per_commit"
max_count = 6

[[solution.call]]
endpoint = "linear"
tool = "linear_getActiveCycle"
arguments = { teamId = "5854633b-d1e9-52b6-b3c7-d309bfb881cb" }

[[solution.call]]
endpoint = "linear"
tool = "linear_addIssueToCycle"
arguments = { issueId = "PAY-121", cycleId = "627fb4e1-47ac-567a-99cd-3e236709e3b0" }

[[solution.call]]
endpoint = "linear"
tool = "linear_updateIssue"
arguments = { id = "PAY-121", stateId = "41688e9c-05a3-5fce-be65-9c7049e13037" }
