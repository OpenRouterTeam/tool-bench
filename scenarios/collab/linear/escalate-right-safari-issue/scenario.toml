[scenario]
id = "collab/linear/escalate-right-safari-issue"
title = "Escalate the open Safari checkout bug (not its duplicate or the fixed look-alike)"
now = "2026-10-29T15:00:00Z"
seed = "collab-linear-escalate-right-safari-issue"
services = ["linear"]
tags = ["write", "single-service", "linear", "disambiguation"]
timeout_sec = 900

[scenario.family]
schema_version = 1
primary = "entity_ambiguity"
secondary = ["stale_state"]
dependency_depth = 1
rationale = "WEB-51 Checkout button unresponsive on Safari (Todo) shares its exact title with PAY-97 (state Duplicate) and resembles Done WEB-44; only WEB-51 may get Urgent, Alex Kim and the comment."

[expect]
version = 2
audit_history = true

[[expect.state]]
pointer = "/services/linear/issues/WEB-51/priority"
equals = 1

[[expect.state]]
pointer = "/services/linear/issues/WEB-51/assigneeId"
equals = "0bfae6ae-01d0-58d1-a611-7d1973102c45"

[[expect.records]]
selector = { collection = "/services/linear/comments", created = true }
equals = 1
reviewed_text = { "/body" = { requirement = "Say the escalation came from Acme Retail. The issue association supplies the Safari checkout context; priority/assignment narration and one particular spelling are not mandatory. Other nonempty wording requires adjudication, not an invented model failure.", accepted = ["Acme Retail escalated this Safari checkout issue.", "Escalated to Urgent: Acme Retail raised this through support, it is blocking their enterprise checkouts. Assigned to Alex Kim."] } }

[[expect.relations]]
source = { collection = "/services/linear/comments", created = true }
source_field = "/issueId"
target = { collection = "/services/linear/issues", matching = { identifier = "WEB-51" } }
target_field = "/id"

[[expect.preservation.allow]]
pointer = "/services/linear/issues/WEB-51/priority"

[[expect.preservation.allow]]
pointer = "/services/linear/issues/WEB-51/assigneeId"

[[expect.preservation.allow]]
pointer = "/services/linear/issues/WEB-51/updatedAt"

[[expect.preservation.allow]]
pointer = "/services/linear/comments/*"
kind = "create"
matching = { userId = "2dad689e-9ace-5467-9b02-0cc4e445cfa4" }

[[expect.preservation.allow]]
pointer = "/services/linear/issue_history/*"
kind = "create"
matching = { issueId = "d27f2e8f-39a2-58fa-be0d-a2b0f760cbb2" }
count_scope = "per_commit"
max_count = 6

[[solution.call]]
endpoint = "linear"
tool = "linear_searchIssues"
arguments = { query = "Safari" }

[[solution.call]]
endpoint = "linear"
tool = "linear_updateIssue"
arguments = { id = "WEB-51", priority = 1, assigneeId = "0bfae6ae-01d0-58d1-a611-7d1973102c45" }

[[solution.call]]
endpoint = "linear"
tool = "linear_createComment"
arguments = { issueId = "WEB-51", body = "Escalated to Urgent: Acme Retail raised this through support, it is blocking their enterprise checkouts. Assigned to Alex Kim." }
