[scenario]
id = "collab/linear/file-safari-crash-bug"
title = "File a Safari bug in the Web App team for the 4.12 release"
now = "2026-10-29T15:00:00Z"
seed = "collab-linear-file-safari-crash-bug"
services = ["linear"]
tags = ["write", "single-service", "linear"]
timeout_sec = 900

[scenario.family]
schema_version = 1
primary = "baseline"
secondary = []
dependency_depth = 1
rationale = "Instruction gives exact title, team Web App, labels Bug and Safari, project Web 4.12 release and full name Alex Kim; each resolves to one record (Alex Rivera is a different name); one created issue is checked."

[expect]
version = 2
audit_history = true

[[expect.records]]
selector = { collection = "/services/linear/issues", created = true }
equals = 1

[[expect.records]]
selector = { collection = "/services/linear/issues", matching = { teamId = "6da75b4c-0e7c-5ac7-a415-f09a129582b1", labelIds = ["75dbca3d-6368-502e-8e56-0c82837ea691", "b528a42a-7d96-511c-ab34-1b8cb0bf0c8d"] }, created = true }
equals = 1
fields = { "/title" = "Saved carts tab reloads in a loop on Safari 17", "/priority" = 2, "/projectId" = "665e6e05-9585-5351-a871-913d9e5b298f", "/assigneeId" = "0bfae6ae-01d0-58d1-a611-7d1973102c45" }
null_fields = ["/archivedAt", "/completedAt", "/canceledAt"]
reviewed_text = { "/description" = { requirement = "Record the forwarded details: opening Saved carts on Safari 17.1/macOS 14 causes a reload loop, Chrome/Firefox are fine, and the regression began with the 4.12 release candidate. The exact title supplies the Saved carts reload-loop symptom; the description must carry Safari 17.1, macOS 14, Chrome, Firefox and the 4.12 release candidate.", accepted = ["On Safari 17.1 (macOS 14), opening the Saved carts tab makes the page reload in a loop. Chrome and Firefox are fine. It started with the 4.12 release candidate."], mentions = [["17.1", "v17.1"], ["macOS 14", "mac OS 14", "macOS Sonoma"], "Chrome", "Firefox", ["4.12", "v4.12"], ["release candidate", "release-candidate", "RC"]] } }

[[expect.relations]]
source = { collection = "/services/linear/issue_history", created = true }
source_field = "/issueId"
target = { collection = "/services/linear/issues", created = true }
target_field = "/id"
kind = "foreign_key"

[[expect.preservation.allow]]
pointer = "/services/linear/issues/*"
kind = "create"
matching = { teamId = "6da75b4c-0e7c-5ac7-a415-f09a129582b1" }

[[expect.preservation.allow]]
pointer = "/services/linear/issue_history/*"
kind = "create"
matching = { actorId = "2dad689e-9ace-5467-9b02-0cc4e445cfa4" }
count_scope = "per_commit"
max_count = 6

[[solution.call]]
endpoint = "linear"
tool = "linear_getTeams"
arguments = {}

[[solution.call]]
endpoint = "linear"
tool = "linear_getLabels"
arguments = {}

[[solution.call]]
endpoint = "linear"
tool = "linear_createIssue"
arguments = { title = "Saved carts tab reloads in a loop on Safari 17", teamId = "6da75b4c-0e7c-5ac7-a415-f09a129582b1", description = "On Safari 17.1 (macOS 14), opening the Saved carts tab makes the page reload in a loop. Chrome and Firefox are fine. It started with the 4.12 release candidate.", priority = 2, labelIds = ["75dbca3d-6368-502e-8e56-0c82837ea691", "b528a42a-7d96-511c-ab34-1b8cb0bf0c8d"], projectId = "665e6e05-9585-5351-a871-913d9e5b298f", assigneeId = "0bfae6ae-01d0-58d1-a611-7d1973102c45" }
