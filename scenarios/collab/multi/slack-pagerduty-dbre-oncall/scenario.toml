[scenario]
id = "collab/multi/slack-pagerduty-dbre-oncall"
title = "Answer a Slack on-call question from PagerDuty: production DBRE, not staging"
now = "2026-10-30T14:00:00Z"
seed = "collab-multi-slack-pagerduty-dbre-oncall"
services = ["slack", "pagerduty"]
tags = ["lookup", "multi-service", "slack", "pagerduty", "disambiguation"]
timeout_sec = 1200

[scenario.family]
schema_version = 1
primary = "entity_ambiguity"
secondary = ["cross_system_identity", "stale_state"]
dependency_depth = 3
rationale = "Slack thread first guesses the staging DB alert, then corrects to production DBRE; PagerDuty has Database Reliability (Dana Nguyen today, then Sam Okafor) and Database Reliability - Staging (Sam Okafor only)."

# The thread starts by guessing the staging DB alert (Database Reliability - Staging, Sam
# Okafor only), then Sam Ortiz corrects it: production inventory-db, PD #4813, the production
# DBRE rotation. Database Reliability (PEPDBRE): level 1 is the daily DBRE Primary schedule,
# Dana Nguyen on 2026-10-30; level 2 is Sam Okafor.
[expect]
version = 2
audit_history = true

[expect.answer]
 [expect.answer.record_facts]
 requirement = "Name the level-1 and level-2 on-call people for the production Database Reliability escalation policy right now."
 mode = "statements"
 rejected = [
   "Level 1: ${oncall2}",
   "First on call: ${oncall2}",
   "Level 2: ${oncall1}",
   "Backup: ${oncall1}",
 ]
 assertions = [
   "Level 1: ${oncall1}",
   "First on call: ${oncall1}",
   "Level 2: ${oncall2}",
   "Backup: ${oncall2}",
   "${oncall1} and ${oncall2}",
   "On call: ${oncall1}, backup: ${oncall2}",
   "Level 1: ${oncall1}. Level 2: ${oncall2}",
 ]

 [expect.answer.record_facts.selector]
 collection = "/services/pagerduty/escalation_policies"
 matching = { name = "Database Reliability" }

 [expect.answer.record_facts.related.schedule]
 collection = "/services/pagerduty/schedules"
 on = { "/id" = "/escalation_rules/0/targets/0/id" }
 pick = { oncall = { overrides = "/services/pagerduty/overrides" } }

 [expect.answer.record_facts.related.level1]
 from = "schedule"
 collection = "/services/pagerduty/users"
 on = { "/id" = "/id" }

 [expect.answer.record_facts.related.level2]
 collection = "/services/pagerduty/users"
 on = { "/id" = "/escalation_rules/1/targets/0/id" }

 [expect.answer.record_facts.facts.oncall1]
 record = "level1"
 field = "/name"
 kind = "text"

 [expect.answer.record_facts.facts.oncall2]
 record = "level2"
 field = "/name"
 kind = "text"

[[expect.forbidden_calls]]
service = "slack"
path = "/_mcp/tools/call"
body = { name = "slack_send_message" }

[[expect.forbidden_calls]]
service = "slack"
path = "/_mcp/tools/call"
body = { name = "slack_schedule_message" }

[[expect.forbidden_calls]]
service = "pagerduty"
method = "POST"
path_regex = "^/(incidents|schedules|v3|services|teams|users|webhook_subscriptions|alert_grouping_settings|incident_workflows|status_pages)"

[[expect.forbidden_calls]]
service = "pagerduty"
method = "PUT"

[[expect.forbidden_calls]]
service = "pagerduty"
method = "DELETE"

[[solution.call]]
endpoint = "slack"
tool = "slack_search_public"
arguments = { keywords = ["inventory", "sync"], natural_language_query = "inventory sync stalling who is on call" }

[[solution.call]]
endpoint = "slack"
tool = "slack_read_thread"
arguments = { channel_id = "C04INCID7NS", message_ts = "1793366520.004100" }

[[solution.call]]
endpoint = "pagerduty"
tool = "list_escalation_policies"
arguments = { query = "Database" }

[[solution.call]]
endpoint = "pagerduty"
tool = "list_oncalls"
arguments = { escalation_policy_ids = ["PEPDBRE"] }

[solution]
answer = """
Level 1: Dana Nguyen. Level 2: Sam Okafor.
"""
