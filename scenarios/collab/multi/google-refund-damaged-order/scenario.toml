count_scope = "per_commit"
cause = { service = "supabase", methods = ["POST"], path_regex = "^/v1/projects/qmvbxtzkplrnwdhyfaco/database/migrations$" }

[[expect.preservation.allow]]
pointer = "/services/google/gmail_messages/*"
kind = "create"
matching = { threadId = "c41e7a2b9d03f615", labelIds = ["SENT"] }
field_patterns = { "/headers/To" = '(?i)\A(?:[^<>,;@]*<)?priya[.]shah@acme[.]io>?\z' }

[[expect.ordering]]
prerequisite = { selector = { collection = "/services/stripe/charges", matching = { id = "ch_Hk5TzQ9wNc2RbV6mXa8LuE4P" } }, field = "/amount_refunded", equals = 6200 }
action = { selector = { collection = "/services/supabase/db.qmvbxtzkplrnwdhyfaco.public.orders", matching = { id = 5024 } }, field = "/status", equals = "refunded" }

[[expect.ordering]]
