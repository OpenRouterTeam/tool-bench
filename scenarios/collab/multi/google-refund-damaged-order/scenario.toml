matching = { charge = "ch_Hk5TzQ9wNc2RbV6mXa8LuE4P", currency = "usd", status = "succeeded" }
max_count = 6200

[[expect.preservation.allow]]
pointer = "/services/stripe/balance_transactions/*"
kind = "create"
matching = { type = "refund", currency = "usd" }
references = [{ source_field = "/source", target_field = "/id", target = { collection = "/services/stripe/refunds", created = true, matching = { charge = "ch_Hk5TzQ9wNc2RbV6mXa8LuE4P" } } }]
max_count = 6200

[[expect.preservation.allow]]
pointer = "/services/stripe/events/*"
kind = "create"
matching = { type = "refund.created", data = { object = { charge = "ch_Hk5TzQ9wNc2RbV6mXa8LuE4P" } } }
max_count = 6200

[[expect.preservation.allow]]
