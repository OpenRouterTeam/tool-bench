[[solution.call]]
endpoint = "google-workspace"
tool = "search_gmail_messages"
arguments = { query = "from:priya.shah refund" }

[[solution.call]]
endpoint = "google-workspace"
tool = "get_gmail_message_content"
arguments = { message_id = "c41e7a2b9d03f615" }

[[solution.call]]
endpoint = "supabase"
tool = "list_projects"
arguments = {}

[[solution.call]]
endpoint = "supabase"
tool = "execute_sql"
arguments = { project_id = "qmvbxtzkplrnwdhyfaco", query = "select o.id, o.status, o.total, o.created_at, o.stripe_charge_id from public.orders o join public.customers c on c.id = o.customer_id where c.email = 'priya.shah@acme.io' order by o.created_at" }

[[solution.call]]
endpoint = "stripe"
tool = "stripe_api_write"
arguments = { stripe_api_operation_id = "PostRefunds", parameters = { charge = "ch_Hk5TzQ9wNc2RbV6mXa8LuE4P", reason = "requested_by_customer" }, stripe_context = "acct_1FwY8bQk2LmN4pRs", livemode = false }

[[solution.call]]
endpoint = "supabase"
tool = "execute_sql"
arguments = { project_id = "qmvbxtzkplrnwdhyfaco", query = "update public.orders set status = 'refunded' where id = 5024 returning id, status" }

[[solution.call]]
endpoint = "google-workspace"
tool = "send_gmail_message"
arguments = { to = "priya.shah@acme.io", thread_id = "c41e7a2b9d03f615", in_reply_to = "<CAJ7pS2x9Lw4q@mail.acme.io>", subject = "Re: Desk lamp arrived broken - refund please", body = "Hi Priya,\n\nSorry the lamp arrived damaged. We've refunded order #5024 in full ($62.00) to your Visa ending 4242.\n\nBest,\nOcto Shop team" }
