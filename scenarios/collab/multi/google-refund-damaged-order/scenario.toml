kind = "create"
matching = { type = "charge.refunded", data = { object = { id = "ch_Hk5TzQ9wNc2RbV6mXa8LuE4P" } } }
max_count = 6200

[[expect.preservation.allow]]
pointer = "/services/supabase/db.qmvbxtzkplrnwdhyfaco.public.orders/*/status"
matching = { id = 5024, status = "refunded" }
initial_matching = { id = 5024 }
initial_references = [{ source_field = "/customer_id", target = { collection = "/services/supabase/db.qmvbxtzkplrnwdhyfaco.public.customers", matching = { email = "priya.shah@acme.io" } }, target_field = "/id" }]

[[expect.preservation.allow]]
pointer = "/services/supabase/migrations/*"
kind = "create"
field_patterns = { "/version" = '\S' }
