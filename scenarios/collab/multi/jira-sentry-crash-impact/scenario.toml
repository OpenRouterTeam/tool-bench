[scenario]
id = "collab/multi/jira-sentry-crash-impact"
title = "Report the Sentry impact of the product-grid crash linked from a Jira bug"
now = "2026-10-29T15:00:00Z"
seed = "collab-multi-jira-sentry-crash-impact"
services = ["jira", "sentry"]
tags = ["lookup", "multi-service", "jira", "sentry", "disambiguation"]
timeout_sec = 1200

[scenario.family]
schema_version = 1
primary = "cross_system_identity"
secondary = ["entity_ambiguity"]
dependency_depth = 2
rationale = "Jira WEB-56 description links Sentry issue 6184421045 (STOREFRONT-WEB-8D); STOREFRONT-WEB-7Q (linked from Done WEB-49) and ADMIN-DASHBOARD-2M share its TypeError title; contract requires a Jira GET and 8D counts."

# WEB-56 (open) links https://lumen-labs.sentry.io/issues/6184421045/ = STOREFRONT-WEB-8D:
# 2172 events, 1318 users, first release storefront@5.3.0. Look-alikes with the same
# TypeError title: STOREFRONT-WEB-7Q (CartDrawer, 2600 events / 1904 users, linked from the
# Done bug WEB-49) and ADMIN-DASHBOARD-2M (96 / 14).
[expect]
version = 2
audit_history = true

# The unresolved WEB bug whose summary is about the product grid -> the Sentry issue whose
# ID is in the URL of that bug's description. The counts carry their units, so the two
# numbers cannot stand in for each other. The unit lists hold the ordinary ways of labelling
# each count ("Event count: 2,172", "1,318 unique users"), not only Sentry's own column names.
[expect.answer.record_facts]
requirement = "For the Sentry issue linked from the open WEB bug about the product grid, give its short ID, its number of events, its number of affected users, and the release in which it first appeared."
mode = "statements"
# The title of the Sentry issue, not a denial of it.
predicates = ["Cannot read properties of undefined"]
context = [
  "last seen in storefront@${last_release}",
  "unlike STOREFRONT-WEB-7Q with 2,600 events",
]

[expect.answer.record_facts.selector]
collection = "/services/jira/issues"
matching = { fields = { project = "WEB", issuetype = "Bug" } }
field_patterns = { "/fields/summary" = "(?i)^product grid\\b" }

[expect.answer.record_facts.filter]
absent = ["/fields/resolution"]

[expect.answer.record_facts.related.sentry]
collection = "/services/sentry/issues"
on = { "/id" = "/fields/description" }
capture_from = { "/fields/description" = 'sentry\.io/issues/(\d+)' }

[expect.answer.record_facts.facts.issue]
record = "sentry"
field = "/shortId"
kind = "identifier"

[expect.answer.record_facts.facts.events]
record = "sentry"
field = "/count"
kind = "number"
units = ["events", "total events", "error events", "event count", "occurrences"]
require_unit = true

[expect.answer.record_facts.facts.users]
record = "sentry"
field = "/userCount"
kind = "number"
units = ["users", "affected users", "impacted users", "unique users", "distinct users", "user count", "people"]
require_unit = true

[expect.answer.record_facts.facts.release]
record = "sentry"
field = "/firstRelease"
capture = '@(.+)$'
kind = "identifier"

[expect.answer.record_facts.facts.last_release]
record = "sentry"
field = "/lastRelease"
capture = '@(.+)$'
kind = "identifier"
optional = true

[[expect.required_calls]]
service = "jira"
method = "GET"
path_regex = "^/rest/api/2/"

[[expect.forbidden_calls]]
service = "sentry"
method = "PUT"

[[expect.forbidden_calls]]
service = "sentry"
method = "DELETE"

[[expect.forbidden_calls]]
service = "jira"
method = "PUT"

[[expect.forbidden_calls]]
service = "jira"
method = "POST"
path_regex = "^/rest/api/2/issue/"

[[solution.call]]
endpoint = "atlassian"
tool = "jira_search"
arguments = { jql = "project = WEB AND summary ~ \"grid\" AND statusCategory != Done", fields = "summary,status,assignee,description" }

[[solution.call]]
endpoint = "atlassian"
tool = "jira_get_issue"
arguments = { issue_key = "WEB-56" }

[[solution.call]]
endpoint = "sentry"
tool = "get_sentry_resource"
arguments = { resourceType = "issue", resourceId = "6184421045", organizationSlug = "lumen-labs" }

[solution]
answer = "Sentry issue: STOREFRONT-WEB-8D. Events: 2,172. Affected users: 1,318. First release: storefront@5.3.0."
