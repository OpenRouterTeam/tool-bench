[scenario]
id = "collab/multi/linear-cloudflare-api-origin-cutover"
title = "Make the DNS change requested in a Linear ticket in Cloudflare, then close the ticket"
now = "2026-10-29T15:00:00Z"
seed = "collab-multi-linear-cloudflare-api-origin-cutover"
services = ["linear", "cloudflare"]
tags = ["write", "multi-service", "linear", "cloudflare", "disambiguation"]
timeout_sec = 1200

[scenario.family]
schema_version = 1
primary = "entity_ambiguity"
secondary = ["stale_state", "tool_ambiguity"]
dependency_depth = 3
rationale = "Todo PLAT-241 asks for 198.51.100.45 while canceled PLAT-238 carries old 198.51.100.44; staging api.octo-corp.dev record must not be patched; creating a second record (POST) or deleting is forbidden."

# PLAT-241 (Todo) asks to point the existing api.octo-corp.com A record
# (5b2d7a1f0e3c8b6d4f9a2e1c7b0d3f58) at 198.51.100.45, proxied, without creating a second record. Look-alikes: the
# canceled PLAT-238 with the old address 198.51.100.44, and the staging api.octo-corp.dev
# record (e41a6d0c…) that must not move yet. The request does not ask for the record comment
# or any metadata to change; the stale "origin-2 (new)" comment is preserved.
[expect]
version = 2
audit_history = true

[[expect.records]]
selector = { collection = "/services/cloudflare/dns_records", matching = { zone_id = "023e105f4ecef8ad9ca31a8372d0c353", name = "api.octo-corp.com", type = "A" } }
equals = 1
fields = { "/id" = "5b2d7a1f0e3c8b6d4f9a2e1c7b0d3f58", "/content" = "198.51.100.45", "/proxied" = true, "/ttl" = 1 }

[[expect.records]]
selector = { collection = "/services/cloudflare/dns_records", created = true }
equals = 0

[[expect.records]]
selector = { collection = "/services/linear/comments", created = true }
equals = 1
reviewed_text = { "/body" = { requirement = "Tell the PLAT-241 reader what was changed in Cloudflare: the existing api.octo-corp.com A record now points to 198.51.100.45. The comment association supplies the ticket context; no greeting, repeated ticket id, old address, proxy narration or staging remark is mandatory, but any added claim must be true. Do not accept the old/canceled address, a newly created record, or a failed/not-done report. Unlisted nonempty wording requires adjudication, not an invented model failure.", accepted = [
  "Done: the api.octo-corp.com A record in Cloudflare now points to 198.51.100.45 (origin-3), still proxied. Staging api.octo-corp.dev is unchanged.",
  "Updated the existing api.octo-corp.com A record to 198.51.100.45.",
  "Changed the api.octo-corp.com A record from 198.51.100.21 to 198.51.100.45; it remains proxied.",
  "api.octo-corp.com now resolves to origin-3: the A record content is 198.51.100.45 and proxying is still on.",
], rejected = [
  "Moved api.octo-corp.com to 198.51.100.44.",
  "Created a new A record for api.octo-corp.com at 198.51.100.45.",
  "I could not make the DNS change.",
] } }

[[expect.relations]]
source = { collection = "/services/linear/comments", created = true }
source_field = "/issueId"
target = { collection = "/services/linear/issues", matching = { identifier = "PLAT-241" } }
target_field = "/id"
kind = "foreign_key"

[[expect.relations]]
source = { collection = "/services/linear/issues", matching = { identifier = "PLAT-241" } }
source_field = "/stateId"
target = { collection = "/services/linear/workflow_states", matching = { teamId = "a7c70c10-090f-50bf-a8ce-b4cdee9d8572", name = "Done", type = "completed" } }
target_field = "/id"
kind = "foreign_key"

[[expect.relations]]
source = { collection = "/services/cloudflare/dns_records", matching = { id = "5b2d7a1f0e3c8b6d4f9a2e1c7b0d3f58" } }
source_field = "/zone_id"
target = { collection = "/services/cloudflare/zones", matching = { name = "octo-corp.com" } }
target_field = "/id"
kind = "foreign_key"

[[expect.preservation.allow]]
pointer = "/services/cloudflare/dns_records/5b2d7a1f0e3c8b6d4f9a2e1c7b0d3f58/content"
value_equals = "198.51.100.45"

[[expect.preservation.allow]]
pointer = "/services/cloudflare/dns_records/5b2d7a1f0e3c8b6d4f9a2e1c7b0d3f58/modified_on"

[[expect.preservation.allow]]
pointer = "/services/cloudflare/dns_records/5b2d7a1f0e3c8b6d4f9a2e1c7b0d3f58/settings"
value_equals = {}

[[expect.preservation.allow]]
pointer = "/services/cloudflare/dns_records/5b2d7a1f0e3c8b6d4f9a2e1c7b0d3f58/comment_modified_on"

[[expect.preservation.allow]]
pointer = "/services/cloudflare/dns_records/5b2d7a1f0e3c8b6d4f9a2e1c7b0d3f58/tags_modified_on"

[[expect.preservation.allow]]
pointer = "/services/linear/issues/PLAT-241/stateId"
value_equals = "4ed11568-6dd0-5b94-bf4e-ba05dd563850"

[[expect.preservation.allow]]
pointer = "/services/linear/issues/PLAT-241/completedAt"

[[expect.preservation.allow]]
pointer = "/services/linear/issues/PLAT-241/updatedAt"

[[expect.preservation.allow]]
pointer = "/services/linear/comments/*"
kind = "create"
matching = { issueId = "9e3a7b52-1c84-5d6f-b0e2-7f4c8a1d6b93" }

[[expect.preservation.allow]]
pointer = "/services/linear/issue_history/*"
kind = "create"
matching = { issueId = "9e3a7b52-1c84-5d6f-b0e2-7f4c8a1d6b93" }
count_scope = "per_commit"
max_count = 6

[[expect.ordering]]
prerequisite = { selector = { collection = "/services/cloudflare/dns_records", matching = { id = "5b2d7a1f0e3c8b6d4f9a2e1c7b0d3f58" } }, field = "/content", equals = "198.51.100.45" }
action = { selector = { collection = "/services/linear/comments", created = true }, field = "/body", nonempty_text = true }

[[expect.ordering]]
prerequisite = { selector = { collection = "/services/cloudflare/dns_records", matching = { id = "5b2d7a1f0e3c8b6d4f9a2e1c7b0d3f58" } }, field = "/content", equals = "198.51.100.45" }
action = { selector = { collection = "/services/linear/issues", matching = { identifier = "PLAT-241" } }, field = "/stateId", equals = "4ed11568-6dd0-5b94-bf4e-ba05dd563850" }

[[expect.forbidden_calls]]
service = "cloudflare"
method = "DELETE"
path_regex = "/dns_records"

[[expect.forbidden_calls]]
service = "cloudflare"
method = "POST"
path_regex = "^/client/v4/zones/[^/]+/dns_records$"

[[expect.forbidden_calls]]
service = "cloudflare"
path_regex = "^/client/v4/zones/e9a7c5b3d1f0e8c6a4b2d0f9e7c5a3b1/dns_records/e41a6d0c9b2f7e5a3c8d1b6f4a9e2c07$"
method = "PATCH"

[[expect.forbidden_calls]]
service = "cloudflare"
path_regex = "^/client/v4/zones/e9a7c5b3d1f0e8c6a4b2d0f9e7c5a3b1/dns_records/e41a6d0c9b2f7e5a3c8d1b6f4a9e2c07$"
method = "PUT"

[[expect.forbidden_calls]]
service = "linear"
path = "/_mcp/tools/call"
body = { name = "linear_archiveIssue" }

[[solution.call]]
endpoint = "linear"
tool = "linear_searchIssues"
arguments = { query = "origin-3", teamId = "a7c70c10-090f-50bf-a8ce-b4cdee9d8572" }

[[solution.call]]
endpoint = "linear"
tool = "linear_getIssueById"
arguments = { id = "PLAT-241" }

[[solution.call]]
endpoint = "cloudflare"
tool = "execute"
arguments = { code = """
async () => {
  const zones = (await cloudflare.request({ method: 'GET', path: '/zones', query: { name: 'octo-corp.com' } })).result;
  const zone = zones[0].id;
  const records = (await cloudflare.request({ method: 'GET', path: `/zones/${zone}/dns_records`, query: { name: 'api.octo-corp.com', type: 'A' } })).result;
  const rec = records[0];
  const updated = await cloudflare.request({
    method: 'PATCH',
    path: `/zones/${zone}/dns_records/${rec.id}`,
    body: { content: '198.51.100.45', proxied: true },
  });
  return { before: rec.content, after: updated.result };
}
""" }

[[solution.call]]
endpoint = "linear"
tool = "linear_createComment"
arguments = { issueId = "PLAT-241", body = "Done: the api.octo-corp.com A record in Cloudflare now points to 198.51.100.45 (origin-3), still proxied. Staging api.octo-corp.dev is unchanged." }

[[solution.call]]
endpoint = "linear"
tool = "linear_updateIssue"
arguments = { id = "PLAT-241", stateId = "4ed11568-6dd0-5b94-bf4e-ba05dd563850" }
