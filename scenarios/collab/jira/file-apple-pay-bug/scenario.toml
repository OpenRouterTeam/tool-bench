[scenario]
id = "collab/jira/file-apple-pay-bug"
title = "File a High-priority WEB bug for the missing Apple Pay button, assigned to Alex Kim"
now = "2026-10-29T15:00:00Z"
seed = "collab-jira-file-apple-pay-bug"
services = ["jira"]
tags = ["write", "single-service", "jira", "disambiguation"]
timeout_sec = 900

[expect]
version = 2
audit_history = true

[[expect.records]]
selector = { collection = "/services/jira/issues", created = true }
equals = 1

[[expect.records]]
selector = { collection = "/services/jira/issues", matching = { fields = { project = "WEB", components = ["Checkout"], labels = ["ios"] } }, created = true }
equals = 1
fields = { "/fields/issuetype" = "Bug", "/fields/priority" = "High", "/fields/assignee" = "alex.kim" }
null_fields = ["/fields/resolution", "/fields/resolutiondate"]

[expect.records.reviewed_fields]
requirement = "The summary and optional description together must report that the Apple Pay button is missing at checkout on iOS 18 Safari, without contradictory or invented claims. Facts may be conveyed in the summary alone or distributed across these fields; no exact title or description is requested."
accepted = [
  { "/fields/summary" = "Apple Pay button missing at checkout on iOS 18 Safari", "/fields/description" = "The Apple Pay button does not render on the checkout payment step in Safari on iOS 18." },
  { "/fields/summary" = "Apple Pay button missing at checkout on iOS 18 Safari", "/fields/description" = "" },
  { "/fields/summary" = "Missing Apple Pay button", "/fields/description" = "At checkout in Safari on iOS 18, the Apple Pay button is missing." },
]

[[expect.preservation.allow]]
pointer = "/services/jira/issues/*"
kind = "create"
matching = { fields = { project = "WEB" } }

[[solution.call]]
endpoint = "atlassian"
tool = "jira_search_assignable_users"
arguments = { query = "Alex Kim", project_key = "WEB" }

[[solution.call]]
endpoint = "atlassian"
tool = "jira_create_issue"
arguments = { project_key = "WEB", summary = "Apple Pay button missing at checkout on iOS 18 Safari", issue_type = "Bug", assignee = "alex.kim", components = "Checkout", description = "The Apple Pay button does not render on the checkout payment step in Safari on iOS 18.", additional_fields = "{\"priority\": {\"name\": \"High\"}, \"labels\": [\"ios\"]}" }
