[scenario]
id = "collab/jira/ship-refund-retries"
title = "Close the refund webhook retries story as Done and note the release"
now = "2026-10-29T15:00:00Z"
seed = "collab-jira-ship-refund-retries"
services = ["jira"]
tags = ["write", "single-service", "jira", "disambiguation"]
timeout_sec = 900

[scenario.family]
schema_version = 1
primary = "entity_ambiguity"
secondary = []
dependency_depth = 2
rationale = "PAY-121 Retry failed refund webhooks sits beside PAY-122 Retry failed payout webhooks, PAY-123 refund webhook docs and PAY-125 retry runbook; only PAY-121 may move to Done and get the comment."

[expect]
version = 2
audit_history = true

[[expect.state]]
pointer = "/services/jira/issues/PAY-121/fields/status"
equals = "Done"

[[expect.state]]
pointer = "/services/jira/issues/PAY-121/fields/resolution"
equals = "Done"

[[expect.state]]
pointer = "/services/jira/issues/PAY-121/fields/resolutiondate"
exists = true
is_null = false

[[expect.records]]
selector = { collection = "/services/jira/comments", created = true }
equals = 1
fields = { "/issue" = "PAY-121" }

[expect.records.reviewed_text."/body"]
requirement = "Say that the failed-refund-webhook retry story shipped in release 2026.11. The issue association supplies the story context. The comment must name release 2026.11 and say it shipped or was released; merely mentioning the release identifier is insufficient."
accepted = [
  "Shipped in release 2026.11.",
  "The refund webhook retry story shipped in release 2026.11.",
]
mentions = [
  ["2026.11", "v2026.11"],
  ["shipped", "ship", "ships", "shipping", "released", "release", "went out", "went live", "rolled out", "deployed", "delivered", "launched"],
]

[[expect.preservation.allow]]
pointer = "/services/jira/issues/PAY-121/fields/status"

[[expect.preservation.allow]]
pointer = "/services/jira/issues/PAY-121/fields/resolution"

[[expect.preservation.allow]]
pointer = "/services/jira/issues/PAY-121/fields/resolutiondate"

[[expect.preservation.allow]]
pointer = "/services/jira/issues/PAY-121/fields/updated"

[[expect.preservation.allow]]
pointer = "/services/jira/issues/PAY-121/changelog"

[[expect.preservation.allow]]
pointer = "/services/jira/comments/*"
kind = "create"
matching = { issue = "PAY-121" }

[[solution.call]]
endpoint = "atlassian"
tool = "jira_search"
arguments = { jql = "project = PAY AND text ~ \"refund webhooks\" AND statusCategory != Done", fields = "summary,status,assignee" }

[[solution.call]]
endpoint = "atlassian"
tool = "jira_get_transitions"
arguments = { issue_key = "PAY-121" }

[[solution.call]]
endpoint = "atlassian"
tool = "jira_transition_issue"
arguments = { issue_key = "PAY-121", transition_id = "31", fields = "{\"resolution\": {\"name\": \"Done\"}}" }

[[solution.call]]
endpoint = "atlassian"
tool = "jira_add_comment"
arguments = { issue_key = "PAY-121", body = "Shipped in release 2026.11." }
