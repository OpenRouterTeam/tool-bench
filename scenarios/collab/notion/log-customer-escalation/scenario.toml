[scenario]
id = "collab/notion/log-customer-escalation"
title = "Log a new customer escalation as a database row"
now = "2026-10-29T15:00:00Z"
seed = "collab-notion-log-customer-escalation"
services = ["notion"]
tags = ["write", "single-service", "notion"]
timeout_sec = 900

[scenario.family]
schema_version = 1
primary = "baseline"
secondary = []
dependency_depth = 1
rationale = "Customer escalations data source f937b556 and user Alex Kim (6a5aa3fe) are each unique in the workspace; all row values are given in the instruction; contract checks one created row."

[expect]
version = 2
audit_history = true

[[expect.records]]
selector = { collection = "/services/notion/pages", created = true }
equals = 1

[[expect.records]]
selector = { collection = "/services/notion/pages", created = true, matching = { parent = { data_source_id = "f937b556-2452-4808-a340-f4c80ce63d68" } } }
equals = 1
fields = { "/parent/type" = "data_source_id", "/parent/database_id" = "31142074-4482-4c70-9ca0-406aa0edd7ec", "/properties/Severity/select/name" = "Sev 2", "/properties/State/status/name" = "Open", "/properties/Owner/people/0/id" = "6a5aa3fe-744c-41b8-ab6d-2e0cc2ef706a", "/properties/Reported/date/start" = "2026-10-29", "/archived" = false, "/in_trash" = false }
null_fields = ["/properties/Reported/date/end", "/properties/Reported/date/time_zone"]
array_lengths = { "/properties/Owner/people" = 1 }
reviewed_text = { "/properties/Summary/title" = { format = "notion_rich_text", requirement = "The Summary is the reported issue as dictated: Checkout button unresponsive on Safari. Segment boundaries, passive formatting and letter case do not change the title; no other text may be added.", accepted = ["Checkout button unresponsive on Safari"], mentions = ["^Checkout button unresponsive on Safari$"] }, "/properties/Customer/rich_text" = { format = "notion_rich_text", requirement = "The Customer is the reporting customer's name, Acme Retail, and nothing else. Segment boundaries, passive formatting and letter case do not change the name.", accepted = ["Acme Retail"], mentions = ["^Acme Retail$"] } }

[[expect.relations]]
source = { collection = "/services/notion/pages", created = true }
source_field = "/parent/data_source_id"
target = { collection = "/services/notion/data_sources", matching = { id = "f937b556-2452-4808-a340-f4c80ce63d68" } }
target_field = "/id"

[[expect.relations]]
source = { collection = "/services/notion/pages", created = true }
source_field = "/properties/Owner/people/0/id"
target = { collection = "/services/notion/users", matching = { id = "6a5aa3fe-744c-41b8-ab6d-2e0cc2ef706a", name = "Alex Kim" } }
target_field = "/id"

[[expect.preservation.allow]]
pointer = "/services/notion/pages/*"
kind = "create"
matching = { parent = { data_source_id = "f937b556-2452-4808-a340-f4c80ce63d68" } }

[[solution.call]]
endpoint = "notion"
tool = "API-post-search"
arguments = { query = "Customer escalations", filter = { property = "object", value = "data_source" } }

[[solution.call]]
endpoint = "notion"
tool = "API-get-users"
arguments = {}

[[solution.call]]
endpoint = "notion"
tool = "API-post-page"
arguments = { parent = { type = "database_id", database_id = "31142074-4482-4c70-9ca0-406aa0edd7ec" }, properties = { Summary = { title = [{ text = { content = "Checkout button unresponsive on Safari" } }] }, Customer = { rich_text = [{ text = { content = "Acme Retail" } }] }, Severity = { select = { name = "Sev 2" } }, State = { status = { name = "Open" } }, Owner = { people = [{ id = "6a5aa3fe-744c-41b8-ab6d-2e0cc2ef706a" }] }, Reported = { date = { start = "2026-10-29" } } } }
