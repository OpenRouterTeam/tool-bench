[scenario]
id = "collab/notion/update-current-runbook"
title = "Update the escalation contact in the current on-call runbook only"
now = "2026-10-29T15:00:00Z"
seed = "collab-notion-update-current-runbook"
services = ["notion"]
tags = ["write", "single-service", "notion", "disambiguation"]
timeout_sec = 900

[expect]
version = 2
audit_history = true

[[expect.records]]
selector = { collection = "/services/notion/blocks", matching = { id = "d18edb31-c7d9-4fa2-9759-783c0b2d0b89", parent = { page_id = "7c41530e-e886-4046-9cb4-2f49e6957f99" } } }
equals = 1
fields = { "/type" = "paragraph", "/archived" = false, "/in_trash" = false }
reviewed_text = { "/paragraph/rich_text" = { format = "notion_rich_text", requirement = "Replace Marcus Webb, +1 555-0100 with Sam Ortiz, +1 555-0142 in the current runbook's escalation contact, preserving the surrounding prefix and role text. Passive formatting and segment boundaries do not change the claim. A name or phone token alone, a rejected alternative or a contradiction is not a complete replacement; unlisted wording requires adjudication.", accepted = ["Escalation contact: Sam Ortiz, +1 555-0142 (Head of Infrastructure)"], rejected = ["Escalation contact: Marcus Webb, +1 555-0100 (Head of Infrastructure)"] } }

[[expect.preservation.allow]]
pointer = "/services/notion/blocks/d18edb31-c7d9-4fa2-9759-783c0b2d0b89/paragraph/rich_text"

[[expect.preservation.allow]]
pointer = "/services/notion/blocks/d18edb31-c7d9-4fa2-9759-783c0b2d0b89/last_edited_time"

[[expect.preservation.allow]]
pointer = "/services/notion/blocks/d18edb31-c7d9-4fa2-9759-783c0b2d0b89/last_edited_by"

[[expect.preservation.allow]]
pointer = "/services/notion/pages/7c41530e-e886-4046-9cb4-2f49e6957f99/last_edited_time"

[[expect.preservation.allow]]
pointer = "/services/notion/pages/7c41530e-e886-4046-9cb4-2f49e6957f99/last_edited_by"

[[solution.call]]
endpoint = "notion"
tool = "API-post-search"
arguments = { query = "On-call runbook" }

[[solution.call]]
endpoint = "notion"
tool = "API-get-block-children"
arguments = { block_id = "7c41530e-e886-4046-9cb4-2f49e6957f99" }

[[solution.call]]
endpoint = "notion"
tool = "API-update-a-block"
arguments = { block_id = "d18edb31-c7d9-4fa2-9759-783c0b2d0b89", type = { paragraph = { rich_text = [{ type = "text", text = { content = "Escalation contact: Sam Ortiz, +1 555-0142 (Head of Infrastructure)" } }] } } }
