[scenario]
id = "collab/notion/delay-web-launch"
title = "Mark the Web 4.12 launch as delayed with its new date"
now = "2026-10-29T15:00:00Z"
seed = "collab-notion-delay-web-launch"
services = ["notion"]
tags = ["write", "single-service", "notion"]
timeout_sec = 900

[scenario.family]
schema_version = 1
primary = "baseline"
secondary = []
dependency_depth = 2
rationale = "Product launches has exactly one row titled Web 4.12 (afa8e804, Planned, 2026-11-03); the only neighbour is the differently named Done row Web 4.11; new status and date are given in the instruction."

[expect]
version = 2
audit_history = true

[[expect.records]]
selector = { collection = "/services/notion/pages", matching = { id = "afa8e804-d2ac-4ee2-80e2-e18ed4c05865" } }
equals = 1
fields = { "/properties/Status/status" = { id = "d280", name = "Delayed", color = "red" }, "/properties/Launch date/date/start" = "2026-11-10", "/archived" = false, "/in_trash" = false }
null_fields = ["/properties/Launch date/date/end", "/properties/Launch date/date/time_zone"]

[[expect.preservation.allow]]
pointer = "/services/notion/pages/afa8e804-d2ac-4ee2-80e2-e18ed4c05865/properties/Status/status"

[[expect.preservation.allow]]
pointer = "/services/notion/pages/afa8e804-d2ac-4ee2-80e2-e18ed4c05865/properties/Launch date/date"

[[expect.preservation.allow]]
pointer = "/services/notion/pages/afa8e804-d2ac-4ee2-80e2-e18ed4c05865/last_edited_time"

[[expect.preservation.allow]]
pointer = "/services/notion/pages/afa8e804-d2ac-4ee2-80e2-e18ed4c05865/last_edited_by"

[[solution.call]]
endpoint = "notion"
tool = "API-query-data-source"
arguments = { data_source_id = "0b7747c0-5ed0-4c77-a8b1-867a05a3c300", filter = { property = "Launch", title = { equals = "Web 4.12" } } }

[[solution.call]]
endpoint = "notion"
tool = "API-patch-page"
arguments = { page_id = "afa8e804-d2ac-4ee2-80e2-e18ed4c05865", properties = { Status = { status = { name = "Delayed" } }, "Launch date" = { date = { start = "2026-11-10" } } } }
