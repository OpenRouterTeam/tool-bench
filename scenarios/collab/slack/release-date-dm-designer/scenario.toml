[scenario]
id = "collab/slack/release-date-dm-designer"
title = "Tell the designer Alex the moved web 4.12 release date by DM"
now = "2026-10-29T15:00:00Z"
seed = "collab-slack-release-date-dm-designer"
services = ["slack"]
tags = ["write", "single-service", "slack", "disambiguation"]
timeout_sec = 900

[scenario.family]
schema_version = 1
primary = "entity_ambiguity"
secondary = ["stale_state"]
dependency_depth = 1
rationale = "Two Alexes with existing DMs: Alex Kim (Senior Product Designer) and Alex Rivera (Engineering Manager, Platform); the DM must reach Kim; #release also holds the original 2026-11-03 date replaced by 2026-11-10."

[expect]
version = 2
audit_history = true

[[expect.records]]
selector = { collection = "/services/slack/posted", created = true }
equals = 1
fields = { "/user" = "U02CMORG8RK" }
reviewed_text = { "/text" = { requirement = "Tell Alex Kim in a DM that the current web 4.12 release date is 2026-11-10, written YYYY-MM-DD. The conversation supplies recipient context. No greeting, reason, old date or freeze date is mandatory; added facts must be grounded. Unlisted nonempty wording requires adjudication.", accepted = ["The web 4.12 release is scheduled for 2026-11-10.", "Hi Alex! The web 4.12 release moved from 2026-11-03 to 2026-11-10 (Tuesday) because of the payments SDK regression. Code freeze is now 2026-11-06."] } }

[[expect.records]]
selector = { collection = "/services/slack/messages", created = true }
equals = 1

[[expect.relations]]
source = { collection = "/services/slack/posted", created = true }
source_field = "/channel"
target = { collection = "/services/slack/channels", matching = { is_im = true, user = "U06AKIM3D2Q" } }
target_field = "/id"
kind = "foreign_key"

[[expect.relations]]
source = { collection = "/services/slack/posted", created = true }
source_field = "/ts"
target = { collection = "/services/slack/messages", created = true }
target_field = "/ts"
kind = "bijection"
fields = [
  { source_field = "/channel", target_field = "/channel", kind = "equals" },
  { source_field = "/text", target_field = "/text", kind = "equals" },
]

[[expect.preservation.allow]]
pointer = "/services/slack/posted/*"
kind = "create"
matching = { user = "U02CMORG8RK" }

[[expect.preservation.allow]]
pointer = "/services/slack/messages/*"
kind = "create"
matching = { user = "U02CMORG8RK" }

[[expect.preservation.allow]]
pointer = "/services/slack/channels/*"
kind = "create"
matching = { is_im = true, user = "U06AKIM3D2Q", members = ["U02CMORG8RK", "U06AKIM3D2Q"] }

[[solution.call]]
endpoint = "slack"
tool = "slack_search_public"
arguments = { keywords = ["4.12", "moved"], natural_language_query = "When is the web 4.12 release now?" }

[[solution.call]]
endpoint = "slack"
tool = "slack_search_users"
arguments = { keywords = ["Alex"], natural_language_query = "Alex on the design team" }

[[solution.call]]
endpoint = "slack"
tool = "slack_send_message"
arguments = { channel_id = "U06AKIM3D2Q", message = "Hi Alex! The web 4.12 release moved from 2026-11-03 to 2026-11-10 (Tuesday) because of the payments SDK regression. Code freeze is now 2026-11-06." }
