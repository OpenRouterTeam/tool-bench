[scenario]
id = "collab/slack/launch-checklist-item"
title = "Add an item to the Payments v2 launch checklist list"
now = "2026-10-29T15:00:00Z"
seed = "collab-slack-launch-checklist-item"
services = ["slack"]
tags = ["write", "single-service", "slack"]
timeout_sec = 900

[expect]
version = 2
audit_history = true

[[expect.records]]
selector = { collection = "/services/slack/lists/F0PAYV2LST1/records", identity_field = "/id", created = true }
equals = 1
fields = { "/fields/Col0TASK0001" = "Rotate webhook signing secrets", "/fields/Col0OWNR0002" = ["U03PRIYAN4T"], "/fields/Col0STAT0003" = ["in_progress"], "/fields/Col0DUED0004" = "2026-11-05" }

[[expect.preservation.allow]]
pointer = "/services/slack/lists/F0PAYV2LST1/records"
kind = "append"
identity_field = "/id"
matching = { created_by = "U02CMORG8RK" }

[[expect.preservation.allow]]
pointer = "/services/slack/lists/F0PAYV2LST1/next_rec"

[[solution.call]]
endpoint = "slack"
tool = "slack_read_list"
arguments = { list_title = "Payments v2 launch checklist", schema_only = true }

[[solution.call]]
endpoint = "slack"
tool = "slack_add_list_record"
arguments = { list_id = "F0PAYV2LST1", columns = { Task = "Rotate webhook signing secrets", Owner = "U03PRIYAN4T", Status = "In progress", "Due date" = "2026-11-05" } }
