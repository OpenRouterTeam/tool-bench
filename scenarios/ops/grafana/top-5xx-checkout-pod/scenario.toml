[scenario]
id = "ops/grafana/top-5xx-checkout-pod"
title = "Find the production checkout pod with the most 5xx errors"
now = "2026-11-12T15:30:00Z"
seed = "ops-grafana-top-5xx-checkout-pod"
services = ["grafana"]
tags = ["lookup", "single-service", "grafana", "disambiguation"]
timeout_sec = 900

[scenario.family]
schema_version = 1
primary = "entity_ambiguity"
secondary = []
dependency_depth = 2
rationale = "prom-staging pod checkout-5f6d7c8b9-zq4wd has the highest 5xx rate (4.5/s) but prom-prod pod checkout-7b9d6c5f4-xk2lp (3.5/s) is the answer; contract requires a query on datasource prom-prod."

[expect]
version = 2
audit_history = true

[expect.answer.record_facts]
requirement = "Name the checkout pod with the highest total 5xx request rate in the production Prometheus datasource (the sum of its http_requests_total rates with a 5xx status). A rough rate may accompany it."
mode = "statements"
contradictions = ["fewest", "the least", "the lowest"]
context = [
  "(~${five_xx_rate} 5xx/s, roughly 8% of its requests)",
]

[expect.answer.record_facts.selector]
collection = "/services/grafana/prom_series"
matching = { labels = { __name__ = "http_requests_total", service = "checkout" } }
field_patterns = { "/labels/status" = "^5[0-9][0-9]$" }
references = [{ source_field = "/datasource", target = { collection = "/services/grafana/datasources", matching = { type = "prometheus" }, field_patterns = { "/name" = '(?i)\bprod\b' } }, target_field = "/uid" }]

[expect.answer.record_facts.selection.group]
by = "/labels/pod"
measure = { sum = "/rate" }
pick = "largest"

[expect.answer.record_facts.facts.pod]
field = "/key"
kind = "identifier"

[expect.answer.record_facts.facts.five_xx_rate]
field = "/value"
kind = "number"
optional = true

[[expect.required_calls]]
service = "grafana"
path_regex = "^/api/datasources/(uid/prom-prod/resources|proxy/uid/prom-prod)/api/v1/query(_range)?$"

[[expect.forbidden_calls]]
service = "grafana"
method = "DELETE"

[[solution.call]]
endpoint = "grafana"
tool = "list_datasources"
arguments = { type = "prometheus" }

[[solution.call]]
endpoint = "grafana"
tool = "query_prometheus"
arguments = { datasourceUid = "prom-prod", expr = "sum by (pod) (rate(http_requests_total{namespace=\"shop-prod\", service=\"checkout\", status=~\"5..\"}[5m]))", queryType = "instant", endTime = "now" }

[solution]
answer = "checkout-7b9d6c5f4-xk2lp"
