[scenario]
id = "ops/grafana/silence-replica-maintenance"
title = "Silence replication-lag alerts for one replica during maintenance"
now = "2026-11-12T15:30:00Z"
seed = "ops-grafana-silence-replica-maintenance"
services = ["grafana"]
tags = ["write", "single-service", "grafana"]
timeout_sec = 900

[scenario.family]
schema_version = 1
primary = "baseline"
secondary = []
dependency_depth = 0
rationale = "Alertname PostgresReplicationLag, instance pg-replica-2, the window and CHG-7781 are all given; one silence create; the two existing silences (NodeDiskFillingUp, staging error rate) are unrelated."

[expect]
version = 2
audit_history = true

[[expect.records]]
selector = { collection = "/services/grafana/silences", created = true }
equals = 1
timestamp_fields = { "/startsAt" = "2026-11-13T02:00:00Z", "/endsAt" = "2026-11-13T04:00:00Z" }
label_matchers = { field = "/matchers", equals = { alertname = "PostgresReplicationLag", instance = "pg-replica-2" } }

[[expect.records]]
selector = { collection = "/services/grafana/silences", created = true, field_patterns = { "/comment" = '(^|[^[:alnum:]_])CHG-7781([^[:alnum:]_]|$)', "/createdBy" = '\S' } }
equals = 1

[[expect.forbidden_calls]]
service = "grafana"
method = "DELETE"

[expect.preservation]
allow = [
  { pointer = "/services/grafana/silences/*", kind = "create", field_patterns = { "/comment" = '(^|[^[:alnum:]_])CHG-7781([^[:alnum:]_]|$)', "/createdBy" = '\S' }, cause = { service = "grafana", methods = ["POST"], path_regex = "^/api/alertmanager/grafana/api/v2/silences/*$" } },
]

[[solution.call]]
endpoint = "grafana"
tool = "alerting_rules_read"
arguments = { operation = "list" }

[[solution.call]]
endpoint = "grafana"
tool = "alerting_silences_write"
arguments = { operation = "create", matchers = [{ name = "alertname", value = "PostgresReplicationLag" }, { name = "instance", value = "pg-replica-2" }], starts_at = "2026-11-13T02:00:00Z", ends_at = "2026-11-13T04:00:00Z", comment = "CHG-7781 storage maintenance on pg-replica-2", created_by = "sre" }
capture = [{ name = "created_silence", pointer = "/content/0/text", json_pointer = "/silenceID", constraint = { type = "string", minLength = 1 } }]

[[solution.call]]
endpoint = "grafana"
tool = "alerting_silences_read"
template = true
arguments = { operation = "get", silence_id = "${created_silence}" }
