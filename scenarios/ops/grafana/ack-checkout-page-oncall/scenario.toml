[scenario]
id = "ops/grafana/ack-checkout-page-oncall"
title = "Acknowledge the production checkout page and find the primary on-call"
now = "2026-11-12T15:30:00Z"
seed = "ops-grafana-ack-checkout-page-oncall"
services = ["grafana"]
tags = ["write", "single-service", "grafana", "disambiguation"]
timeout_sec = 900

[expect]
version = 2
audit_history = true

[[expect.records]]
selector = { collection = "/services/grafana/oncall_alert_groups", matching = { id = "IHQ4K2M7", integration_id = "CIGRAFAN" }, references = [{ source_field = "/team_id", target_field = "/id", target = { collection = "/services/grafana/oncall_teams", matching = { name = "Checkout" } } }] }
equals = 1
fields = { "/state" = "acknowledged" }
null_fields = ["/resolved_at", "/resolved_by", "/silenced_at"]

[expect.answer.oncall]
schedule = { collection = "/services/grafana/oncall_schedules", matching = { name = "Checkout Primary" }, references = [{ source_field = "/team_id", target_field = "/id", target = { collection = "/services/grafana/oncall_teams", matching = { name = "Checkout" } } }] }
directory = "/services/grafana/oncall_users"
allow_unambiguous_surnames = true
empty_answers = ["Nobody is on call on Checkout Primary.", "No one is currently on call on Checkout Primary."]
content = { requirement = "Identify exactly the current assignees of Checkout Primary, using authoritative schedule/directory relationships. Username, email, full name, unambiguous surname and truthful structured user records are acceptable. Do not negate current duty, substitute another schedule, or invent another assignee; unreviewed wording requires adjudication.", accepted = ["${oncall}", "On call: ${oncall}", "Checkout Primary: ${oncall}", "${oncall} is on call.", "The current primary on-call engineer is ${oncall}.", "On call right now on the Checkout Primary schedule: ${oncall}.", 'Acknowledged the production alert group IHQ4K2M7 ("[prod] HighCheckoutLatency checkout p99 above 1.5s"). On call right now on the Checkout Primary schedule: ${oncall}.'], rejected = ["${oncall} is not on call.", "${oncall} is not on call. The primary on-call person is Mei Chen.", "Do not contact ${oncall}; they are not on call."] }

[[expect.forbidden_calls]]
service = "grafana"
method = "POST"
path_regex = "^/oncall/api/v1/alert_groups/[^/]+/(resolve|silence)/*$"

[expect.preservation]
allow = [
  { pointer = "/services/grafana/oncall_alert_groups/IHQ4K2M7/state", matching = { state = "acknowledged" }, cause = { service = "grafana", methods = ["POST"], path_regex = "^/oncall/api/v1/alert_groups/IHQ4K2M7/acknowledge/*$" } },
  { pointer = "/services/grafana/oncall_alert_groups/IHQ4K2M7/acknowledged_at", matching = { state = "acknowledged" }, cause = { service = "grafana", methods = ["POST"], path_regex = "^/oncall/api/v1/alert_groups/IHQ4K2M7/acknowledge/*$" } },
  { pointer = "/services/grafana/oncall_alert_groups/IHQ4K2M7/acknowledged_by", matching = { state = "acknowledged" }, cause = { service = "grafana", methods = ["POST"], path_regex = "^/oncall/api/v1/alert_groups/IHQ4K2M7/acknowledge/*$" } },
]

[[solution.call]]
endpoint = "grafana"
tool = "list_alert_groups"
arguments = { state = "new" }

[[solution.call]]
endpoint = "grafana"
tool = "update_alert_group"
arguments = { alertGroupId = "IHQ4K2M7", state = "acknowledged" }

[[solution.call]]
endpoint = "grafana"
tool = "list_oncall_teams"
arguments = {}

[[solution.call]]
endpoint = "grafana"
tool = "list_oncall_schedules"
arguments = { teamId = "TCK4M2P8" }

[[solution.call]]
endpoint = "grafana"
tool = "get_current_oncall_users"
arguments = { scheduleId = "SCK1PRIM" }
capture = [{ name = "oncall_users", pointer = "/content/0/text", json_pointer = "/users" }]

[solution]
answer = "${oncall_users}"
answer_template = true
