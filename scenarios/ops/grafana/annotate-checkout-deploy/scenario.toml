[scenario]
id = "ops/grafana/annotate-checkout-deploy"
title = "Annotate the production checkout deploy on the right dashboard"
now = "2026-11-12T15:30:00Z"
seed = "ops-grafana-annotate-checkout-deploy"
services = ["grafana"]
tags = ["write", "single-service", "grafana", "disambiguation"]
timeout_sec = 900

[expect]
version = 2
audit_history = true

[[expect.records]]
selector = { collection = "/services/grafana/annotations", created = true }
equals = 1

[[expect.records]]
selector = { collection = "/services/grafana/annotations", created = true, matching = { dashboardUID = "checkout-prod", tags = ["deploy", "checkout"] } }
equals = 1
fields = { "/text" = "Deploy checkout v4.19.0", "/time" = 1794492300000, "/timeEnd" = 1794492300000 }
any_fields = [{ "/panelId" = 0 }, { "/panelId" = 3 }]

[[expect.relations]]
source = { collection = "/services/grafana/annotations", created = true }
source_field = "/dashboardUID"
target = { collection = "/services/grafana/dashboards", matching = { folderUid = "f-prod", dashboard = { uid = "checkout-prod", title = "Checkout Service" } } }
target_field = "/dashboard/uid"

[[expect.relations]]
source = { collection = "/services/grafana/annotations", created = true }
source_field = "/dashboardId"
target = { collection = "/services/grafana/dashboards", matching = { dashboard = { uid = "checkout-prod" } } }
target_field = "/dashboard/id"

[[expect.relations]]
source = { collection = "/services/grafana/annotations", created = true }
source_field = "/userId"
target = { collection = "/services/grafana/user", key_prefix = "current" }
target_field = "/id"

[[expect.forbidden_calls]]
service = "grafana"
method = "DELETE"

[[expect.forbidden_calls]]
service = "grafana"
method = "POST"
path = "/api/dashboards/db"

[expect.preservation]
allow = [
  { pointer = "/services/grafana/annotations/*", kind = "create", matching = { dashboardUID = "checkout-prod", panelId = 0, text = "Deploy checkout v4.19.0", time = 1794492300000, timeEnd = 1794492300000, tags = ["deploy", "checkout"] }, references = [{ source_field = "/dashboardId", target_field = "/dashboard/id", target = { collection = "/services/grafana/dashboards", matching = { dashboard = { uid = "checkout-prod" } } } }, { source_field = "/userId", target_field = "/id", target = { collection = "/services/grafana/user", key_prefix = "current" } }], cause = { service = "grafana", methods = ["POST"], path_regex = "^/api/annotations/*$" } },
  { pointer = "/services/grafana/annotations/*", kind = "create", matching = { dashboardUID = "checkout-prod", panelId = 3, text = "Deploy checkout v4.19.0", time = 1794492300000, timeEnd = 1794492300000, tags = ["deploy", "checkout"] }, references = [{ source_field = "/dashboardId", target_field = "/dashboard/id", target = { collection = "/services/grafana/dashboards", matching = { dashboard = { uid = "checkout-prod" } } } }, { source_field = "/userId", target_field = "/id", target = { collection = "/services/grafana/user", key_prefix = "current" } }], cause = { service = "grafana", methods = ["POST"], path_regex = "^/api/annotations/*$" } },
]

[[solution.call]]
endpoint = "grafana"
tool = "search_dashboards"
arguments = { query = "Checkout Service" }

[[solution.call]]
endpoint = "grafana"
tool = "create_annotation"
arguments = { dashboardUid = "checkout-prod", time = 1794492300000, text = "Deploy checkout v4.19.0", tags = ["deploy", "checkout"] }

[[solution.call]]
endpoint = "grafana"
tool = "get_annotations"
arguments = { dashboardUid = "checkout-prod", from = 1794492300000, to = 1794492300000, tags = ["deploy", "checkout"] }
