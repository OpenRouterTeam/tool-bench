[[solution.call]]
endpoint = "datadog"
tool = "get_monitors"
arguments = { tags = ["service:billing-api"] }

[[solution.call]]
endpoint = "datadog"
tool = "query_metrics"
arguments = { from = 1793253600, to = 1793282400, query = "avg:billing.api.latency.p95{env:prod,service:billing-api}" }

[[solution.call]]
endpoint = "argocd"
tool = "get_application"
arguments = { applicationName = "billing-api" }
capture = [{ name = "billing_spec", pointer = "/content/0/text", json_pointer = "/spec" }]

[[solution.call]]
endpoint = "argocd"
tool = "update_application_spec"
template = true
arguments = { applicationName = "billing-api", applicationNamespace = "argocd", spec = "${billing_spec}" }
replacements = [{ pointer = "/spec/source/targetRevision", value = "v2.8.0" }]

[[solution.call]]
endpoint = "argocd"
tool = "get_application"
arguments = { applicationName = "billing-api", applicationNamespace = "argocd" }

[[solution.call]]
endpoint = "argocd"
tool = "get_application"
arguments = { applicationName = "billing-api", applicationNamespace = "argocd" }
