[scenario]
id = "ops/multi/datadog-latency-argocd-rollback"
title = "Trace a prod latency regression in Datadog to an Argo CD release and roll it back"
now = "2026-10-29T14:05:00Z"
seed = "ops-multi-datadog-latency-argocd-rollback"
services = ["datadog", "argocd"]
tags = ["write", "multi-service", "datadog", "argocd", "disambiguation"]
timeout_sec = 1200

# Prod billing-api p95 jumps from ~180 ms to ~900 ms at 09:05, right after v2.9.0 was deployed
# at 09:02 (v2.9.1 at 12:10 did not help; billing-worker's 10:44 deploy is unrelated; the
# staging spike 11:00-11:30 is a load test). Correct rollback: pin prod to v2.8.0 (f4befdc).
# Traps: pinning v2.9.0 (the release before the latest), touching billing-api-staging.

[expect]
version = 2
audit_history = true

[[expect.records]]
selector = { collection = "/services/argocd/applications", matching = { metadata = { name = "billing-api", namespace = "argocd" }, spec = { syncPolicy = { automated = {} } } } }
equals = 1
fields = { "/spec/source/targetRevision" = "v2.8.0", "/status/sync/status" = "Synced", "/status/health/status" = "Healthy" }
optional_choices = { "/spec/syncPolicy/automated/enabled" = [true] }

[[expect.records]]
selector = { collection = "/services/argocd/sync_history", matching = { app = "argocd/billing-api" }, latest_by = "/sequence" }
equals = 1
fields = { "/history/revision" = "f4befdc6efa7504dc43d29f4de52c0f1529f52d2", "/history/source/repoURL" = "https://github.com/lumen-retail/billing-api-deploy.git", "/history/source/path" = "overlays/production", "/history/source/targetRevision" = "v2.8.0" }

[[expect.relations]]
kind = "bijection"
source = { collection = "/services/argocd/resources", matching = { app = "argocd/billing-api", managed = true, cluster = "https://prod-use1.k8s.lumen.internal" } }
source_field = "/resource_identity"
target = { collection = "/services/argocd/desired_resources", matching = { repoURL = "https://github.com/lumen-retail/billing-api-deploy.git", path = "overlays/production", revision = "f4befdc6efa7504dc43d29f4de52c0f1529f52d2" } }
target_field = "/resource_identity"
fields = [{ source_field = "/content_digest", target_field = "/content_digest", kind = "equals" }]

[[expect.relations]]
kind = "numeric_equals"
source = { collection = "/services/argocd/resources", matching = { app = "argocd/billing-api", kind = "Deployment", namespace = "billing", name = "billing-api" } }
source_field = "/manifest/metadata/generation"
target = { collection = "/services/argocd/resources", matching = { app = "argocd/billing-api", kind = "Deployment", namespace = "billing", name = "billing-api" } }
target_field = "/manifest/status/observedGeneration"

[[expect.relations]]
kind = "count_equals"
source = { collection = "/services/argocd/resources", matching = { app = "argocd/billing-api", kind = "Pod", namespace = "billing", deleting = false, manifest = { status = { phase = "Running", conditions = [{ type = "Ready", status = "True" }] } } }, references = [{ source_field = "/controller_uid", target_field = "/uid", target = { collection = "/services/argocd/resources", matching = { app = "argocd/billing-api", kind = "ReplicaSet", namespace = "billing" }, references = [{ source_field = "/controller_uid", target_field = "/uid", target = { collection = "/services/argocd/resources", matching = { app = "argocd/billing-api", kind = "Deployment", namespace = "billing", name = "billing-api" } } }, { source_field = "/template_digest", target_field = "/template_digest", target = { collection = "/services/argocd/resources", matching = { app = "argocd/billing-api", kind = "Deployment", namespace = "billing", name = "billing-api" } } }] } }] }
source_field = "/uid"
target = { collection = "/services/argocd/resources", matching = { app = "argocd/billing-api", kind = "Deployment", namespace = "billing", name = "billing-api" } }
target_field = "/manifest/spec/replicas"

[[expect.relations]]
kind = "foreign_key"
source = { collection = "/services/argocd/resources", matching = { app = "argocd/billing-api", kind = "Pod", namespace = "billing", deleting = false, manifest = { status = { phase = "Running", conditions = [{ type = "Ready", status = "True" }] } } }, references = [{ source_field = "/controller_uid", target_field = "/uid", target = { collection = "/services/argocd/resources", matching = { app = "argocd/billing-api", kind = "ReplicaSet", namespace = "billing" }, references = [{ source_field = "/controller_uid", target_field = "/uid", target = { collection = "/services/argocd/resources", matching = { app = "argocd/billing-api", kind = "Deployment", namespace = "billing", name = "billing-api" } } }, { source_field = "/template_digest", target_field = "/template_digest", target = { collection = "/services/argocd/resources", matching = { app = "argocd/billing-api", kind = "Deployment", namespace = "billing", name = "billing-api" } } }] } }] }
source_field = "/controller_uid"
target = { collection = "/services/argocd/resources", matching = { app = "argocd/billing-api", kind = "ReplicaSet", namespace = "billing" } }
target_field = "/uid"
fields = [
  { source_field = "/manifest/spec/containers", target_field = "/manifest/spec/template/spec/containers", kind = "equals" },
  { source_field = "/manifest/spec/serviceAccountName", target_field = "/manifest/spec/template/spec/serviceAccountName", kind = "equals" },
  { source_field = "/manifest/metadata/namespace", target_field = "/manifest/metadata/namespace", kind = "equals" },
  { source_field = "/cluster", target_field = "/cluster", kind = "equals" },
]
[[expect.information]]
prerequisite = { service = "datadog", method = "GET", path = "/api/v1/query" }
response_field = "/series"
source = { collection = "/services/datadog/metrics", matching = { metric = "billing.api.latency.p95", tags = ["env:prod", "service:billing-api"] } }
series = { fields = { "/metric" = "/metric" }, scope = "/scope", source_tags = "/tags", points = "/pointlist", interval = "/interval", source_points = "/points", timestamp_scale = 1000, start = "2026-10-29T09:00:00Z", end = "2026-10-29T09:10:00Z" }
action = { service = "argocd", method = "PUT", path_regex = "^/api/v1/applications/billing-api(/spec)?$" }

[[expect.forbidden_calls]]
service = "argocd"
method = "DELETE"

[[expect.forbidden_calls]]
service = "argocd"
method = "PUT"
path_regex = "^/api/v1/applications/billing-(api-staging|worker)(/spec)?$"

[[expect.forbidden_calls]]
service = "argocd"
method = "POST"
path_regex = "^/api/v1/applications/billing-(api-staging|worker)/(sync|rollback|resource/actions)$"

