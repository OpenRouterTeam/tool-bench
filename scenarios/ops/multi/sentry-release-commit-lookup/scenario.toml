[scenario]
id = "ops/multi/sentry-release-commit-lookup"
title = "Trace the noisiest storefront Sentry error to the pull request that introduced it"
now = "2026-10-20T16:00:00Z"
seed = "ops-multi-sentry-release-commit-lookup"
services = ["sentry", "github"]
tags = ["lookup", "multi-service", "sentry", "github", "disambiguation"]
timeout_sec = 900

[scenario.family]
schema_version = 1
primary = "dependency_depth"
secondary = ["cross_system_identity", "entity_ambiguity"]
dependency_depth = 4
rationale = "Chain: top unresolved STOREFRONT-WEB-7Q -> first release storefront@5.2.0 -> commit 9f1c2ab -> GitHub PR #57 -> author sofia; same-title 8D (5.3.0, PR #63) and open unmerged PR #70 are decoys."

# Sentry: STOREFRONT-WEB-7Q (2,600 events, CartDrawer) first seen in storefront@5.2.0, whose
# only commit is 9f1c2ab "feat(cart): slide-out cart drawer" by Sofia Alvarez. Look-alike:
# STOREFRONT-WEB-8D (same "reading 'map'" TypeError, 2,172 events, ProductGrid) from
# storefront@5.3.0 (Kenji's #63). GitHub: the drawer commit is the squash merge of PR #57
# (author sofia); PR #70 by marcus is an open, unmerged fix attempt.
[expect]
version = 2
audit_history = true

[expect.answer.record_facts]
requirement = "Name the unresolved Sentry issue of the storefront-web project that has the most events (short ID), the release it first appeared in, the number of the GitHub pull request whose merge commit is that release's commit, and that pull request's author."
mode = "statements"
selection = { largest = { field = "/count" } }
# The task asks for the issue with the most events; these words say the opposite of it.
contradictions = ["fewest", "least frequent", "least noisy", "quietest"]
context = [
  "(https://github.com/lumen-labs/storefront/pull/${pull_request})",
  "(${event_count} events, unresolved)",
  '(single commit ${commit_sha}, "${commit_message}")',
 'commit title: "${commit_title}"',
]

[expect.answer.record_facts.selector]
collection = "/services/sentry/issues"
matching = { status = "unresolved", project = "storefront-web" }

[expect.answer.record_facts.related.release]
collection = "/services/sentry/releases"
on = { "/version" = "/firstRelease" }

# The pull request is the one whose merge commit is the release's commit.
[expect.answer.record_facts.related.pull]
from = "release"
collection = "/services/github/pulls"
on = { "/merge_commit_sha" = "/commits/0/id" }

[expect.answer.record_facts.related.author]
from = "pull"
collection = "/services/github/users"
on = { "/login" = "/user" }

[expect.answer.record_facts.facts.issue_id]
field = "/shortId"
kind = "identifier"

[expect.answer.record_facts.facts.release]
record = "release"
field = "/version"
kind = "identifier"

# Sentry lists a `package@version` release under its short version, so `5.2.0` names the
# same release. The wording is bound to that release and stops applying when the data changes.
[expect.answer.record_facts.facts.release.wordings]
"storefront@5.2.0" = ["5.2.0"]

[expect.answer.record_facts.facts.pull_request]
record = "pull"
field = "/number"
kind = "number"
units = ["#", "pr", "request", "number"]
require_unit = true

[expect.answer.record_facts.facts.author]
record = "author"
field = "/name"
kind = "text"
also = ["/login"]

[expect.answer.record_facts.facts.event_count]
field = "/count"
kind = "number"
optional = true

[expect.answer.record_facts.facts.commit_sha]
record = "release"
field = "/commits/0/id"
capture = '^(.{7})'
kind = "identifier"
optional = true

[expect.answer.record_facts.facts.commit_message]
record = "release"
field = "/commits/0/message"
kind = "text"
optional = true

[expect.answer.record_facts.facts.commit_title]
record = "release"
field = "/commits/0/message"
capture = '^(?:feat|fix|chore|perf|refactor|docs|style|test|ci|build|revert)(?:\([^)]+\))?: (.+)'
kind = "text"
optional = true

[[expect.required_calls]]
service = "github"

[[expect.forbidden_calls]]
service = "sentry"
method = "PUT"

[[expect.forbidden_calls]]
service = "sentry"
method = "DELETE"

[[expect.forbidden_calls]]
service = "github"
method = "POST"

[[expect.forbidden_calls]]
service = "github"
method = "PATCH"

[[expect.forbidden_calls]]
service = "github"
method = "PUT"

[[solution.call]]
endpoint = "sentry"
tool = "search_issues"
arguments = { organizationSlug = "lumen-labs", projectSlugOrId = "storefront-web", query = "is:unresolved", sort = "freq", limit = 5 }

[[solution.call]]
endpoint = "github"
tool = "list_commits"
arguments = { owner = "lumen-labs", repo = "storefront", perPage = 10 }

[[solution.call]]
endpoint = "github"
tool = "get_commit"
arguments = { owner = "lumen-labs", repo = "storefront", sha = "9f1c2ab7e0d4c3b2a1908f7e6d5c4b3a2f1e0d9c" }

[[solution.call]]
endpoint = "github"
tool = "pull_request_read"
arguments = { method = "get", owner = "lumen-labs", repo = "storefront", pullNumber = 57 }

[solution]
answer = "Issue STOREFRONT-WEB-7Q first appeared in release storefront@5.2.0. It was introduced by PR #57, authored by Sofia Alvarez."
