[scenario]
id = "ops/multi/pagerduty-sentry-github-issue"
title = "Turn a production checkout page into a GitHub issue with its Sentry error"
now = "2026-10-20T16:00:00Z"
seed = "ops-multi-pagerduty-sentry-github-issue"
services = ["pagerduty", "sentry", "github"]
tags = ["write", "multi-service", "pagerduty", "sentry", "github", "disambiguation"]
timeout_sec = 900

[scenario.family]
schema_version = 1
primary = "entity_ambiguity"
secondary = ["cross_system_identity"]
dependency_depth = 3
rationale = "Incident 4810 has staging twin 4811 with the same title; Sentry CHECKOUT-API-3F shares its pool-timeout title with PAYMENTS-WORKER-1K; issue title must bind to the checkout-api create_order issue and body to 4810."

# PagerDuty: #4810 (Q7CHKAP15PCT1D, checkout-api, production) "Checkout error rate above 5%"
# on POST /api/orders/; #4811 (Q8CHKSTG5PCT2F) is its staging twin. Sentry: the production
# error on that endpoint is CHECKOUT-API-3F (OperationalError: could not obtain connection from
# pool within 5.0s, culprit checkout.views.orders in create_order). Look-alikes:
# PAYMENTS-WORKER-1K (same title, other project, more events; GitHub payments-worker#88 tracks
# it) and CHECKOUT-API-3C (tracked in checkout#207). The new GitHub issue and PagerDuty note are
# new records whose identities the services emit; the note must cite the actual issue number
# the GitHub service emitted, never a predicted one. Local ticket and note records are not
# evidence that any hosted notification was delivered.
[expect]
version = 2
audit_history = true

[[expect.records]]
selector = { collection = "/services/github/issues", created = true }
equals = 1

[[expect.records]]
selector = { collection = "/services/github/issues", key_prefix = "lumen-labs/checkout#", created = true, field_patterns = { "/title" = "^CHECKOUT-API-3F: \\S" } }
equals = 1
fields = { "/state" = "open", "/user" = "hana", "/assignees" = [] }
optional_fields = { "/locked" = false, "/milestone" = "", "/type" = "", "/parent" = "" }
null_fields = ["/closed_at"]

[expect.records.reviewed_text."/title"]
requirement = "Start the title with the Sentry short ID of the checkout-api issue behind the page. The request asks for nothing else of the title, so no particular wording is required after it."
mentions = ["^${short_id}"]

[expect.records.reviewed_text."/title".bound]
examples = [
  "${short_id}: OperationalError: could not obtain connection from pool within 5.0s",
  "${short_id}: OperationalError: could not obtain connection from pool",
  "${short_id}: could not obtain connection from pool within 5.0s",
  "${short_id}: could not obtain connection from pool",
  "${short_id}: Checkout API OperationalError: could not obtain connection from pool within 5.0s",
  "${short_id}: OperationalError in create_order: could not obtain connection from pool within 5.0s",
  "${short_id}: could not obtain connection from pool in create_order",
  "${short_id}: Checkout order creation fails with a database connection pool timeout",
]

[expect.records.reviewed_text."/title".bound.identities.short_id]
selector = { collection = "/services/sentry/issues", matching = { project = "checkout-api", culprit = "checkout.views.orders in create_order" } }
field = "/shortId"

[expect.records.reviewed_text."/body"]
requirement = "Include the number of the production PagerDuty incident, the Sentry culprit checkout.views.orders in create_order and the error message could not obtain connection from pool within 5.0s, as the tools return them. The Sentry short ID, event counts and the endpoint are optional context."
mentions = ["${incident_number}", "checkout.views.orders in create_order", "could not obtain connection from pool within 5.0s"]

# The instruction asks the description for the incident number, the culprit and the error
# message only; the Sentry short ID is required in the title. It is therefore a literal here,
# not a source identity every description must repeat.
[expect.records.reviewed_text."/body".bound]
examples = [
  "PagerDuty incident #${incident_number} (Checkout error rate above 5%, production).\n\nSentry: CHECKOUT-API-3F\nCulprit: checkout.views.orders in create_order\nError: OperationalError: could not obtain connection from pool within 5.0s\nEndpoint: POST /api/orders/ (1,842 events, 611 users)",
  "PagerDuty incident #${incident_number} (Checkout error rate above 5%, production).\n\nSentry: CHECKOUT-API-3F\nCulprit: checkout.views.orders in create_order\nError: OperationalError: could not obtain connection from pool within 5.0s",
  "PagerDuty incident #${incident_number}\nSentry: CHECKOUT-API-3F\nCulprit: checkout.views.orders in create_order\nError: OperationalError: could not obtain connection from pool within 5.0s",
  "PagerDuty incident #${incident_number}\nSentry issue: CHECKOUT-API-3F\nCulprit: checkout.views.orders in create_order\nError message: OperationalError: could not obtain connection from pool within 5.0s",
  "PagerDuty incident ${incident_number}\nSentry: CHECKOUT-API-3F\nCulprit: checkout.views.orders in create_order\nError: OperationalError: could not obtain connection from pool within 5.0s",
  "PagerDuty incident ${incident_number}\nSentry issue: CHECKOUT-API-3F\nCulprit: checkout.views.orders in create_order\nError message: OperationalError: could not obtain connection from pool within 5.0s",
  "Incident: PagerDuty #${incident_number}\nSentry issue: CHECKOUT-API-3F\nCulprit: checkout.views.orders in create_order\nError: OperationalError: could not obtain connection from pool within 5.0s",
]

[expect.records.reviewed_text."/body".bound.identities.incident_number]
selector = { collection = "/services/pagerduty/incidents", matching = { id = "Q7CHKAP15PCT1D", service = { id = "PSVCHKA" } } }
field = "/incident_number"

[[expect.records]]
selector = { collection = "/services/pagerduty/notes", created = true }
equals = 1

[[expect.records]]
selector = { collection = "/services/pagerduty/notes", key_prefix = "Q7CHKAP15PCT1D/", created = true, field_patterns = { "/content" = "[0-9]" } }
equals = 1
fields = { "/user" = { id = "PLWEBR5", type = "user_reference" } }

[expect.records.reviewed_text."/content"]
requirement = "Give the number of the GitHub issue that was actually opened in lumen-labs/checkout for this incident, as the GitHub service emitted it and written as an issue reference. No particular wording is required."
mentions = [["#${issue_number}", "issue ${issue_number}", "issues/${issue_number}", "issue: ${issue_number}", "number ${issue_number}", "number: ${issue_number}"]]

[expect.records.reviewed_text."/content".bound]
examples = [
  "Tracking the fix in GitHub issue lumen-labs/checkout#${issue_number} (Sentry CHECKOUT-API-3F).",
  "Tracking the fix in GitHub issue lumen-labs/checkout#${issue_number}.",
  "Tracking the fix in GitHub issue lumen-labs/checkout#${issue_number}",
  "GitHub issue lumen-labs/checkout#${issue_number} tracks the fix (Sentry CHECKOUT-API-3F).",
  "GitHub issue lumen-labs/checkout#${issue_number} tracks the fix.",
  "GitHub issue lumen-labs/checkout#${issue_number} opened for Sentry CHECKOUT-API-3F.",
  "Opened GitHub issue lumen-labs/checkout#${issue_number} for this incident.",
  "Opened GitHub issue #${issue_number} in lumen-labs/checkout for this incident.",
  "Created GitHub issue #${issue_number} in lumen-labs/checkout for Sentry CHECKOUT-API-3F.",
  "GitHub issue lumen-labs/checkout#${issue_number}",
  "GitHub issue #${issue_number} in lumen-labs/checkout",
  "Tracking in lumen-labs/checkout#${issue_number}",
]

[expect.records.reviewed_text."/content".bound.identities.issue_number]
selector = { collection = "/services/github/issues", key_prefix = "lumen-labs/checkout#", created = true }
field = "/number"

[[expect.records]]
selector = { collection = "/services/pagerduty/incidents", matching = { id = "Q7CHKAP15PCT1D", incident_number = 4810, service = { id = "PSVCHKA" } } }
equals = 1
fields = { "/status" = "triggered" }

[[expect.records]]
selector = { collection = "/services/pagerduty/incidents", matching = { id = "Q8CHKSTG5PCT2F", incident_number = 4811, service = { id = "PSVCHKS" } } }
equals = 1
fields = { "/status" = "triggered" }

[[expect.records]]
selector = { collection = "/services/sentry/issues", matching = { shortId = "CHECKOUT-API-3F", project = "checkout-api" } }
equals = 1
fields = { "/status" = "unresolved" }

[[expect.relations]]
source = { collection = "/services/pagerduty/notes", created = true }
source_field = "/id"
target = { collection = "/services/pagerduty/notes", key_prefix = "Q7CHKAP15PCT1D/", created = true }
target_field = "/id"
kind = "bijection"

[[expect.relations]]
source = { collection = "/services/pagerduty/notes", created = true }
source_field = "/user/id"
target = { collection = "/services/pagerduty/account", key_prefix = "account" }
target_field = "/user_id"
kind = "foreign_key"

[[expect.ordering]]
prerequisite = { selector = { collection = "/services/github/issues", key_prefix = "lumen-labs/checkout#", created = true }, field = "/state", equals = "open" }
action = { selector = { collection = "/services/pagerduty/notes", key_prefix = "Q7CHKAP15PCT1D/", created = true }, field = "/content", nonempty_text = true }

[expect.preservation]
allow = [
  { pointer = "/services/github/issues/*", kind = "create", matching = { user = "hana", state = "open", assignees = [] }, field_patterns = { "/title" = "^CHECKOUT-API-3F: \\S" }, cause = { service = "github", methods = ["POST", "PATCH"], path_regex = "^(/api/v3/repos/lumen-labs/checkout/issues(/[0-9]+)?|/api/graphql)$" } },
  { pointer = "/services/pagerduty/notes/*", kind = "create", matching = { user = { id = "PLWEBR5", type = "user_reference" } }, field_patterns = { "/content" = "[0-9]" }, references = [{ source_field = "/user/id", target = { collection = "/services/pagerduty/account", key_prefix = "account" }, target_field = "/user_id" }], cause = { service = "pagerduty", methods = ["POST"], path_regex = "^/incidents/Q7CHKAP15PCT1D/notes$" } },
  { pointer = "/services/pagerduty/log_entries/*", kind = "create", matching = { type = "annotate_log_entry", incident = { id = "Q7CHKAP15PCT1D" }, service = { id = "PSVCHKA" } }, references = [{ source_field = "/agent/id", target = { collection = "/services/pagerduty/account", key_prefix = "account" }, target_field = "/user_id" }], cause = { service = "pagerduty", methods = ["POST"], path_regex = "^/incidents/Q7CHKAP15PCT1D/notes$" } },
  { pointer = "/services/pagerduty/incidents/Q7CHKAP15PCT1D/updated_at", cause = { service = "pagerduty", methods = ["POST"], path_regex = "^/incidents/Q7CHKAP15PCT1D/notes$" } },
]


[[solution.call]]
endpoint = "pagerduty"
tool = "list_incidents"
arguments = { statuses = ["triggered", "acknowledged"] }

[[solution.call]]
endpoint = "pagerduty"
tool = "get_incident"
arguments = { incident_id = "Q7CHKAP15PCT1D" }

[[solution.call]]
endpoint = "sentry"
tool = "search_issues"
arguments = { organizationSlug = "lumen-labs", projectSlugOrId = "checkout-api", query = "is:unresolved", sort = "freq", limit = 5 }

[[solution.call]]
endpoint = "github"
tool = "issue_write"
arguments = { method = "create", owner = "lumen-labs", repo = "checkout", title = "CHECKOUT-API-3F: OperationalError: could not obtain connection from pool within 5.0s", body = "PagerDuty incident #4810 (Checkout error rate above 5%, production).\n\nSentry: CHECKOUT-API-3F\nCulprit: checkout.views.orders in create_order\nError: OperationalError: could not obtain connection from pool within 5.0s\nEndpoint: POST /api/orders/ (1,842 events, 611 users)" }

[[solution.call]]
endpoint = "github"
tool = "list_issues"
arguments = { owner = "lumen-labs", repo = "checkout", state = "OPEN", orderBy = "CREATED_AT", direction = "DESC", perPage = 10 }

[[solution.call.capture]]
name = "issue_number"
pointer = "/content/0/text"
json_pointer = "/issues"
select = { matching = { title = "CHECKOUT-API-3F: OperationalError: could not obtain connection from pool within 5.0s" }, pointer = "/number" }
constraint = { type = "integer", minimum = 1 }

[[solution.call]]
endpoint = "pagerduty"
tool = "add_note_to_incident"
template = true
arguments = { incident_id = "Q7CHKAP15PCT1D", note = "Tracking the fix in GitHub issue lumen-labs/checkout#${issue_number} (Sentry CHECKOUT-API-3F)." }
