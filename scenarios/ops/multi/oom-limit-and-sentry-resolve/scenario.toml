[scenario]
id = "ops/multi/oom-limit-and-sentry-resolve"
title = "Raise the OOM-killed workload's memory limit and resolve its Sentry worker-lost issue"
now = "2026-10-21T03:15:00Z"
seed = "ops-multi-oom-limit-and-sentry-resolve"
services = ["kubernetes", "sentry"]
tags = ["write", "multi-service", "kubernetes", "sentry", "disambiguation"]
timeout_sec = 900

[expect]
version = 2
audit_history = true

[[expect.records]]
selector = { collection = "/services/kubernetes/deployments.apps/analytics~1report-builder/spec/template/spec/containers", identity_field = "/name", matching = { name = "report-builder" } }
equals = 1
quantity_fields = { "/resources/limits/memory" = "1Gi" }

[[expect.records]]
selector = { collection = "/services/sentry/issues", matching = { shortId = "REPORT-BUILDER-4T", id = "6184422318", project = "report-builder" } }
equals = 1
fields = { "/status" = "resolved" }
null_fields = ["/substatus"]
optional_choices = { "/statusDetails/inNextRelease" = [false] }

[[expect.ordering]]
prerequisite = { selector = { collection = "/services/kubernetes/deployments.apps/analytics~1report-builder/spec/template/spec/containers", identity_field = "/name", matching = { name = "report-builder" } }, field = "/resources/limits/memory", quantity_equals = "1Gi" }
action = { selector = { collection = "/services/sentry/issues", matching = { shortId = "REPORT-BUILDER-4T", id = "6184422318" } }, field = "/status", equals = "resolved" }

[[expect.preservation.allow]]
pointer = "/services/kubernetes/deployments.apps/analytics~1report-builder/apiVersion"
matching = { apiVersion = "apps/v1", kind = "Deployment" }
cause = { service = "kubernetes", methods = ["PATCH", "PUT"], path_regex = "^/apis/apps/v1/namespaces/analytics/deployments/report-builder$" }

[[expect.preservation.allow]]
pointer = "/services/kubernetes/deployments.apps/analytics~1report-builder/kind"
matching = { apiVersion = "apps/v1", kind = "Deployment" }
cause = { service = "kubernetes", methods = ["PATCH", "PUT"], path_regex = "^/apis/apps/v1/namespaces/analytics/deployments/report-builder$" }

[[expect.preservation.allow]]
pointer = "/services/kubernetes/deployments.apps/analytics~1report-builder/spec/template/spec/containers/*/resources/limits/memory"
