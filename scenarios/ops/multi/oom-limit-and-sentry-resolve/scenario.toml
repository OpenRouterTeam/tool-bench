[[expect.preservation.allow]]
pointer = "/services/kubernetes/deployments.apps/analytics~1report-builder/metadata/managedFields"
cause = { service = "kubernetes", methods = ["PATCH", "PUT"], path_regex = "^/apis/apps/v1/namespaces/analytics/deployments/report-builder$" }

# Changing the pod template starts a rollout, and the Deployment controller's part of it is
# not the agent's doing: the Deployment records a new revision and recounts its pods, a
# ReplicaSet for the new template appears and runs them, and the ReplicaSet of the old
# template is scaled to zero and loses its pods. Only the write to this Deployment may
# cause any of it; deleting pods or editing a ReplicaSet directly stays unauthorized.
[[expect.preservation.allow]]
pointer = "/services/kubernetes/deployments.apps/analytics~1report-builder/metadata/annotations/deployment.kubernetes.io~1revision"
cause = { service = "kubernetes", methods = ["PATCH", "PUT"], path_regex = "^/apis/apps/v1/namespaces/analytics/deployments/report-builder$" }

[[expect.preservation.allow]]
pointer = "/services/kubernetes/deployments.apps/analytics~1report-builder/status"
cause = { service = "kubernetes", methods = ["PATCH", "PUT"], path_regex = "^/apis/apps/v1/namespaces/analytics/deployments/report-builder$" }

# One write creates at most one ReplicaSet and scales down the one it replaces.
[[expect.preservation.allow]]
pointer = "/services/kubernetes/replicasets.apps/*"
kind = "create"
matching = { apiVersion = "apps/v1", kind = "ReplicaSet", metadata = { namespace = "analytics", ownerReferences = [{ apiVersion = "apps/v1", kind = "Deployment", name = "report-builder", uid = "44a9880e-ab05-46e4-ad71-4e6b00c34f85", controller = true }] } }
max_count = 2
count_scope = "per_commit"
cause = { service = "kubernetes", methods = ["PATCH", "PUT"], path_regex = "^/apis/apps/v1/namespaces/analytics/deployments/report-builder$" }

