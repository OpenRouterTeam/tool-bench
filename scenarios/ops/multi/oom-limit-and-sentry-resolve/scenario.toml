cause = { service = "sentry", methods = ["PUT"], path_regex = "^/api/0/organizations/(lumen-labs|1180274)/issues/[^/]+/$" }

[[solution.call]]
endpoint = "kubernetes"
tool = "pods_list_in_namespace"
arguments = { namespace = "analytics" }

[[solution.call]]
endpoint = "kubernetes"
tool = "pods_get"
arguments = { namespace = "analytics", name = "report-builder-t2h6vx4p7r-q8j52" }

[[solution.call]]
endpoint = "kubernetes"
tool = "resources_create_or_update"
arguments = { resource = """
apiVersion: apps/v1
kind: Deployment
metadata:
  name: report-builder
  namespace: analytics
spec:
  template:
    spec:
      containers:
        - name: report-builder
          resources:
            limits:
              memory: 1Gi
""" }

[[solution.call]]
endpoint = "sentry"
tool = "search_issues"
arguments = { organizationSlug = "lumen-labs", projectSlugOrId = "report-builder", query = "is:unresolved WorkerLostError" }

[[solution.call]]
endpoint = "sentry"
tool = "update_issue"
arguments = { organizationSlug = "lumen-labs", issueId = "REPORT-BUILDER-4T", status = "resolved" }
