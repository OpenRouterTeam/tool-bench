[scenario]
id = "ops/multi/crashloop-oncall-lookup"
title = "Find the crash-looping production pod, its error, and who is on call for it"
now = "2026-10-30T14:00:00Z"
seed = "ops-multi-crashloop-oncall-lookup"
services = ["kubernetes", "pagerduty"]
tags = ["lookup", "multi-service", "kubernetes", "pagerduty", "disambiguation"]
timeout_sec = 900

[scenario.family]
schema_version = 1
primary = "entity_ambiguity"
secondary = ["stale_state"]
dependency_depth = 2
rationale = "payments pod ledger-worker-...-gdg8j crash-loops on password auth while payments-staging ...-v45ss crash-loops on a config panic; Payments policy has Priya Raman on an override today over scheduled Riya Patel."

# Kubernetes: ledger-worker-zx4mrndj8b-gdg8j in `payments` is in CrashLoopBackOff because the
# ledger DB rejects its password. Decoy: payments-staging/ledger-worker-c64m9bbw8-v45ss also
# crash-loops (config panic, 31 restarts). PagerDuty: ledger-worker uses the "Payments" policy;
# Riya Patel is scheduled but Priya Raman has an override for today; level 2 is Marcus Chen.
# Look-alike policies: "Payments Gateway (Legacy)" (Jordan Alvarez), "Payouts" (Riya Patel).
[expect]
version = 2
audit_history = true

[expect.answer]
 [expect.answer.record_facts]
 requirement = "Name the crash-looping production pod, its error from the logs, and who is on call (level 1 and 2) for its service."
 mode = "statements"
 order = ["oncall1", "oncall2"]
rejected = ["${oncall2} is on call and ${oncall1} is the backup"]
 context = [
   "covering Riya Patel via a schedule override",
   "covering Riya Patel",
   "override covering Riya Patel",
   "(override for Riya Patel)",
 ]

 [expect.answer.record_facts.selector]
 collection = "/services/kubernetes/pods"
 matching = { metadata = { namespace = "payments" }, status = { containerStatuses = [{ state = { waiting = { reason = "CrashLoopBackOff" } } }] } }

 # Pod logs joined by key prefix
 [expect.answer.record_facts.related.logs]
 collection = "/services/kubernetes/pod_logs"
 on = { "/_key" = "/_key" }
 capture_from = { "/_key" = "^(.+)$" }
 capture = { "/_key" = "^(.+)/" }

 # PD escalation policy for Payments
 [expect.answer.record_facts.related.policy]
 collection = "/services/pagerduty/escalation_policies"
 filter = { matching = { "/name" = "Payments" } }

 [expect.answer.record_facts.related.schedule]
 from = "policy"
 collection = "/services/pagerduty/schedules"
 on = { "/id" = "/escalation_rules/0/targets/0/id" }
 pick = { oncall = { overrides = "/services/pagerduty/overrides" } }

 [expect.answer.record_facts.related.level1]
 from = "schedule"
 collection = "/services/pagerduty/users"
 on = { "/id" = "/id" }

 [expect.answer.record_facts.related.level2]
 from = "policy"
 collection = "/services/pagerduty/users"
 on = { "/id" = "/escalation_rules/1/targets/0/id" }

 [expect.answer.record_facts.facts.pod]
 field = "/metadata/name"
 kind = "identifier"

 [expect.answer.record_facts.facts.error]
 record = "logs"
 field = "/current/2"
 kind = "text"
 capture = 'pq: (password authentication failed[^"]*)'

 [expect.answer.record_facts.facts.oncall1]
 record = "level1"
 field = "/name"
 kind = "text"

 [expect.answer.record_facts.facts.oncall2]
 record = "level2"
 field = "/name"
 kind = "text"

[[expect.required_calls]]
service = "kubernetes"
method = "GET"
path = "/api/v1/namespaces/payments/pods/ledger-worker-zx4mrndj8b-gdg8j/log"

[[expect.forbidden_calls]]
service = "kubernetes"
method = "DELETE"

[[expect.forbidden_calls]]
service = "kubernetes"
method = "PATCH"

[[expect.forbidden_calls]]
service = "pagerduty"
method = "PUT"

# Analytics queries are read-only POSTs; anything else that POSTs writes.
[[expect.forbidden_calls]]
service = "pagerduty"
method = "POST"
path_regex = "^/(incidents|schedules|v3|services|teams|users|webhook_subscriptions|alert_grouping_settings|incident_workflows|status_pages)"

[[solution.call]]
endpoint = "kubernetes"
tool = "pods_list_in_namespace"
arguments = { namespace = "payments" }

[[solution.call]]
endpoint = "kubernetes"
tool = "pods_log"
arguments = { namespace = "payments", name = "ledger-worker-zx4mrndj8b-gdg8j", previous = true }

[[solution.call]]
endpoint = "pagerduty"
tool = "list_services"
arguments = { query = "ledger" }

[[solution.call]]
endpoint = "pagerduty"
tool = "list_oncalls"
arguments = { escalation_policy_ids = ["PEPPAY1"] }

[solution]
answer = "Pod ledger-worker-zx4mrndj8b-gdg8j, error: password authentication failed for user. On call: Priya Raman, backup Marcus Chen."
