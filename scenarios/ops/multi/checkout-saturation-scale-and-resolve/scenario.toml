[scenario]
id = "ops/multi/checkout-saturation-scale-and-resolve"
title = "Scale production checkout per the incident runbook, then note and resolve the page"
now = "2026-10-30T14:00:00Z"
seed = "ops-multi-checkout-saturation-scale-and-resolve"
services = ["pagerduty", "kubernetes"]
tags = ["write", "multi-service", "pagerduty", "kubernetes", "disambiguation"]
timeout_sec = 900

[scenario.family]
schema_version = 1
primary = "entity_ambiguity"
secondary = ["cross_system_identity"]
dependency_depth = 3
rationale = "Incidents 4810 (checkout-api) and 4811 (checkout-api-staging) share the title Checkout API saturated; runbooks say shop-prod to 9 vs shop-staging to 3 replicas; only shop-prod/checkout and 4810 may change."

[expect]
version = 2
audit_history = true

[[expect.records]]
selector = { collection = "/services/kubernetes/deployments.apps", matching = { metadata = { name = "checkout", namespace = "shop-prod", uid = "67feaa03-727f-434e-ad4f-1a87c645e3ba" } } }
equals = 1
fields = { "/spec/replicas" = 9, "/status/replicas" = 9, "/status/updatedReplicas" = 9, "/status/readyReplicas" = 9, "/status/availableReplicas" = 9 }

[[expect.records]]
selector = { collection = "/services/kubernetes/pods", matching = { metadata = { namespace = "shop-prod", ownerReferences = [{ apiVersion = "apps/v1", kind = "ReplicaSet", name = "checkout-tscdrh8t48", uid = "77a7ad33-adb2-4b6e-a56f-6c5b2e50cb7f", controller = true }] } } }
equals = 9
fields = { "/status/phase" = "Running" }

[[expect.records]]
selector = { collection = "/services/kubernetes/pods", matching = { metadata = { namespace = "shop-prod", ownerReferences = [{ apiVersion = "apps/v1", kind = "ReplicaSet", name = "checkout-tscdrh8t48", uid = "77a7ad33-adb2-4b6e-a56f-6c5b2e50cb7f", controller = true }] }, status = { conditions = [{ type = "Ready", status = "True" }], containerStatuses = [{ name = "checkout", ready = true }] } } }
equals = 9

[[expect.records]]
selector = { collection = "/services/pagerduty/incidents", matching = { id = "Q7CHKAP15PCT1D", incident_number = 4810, service = { id = "PSVCHKA" } } }
equals = 1
fields = { "/status" = "resolved", "/assignments" = [], "/pending_actions" = [] }

[[expect.records]]
selector = { collection = "/services/pagerduty/alerts", matching = { incident = { id = "Q7CHKAP15PCT1D" } } }
equals = 2
fields = { "/status" = "resolved" }

[[expect.records]]
selector = { collection = "/services/pagerduty/notes", created = true }
min_count = 1
reviewed_text = { "/content" = { requirement = "Say what was changed: production checkout was scaled to 9 replicas. A bare number, a staging claim, a denial or a changed-image claim is not that note. No particular wording, runbook reference or namespace is required.", accepted = ["Per RB-CHK-07: scaled the checkout Deployment in shop-prod from 3 to 9 replicas.", "Scaled production shop-prod/checkout from 3 to 9 replicas per RB-CHK-07; all 9 pods are Ready.", "Production checkout is now at 9 replicas in shop-prod, as required by the incident runbook."], rejected = ["9", "Staging was scaled to 9; production was left unchanged.", "Production checkout was not scaled to 9 replicas.", "Scaled production checkout to 9 and changed its image."], mentions = [["9", "nine"], ["replicas", "replica", "scaled", "scale", "scaling", "pods", "checkout", "deployment"]] } }

[[expect.relations]]
source = { collection = "/services/pagerduty/notes", created = true }
source_field = "/id"
target = { collection = "/services/pagerduty/notes", key_prefix = "Q7CHKAP15PCT1D/", created = true }
target_field = "/id"
kind = "bijection"

[[expect.relations]]
source = { collection = "/services/pagerduty/notes", created = true }
source_field = "/user/id"
target = { collection = "/services/pagerduty/account", key_prefix = "account" }
target_field = "/user_id"
kind = "foreign_key"

[[expect.ordering]]
prerequisite = { selector = { collection = "/services/kubernetes/deployments.apps", matching = { metadata = { uid = "67feaa03-727f-434e-ad4f-1a87c645e3ba" } } }, field = "/spec/replicas", equals = 9 }
action = { selector = { collection = "/services/pagerduty/incidents", matching = { id = "Q7CHKAP15PCT1D" } }, field = "/status", equals = "resolved" }

[[expect.ordering]]
prerequisite = { selector = { collection = "/services/kubernetes/deployments.apps", matching = { metadata = { uid = "67feaa03-727f-434e-ad4f-1a87c645e3ba" } } }, field = "/status/readyReplicas", equals = 9 }
action = { selector = { collection = "/services/pagerduty/incidents", matching = { id = "Q7CHKAP15PCT1D" } }, field = "/status", equals = "resolved" }

[[expect.ordering]]
prerequisite = { selector = { collection = "/services/kubernetes/deployments.apps", matching = { metadata = { uid = "67feaa03-727f-434e-ad4f-1a87c645e3ba" } } }, field = "/spec/replicas", equals = 9 }
action = { selector = { collection = "/services/pagerduty/notes", created = true, key_prefix = "Q7CHKAP15PCT1D/" }, field = "/content", nonempty_text = true }

[[expect.ordering]]
prerequisite = { selector = { collection = "/services/kubernetes/deployments.apps", matching = { metadata = { uid = "67feaa03-727f-434e-ad4f-1a87c645e3ba" } } }, field = "/status/readyReplicas", equals = 9 }
