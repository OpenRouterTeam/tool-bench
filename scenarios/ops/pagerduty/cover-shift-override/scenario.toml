[scenario]
id = "ops/pagerduty/cover-shift-override"
title = "Create a schedule override so a teammate covers part of a shift"
now = "2026-10-30T14:00:00Z"
seed = "ops-pagerduty-cover-shift-override"
services = ["pagerduty"]
tags = ["write", "single-service", "pagerduty"]
timeout_sec = 900

[expect]
version = 2
audit_history = true

[[expect.records]]
selector = { collection = "/services/pagerduty/overrides", created = true }
min_count = 1
fields = { "/user/id" = "PJ0RLEE" }
interval_coverage = { start_field = "/start", end_field = "/end", start = "2026-10-31T09:00:00Z", end = "2026-10-31T17:00:00Z" }

[[expect.relations]]
source = { collection = "/services/pagerduty/overrides", created = true }
source_field = "/id"
target = { collection = "/services/pagerduty/overrides", key_prefix = "PSPLTPR/", created = true }
target_field = "/id"
kind = "bijection"

[[expect.relations]]
source = { collection = "/services/pagerduty/overrides", created = true }
source_field = "/user/id"
target = { collection = "/services/pagerduty/users", matching = { name = "Jordan Lee", email = "jordan.lee@tidewater.io", teams = [{ id = "PTPLATF" }] } }
target_field = "/id"
kind = "foreign_key"

[expect.preservation]
allow = [
  { pointer = "/services/pagerduty/overrides/*", kind = "create", matching = { user = { id = "PJ0RLEE", type = "user_reference" } }, max_count = "all_matching", cause = { service = "pagerduty", methods = ["POST"], path_regex = "^/schedules/PSPLTPR/overrides$" } },
]

[[solution.call]]
endpoint = "pagerduty"
tool = "get_user_data"
arguments = {}

[[solution.call]]
endpoint = "pagerduty"
tool = "list_schedules"
arguments = { query_model = { query = "Platform" } }

[[solution.call]]
endpoint = "pagerduty"
tool = "list_users"
arguments = { query = "Jordan" }

[[solution.call]]
endpoint = "pagerduty"
tool = "create_schedule_override"
arguments = { schedule_id = "PSPLTPR", override_request = { overrides = [{ start = "2026-10-31T09:00:00Z", end = "2026-10-31T17:00:00Z", user_id = "PJ0RLEE" }] } }
