[scenario]
id = "ops/pagerduty/resolve-prod-checkout"
title = "Resolve the production checkout incident, not its staging twin"
now = "2026-10-30T14:00:00Z"
seed = "ops-pagerduty-resolve-prod-checkout"
services = ["pagerduty"]
tags = ["write", "single-service", "pagerduty", "disambiguation"]
timeout_sec = 900

[scenario.family]
schema_version = 1
primary = "entity_ambiguity"
secondary = []
dependency_depth = 2
rationale = "Open incidents 4810 (checkout-api) and 4811 (checkout-api-staging) are both titled Checkout error rate above 5%, as are resolved 4752 and 4655; only 4810 and its two alerts may be resolved."

[expect]
version = 2
audit_history = true

[[expect.records]]
selector = { collection = "/services/pagerduty/incidents", matching = { id = "Q7CHKAP15PCT1D", incident_number = 4810, service = { id = "PSVCHKA" } } }
equals = 1
fields = { "/status" = "resolved", "/assignments" = [], "/pending_actions" = [] }

[[expect.records]]
selector = { collection = "/services/pagerduty/alerts", matching = { incident = { id = "Q7CHKAP15PCT1D" } } }
equals = 2
fields = { "/status" = "resolved" }

[[expect.records]]
selector = { collection = "/services/pagerduty/notes", created = true }
min_count = 1
reviewed_text = { "/content" = { requirement = "The complete incident note must state that rolling back release 2026.10.29.3 resolved this production incident. Do not merely mention the release, negate the rollback or resolution, claim a roll-forward, or claim that the assistant performed the rollback.", accepted = ["Resolved by rolling back release 2026.10.29.3.", "Rolling back release 2026.10.29.3 resolved this incident.", "Production checkout recovered after release 2026.10.29.3 was rolled back; the incident is resolved."], rejected = ["2026.10.29.3", "Release 2026.10.29.3 was not rolled back; this incident is still broken.", "Resolved by rolling forward release 2026.10.29.3.", "I rolled back release 2026.10.29.3 and resolved this incident."] } }

[[expect.relations]]
source = { collection = "/services/pagerduty/notes", created = true }
source_field = "/id"
target = { collection = "/services/pagerduty/notes", key_prefix = "Q7CHKAP15PCT1D/", created = true }
target_field = "/id"
kind = "bijection"

[[expect.relations]]
source = { collection = "/services/pagerduty/notes", created = true }
source_field = "/user/id"
target = { collection = "/services/pagerduty/account", key_prefix = "account" }
target_field = "/user_id"
kind = "foreign_key"

[expect.preservation]
allow = [
  { pointer = "/services/pagerduty/incidents/Q7CHKAP15PCT1D/status", cause = { service = "pagerduty", methods = ["PUT"], path_regex = "^/incidents(/Q7CHKAP15PCT1D)?$" } },
  { pointer = "/services/pagerduty/incidents/Q7CHKAP15PCT1D/resolved_at", matching = { status = "resolved" }, cause = { service = "pagerduty", methods = ["PUT"], path_regex = "^/incidents(/Q7CHKAP15PCT1D)?$" } },
  { pointer = "/services/pagerduty/incidents/Q7CHKAP15PCT1D/assignments", matching = { status = "resolved", assignments = [] }, cause = { service = "pagerduty", methods = ["PUT"], path_regex = "^/incidents(/Q7CHKAP15PCT1D)?$" } },
  { pointer = "/services/pagerduty/incidents/Q7CHKAP15PCT1D/pending_actions", matching = { status = "resolved", pending_actions = [] }, cause = { service = "pagerduty", methods = ["PUT"], path_regex = "^/incidents(/Q7CHKAP15PCT1D)?$" } },
  { pointer = "/services/pagerduty/incidents/Q7CHKAP15PCT1D/last_status_change_at", cause = { service = "pagerduty", methods = ["PUT"], path_regex = "^/incidents(/Q7CHKAP15PCT1D)?$" } },
  { pointer = "/services/pagerduty/incidents/Q7CHKAP15PCT1D/last_status_change_by", references = [{ source_field = "/last_status_change_by/id", target = { collection = "/services/pagerduty/account", key_prefix = "account" }, target_field = "/user_id" }], cause = { service = "pagerduty", methods = ["PUT"], path_regex = "^/incidents(/Q7CHKAP15PCT1D)?$" } },
  { pointer = "/services/pagerduty/incidents/Q7CHKAP15PCT1D/acknowledgements", kind = "append", identity_field = "/acknowledger/id", matching = { acknowledger = { id = "PLWEBR5", type = "user_reference" } }, cause = { service = "pagerduty", methods = ["PUT"], path_regex = "^/incidents(/Q7CHKAP15PCT1D)?$" } },
  { pointer = "/services/pagerduty/incidents/Q7CHKAP15PCT1D/updated_at", cause = { service = "pagerduty", methods = ["PUT", "POST"], path_regex = "^/incidents(/Q7CHKAP15PCT1D(/notes)?)?$" } },
  { pointer = "/services/pagerduty/alerts/*/status", initial_matching = { incident = { id = "Q7CHKAP15PCT1D" } }, matching = { status = "resolved" }, max_count = "all_matching", cause = { service = "pagerduty", methods = ["PUT"], path_regex = "^/incidents(/Q7CHKAP15PCT1D)?$" } },
  { pointer = "/services/pagerduty/alerts/*/resolved_at", initial_matching = { incident = { id = "Q7CHKAP15PCT1D" } }, matching = { status = "resolved" }, max_count = "all_matching", cause = { service = "pagerduty", methods = ["PUT"], path_regex = "^/incidents(/Q7CHKAP15PCT1D)?$" } },
  { pointer = "/services/pagerduty/notes/*", kind = "create", matching = { user = { type = "user_reference" } }, references = [{ source_field = "/user/id", target = { collection = "/services/pagerduty/account", key_prefix = "account" }, target_field = "/user_id" }], max_count = "all_matching", cause = { service = "pagerduty", methods = ["POST"], path_regex = "^/incidents/Q7CHKAP15PCT1D/notes$" } },
  { pointer = "/services/pagerduty/log_entries/*", kind = "create", matching = { type = "resolve_log_entry", incident = { id = "Q7CHKAP15PCT1D" }, service = { id = "PSVCHKA" } }, references = [{ source_field = "/agent/id", target = { collection = "/services/pagerduty/account", key_prefix = "account" }, target_field = "/user_id" }], max_count = "all_matching", cause = { service = "pagerduty", methods = ["PUT"], path_regex = "^/incidents(/Q7CHKAP15PCT1D)?$" } },
  { pointer = "/services/pagerduty/log_entries/*", kind = "create", matching = { type = "acknowledge_log_entry", incident = { id = "Q7CHKAP15PCT1D" }, service = { id = "PSVCHKA" } }, references = [{ source_field = "/agent/id", target = { collection = "/services/pagerduty/account", key_prefix = "account" }, target_field = "/user_id" }], max_count = "all_matching", cause = { service = "pagerduty", methods = ["PUT"], path_regex = "^/incidents(/Q7CHKAP15PCT1D)?$" } },
  { pointer = "/services/pagerduty/log_entries/*", kind = "create", matching = { type = "annotate_log_entry", incident = { id = "Q7CHKAP15PCT1D" }, service = { id = "PSVCHKA" } }, references = [{ source_field = "/agent/id", target = { collection = "/services/pagerduty/account", key_prefix = "account" }, target_field = "/user_id" }], max_count = "all_matching", cause = { service = "pagerduty", methods = ["POST"], path_regex = "^/incidents/Q7CHKAP15PCT1D/notes$" } },
]

[[solution.call]]
endpoint = "pagerduty"
tool = "list_services"
arguments = { query = "checkout" }

[[solution.call]]
endpoint = "pagerduty"
tool = "list_incidents"
arguments = { statuses = ["triggered", "acknowledged"] }

[[solution.call]]
endpoint = "pagerduty"
tool = "add_note_to_incident"
arguments = { incident_id = "Q7CHKAP15PCT1D", note = "Resolved by rolling back release 2026.10.29.3." }

[[solution.call]]
endpoint = "pagerduty"
tool = "manage_incidents"
arguments = { manage_request = { incident_ids = ["Q7CHKAP15PCT1D"], status = "resolved" } }
