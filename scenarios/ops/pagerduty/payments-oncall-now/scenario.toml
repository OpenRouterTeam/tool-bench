[scenario]
id = "ops/pagerduty/payments-oncall-now"
title = "Find who is on call for Payments right now"
now = "2026-10-30T14:00:00Z"
seed = "ops-pagerduty-payments-oncall-now"
services = ["pagerduty"]
tags = ["lookup", "single-service", "pagerduty", "disambiguation"]
timeout_sec = 900

[scenario.family]
schema_version = 1
primary = "stale_state"
secondary = ["entity_ambiguity"]
dependency_depth = 2
rationale = "Payments Primary rotation has Riya Patel this week but override PQ7OV01 puts Priya Raman on call 2026-10-30T06:00Z to 10-31T06:00Z, covering now; Payments Gateway (Legacy) and Payouts are look-alike policies."

# Riya Patel is scheduled on Payments Primary this week, but Priya Raman has an override
# covering today; level 2 is Marcus Chen. "Payments Gateway (Legacy)" (Jordan Alvarez)
# and "Payouts" (Riya Patel) are look-alike policies.
[expect]
version = 2
audit_history = true

[expect.answer]
 [expect.answer.record_facts]
 requirement = "Name the level-1 and level-2 on-call people for the Payments escalation policy right now."
 mode = "statements"
 order = ["oncall1", "oncall2"]
rejected = ["${oncall2} is on call and ${oncall1} is the backup", "${oncall2} and ${oncall1}"]
 context = [
   "covering Riya Patel via a schedule override",
   "covering Riya Patel",
   "override covering Riya Patel",
   "(override for Riya Patel)",
 ]

 [expect.answer.record_facts.selector]
 collection = "/services/pagerduty/escalation_policies"
 matching = { name = "Payments" }

 # Resolve level 1: schedule from first escalation rule target
 [expect.answer.record_facts.related.schedule]
 collection = "/services/pagerduty/schedules"
 on = { "/id" = "/escalation_rules/0/targets/0/id" }
 pick = { oncall = { overrides = "/services/pagerduty/overrides" } }

 # Join oncall user to directory
 [expect.answer.record_facts.related.level1]
 from = "schedule"
 collection = "/services/pagerduty/users"
 on = { "/id" = "/id" }

 # Level 2: direct user reference from second escalation rule
 [expect.answer.record_facts.related.level2]
 collection = "/services/pagerduty/users"
 on = { "/id" = "/escalation_rules/1/targets/0/id" }

 [expect.answer.record_facts.facts.oncall1]
 record = "level1"
 field = "/name"
 kind = "text"

 [expect.answer.record_facts.facts.oncall2]
 record = "level2"
 field = "/name"
 kind = "text"

# Analytics queries are read-only POSTs; anything else that POSTs writes.
[[expect.forbidden_calls]]
service = "pagerduty"
method = "POST"
path_regex = "^/(incidents|schedules|v3|services|teams|users|webhook_subscriptions|alert_grouping_settings|incident_workflows|status_pages)"

[[expect.forbidden_calls]]
service = "pagerduty"
method = "PUT"

[[expect.forbidden_calls]]
service = "pagerduty"
method = "DELETE"

[[solution.call]]
endpoint = "pagerduty"
tool = "list_escalation_policies"
arguments = { query = "Payments" }

[[solution.call]]
endpoint = "pagerduty"
tool = "list_oncalls"
arguments = { escalation_policy_ids = ["PEPPAY1"] }

[solution]
answer = "On call: Priya Raman, backup: Marcus Chen."
