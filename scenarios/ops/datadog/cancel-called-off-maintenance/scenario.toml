[scenario]
id = "ops/datadog/cancel-called-off-maintenance"
title = "Cancel the downtime for a called-off production maintenance"
now = "2026-10-30T10:00:00Z"
seed = "ops-datadog-cancel-called-off-maintenance"
services = ["datadog"]
tags = ["write", "single-service", "datadog", "disambiguation"]
timeout_sec = 900

[scenario.family]
schema_version = 1
primary = "entity_ambiguity"
secondary = ["stale_state"]
dependency_depth = 1
rationale = "CHG-4410 appears on downtimes 2207731 (prod, Oct 31), 2207690 (original date, already canceled) and 2207752 (staging rehearsal tonight); contract requires DELETE on 2207731 and forbids it on the five others."

[expect]
version = 2
audit_history = true

[[expect.records]]
selector = { collection = "/services/datadog/downtimes", matching = { id = 2207731 } }
equals = 1
fields = { "/disabled" = true, "/active" = false }
numeric_fields = { "/canceled" = 1793354400, "/updater_id" = 1445416 }

[[expect.required_calls]]
service = "datadog"
method = "DELETE"
path = "/api/v1/downtime/2207731"

[[expect.forbidden_calls]]
service = "datadog"
method = "DELETE"
path_regex = "^/api/v1/downtime/(2207690|2207702|2207745|2207752|2207760)$"

[expect.preservation]
allow = [
  { pointer = "/services/datadog/downtimes/2207731/canceled", matching = { id = 2207731, disabled = true, active = false }, numeric_fields = { "/canceled" = 1793354400, "/updater_id" = 1445416 }, cause = { service = "datadog", methods = ["DELETE"], path_regex = "^/api/v1/downtime/2207731$" } },
  { pointer = "/services/datadog/downtimes/2207731/disabled", matching = { id = 2207731, disabled = true, active = false }, cause = { service = "datadog", methods = ["DELETE"], path_regex = "^/api/v1/downtime/2207731$" } },
  { pointer = "/services/datadog/downtimes/2207731/active", matching = { id = 2207731, disabled = true, active = false }, cause = { service = "datadog", methods = ["DELETE"], path_regex = "^/api/v1/downtime/2207731$" } },
  { pointer = "/services/datadog/downtimes/2207731/updater_id", matching = { id = 2207731, disabled = true, active = false }, numeric_fields = { "/updater_id" = 1445416 }, cause = { service = "datadog", methods = ["DELETE"], path_regex = "^/api/v1/downtime/2207731$" } },
]

[[solution.call]]
endpoint = "datadog"
tool = "list_downtimes"
arguments = {}

[[solution.call]]
endpoint = "datadog"
tool = "cancel_downtime"
arguments = { downtimeId = 2207731 }
