[scenario]
id = "ops/datadog/schedule-replica-downtime"
title = "Schedule a downtime on the prod replication-lag monitor for a replica rebuild"
now = "2026-10-30T16:00:00Z"
seed = "ops-datadog-schedule-replica-downtime"
services = ["datadog"]
tags = ["write", "single-service", "datadog"]
timeout_sec = 900

[scenario.family]
schema_version = 1
primary = "entity_ambiguity"
secondary = []
dependency_depth = 1
rationale = "Monitors 7301 Postgres replication lag (env:prod), 7302 same name with (staging), 7304 MySQL replication lag and 7305 replica disk usage; contract requires monitor_id 7301 and forbids a downtime on 7302."

[expect]
version = 2
audit_history = true

[[expect.records]]
selector = { collection = "/services/datadog/downtimes", created = true }
equals = 1
fields = { "/monitor_id" = 7301, "/disabled" = false, "/active" = false, "/creator_id" = 1445416 }
numeric_fields = { "/start" = 1793412000, "/end" = 1793419200 }
null_fields = ["/recurrence", "/canceled", "/parent_id", "/active_child", "/updater_id"]
tag_scope = { field = "/scope", equals = { host = "pg-prod-replica-2" }, context = { selector = { collection = "/services/datadog/hosts", matching = { name = "pg-prod-replica-2" } }, field = "/tags_by_source" } }

[[expect.records]]
selector = { collection = "/services/datadog/downtimes", created = true, field_patterns = { "/message" = '(^|[^[:alnum:]_])(?i-u:CHG-5012)([^[:alnum:]_]|$)' } }
equals = 1

[[expect.relations]]
source = { collection = "/services/datadog/downtimes", created = true }
source_field = "/monitor_id"
target = { collection = "/services/datadog/monitors", matching = { name = "Postgres replication lag", tags = ["env:prod", "service:postgres"] } }
target_field = "/id"
kind = "foreign_key"

[[expect.required_calls]]
service = "datadog"
method = "POST"
path = "/api/v1/downtime"
body = { monitor_id = 7301 }

[[expect.forbidden_calls]]
service = "datadog"
method = "DELETE"

[[expect.forbidden_calls]]
service = "datadog"
method = "POST"
path = "/api/v1/downtime"
body = { monitor_id = 7302 }

[expect.preservation]
allow = [
  { pointer = "/services/datadog/downtimes/*", kind = "create", matching = { monitor_id = 7301, disabled = false, active = false, creator_id = 1445416 }, numeric_fields = { "/start" = 1793412000, "/end" = 1793419200 }, field_patterns = { "/message" = '(^|[^[:alnum:]_])(?i-u:CHG-5012)([^[:alnum:]_]|$)' }, cause = { service = "datadog", methods = ["POST"], path_regex = "^/api/v1/downtime$" } },
]

[[solution.call]]
endpoint = "datadog"
tool = "get_monitors"
arguments = { name = "replication lag" }

[[solution.call]]
endpoint = "datadog"
tool = "schedule_downtime"
arguments = { scope = "host:pg-prod-replica-2", monitorId = 7301, start = 1793412000, end = 1793419200, message = "Rebuilding replica pg-prod-replica-2 (CHG-5012)", timezone = "UTC" }
