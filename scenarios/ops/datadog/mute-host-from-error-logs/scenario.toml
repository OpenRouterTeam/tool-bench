[scenario]
id = "ops/datadog/mute-host-from-error-logs"
title = "Find the prod checkout host emitting connection resets in the logs and mute it"
now = "2026-10-30T14:30:00Z"
seed = "ops-datadog-mute-host-from-error-logs"
services = ["datadog"]
tags = ["write", "single-service", "datadog", "disambiguation"]
timeout_sec = 900

[scenario.family]
schema_version = 1
primary = "entity_ambiguity"
secondary = []
dependency_depth = 1
rationale = "Reset errors: 12 on checkout-api-prod-1b, 3 on checkout-api-staging-1b, 1 on prod-1a at 12:41, 1 on payments-api-prod-1a; checkout-worker-prod-1b errors differ; contract forbids muting those five hosts."

[expect]
version = 2
audit_history = true

[[expect.records]]
selector = { collection = "/services/datadog/hosts", matching = { name = "checkout-api-prod-1b" } }
equals = 1
fields = { "/is_muted" = true }
numeric_fields = { "/mute_timeout" = 1793383200 }

[[expect.records]]
selector = { collection = "/services/datadog/host_mutes", created = true }
equals = 1
fields = { "/hostname" = "checkout-api-prod-1b" }
numeric_fields = { "/end" = 1793383200 }
timestamp_fields = { "/muted_at" = "2026-10-30T14:30:00Z" }

[[expect.records]]
selector = { collection = "/services/datadog/host_mutes", created = true, field_patterns = { "/message" = '(^|[^[:alnum:]_])(?i-u:INC-2291)([^[:alnum:]_]|$)' } }
equals = 1

[[expect.relations]]
source = { collection = "/services/datadog/host_mutes", created = true }
source_field = "/hostname"
target = { collection = "/services/datadog/hosts", matching = { name = "checkout-api-prod-1b" } }
target_field = "/name"
kind = "foreign_key"

[[expect.information]]
prerequisite = { service = "datadog", method = "POST", path = "/api/v2/logs/events/search" }
response_field = "/data"
source = { collection = "/services/datadog/logs", matching = { type = "log", attributes = { host = "checkout-api-prod-1b", service = "checkout-api", status = "error", attributes = { env = "prod" } } }, field_patterns = { "/attributes/message" = 'connection reset by peer' } }
window = { field = "/attributes/timestamp", start = "2026-10-30T13:00:00Z", end = "2026-10-30T14:30:00Z" }
action = { service = "datadog", method = "POST", path = "/api/v1/host/checkout-api-prod-1b/mute" }

[[expect.required_calls]]
service = "datadog"
method = "POST"
path = "/api/v1/host/checkout-api-prod-1b/mute"

[[expect.forbidden_calls]]
service = "datadog"
method = "POST"
path_regex = "^/api/v1/host/[^/]+/unmute$"

[[expect.forbidden_calls]]
service = "datadog"
method = "POST"
path_regex = "^/api/v1/host/(checkout-api-prod-1a|checkout-api-prod-1c|checkout-api-staging-1b|checkout-worker-prod-1b|payments-api-prod-1a)/mute$"

[expect.preservation]
allow = [
  { pointer = "/services/datadog/hosts/checkout-api-prod-1b/is_muted", matching = { name = "checkout-api-prod-1b", is_muted = true }, numeric_fields = { "/mute_timeout" = 1793383200 }, cause = { service = "datadog", methods = ["POST"], path_regex = "^/api/v1/host/checkout-api-prod-1b/mute$" } },
  { pointer = "/services/datadog/hosts/checkout-api-prod-1b/mute_timeout", matching = { name = "checkout-api-prod-1b", is_muted = true }, numeric_fields = { "/mute_timeout" = 1793383200 }, cause = { service = "datadog", methods = ["POST"], path_regex = "^/api/v1/host/checkout-api-prod-1b/mute$" } },
  { pointer = "/services/datadog/host_mutes/checkout-api-prod-1b", kind = "create", matching = { hostname = "checkout-api-prod-1b" }, numeric_fields = { "/end" = 1793383200 }, field_patterns = { "/message" = '(^|[^[:alnum:]_])(?i-u:INC-2291)([^[:alnum:]_]|$)' }, cause = { service = "datadog", methods = ["POST"], path_regex = "^/api/v1/host/checkout-api-prod-1b/mute$" } },
]

[[solution.call]]
endpoint = "datadog"
tool = "get_logs"
arguments = { query = "service:checkout-api env:prod status:error \"connection reset by peer\"", from = 1793365200, to = 1793370600, limit = 100 }

[[solution.call]]
endpoint = "datadog"
tool = "mute_host"
arguments = { hostname = "checkout-api-prod-1b", end = 1793383200, message = "Draining for replacement - connection reset errors (INC-2291)" }
