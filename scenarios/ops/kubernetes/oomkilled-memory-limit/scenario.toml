[scenario]
id = "ops/kubernetes/oomkilled-memory-limit"
title = "Raise the memory limit of the OOM-killed analytics workload"
now = "2026-12-01T03:15:00Z"
seed = "ops-kubernetes-oomkilled-memory-limit"
services = ["kubernetes"]
tags = ["write", "single-service", "kubernetes", "disambiguation"]
timeout_sec = 900

[scenario.family]
schema_version = 1
primary = "entity_ambiguity"
secondary = []
dependency_depth = 2
rationale = "analytics/report-builder pods are OOMKilled (6 and 7 restarts); report-scheduler restarted once with exit 1, report-api shares the 512Mi limit and analytics-staging has a same-named report-builder; only prod one changes."

[expect]
version = 2
audit_history = true

[[expect.records]]
selector = { collection = "/services/kubernetes/deployments.apps/analytics~1report-builder/spec/template/spec/containers", identity_field = "/name", matching = { name = "report-builder" } }
equals = 1
quantity_fields = { "/resources/limits/memory" = "1Gi" }

[[expect.preservation.allow]]
pointer = "/services/kubernetes/deployments.apps/analytics~1report-builder/apiVersion"
matching = { apiVersion = "apps/v1", kind = "Deployment" }
cause = { service = "kubernetes", methods = ["PATCH", "PUT"], path_regex = "^/apis/apps/v1/namespaces/analytics/deployments/report-builder$" }

[[expect.preservation.allow]]
pointer = "/services/kubernetes/deployments.apps/analytics~1report-builder/kind"
matching = { apiVersion = "apps/v1", kind = "Deployment" }
cause = { service = "kubernetes", methods = ["PATCH", "PUT"], path_regex = "^/apis/apps/v1/namespaces/analytics/deployments/report-builder$" }

[[expect.preservation.allow]]
pointer = "/services/kubernetes/deployments.apps/analytics~1report-builder/spec/template/spec/containers/*/resources/limits/memory"
element_matching = { name = "report-builder" }
cause = { service = "kubernetes", methods = ["PATCH", "PUT"], path_regex = "^/apis/apps/v1/namespaces/analytics/deployments/report-builder$" }

[[expect.preservation.allow]]
pointer = "/services/kubernetes/deployments.apps/analytics~1report-builder/metadata/resourceVersion"
cause = { service = "kubernetes", methods = ["PATCH", "PUT"], path_regex = "^/apis/apps/v1/namespaces/analytics/deployments/report-builder$" }

[[expect.preservation.allow]]
pointer = "/services/kubernetes/deployments.apps/analytics~1report-builder/metadata/generation"
cause = { service = "kubernetes", methods = ["PATCH", "PUT"], path_regex = "^/apis/apps/v1/namespaces/analytics/deployments/report-builder$" }

[[expect.preservation.allow]]
pointer = "/services/kubernetes/deployments.apps/analytics~1report-builder/metadata/managedFields"
cause = { service = "kubernetes", methods = ["PATCH", "PUT"], path_regex = "^/apis/apps/v1/namespaces/analytics/deployments/report-builder$" }

[[solution.call]]
endpoint = "kubernetes"
tool = "pods_list_in_namespace"
arguments = { namespace = "analytics" }

[[solution.call]]
endpoint = "kubernetes"
tool = "pods_get"
arguments = { namespace = "analytics", name = "report-builder-t2h6vx4p7r-q8j52" }

[[solution.call]]
endpoint = "kubernetes"
tool = "resources_create_or_update"
arguments = { resource = """
apiVersion: apps/v1
kind: Deployment
metadata:
  name: report-builder
  namespace: analytics
spec:
  template:
    spec:
      containers:
        - name: report-builder
          resources:
            limits:
              memory: 1Gi
""" }
