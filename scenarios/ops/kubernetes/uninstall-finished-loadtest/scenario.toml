[scenario]
id = "ops/kubernetes/uninstall-finished-loadtest"
title = "Uninstall the finished checkout load test release in perf"
now = "2026-11-04T16:20:00Z"
seed = "ops-kubernetes-uninstall-finished-loadtest"
services = ["kubernetes"]
tags = ["write", "single-service", "kubernetes", "disambiguation"]
timeout_sec = 900

[scenario.family]
schema_version = 1
primary = "entity_ambiguity"
secondary = []
dependency_depth = 1
rationale = "Helm releases: perf/checkout-loadtest (pods Succeeded), perf/search-loadtest (pods Running), perf/k6-operator and a same-named perf-staging/checkout-loadtest; contract removes only the perf job and script."

[expect]
version = 2
audit_history = true

[[expect.records]]
selector = { collection = "/services/kubernetes/helm_releases", matching = { name = "checkout-loadtest", namespace = "perf" }, latest_by = "/version" }
min_count = 0
max_count = 1
fields = { "/info/status" = "uninstalled" }

[[expect.records]]
selector = { collection = "/services/kubernetes/secrets", matching = { type = "helm.sh/release.v1", metadata = { namespace = "perf", name = "sh.helm.release.v1.checkout-loadtest.v2" } } }
min_count = 0
max_count = 1
fields = { "/metadata/labels/owner" = "helm", "/metadata/labels/name" = "checkout-loadtest", "/metadata/labels/version" = "2" }

[[expect.relations]]
source = { collection = "/services/kubernetes/secrets", matching = { type = "helm.sh/release.v1", metadata = { namespace = "perf", name = "sh.helm.release.v1.checkout-loadtest.v2" } } }
source_field = "/metadata/labels/status"
target = { collection = "/services/kubernetes/helm_releases", matching = { name = "checkout-loadtest", namespace = "perf", version = 2 } }
target_field = "/info/status"
kind = "bijection"
allow_empty = true

[[expect.state]]
pointer = "/services/kubernetes/jobs.batch/perf~1checkout-loadtest"
exists = false

[[expect.state]]
pointer = "/services/kubernetes/configmaps/perf~1checkout-loadtest-script"
exists = false

[[expect.preservation.allow]]
pointer = "/services/kubernetes/jobs.batch/perf~1checkout-loadtest"
kind = "delete"
cause = { service = "kubernetes", methods = ["DELETE"], path_regex = "^/apis/batch/v1/namespaces/perf/jobs/checkout-loadtest$" }

[[expect.preservation.allow]]
pointer = "/services/kubernetes/configmaps/perf~1checkout-loadtest-script"
kind = "delete"
cause = { service = "kubernetes", methods = ["DELETE"], path_regex = "^/api/v1/namespaces/perf/configmaps/checkout-loadtest-script$" }

[[expect.preservation.allow]]
pointer = "/services/kubernetes/pods/*"
kind = "delete"
max_count = 4
matching = { metadata = { namespace = "perf", ownerReferences = [{ apiVersion = "batch/v1", kind = "Job", name = "checkout-loadtest", uid = "36ab8166-a60d-4b26-aa60-9615c207b3d0" }] } }
cause = { service = "kubernetes", methods = ["DELETE"], path_regex = "^(/apis/batch/v1/namespaces/perf/jobs/checkout-loadtest|/api/v1/namespaces/perf/pods/[^/]+)$" }

[[expect.preservation.allow]]
pointer = "/services/kubernetes/helm_releases/*"
kind = "delete"
count_scope = "per_commit"
matching = { name = "checkout-loadtest", namespace = "perf" }
cause = { service = "kubernetes", methods = ["DELETE"], path_regex = "^/api/v1/namespaces/perf/secrets/sh\\.helm\\.release\\.v1\\.checkout-loadtest\\.v[0-9]+$" }

[[expect.preservation.allow]]
pointer = "/services/kubernetes/helm_releases/perf~1checkout-loadtest.v2/info/status"
cause = { service = "kubernetes", methods = ["PATCH", "PUT"], path_regex = "^/api/v1/namespaces/perf/secrets/sh\\.helm\\.release\\.v1\\.checkout-loadtest\\.v2$" }

[[expect.preservation.allow]]
pointer = "/services/kubernetes/helm_releases/perf~1checkout-loadtest.v2/info/description"
cause = { service = "kubernetes", methods = ["PATCH", "PUT"], path_regex = "^/api/v1/namespaces/perf/secrets/sh\\.helm\\.release\\.v1\\.checkout-loadtest\\.v2$" }

[[expect.preservation.allow]]
pointer = "/services/kubernetes/helm_releases/perf~1checkout-loadtest.v2/info/deleted"
cause = { service = "kubernetes", methods = ["PATCH", "PUT"], path_regex = "^/api/v1/namespaces/perf/secrets/sh\\.helm\\.release\\.v1\\.checkout-loadtest\\.v2$" }

[[expect.preservation.allow]]
pointer = "/services/kubernetes/secrets/*"
kind = "create"
matching = { type = "helm.sh/release.v1", metadata = { namespace = "perf", name = "sh.helm.release.v1.checkout-loadtest.v2", labels = { owner = "helm", name = "checkout-loadtest", version = "2" } } }
cause = { service = "kubernetes", methods = ["PATCH", "PUT"], path_regex = "^/api/v1/namespaces/perf/secrets/sh\\.helm\\.release\\.v1\\.checkout-loadtest\\.v2$" }

[[expect.preservation.allow]]
pointer = "/services/kubernetes/secrets/*"
kind = "delete"
matching = { type = "helm.sh/release.v1", metadata = { namespace = "perf", name = "sh.helm.release.v1.checkout-loadtest.v2" } }
cause = { service = "kubernetes", methods = ["DELETE"], path_regex = "^/api/v1/namespaces/perf/secrets/sh\\.helm\\.release\\.v1\\.checkout-loadtest\\.v2$" }

[[expect.preservation.allow]]
pointer = "/services/kubernetes/secrets/*/data/release"
matching = { type = "helm.sh/release.v1", metadata = { namespace = "perf", name = "sh.helm.release.v1.checkout-loadtest.v2" } }
cause = { service = "kubernetes", methods = ["PATCH", "PUT"], path_regex = "^/api/v1/namespaces/perf/secrets/sh\\.helm\\.release\\.v1\\.checkout-loadtest\\.v2$" }

[[expect.preservation.allow]]
pointer = "/services/kubernetes/secrets/*/metadata/resourceVersion"
matching = { type = "helm.sh/release.v1", metadata = { namespace = "perf", name = "sh.helm.release.v1.checkout-loadtest.v2" } }
cause = { service = "kubernetes", methods = ["PATCH", "PUT"], path_regex = "^/api/v1/namespaces/perf/secrets/sh\\.helm\\.release\\.v1\\.checkout-loadtest\\.v2$" }

[[expect.preservation.allow]]
pointer = "/services/kubernetes/secrets/*/metadata/labels/status"
matching = { type = "helm.sh/release.v1", metadata = { namespace = "perf", name = "sh.helm.release.v1.checkout-loadtest.v2" } }
cause = { service = "kubernetes", methods = ["PATCH", "PUT"], path_regex = "^/api/v1/namespaces/perf/secrets/sh\\.helm\\.release\\.v1\\.checkout-loadtest\\.v2$" }

[[expect.preservation.allow]]
pointer = "/services/kubernetes/secrets/*/metadata/labels/modifiedAt"
matching = { type = "helm.sh/release.v1", metadata = { namespace = "perf", name = "sh.helm.release.v1.checkout-loadtest.v2" } }
cause = { service = "kubernetes", methods = ["PATCH", "PUT"], path_regex = "^/api/v1/namespaces/perf/secrets/sh\\.helm\\.release\\.v1\\.checkout-loadtest\\.v2$" }

[[solution.call]]
endpoint = "kubernetes"
tool = "helm_list"
arguments = { all_namespaces = true }

[[solution.call]]
endpoint = "kubernetes"
tool = "helm_uninstall"
arguments = { name = "checkout-loadtest", namespace = "perf" }
