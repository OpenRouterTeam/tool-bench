[scenario]
id = "ops/kubernetes/crashloop-root-cause"
title = "Find the crash-looping payments pod and why it dies"
now = "2026-11-03T08:40:00Z"
seed = "ops-kubernetes-crashloop-root-cause"
services = ["kubernetes"]
tags = ["lookup", "single-service", "kubernetes"]
timeout_sec = 900

[scenario.family]
schema_version = 1
primary = "entity_ambiguity"
secondary = []
dependency_depth = 2
rationale = "CrashLoopBackOff on payments/ledger-worker-zx4mrndj8b-gdg8j (14 restarts) and payments-staging/ledger-worker (31 restarts, config panic); refund-scheduler had one OOMKilled restart; answer needs gdg8j and its log error."

[expect]
version = 2
audit_history = true

# The pod is the one in the payments namespace whose container waits in CrashLoopBackOff.
# Its log record is keyed "<namespace>/<pod>/<container>"; the error is the innermost
# message (the text after the last colon) of the ERROR line of the crashed instance.
[expect.answer.record_facts]
requirement = "Name the pod in the payments namespace whose container is in CrashLoopBackOff, and quote the error message that the ERROR line of its crashed container's log ends with."
mode = "statements"
# True negative predicates of a diagnosis; they do not deny the pod they describe.
predicates = [
  "cannot log in",
  "can't log in",
  "cannot authenticate",
  "can't authenticate",
  "could not authenticate",
  "cannot connect",
  "can't connect",
  "could not connect",
  "cannot reach",
  "can't reach",
  "could not reach",
  "never becomes ready",
  "does not become ready",
  "does not stay up",
  "never stays up",
  "could not initialise",
  "could not initialize",
  "cannot initialise",
  "cannot initialize",
]
context = [
  "in the payments namespace",
  "(CrashLoopBackOff, ${restarts} restarts)",
  "(CrashLoopBackOff)",
  "It exits with code 1 right after start-up because it cannot log in to its database:",
  "The ledger database credentials need fixing (the ledger user's password was rejected).",
  "2026-11-03T08:33:44.302Z ERROR db: connect ledger-db.payments.svc:5432:",
  "Its previous container log ends with:",
  "2026-11-03T08:33:44.302Z FATAL could not initialise ledger store, exiting (exit code 1)",
]

[expect.answer.record_facts.selector]
collection = "/services/kubernetes/pods"
matching = { metadata = { namespace = "payments" } }
field_patterns = { "/status/containerStatuses/0/state/waiting/reason" = '^CrashLoopBackOff$' }

[expect.answer.record_facts.related.logs]
collection = "/services/kubernetes/pod_logs"
on = { "/_key" = "/_key" }
capture = { "/_key" = '^(.+)/[^/]+$' }

[expect.answer.record_facts.facts.pod]
field = "/metadata/name"
kind = "identifier"

[expect.answer.record_facts.facts.error]
record = "logs"
field = "/previous/0"
append = ["/previous/1", "/previous/2", "/previous/3"]
capture = 'ERROR .*?: ([^:]+?)(?: \d{4}-\d{2}-\d{2}T|$)'
kind = "text"

[expect.answer.record_facts.facts.restarts]
field = "/status/containerStatuses/0/restartCount"
kind = "number"
optional = true

[[expect.required_calls]]
service = "kubernetes"
method = "GET"
path = "/api/v1/namespaces/payments/pods/ledger-worker-zx4mrndj8b-gdg8j/log"

[[expect.forbidden_calls]]
service = "kubernetes"
method = "DELETE"

[[solution.call]]
endpoint = "kubernetes"
tool = "pods_list_in_namespace"
arguments = { namespace = "payments" }

[[solution.call]]
endpoint = "kubernetes"
tool = "pods_log"
arguments = { namespace = "payments", name = "ledger-worker-zx4mrndj8b-gdg8j", previous = true }

[solution]
answer = "Pod: ledger-worker-zx4mrndj8b-gdg8j\nError: pq: password authentication failed for user \"ledger\""
