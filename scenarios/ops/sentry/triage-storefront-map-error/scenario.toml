[scenario]
id = "ops/sentry/triage-storefront-map-error"
title = "Assign and resolve-in-next-release the right TypeError among look-alikes"
now = "2026-10-20T16:00:00Z"
seed = "ops-sentry-triage-storefront-map-error"
services = ["sentry"]
tags = ["write", "single-service", "sentry", "disambiguation"]
timeout_sec = 900

[scenario.family]
schema_version = 1
primary = "entity_ambiguity"
secondary = []
dependency_depth = 1
rationale = "Three issues share the TypeError reading map title: STOREFRONT-WEB-8D (first release 5.3.0, target), STOREFRONT-WEB-7Q (5.2.0, same project) and ADMIN-DASHBOARD-2M; only 8D may be assigned and resolved."

[expect]
version = 2
audit_history = true

[[expect.records]]
selector = { collection = "/services/sentry/issues", matching = { shortId = "STOREFRONT-WEB-8D" } }
equals = 1
fields = { "/status" = "resolved", "/statusDetails/inNextRelease" = true, "/assignedTo/type" = "team" }
null_fields = ["/substatus"]

[[expect.relations]]
source = { collection = "/services/sentry/issues", matching = { shortId = "STOREFRONT-WEB-8D" } }
source_field = "/assignedTo/id"
target = { collection = "/services/sentry/teams", matching = { slug = "frontend-web" } }
target_field = "/id"
kind = "equals"

[[expect.preservation.allow]]
pointer = "/services/sentry/issues/STOREFRONT-WEB-8D/status"
matching = { status = "resolved", statusDetails = { inNextRelease = true } }
cause = { service = "sentry", methods = ["PUT"], path_regex = "^/api/0/organizations/(lumen-labs|1180274)/issues/[^/]+/$" }

[[expect.preservation.allow]]
pointer = "/services/sentry/issues/STOREFRONT-WEB-8D/substatus"
matching = { status = "resolved", statusDetails = { inNextRelease = true } }
cause = { service = "sentry", methods = ["PUT"], path_regex = "^/api/0/organizations/(lumen-labs|1180274)/issues/[^/]+/$" }

[[expect.preservation.allow]]
pointer = "/services/sentry/issues/STOREFRONT-WEB-8D/statusDetails"
matching = { status = "resolved", statusDetails = { inNextRelease = true } }
cause = { service = "sentry", methods = ["PUT"], path_regex = "^/api/0/organizations/(lumen-labs|1180274)/issues/[^/]+/$" }

[[expect.preservation.allow]]
pointer = "/services/sentry/issues/STOREFRONT-WEB-8D/resolvedAt"
matching = { status = "resolved", statusDetails = { inNextRelease = true } }
field_patterns = { "/resolvedAt" = '\S' }
cause = { service = "sentry", methods = ["PUT"], path_regex = "^/api/0/organizations/(lumen-labs|1180274)/issues/[^/]+/$" }

[[expect.preservation.allow]]
pointer = "/services/sentry/issues/STOREFRONT-WEB-8D/assignedTo"
matching = { assignedTo = { type = "team" } }
references = [{ source_field = "/assignedTo/id", target = { collection = "/services/sentry/teams", matching = { slug = "frontend-web" } }, target_field = "/id" }]
cause = { service = "sentry", methods = ["PUT"], path_regex = "^/api/0/organizations/(lumen-labs|1180274)/issues/[^/]+/$" }

[[expect.preservation.allow]]
pointer = "/services/sentry/activities/*"
kind = "create"
matching = { type = "set_resolved_in_release", data = { inNextRelease = true } }
references = [
  { source_field = "/issue", target = { collection = "/services/sentry/issues", matching = { shortId = "STOREFRONT-WEB-8D" } }, target_field = "/id" },
  { source_field = "/user", target = { collection = "/services/sentry/users", matching = { email = "priya@lumenlabs.dev" } }, target_field = "/id" },
]
max_count = 1
count_scope = "per_commit"
cause = { service = "sentry", methods = ["PUT"], path_regex = "^/api/0/organizations/(lumen-labs|1180274)/issues/[^/]+/$" }

[[expect.preservation.allow]]
pointer = "/services/sentry/activities/*"
kind = "create"
matching = { type = "assigned", data = { assigneeType = "team" } }
references = [
  { source_field = "/issue", target = { collection = "/services/sentry/issues", matching = { shortId = "STOREFRONT-WEB-8D" } }, target_field = "/id" },
  { source_field = "/data/assignee", target = { collection = "/services/sentry/teams", matching = { slug = "frontend-web" } }, target_field = "/id" },
  { source_field = "/user", target = { collection = "/services/sentry/users", matching = { email = "priya@lumenlabs.dev" } }, target_field = "/id" },
]
max_count = 1
count_scope = "per_commit"
cause = { service = "sentry", methods = ["PUT"], path_regex = "^/api/0/organizations/(lumen-labs|1180274)/issues/[^/]+/$" }

[[solution.call]]
endpoint = "sentry"
tool = "search_issues"
arguments = { organizationSlug = "lumen-labs", projectSlugOrId = "storefront-web", query = "is:unresolved firstRelease:storefront@5.3.0 TypeError" }

[[solution.call]]
endpoint = "sentry"
tool = "update_issue"
arguments = { organizationSlug = "lumen-labs", issueId = "STOREFRONT-WEB-8D", status = "resolvedInNextRelease", assignedTo = "team:4507214" }
