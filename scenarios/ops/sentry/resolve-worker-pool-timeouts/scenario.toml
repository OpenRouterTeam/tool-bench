[scenario]
id = "ops/sentry/resolve-worker-pool-timeouts"
title = "Resolve the payments worker's connection-pool timeout issue"
now = "2026-10-20T16:00:00Z"
seed = "ops-sentry-resolve-worker-pool-timeouts"
services = ["sentry"]
tags = ["write", "single-service", "sentry", "disambiguation"]
timeout_sec = 900

[expect]
version = 2
audit_history = true

[[expect.records]]
selector = { collection = "/services/sentry/issues", matching = { shortId = "PAYMENTS-WORKER-1K" } }
equals = 1
fields = { "/status" = "resolved" }
null_fields = ["/substatus"]
optional_choices = { "/statusDetails/inNextRelease" = [false] }

[[expect.preservation.allow]]
pointer = "/services/sentry/issues/PAYMENTS-WORKER-1K/status"
matching = { status = "resolved" }
cause = { service = "sentry", methods = ["PUT"], path_regex = "^/api/0/organizations/(lumen-labs|1180274)/issues/[^/]+/$" }

[[expect.preservation.allow]]
pointer = "/services/sentry/issues/PAYMENTS-WORKER-1K/substatus"
matching = { status = "resolved" }
cause = { service = "sentry", methods = ["PUT"], path_regex = "^/api/0/organizations/(lumen-labs|1180274)/issues/[^/]+/$" }

[[expect.preservation.allow]]
pointer = "/services/sentry/issues/PAYMENTS-WORKER-1K/resolvedAt"
matching = { status = "resolved" }
field_patterns = { "/resolvedAt" = '\S' }
cause = { service = "sentry", methods = ["PUT"], path_regex = "^/api/0/organizations/(lumen-labs|1180274)/issues/[^/]+/$" }

[[expect.preservation.allow]]
pointer = "/services/sentry/activities/*"
kind = "create"
matching = { type = "set_resolved" }
references = [
  { source_field = "/issue", target = { collection = "/services/sentry/issues", matching = { shortId = "PAYMENTS-WORKER-1K" } }, target_field = "/id" },
  { source_field = "/user", target = { collection = "/services/sentry/users", matching = { email = "priya@lumenlabs.dev" } }, target_field = "/id" },
]
max_count = 1
count_scope = "per_commit"
cause = { service = "sentry", methods = ["PUT"], path_regex = "^/api/0/organizations/(lumen-labs|1180274)/issues/[^/]+/$" }

[[expect.preservation.allow]]
pointer = "/services/sentry/activities/*"
kind = "create"
matching = { type = "assigned", data = { assigneeType = "team" } }
references = [
  { source_field = "/issue", target = { collection = "/services/sentry/issues", matching = { shortId = "PAYMENTS-WORKER-1K" } }, target_field = "/id" },
  { source_field = "/data/assignee", target = { collection = "/services/sentry/issues", matching = { shortId = "PAYMENTS-WORKER-1K", assignedTo = { type = "team" } } }, target_field = "/assignedTo/id" },
  { source_field = "/user", target = { collection = "/services/sentry/users", matching = { email = "priya@lumenlabs.dev" } }, target_field = "/id" },
]
max_count = 1
count_scope = "per_commit"
cause = { service = "sentry", methods = ["PUT"], path_regex = "^/api/0/organizations/(lumen-labs|1180274)/issues/[^/]+/$" }

[[solution.call]]
endpoint = "sentry"
tool = "search_issues"
arguments = { organizationSlug = "lumen-labs", projectSlugOrId = "payments-worker", query = "is:unresolved \"could not obtain connection from pool\"" }

[[solution.call]]
endpoint = "sentry"
tool = "update_issue"
arguments = { organizationSlug = "lumen-labs", issueId = "PAYMENTS-WORKER-1K", status = "resolved" }
