[scenario]
id = "code/github/file-login-bug"
title = "File a bug for a production login failure"
now = "2026-03-14T09:00:00Z"
seed = "code-github-file-login-bug"
services = ["github"]
tags = ["single-service", "write", "github"]
timeout_sec = 900

[expect]
version = 2
audit_history = true

[[expect.records]]
selector = { collection = "/services/github/issues", created = true }
equals = 1

[[expect.records]]
selector = { collection = "/services/github/issues", key_prefix = "octo-org/app#", created = true }
equals = 1
fields = { "/title" = "Login page returns 500", "/state" = "open", "/user" = "mona", "/assignees" = [] }
optional_fields = { "/locked" = false, "/milestone" = "", "/type" = "", "/parent" = "" }
null_fields = ["/closed_at"]
reviewed_text = { "/body" = { requirement = "Mention deploy 412 in the new login HTTP-500 bug's description, without denying the reported regression or inventing its root cause. The exact title already supplies the login failure context; no particular prose or level of detail is required. Unlisted nonempty wording requires adjudication.", accepted = ["The login page has returned HTTP 500 since deploy 412.", "Observed after deploy 412.", "Deploy 412."] } }

[[expect.preservation.allow]]
pointer = "/services/github/issues/*"
kind = "create"
matching = { user = "mona" }

[[solution.call]]
endpoint = "github"
tool = "issue_write"
arguments = { method = "create", owner = "octo-org", repo = "app", title = "Login page returns 500", body = "The login page has returned HTTP 500 since deploy 412." }
