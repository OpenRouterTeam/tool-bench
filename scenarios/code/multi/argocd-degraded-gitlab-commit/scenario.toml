[scenario]
id = "code/multi/argocd-degraded-gitlab-commit"
title = "Trace a Degraded Argo CD app back to the failed GitLab pipeline that promoted it"
now = "2026-10-29T14:05:00Z"
seed = "code-multi-argocd-degraded-gitlab-commit"
services = ["argocd", "gitlab"]
tags = ["lookup", "multi-service", "argocd", "gitlab", "disambiguation"]
timeout_sec = 1200

[scenario.family]
schema_version = 1
primary = "cross_system_identity"
secondary = ["entity_ambiguity"]
dependency_depth = 4
rationale = "Argo CD checkout-web sync revision a23f2a7 must be matched to the GitLab storefront-deploy commit, whose message names checkout-web pipeline 7712; traps are the Degraded staging twin and lint-failed pipeline 7716."

# checkout-web (prod) runs storefront-deploy a23f2a7 ("promote 2.14.0-rc3") and cannot pull
# ghcr.io/lumen-retail/checkout-web:2.14.0-rc3. The deploy commit names checkout-web pipeline
# #7712 (tag v2.14.0-rc3), whose image-publish job failed (ghcr push denied, expired token)
# while the always-run promote job still pushed the deploy commit. Distractors: the Degraded
# staging twin (missing env var), the green rc2 pipeline 7698, and pipeline 7716 on main that
# failed in lint.
[expect]
version = 2
audit_history = true

# The application whose health is Degraded and whose env label is production -> its failing
# pod (image tag) and the deploy commit Argo CD is synced to -> the pipeline that commit's
# message names -> the job of that pipeline that failed. The error is the registry's own
# error code on the `denied:` line of that job's trace.
[expect.answer.record_facts]
requirement = "Name the Argo CD application that is Degraded on production and the image tag its failing pod runs, the ID of the GitLab pipeline named by the deploy commit that application is synced to, the job that failed in that pipeline, and the error that job's log reports."
mode = "statements"
# True of the error itself, not a denial of it.
predicates = ["does not match expected scopes", "does not match the expected scopes"]
# True remarks about the deploy commit's title and the pipeline's promote job, which ran.
context = [
  "commit ${commit_sha}",
  "The promote job runs with when: always, so it promoted the tag to production anyway",
  "the promote job runs with when: always",
  "the promote job has when: always",
  "the promote job uses when: always",
  "the promote job is configured with when: always",
  "the promote job still ran",
  "the promote job ran anyway",
  "the promote job succeeded",
  "The token provided",
  "scope ${scope}",
  "does not match expected scopes",
  "because",
  "and pushed the deploy commit anyway",
  "promoted it although its",
]
assertions = [
  "App: ${app}, failing on image tag ${image_tag}",
  "${app} cannot pull tag ${image_tag}",
  "${app} (${image_tag})",
  "Pipeline: ${pipeline}, failed job: ${job}",
  "Pipeline ${pipeline}: ${job} failed",
  "Pipeline ${pipeline}",
  "Pipeline #${pipeline}",
  "${job} failed",
  "${job} job failed",
  "failed job: ${job}",
  "Error: denied: ${error}",
  "Error: ${error}",
  "${error}",
  "the docker push was ${error}",
  "the CI token ${error}",
  "the push was ${error}",
  "${job} failed with ${error}",
  "${job} failed because the CI token ${error}",
  "${job} failed because the push was ${error}",
  "GHCR_TOKEN had ${error}",
  "Error: denied: ${error}: The token provided does not match expected scopes (${scope})",
  "(${scope})",
]

[expect.answer.record_facts.selector]
collection = "/services/argocd/applications"
matching = { status = { health = { status = "Degraded" } }, metadata = { labels = { env = "production" } } }

[expect.answer.record_facts.related.pod]
collection = "/services/argocd/resources"
filter = { matching = { "/kind" = "Pod" }, excluding = [{ "/health/status" = "Healthy" }] }
on = { "/manifest/metadata/labels/app.kubernetes.io~1instance" = "/metadata/name" }

[expect.answer.record_facts.related.commit]
collection = "/services/gitlab/commits"
on = { "/id" = "/status/sync/revision" }

[expect.answer.record_facts.related.pipeline]
from = "commit"
collection = "/services/gitlab/pipelines"
on = { "/id" = "/message" }
capture_from = { "/message" = 'pipeline #(\d+)' }

[expect.answer.record_facts.related.job]
from = "pipeline"
collection = "/services/gitlab/jobs"
filter = { matching = { "/status" = "failed" } }
on = { "/pipeline_id" = "/id" }

[expect.answer.record_facts.facts.app]
field = "/metadata/name"
kind = "text"

[expect.answer.record_facts.facts.image_tag]
record = "pod"
field = "/images/0"
capture = ':([^:/]+)$'
kind = "identifier"

[expect.answer.record_facts.facts.pipeline]
record = "pipeline"
field = "/id"
kind = "identifier"

[expect.answer.record_facts.facts.job]
record = "job"
field = "/name"
kind = "text"

[expect.answer.record_facts.facts.error]
record = "job"
field = "/trace"
capture = '(?m)^denied: (\w+):'
kind = "identifier"

# Plain wordings of the registry's error line, bound to its error code: the push was
# denied because the token no longer matched the expected scopes (it had expired).
[expect.answer.record_facts.facts.error.wordings]
permission_denied = ["permission denied", "denied", "expired", "scopes"]

[expect.answer.record_facts.facts.commit_sha]
record = "commit"
field = "/id"
kind = "identifier"
min_prefix = 7
optional = true

[expect.answer.record_facts.facts.scope]
record = "scope_trace"
field = "/trace"
capture = 'expected scopes \(([^)]+)\)'
kind = "identifier"
optional = true

[expect.answer.record_facts.related.scope_trace]
from = "job"
collection = "/services/gitlab/jobs"
on = { "/id" = "/id" }
filter = { patterns = { "/trace" = 'expected scopes \([^)]+\)' } }
allow_absence = true

[[expect.required_calls]]
service = "gitlab"
method = "GET"
path_regex = "/jobs/77123/trace$"

[[expect.forbidden_calls]]
service = "argocd"
method = "POST"

[[expect.forbidden_calls]]
service = "argocd"
method = "PUT"

[[expect.forbidden_calls]]
service = "argocd"
method = "DELETE"

[[expect.forbidden_calls]]
service = "gitlab"
method = "POST"
path_regex = "^/api/v4/"

[[expect.forbidden_calls]]
service = "gitlab"
method = "PUT"

[[expect.forbidden_calls]]
service = "gitlab"
method = "DELETE"

[[solution.call]]
endpoint = "argocd"
tool = "list_applications"
arguments = {}

[[solution.call]]
endpoint = "argocd"
tool = "get_application_resource_tree"
arguments = { applicationName = "checkout-web" }

[[solution.call]]
endpoint = "gitlab"
tool = "get_commit"
arguments = { project_id = "lumen-retail/storefront/storefront-deploy", sha = "a23f2a7b21f788c07d95ceaeb529e54b7ae3dbcd" }

[[solution.call]]
endpoint = "gitlab"
tool = "list_pipeline_jobs"
arguments = { project_id = "lumen-retail/storefront/checkout-web", pipeline_id = "7712" }

[[solution.call]]
endpoint = "gitlab"
tool = "get_pipeline_job_output"
arguments = { project_id = "lumen-retail/storefront/checkout-web", job_id = "77123" }

[solution]
answer = """
App: checkout-web, failing on image tag 2.14.0-rc3. Pipeline 7712: image-publish failed because the CI token expired. The promote job runs with when: always, so it promoted the tag to production anyway.
"""
