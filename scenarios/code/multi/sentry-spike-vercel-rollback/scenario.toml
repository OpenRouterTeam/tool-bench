[scenario]
id = "code/multi/sentry-spike-vercel-rollback"
title = "Trace a new Sentry error to its Vercel release, roll production back and hand the issue over"
now = "2026-10-28T15:00:00Z"
seed = "code-multi-sentry-spike-vercel-rollback"
services = ["sentry", "vercel"]
tags = ["write", "multi-service", "sentry", "vercel", "disambiguation"]
timeout_sec = 1200

[scenario.family]
schema_version = 1
primary = "cross_system_identity"
secondary = ["entity_ambiguity", "stale_state"]
dependency_depth = 3
rationale = "Sentry STOREFRONT-5R firstRelease e07a3c9 is matched to the Vercel deployment with that githubCommitSha; the prior serving build is c3a9f12 (dpl_8o704), not errored 2f6c8a1 or preview 91b7e4c; 5T is preview-only."

# STOREFRONT-5R (7201330418) first appeared in release e07a3c9 ("Switch to payments client v3
# (#491)", production since 08:16). The build serving production before it is c3a9f12
# (dpl_8o704…); the newer eslint build 2f6c8a1 failed and never served. Traps: the newer
# preview-only error STOREFRONT-5T (release 4be1d07, a preview deployment), the older
# ChunkLoadError STOREFRONT-4W, and the storefront-admin project.


[expect]
version = 2
audit_history = true

[[expect.records]]
selector = { collection = "/services/vercel/deployments", created = true, matching = { projectId = "prj_3dw2VoUa166qmaLV3P6dm828isAX" } }
min_count = 1
fields = { "/target" = "production", "/readyState" = "READY", "/source" = "redeploy", "/gitSource/sha" = "c3a9f12e8b47d05a6e21f9b3c7d84e50a1b6f2d9", "/meta/originalDeploymentId" = "dpl_8o704GjcwumkLAaxPwjoxb4V6QDF", "/meta/githubCommitSha" = "c3a9f12e8b47d05a6e21f9b3c7d84e50a1b6f2d9" }

[[expect.relations]]
kind = "foreign_key"
source = { collection = "/services/vercel/aliases", matching = { projectId = "prj_3dw2VoUa166qmaLV3P6dm828isAX" }, field_patterns = { "/alias" = "^(acme-shop\\.com|storefront-acme-shop\\.vercel\\.app)$" } }
source_field = "/deploymentId"
target = { collection = "/services/vercel/deployments", created = true, matching = { projectId = "prj_3dw2VoUa166qmaLV3P6dm828isAX", readyState = "READY", target = "production" }, references = [{ source_field = "/id", target_field = "/deploymentId", target = { collection = "/services/vercel/deployment_sources", created = true, matching = { originalDeploymentId = "dpl_8o704GjcwumkLAaxPwjoxb4V6QDF", sourcePreserved = true } } }] }
target_field = "/id"

[[expect.records]]
selector = { collection = "/services/vercel/aliases", matching = { projectId = "prj_3dw2VoUa166qmaLV3P6dm828isAX" }, field_patterns = { "/alias" = "^(acme-shop\\.com|storefront-acme-shop\\.vercel\\.app)$" } }
equals = 2

[[expect.preservation.allow]]
pointer = "/services/vercel/deployments/*"
kind = "create"
matching = { projectId = "prj_3dw2VoUa166qmaLV3P6dm828isAX", source = "redeploy", target = "production" }
references = [{ source_field = "/id", target_field = "/deploymentId", target = { collection = "/services/vercel/deployment_sources", created = true, matching = { originalDeploymentId = "dpl_8o704GjcwumkLAaxPwjoxb4V6QDF", sourcePreserved = true } } }]
count_scope = "per_commit"

[[expect.preservation.allow]]
pointer = "/services/vercel/deployment_sources/*"
kind = "create"
matching = { projectId = "prj_3dw2VoUa166qmaLV3P6dm828isAX", originalDeploymentId = "dpl_8o704GjcwumkLAaxPwjoxb4V6QDF", sourcePreserved = true }
count_scope = "per_commit"

[[expect.preservation.allow]]
pointer = "/services/vercel/aliases/*/deploymentId"
initial_matching = { projectId = "prj_3dw2VoUa166qmaLV3P6dm828isAX" }
field_patterns = { "/alias" = "^(acme-shop\\.com|storefront-acme-shop\\.vercel\\.app)$" }
references = [{ source_field = "/deploymentId", target_field = "/id", target = { collection = "/services/vercel/deployments", created = true, matching = { projectId = "prj_3dw2VoUa166qmaLV3P6dm828isAX", readyState = "READY", target = "production" }, references = [{ source_field = "/id", target_field = "/deploymentId", target = { collection = "/services/vercel/deployment_sources", created = true, matching = { originalDeploymentId = "dpl_8o704GjcwumkLAaxPwjoxb4V6QDF", sourcePreserved = true } } }] } }]
max_count = 2

[[expect.preservation.allow]]
pointer = "/services/vercel/projects/prj_3dw2VoUa166qmaLV3P6dm828isAX/targets/production"
references = [{ source_field = "/targets/production/id", target_field = "/id", target = { collection = "/services/vercel/deployments", created = true, matching = { projectId = "prj_3dw2VoUa166qmaLV3P6dm828isAX", readyState = "READY", target = "production" }, references = [{ source_field = "/id", target_field = "/deploymentId", target = { collection = "/services/vercel/deployment_sources", created = true, matching = { originalDeploymentId = "dpl_8o704GjcwumkLAaxPwjoxb4V6QDF", sourcePreserved = true } } }] } }]

[[expect.preservation.allow]]
pointer = "/services/vercel/projects/prj_3dw2VoUa166qmaLV3P6dm828isAX/latestDeployments"

[[expect.preservation.allow]]
pointer = "/services/vercel/projects/prj_3dw2VoUa166qmaLV3P6dm828isAX/updatedAt"

[[expect.records]]
selector = { collection = "/services/sentry/issues", matching = { shortId = "STOREFRONT-5R", id = "7201330418", project = "storefront" } }
equals = 1
fields = { "/status" = "unresolved", "/assignedTo/type" = "team" }

[[expect.relations]]
kind = "equals"
source = { collection = "/services/sentry/issues", matching = { shortId = "STOREFRONT-5R", id = "7201330418" } }
source_field = "/assignedTo/id"
target = { collection = "/services/sentry/teams", matching = { slug = "payments-web" } }
target_field = "/id"

[[expect.preservation.allow]]
pointer = "/services/sentry/issues/STOREFRONT-5R/assignedTo"
matching = { assignedTo = { type = "team" } }
references = [{ source_field = "/assignedTo/id", target = { collection = "/services/sentry/teams", matching = { slug = "payments-web" } }, target_field = "/id" }]
cause = { service = "sentry", methods = ["PUT"], path_regex = "^/api/0/organizations/(acme-shop|1180911)/issues/(STOREFRONT-5R|7201330418)/$" }

[[expect.preservation.allow]]
pointer = "/services/sentry/activities/*"
kind = "create"
matching = { type = "assigned", data = { assigneeType = "team" } }
references = [
  { source_field = "/issue", target = { collection = "/services/sentry/issues", matching = { shortId = "STOREFRONT-5R", id = "7201330418" } }, target_field = "/id" },
  { source_field = "/data/assignee", target = { collection = "/services/sentry/teams", matching = { slug = "payments-web" } }, target_field = "/id" },
  { source_field = "/user", target = { collection = "/services/sentry/users", matching = { email = "riley@acme-shop.com" } }, target_field = "/id" },
]
max_count = 1
count_scope = "per_commit"
cause = { service = "sentry", methods = ["PUT"], path_regex = "^/api/0/organizations/(acme-shop|1180911)/issues/(STOREFRONT-5R|7201330418)/$" }

[[expect.forbidden_calls]]
service = "sentry"
method = "DELETE"

[[expect.forbidden_calls]]
service = "vercel"
body = { name = "vercel-delete-project" }

[[expect.forbidden_calls]]
service = "vercel"
body = { name = "vercel-remove-environment-variable" }

[[expect.forbidden_calls]]
service = "vercel"
body = { name = "vercel-create-environment-variables" }

[[solution.call]]
endpoint = "sentry"
tool = "search_issues"
arguments = { organizationSlug = "acme-shop", projectSlugOrId = "storefront", query = "is:unresolved environment:production" }

[[solution.call]]
endpoint = "vercel"
tool = "vercel-list-all-deployments"
arguments = { app = "storefront" }

[[solution.call]]
endpoint = "vercel"
tool = "vercel-create-deployment"
arguments = { name = "storefront", deploymentId = "dpl_8o704GjcwumkLAaxPwjoxb4V6QDF", target = "production" }

[[solution.call]]
endpoint = "sentry"
tool = "update_issue"
arguments = { organizationSlug = "acme-shop", issueId = "STOREFRONT-5R", assignedTo = "team:payments-web" }
