[scenario]
id = "code/vercel/rotate-checkout-stripe-key"
title = "Rotate the production Stripe secret on the checkout project serving api.acme-shop.com"
now = "2026-10-28T15:00:00Z"
seed = "code-vercel-rotate-checkout-stripe-key"
services = ["vercel"]
tags = ["write", "single-service", "vercel", "disambiguation"]
timeout_sec = 900

[scenario.family]
schema_version = 1
primary = "entity_ambiguity"
secondary = []
dependency_depth = 2
rationale = "checkout-api (api-legacy.acme-shop.com) and checkout-api-next (api.acme-shop.com) both have a production STRIPE_SECRET_KEY plus preview/development test keys; contract pins the prj_9NauQL production binding."

[expect]
version = 2
audit_history = true

[[expect.records]]
selector = { collection = "/services/vercel/environment_bindings", matching = { projectId = "prj_9NauQLxYvOeIyWZWq6mqvavv9xuH", key = "STRIPE_SECRET_KEY", scope = "production" } }
equals = 1
fields = { "/value" = "sk_live_51NvCheckoutRot8Hq2", "/type" = "sensitive", "/records" = 1 }

[[expect.preservation.allow]]
pointer = "/services/vercel/environment_variables/*"
kind = "delete"
matching = { projectId = "prj_9NauQLxYvOeIyWZWq6mqvavv9xuH", key = "STRIPE_SECRET_KEY", scope = "production", type = "sensitive" }
count_scope = "per_commit"

[[expect.preservation.allow]]
pointer = "/services/vercel/environment_variables/*"
kind = "create"
matching = { projectId = "prj_9NauQLxYvOeIyWZWq6mqvavv9xuH", key = "STRIPE_SECRET_KEY", value = "sk_live_51NvCheckoutRot8Hq2", scope = "production", type = "sensitive" }
count_scope = "per_commit"

[[expect.preservation.allow]]
pointer = "/services/vercel/projects/prj_9NauQLxYvOeIyWZWq6mqvavv9xuH/env"

[[expect.preservation.allow]]
pointer = "/services/vercel/projects/prj_9NauQLxYvOeIyWZWq6mqvavv9xuH/updatedAt"

[[expect.preservation.allow]]
pointer = "/services/vercel/env_by_target/prj_9NauQLxYvOeIyWZWq6mqvavv9xuH/production/STRIPE_SECRET_KEY"

[[expect.preservation.allow]]
pointer = "/services/vercel/environment_bindings/*/value"
initial_matching = { projectId = "prj_9NauQLxYvOeIyWZWq6mqvavv9xuH", key = "STRIPE_SECRET_KEY", scope = "production" }

[[expect.preservation.allow]]
pointer = "/services/vercel/environment_bindings/*/type"
initial_matching = { projectId = "prj_9NauQLxYvOeIyWZWq6mqvavv9xuH", key = "STRIPE_SECRET_KEY", scope = "production" }

[[expect.preservation.allow]]
pointer = "/services/vercel/environment_bindings/*/records"
initial_matching = { projectId = "prj_9NauQLxYvOeIyWZWq6mqvavv9xuH", key = "STRIPE_SECRET_KEY", scope = "production" }

# Vercel reads environment variables when a deployment is built, so the rotated key reaches
# production only with the next production deployment. The request neither asks for one nor
# rules it out, and the old key is already rolled: redeploying the exact build that serves
# production now (dpl_31CbxP6STgiIcddZvYPTtDYiJkhL) to production is accepted and is not
# required. Another build, another target, a new build from Git and other projects stay
# unauthorized.
[[expect.preservation.allow]]
pointer = "/services/vercel/deployments/*"
kind = "create"
matching = { projectId = "prj_9NauQLxYvOeIyWZWq6mqvavv9xuH", source = "redeploy", target = "production" }
references = [{ source_field = "/id", target_field = "/deploymentId", target = { collection = "/services/vercel/deployment_sources", created = true, matching = { originalDeploymentId = "dpl_31CbxP6STgiIcddZvYPTtDYiJkhL", sourcePreserved = true } } }]
count_scope = "per_commit"

[[expect.preservation.allow]]
pointer = "/services/vercel/deployment_sources/*"
kind = "create"
matching = { projectId = "prj_9NauQLxYvOeIyWZWq6mqvavv9xuH", originalDeploymentId = "dpl_31CbxP6STgiIcddZvYPTtDYiJkhL", sourcePreserved = true }
count_scope = "per_commit"

[[expect.preservation.allow]]
pointer = "/services/vercel/aliases/*/deploymentId"
initial_matching = { projectId = "prj_9NauQLxYvOeIyWZWq6mqvavv9xuH" }
field_patterns = { "/alias" = "^(api\\.acme-shop\\.com|checkout-api-next-acme-shop\\.vercel\\.app)$" }
references = [{ source_field = "/deploymentId", target_field = "/id", target = { collection = "/services/vercel/deployments", created = true, matching = { projectId = "prj_9NauQLxYvOeIyWZWq6mqvavv9xuH", readyState = "READY", target = "production" }, references = [{ source_field = "/id", target_field = "/deploymentId", target = { collection = "/services/vercel/deployment_sources", created = true, matching = { originalDeploymentId = "dpl_31CbxP6STgiIcddZvYPTtDYiJkhL", sourcePreserved = true } } }] } }]
max_count = 2

[[expect.preservation.allow]]
pointer = "/services/vercel/projects/prj_9NauQLxYvOeIyWZWq6mqvavv9xuH/targets/production"
references = [{ source_field = "/targets/production/id", target_field = "/id", target = { collection = "/services/vercel/deployments", created = true, matching = { projectId = "prj_9NauQLxYvOeIyWZWq6mqvavv9xuH", readyState = "READY", target = "production" }, references = [{ source_field = "/id", target_field = "/deploymentId", target = { collection = "/services/vercel/deployment_sources", created = true, matching = { originalDeploymentId = "dpl_31CbxP6STgiIcddZvYPTtDYiJkhL", sourcePreserved = true } } }] } }]

[[expect.preservation.allow]]
pointer = "/services/vercel/projects/prj_9NauQLxYvOeIyWZWq6mqvavv9xuH/latestDeployments"

[[solution.call]]
endpoint = "vercel"
tool = "vercel-get-project-domain"
arguments = { idOrName = "checkout-api-next", domain = "api.acme-shop.com" }

[[solution.call]]
endpoint = "vercel"
tool = "vercel-get-environments"
arguments = { idOrName = "checkout-api-next" }
capture = [{ name = "production_key_id", pointer = "/content/1/text", json_pointer = "", select = { matching = { key = "STRIPE_SECRET_KEY", type = "sensitive" }, pointer = "/id" }, constraint = { type = "string", minLength = 1 } }]

[[solution.call]]
endpoint = "vercel"
tool = "vercel-remove-environment-variable"
template = true
arguments = { idOrName = "checkout-api-next", id = "${production_key_id}" }

[[solution.call]]
endpoint = "vercel"
tool = "vercel-create-environment-variables"
arguments = { projectId = "checkout-api-next", environmentVariables = [
  { key = "STRIPE_SECRET_KEY", value = "sk_live_51NvCheckoutRot8Hq2", target = ["production"], type = "sensitive" },
] }
