[scenario]
id = "code/vercel/enable-gift-cards-in-previews"
title = "Add preview/development environment variables to the storefront project"
now = "2026-10-28T15:00:00Z"
seed = "code-vercel-enable-gift-cards-in-previews"
services = ["vercel"]
tags = ["write", "single-service", "vercel"]
timeout_sec = 900

[expect]
version = 2
audit_history = true

[[expect.records]]
selector = { collection = "/services/vercel/environment_bindings", matching = { projectId = "prj_3dw2VoUa166qmaLV3P6dm828isAX", key = "NEXT_PUBLIC_ENABLE_GIFT_CARDS" } }
equals = 2
fields = { "/value" = "true", "/records" = 1 }
any_fields = [{ "/scope" = "preview" }, { "/scope" = "development" }]

[[expect.records]]
selector = { collection = "/services/vercel/environment_bindings", matching = { projectId = "prj_3dw2VoUa166qmaLV3P6dm828isAX", key = "PAYMENTS_API_URL", scope = "preview" } }
equals = 1
fields = { "/value" = "https://sandbox.pay.acme-shop.com", "/records" = 1 }

[[expect.preservation.allow]]
pointer = "/services/vercel/environment_variables/*"
kind = "create"
matching = { projectId = "prj_3dw2VoUa166qmaLV3P6dm828isAX", key = "NEXT_PUBLIC_ENABLE_GIFT_CARDS", value = "true" }
field_patterns = { "/scope" = "^(development|preview|development,preview)$" }
max_count = 2

[[expect.preservation.allow]]
pointer = "/services/vercel/environment_variables/*"
kind = "create"
matching = { projectId = "prj_3dw2VoUa166qmaLV3P6dm828isAX", key = "PAYMENTS_API_URL", value = "https://sandbox.pay.acme-shop.com", scope = "preview" }

[[expect.preservation.allow]]
pointer = "/services/vercel/projects/prj_3dw2VoUa166qmaLV3P6dm828isAX/env"

[[expect.preservation.allow]]
pointer = "/services/vercel/projects/prj_3dw2VoUa166qmaLV3P6dm828isAX/updatedAt"

[[expect.preservation.allow]]
pointer = "/services/vercel/env_by_target/prj_3dw2VoUa166qmaLV3P6dm828isAX/preview/NEXT_PUBLIC_ENABLE_GIFT_CARDS"

[[expect.preservation.allow]]
pointer = "/services/vercel/env_by_target/prj_3dw2VoUa166qmaLV3P6dm828isAX/development/NEXT_PUBLIC_ENABLE_GIFT_CARDS"

[[expect.preservation.allow]]
pointer = "/services/vercel/env_by_target/prj_3dw2VoUa166qmaLV3P6dm828isAX/preview/PAYMENTS_API_URL"

[[expect.preservation.allow]]
pointer = "/services/vercel/environment_bindings/*"
kind = "create"
matching = { projectId = "prj_3dw2VoUa166qmaLV3P6dm828isAX", key = "NEXT_PUBLIC_ENABLE_GIFT_CARDS", value = "true", records = 1 }
field_patterns = { "/scope" = "^(preview|development)$" }
max_count = 2

[[expect.preservation.allow]]
pointer = "/services/vercel/environment_bindings/*"
kind = "create"
matching = { projectId = "prj_3dw2VoUa166qmaLV3P6dm828isAX", key = "PAYMENTS_API_URL", value = "https://sandbox.pay.acme-shop.com", scope = "preview", records = 1 }

[[solution.call]]
endpoint = "vercel"
tool = "vercel-create-environment-variables"
arguments = { projectId = "storefront", environmentVariables = [
  { key = "NEXT_PUBLIC_ENABLE_GIFT_CARDS", value = "true", target = ["preview", "development"], type = "plain" },
  { key = "PAYMENTS_API_URL", value = "https://sandbox.pay.acme-shop.com", target = ["preview"], type = "plain" },
] }
