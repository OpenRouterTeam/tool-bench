[scenario]
id = "code/gitlab/file-circuit-breaker-issue"
title = "File the circuit-breaker follow-up from the checkout outage postmortem"
now = "2026-04-02T09:00:00Z"
seed = "code-gitlab-file-circuit-breaker-issue"
services = ["gitlab"]
tags = ["single-service", "write", "gitlab"]
timeout_sec = 900

[scenario.family]
schema_version = 1
primary = "entity_ambiguity"
secondary = []
dependency_depth = 1
rationale = "Users Mei Chen (id 44, SRE) and Mei Lin (id 45, iOS); milestone 2026.04 exists in checkout-api (7104) and checkout-ios (7210); labels reliability and reliability-review; contract checks 7104 and mei.chen."

[expect]
version = 2
audit_history = true

[[expect.records]]
selector = { collection = "/services/gitlab/issues", created = true }
equals = 1

[[expect.records]]
selector = { collection = "/services/gitlab/issues", key_prefix = "northwind/payments/checkout-api#", created = true, matching = { labels = ["backend", "reliability"] } }
equals = 1
fields = { "/title" = "Add circuit breaker around fraud-score service calls", "/state" = "opened", "/milestone_id" = 7104, "/assignees" = ["mei.chen"], "/author" = "sam.okafor" }
reviewed_text = { "/description" = { requirement = "Explain that fraud-score latency spikes cascaded into checkout timeouts. The requested title supplies the circuit-breaker action. Extra detail is not mandatory, and unlisted nonempty wording requires adjudication rather than keyword success.", accepted = ["Fraud-score latency spikes cascaded into checkout timeouts.", "Follow-up from the 2026-04-01 checkout outage postmortem (#56): fraud-score latency spikes (p99 ~9s) cascaded into checkout request timeouts. Wrap fraud-score calls in a circuit breaker with a fallback so checkout degrades gracefully."] } }

[[expect.relations]]
source = { collection = "/services/gitlab/events", created = true, matching = { project = "northwind/payments/checkout-api", target_type = "Issue" } }
source_field = "/target_id"
target = { collection = "/services/gitlab/issues", created = true, key_prefix = "northwind/payments/checkout-api#" }
target_field = "/id"
kind = "foreign_key"

[[expect.relations]]
source = { collection = "/services/gitlab/notes", created = true, matching = { system = true, author = "sam.okafor" } }
source_field = "/noteable"
target = { collection = "/services/gitlab/issues", created = true, key_prefix = "northwind/payments/checkout-api#" }
kind = "key_reference"

[[expect.preservation.allow]]
pointer = "/services/gitlab/issues/*"
kind = "create"
matching = { author = "sam.okafor" }

[[expect.preservation.allow]]
pointer = "/services/gitlab/events/*"
kind = "create"
matching = { project = "northwind/payments/checkout-api", author = "sam.okafor", action_name = "opened", target_type = "Issue" }

[[expect.preservation.allow]]
pointer = "/services/gitlab/notes/*"
kind = "create"
matching = { system = true, author = "sam.okafor" }
count_scope = "per_commit"
max_count = 8

[[solution.call]]
endpoint = "gitlab"
tool = "create_issue"
arguments = { project_id = "northwind/payments/checkout-api", title = "Add circuit breaker around fraud-score service calls", description = "Follow-up from the 2026-04-01 checkout outage postmortem (#56): fraud-score latency spikes (p99 ~9s) cascaded into checkout request timeouts. Wrap fraud-score calls in a circuit breaker with a fallback so checkout degrades gracefully.", labels = ["backend", "reliability"], milestone_id = "7104", assignee_ids = [44] }
