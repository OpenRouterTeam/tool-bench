action = { selector = { collection = "/services/gitlab/merge_requests", key_prefix = "northwind/payments/ledger!", matching = { iid = 41 } }, field = "/state", equals = "merged" }

[[expect.ordering]]
prerequisite = { selector = { collection = "/services/gitlab/merge_requests", key_prefix = "northwind/payments/ledger!", matching = { iid = 41 } }, field = "/state", equals = "merged" }
action = { selector = { collection = "/services/gitlab/issues", key_prefix = "northwind/payments/ledger#", matching = { iid = 118 } }, field = "/state", equals = "closed" }
