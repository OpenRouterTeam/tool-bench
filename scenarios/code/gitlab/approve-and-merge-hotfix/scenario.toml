[scenario]
id = "code/gitlab/approve-and-merge-hotfix"
title = "Approve and merge the refund double-posting hotfix"
now = "2026-04-02T09:00:00Z"
seed = "code-gitlab-approve-and-merge-hotfix"
services = ["gitlab"]
tags = ["single-service", "write", "gitlab"]
timeout_sec = 900

[scenario.family]
schema_version = 1
primary = "entity_ambiguity"
secondary = []
dependency_depth = 2
rationale = "Ledger has !41 Fix double-posting of refunds on retry (pipeline 6110 success), !42 Fix double-posting in payouts export (pipeline 6108 failed), merged !37 chargebacks and draft !39; contract merges only !41."

[expect]
version = 2
audit_history = true

[[expect.records]]
selector = { collection = "/services/gitlab/merge_requests", key_prefix = "northwind/payments/ledger!", matching = { iid = 41, approved_by = ["sam.okafor"] } }
equals = 1
fields = { "/state" = "merged", "/target_branch" = "main", "/merged_by" = "sam.okafor" }

[[expect.records]]
selector = { collection = "/services/gitlab/commits", created = true }
min_count = 1
max_count = 2

[[expect.records]]
selector = { collection = "/services/gitlab/commits", created = true, key_prefix = "northwind/payments/ledger@", matching = { branch = "main" } }
equals = 1
fields = { "/branch" = "main", "/parent_ids/0" = "b53cc05521bb890c3b594541739cfebb76fc1117" }

[[expect.records]]
selector = { collection = "/services/gitlab/commits", created = true, key_prefix = "northwind/payments/ledger@", matching = { branch = "hotfix/double-post-refunds" } }
max_count = 1
fields = { "/parent_ids" = ["b53cc05521bb890c3b594541739cfebb76fc1117"] }

[[expect.records]]
selector = { collection = "/services/gitlab/issues", key_prefix = "northwind/payments/ledger#", matching = { iid = 118 } }
equals = 1
fields = { "/state" = "closed", "/closed_by" = "sam.okafor" }

[[expect.state]]
pointer = "/services/gitlab/branches/northwind~1payments~1ledger:hotfix~1double-post-refunds"
exists = false

[[expect.state]]
pointer = "/services/gitlab/files/northwind~1payments~1ledger:main:posting~1refunds.go/content"
equals = """
package posting

func PostRefund(tx *sql.Tx, r Refund) error {
\tif exists, err := alreadyPosted(tx, r.IdempotencyKey); err != nil || exists {
\t\treturn err
\t}
\t_, err := tx.Exec(insertRefundEntry, r.ID, r.AmountCents)
\treturn err
}
"""

[[expect.relations]]
source = { collection = "/services/gitlab/merge_requests", key_prefix = "northwind/payments/ledger!", matching = { iid = 41 } }
source_field = "/merge_commit_sha"
target = { collection = "/services/gitlab/commits", created = true, key_prefix = "northwind/payments/ledger@", matching = { branch = "main" } }
target_field = "/id"

[[expect.relations]]
source = { collection = "/services/gitlab/branches", key_prefix = "northwind/payments/ledger:", matching = { name = "main" } }
source_field = "/commit"
target = { collection = "/services/gitlab/commits", created = true, key_prefix = "northwind/payments/ledger@", matching = { branch = "main" } }
target_field = "/id"

[[expect.relations]]
source = { collection = "/services/gitlab/commits", created = true, key_prefix = "northwind/payments/ledger@", matching = { branch = "main" } }
source_field = "/parent_ids/1"
target = { collection = "/services/gitlab/commits", key_prefix = "northwind/payments/ledger@", matching = { branch = "hotfix/double-post-refunds", parent_ids = ["b53cc05521bb890c3b594541739cfebb76fc1117"] } }
target_field = "/id"
kind = "foreign_key"

[[expect.relations]]
source = { collection = "/services/gitlab/events", created = true, matching = { project = "northwind/payments/ledger", target_type = "MergeRequest" } }
source_field = "/target_id"
target = { collection = "/services/gitlab/merge_requests", key_prefix = "northwind/payments/ledger!", matching = { iid = 41 } }
target_field = "/id"
kind = "foreign_key"

[[expect.ordering]]
