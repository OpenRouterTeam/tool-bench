[scenario]
id = "code/argocd/sync-prod-payments-api"
title = "Sync the production payments-api (not its staging twin) with pruning"
now = "2026-10-29T14:15:00Z"
seed = "code-argocd-sync-prod-payments-api"
services = ["argocd"]
tags = ["single-service", "write", "argocd", "disambiguation"]
timeout_sec = 900

[scenario.family]
schema_version = 1
primary = "entity_ambiguity"
secondary = []
dependency_depth = 1
rationale = "Two apps are both named payments-api: namespace payments (prod-use1) and payments-staging (staging-use1), both OutOfSync with the legacy-webhooks ConfigMap; contract forbids sync with appNamespace payments-staging."

[expect]
version = 2
audit_history = true

[[expect.records]]
selector = { collection = "/services/argocd/applications", matching = { metadata = { name = "payments-api", namespace = "payments" } } }
equals = 1
fields = { "/status/sync/status" = "Synced", "/status/health/status" = "Healthy" }

[[expect.records]]
selector = { collection = "/services/argocd/sync_history", matching = { app = "payments/payments-api" }, latest_by = "/sequence" }
equals = 1
fields = { "/history/revision" = "fe01f33d2a5392fa17c1c35f25d294d24075c28b", "/history/source/repoURL" = "https://github.com/lumen-retail/payments-api-deploy.git", "/history/source/path" = "overlays/production" }

[[expect.records]]
selector = { collection = "/services/argocd/resources", matching = { cluster = "https://prod-use1.k8s.lumen.internal", group = "", kind = "ConfigMap", namespace = "payments", name = "payments-api-legacy-webhooks" } }
equals = 0

[[expect.relations]]
kind = "bijection"
source = { collection = "/services/argocd/resources", matching = { app = "payments/payments-api", managed = true, cluster = "https://prod-use1.k8s.lumen.internal" } }
source_field = "/resource_identity"
target = { collection = "/services/argocd/desired_resources", matching = { repoURL = "https://github.com/lumen-retail/payments-api-deploy.git", path = "overlays/production", revision = "fe01f33d2a5392fa17c1c35f25d294d24075c28b" } }
target_field = "/resource_identity"
fields = [{ source_field = "/content_digest", target_field = "/content_digest", kind = "equals" }]

[[expect.relations]]
kind = "numeric_equals"
source = { collection = "/services/argocd/resources", matching = { app = "payments/payments-api", kind = "Deployment", namespace = "payments", name = "payments-api" } }
source_field = "/manifest/metadata/generation"
target = { collection = "/services/argocd/resources", matching = { app = "payments/payments-api", kind = "Deployment", namespace = "payments", name = "payments-api" } }
target_field = "/manifest/status/observedGeneration"

[[expect.relations]]
kind = "count_equals"
source = { collection = "/services/argocd/resources", matching = { app = "payments/payments-api", kind = "Pod", namespace = "payments", deleting = false, manifest = { status = { phase = "Running", conditions = [{ type = "Ready", status = "True" }] } } }, references = [{ source_field = "/controller_uid", target_field = "/uid", target = { collection = "/services/argocd/resources", matching = { app = "payments/payments-api", kind = "ReplicaSet", namespace = "payments" }, references = [{ source_field = "/controller_uid", target_field = "/uid", target = { collection = "/services/argocd/resources", matching = { app = "payments/payments-api", kind = "Deployment", namespace = "payments", name = "payments-api" } } }, { source_field = "/template_digest", target_field = "/template_digest", target = { collection = "/services/argocd/resources", matching = { app = "payments/payments-api", kind = "Deployment", namespace = "payments", name = "payments-api" } } }] } }] }
source_field = "/uid"
target = { collection = "/services/argocd/resources", matching = { app = "payments/payments-api", kind = "Deployment", namespace = "payments", name = "payments-api" } }
target_field = "/manifest/spec/replicas"

[[expect.relations]]
kind = "foreign_key"
source = { collection = "/services/argocd/resources", matching = { app = "payments/payments-api", kind = "Pod", namespace = "payments", deleting = false, manifest = { status = { phase = "Running", conditions = [{ type = "Ready", status = "True" }] } } }, references = [{ source_field = "/controller_uid", target_field = "/uid", target = { collection = "/services/argocd/resources", matching = { app = "payments/payments-api", kind = "ReplicaSet", namespace = "payments" }, references = [{ source_field = "/controller_uid", target_field = "/uid", target = { collection = "/services/argocd/resources", matching = { app = "payments/payments-api", kind = "Deployment", namespace = "payments", name = "payments-api" } } }, { source_field = "/template_digest", target_field = "/template_digest", target = { collection = "/services/argocd/resources", matching = { app = "payments/payments-api", kind = "Deployment", namespace = "payments", name = "payments-api" } } }] } }] }
source_field = "/controller_uid"
target = { collection = "/services/argocd/resources", matching = { app = "payments/payments-api", kind = "ReplicaSet", namespace = "payments" } }
target_field = "/uid"
fields = [
  { source_field = "/manifest/spec/containers", target_field = "/manifest/spec/template/spec/containers", kind = "equals" },
  { source_field = "/manifest/spec/serviceAccountName", target_field = "/manifest/spec/template/spec/serviceAccountName", kind = "equals" },
  { source_field = "/manifest/metadata/namespace", target_field = "/manifest/metadata/namespace", kind = "equals" },
  { source_field = "/cluster", target_field = "/cluster", kind = "equals" },
]

[[expect.forbidden_calls]]
service = "argocd"
method = "POST"
path = "/api/v1/applications/payments-api/sync"
body = { appNamespace = "payments-staging" }

[[expect.forbidden_calls]]
service = "argocd"
method = "DELETE"

