[[solution.call]]
endpoint = "argocd"
tool = "get_application_resource_tree"
arguments = { applicationName = "search-indexer" }
capture = [{ name = "worker_uid", pointer = "/content/0/text", json_pointer = "/nodes", select = { matching = { kind = "Deployment", namespace = "search", name = "search-indexer-worker" }, pointer = "/uid" } }]

[[solution.call]]
endpoint = "argocd"
tool = "get_resource_actions"
template = true
arguments = { applicationName = "search-indexer", applicationNamespace = "argocd", resourceRef = { uid = "${worker_uid}", kind = "Deployment", namespace = "search", name = "search-indexer-worker", version = "v1", group = "apps" } }

[[solution.call]]
endpoint = "argocd"
tool = "run_resource_action"
template = true
arguments = { applicationName = "search-indexer", applicationNamespace = "argocd", resourceRef = { uid = "${worker_uid}", kind = "Deployment", namespace = "search", name = "search-indexer-worker", version = "v1", group = "apps" }, action = "restart" }

[[solution.call]]
endpoint = "argocd"
tool = "get_application_resource_tree"
arguments = { applicationName = "search-indexer", applicationNamespace = "argocd" }
