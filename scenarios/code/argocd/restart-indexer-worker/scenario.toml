[scenario]
id = "code/argocd/restart-indexer-worker"
title = "Restart only the production search-indexer worker Deployment through Argo CD"
now = "2026-10-29T14:05:00Z"
seed = "code-argocd-restart-indexer-worker"
services = ["argocd"]
tags = ["single-service", "write", "argocd"]
timeout_sec = 900

[expect]
version = 2
audit_history = true

[[expect.records]]
selector = { collection = "/services/argocd/resources", matching = { app = "argocd/search-indexer", group = "apps", kind = "Deployment", namespace = "search", name = "search-indexer-worker", cluster = "https://prod-use1.k8s.lumen.internal" }, field_patterns = { "/manifest/spec/template/metadata/annotations/kubectl.kubernetes.io~1restartedAt" = '^[0-9]{4}-[0-9]{2}-[0-9]{2}T[0-9]{2}:[0-9]{2}:[0-9]{2}(\.[0-9]+)?Z$' } }
equals = 1
fields = { "/health/status" = "Healthy" }
optional_choices = { "/manifest/spec/paused" = [false] }

[[expect.relations]]
kind = "numeric_equals"
source = { collection = "/services/argocd/resources", matching = { app = "argocd/search-indexer", kind = "Deployment", namespace = "search", name = "search-indexer-worker" } }
source_field = "/manifest/metadata/generation"
target = { collection = "/services/argocd/resources", matching = { app = "argocd/search-indexer", kind = "Deployment", namespace = "search", name = "search-indexer-worker" } }
target_field = "/manifest/status/observedGeneration"

[[expect.relations]]
kind = "count_equals"
source = { collection = "/services/argocd/resources", matching = { app = "argocd/search-indexer", kind = "Pod", namespace = "search", deleting = false, manifest = { status = { phase = "Running", conditions = [{ type = "Ready", status = "True" }] } } }, references = [{ source_field = "/controller_uid", target_field = "/uid", target = { collection = "/services/argocd/resources", matching = { app = "argocd/search-indexer", kind = "ReplicaSet", namespace = "search" }, references = [{ source_field = "/controller_uid", target_field = "/uid", target = { collection = "/services/argocd/resources", matching = { app = "argocd/search-indexer", kind = "Deployment", namespace = "search", name = "search-indexer-worker" } } }, { source_field = "/template_digest", target_field = "/template_digest", target = { collection = "/services/argocd/resources", matching = { app = "argocd/search-indexer", kind = "Deployment", namespace = "search", name = "search-indexer-worker" } } }] } }] }
source_field = "/uid"
target = { collection = "/services/argocd/resources", matching = { app = "argocd/search-indexer", kind = "Deployment", namespace = "search", name = "search-indexer-worker" } }
target_field = "/manifest/spec/replicas"

[[expect.relations]]
kind = "foreign_key"
source = { collection = "/services/argocd/resources", matching = { app = "argocd/search-indexer", kind = "Pod", namespace = "search", deleting = false, manifest = { status = { phase = "Running", conditions = [{ type = "Ready", status = "True" }] } } }, references = [{ source_field = "/controller_uid", target_field = "/uid", target = { collection = "/services/argocd/resources", matching = { app = "argocd/search-indexer", kind = "ReplicaSet", namespace = "search" }, references = [{ source_field = "/controller_uid", target_field = "/uid", target = { collection = "/services/argocd/resources", matching = { app = "argocd/search-indexer", kind = "Deployment", namespace = "search", name = "search-indexer-worker" } } }, { source_field = "/template_digest", target_field = "/template_digest", target = { collection = "/services/argocd/resources", matching = { app = "argocd/search-indexer", kind = "Deployment", namespace = "search", name = "search-indexer-worker" } } }] } }] }
source_field = "/controller_uid"
target = { collection = "/services/argocd/resources", matching = { app = "argocd/search-indexer", kind = "ReplicaSet", namespace = "search" } }
target_field = "/uid"
fields = [
  { source_field = "/manifest/spec/containers", target_field = "/manifest/spec/template/spec/containers", kind = "equals" },
  { source_field = "/manifest/spec/serviceAccountName", target_field = "/manifest/spec/template/spec/serviceAccountName", kind = "equals" },
  { source_field = "/manifest/metadata/namespace", target_field = "/manifest/metadata/namespace", kind = "equals" },
  { source_field = "/cluster", target_field = "/cluster", kind = "equals" },
]

[[expect.state]]
pointer = "/services/argocd/applications/argocd~1search-indexer/status/sync/status"
equals = "OutOfSync"

[[expect.required_calls]]
service = "argocd"
method = "POST"
path = "/api/v1/applications/search-indexer/resource/actions"
query_fields = { resourceName = "search-indexer-worker", namespace = "search", group = "apps", kind = "Deployment" }
body = "restart"

[[expect.forbidden_calls]]
service = "argocd"
method = "POST"
path_regex = "/sync$"

[[expect.forbidden_calls]]
service = "argocd"
method = "PUT"

[[expect.forbidden_calls]]
service = "argocd"
method = "DELETE"

