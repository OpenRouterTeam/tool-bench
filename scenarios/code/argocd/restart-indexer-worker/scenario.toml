  { pointer = "/services/argocd/resources/*/manifest/metadata/annotations/deployment.kubernetes.io~1revision", initial_matching = { app = "argocd/search-indexer", kind = "Deployment", namespace = "search", name = "search-indexer-worker" }, cause = { service = "argocd", methods = ["GET"], path_regex = "^/api/v1/applications/search-indexer(/resource-tree|/managed-resources|/resource)?$" } },
