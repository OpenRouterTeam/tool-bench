[scenario]
id = "code/argocd/roll-back-billing-worker"
title = "Roll production billing-worker back to v1.42.0 by pinning its target revision"
now = "2026-10-29T14:05:00Z"
seed = "code-argocd-roll-back-billing-worker"
services = ["argocd"]
tags = ["single-service", "write", "argocd"]
timeout_sec = 900

[scenario.family]
schema_version = 1
primary = "entity_ambiguity"
secondary = []
dependency_depth = 1
rationale = "Three apps track main: billing-worker (prod, Degraded), billing-api and billing-worker-staging; contract forbids PUT on the latter two and requires billing-worker pinned to v1.42.0 (b0826e9), not v1.41.0."

[expect]
version = 2
audit_history = true

[[expect.records]]
selector = { collection = "/services/argocd/applications", matching = { metadata = { name = "billing-worker", namespace = "argocd" }, spec = { syncPolicy = { automated = {} } } } }
equals = 1
fields = { "/spec/source/targetRevision" = "v1.42.0", "/status/sync/status" = "Synced", "/status/health/status" = "Healthy" }
optional_choices = { "/spec/syncPolicy/automated/enabled" = [true] }

[[expect.records]]
selector = { collection = "/services/argocd/sync_history", matching = { app = "argocd/billing-worker" }, latest_by = "/sequence" }
equals = 1
fields = { "/history/revision" = "b0826e986c9c73e0088c6ecb2a14458d247d2205", "/history/source/repoURL" = "https://github.com/lumen-retail/billing-worker-deploy.git", "/history/source/path" = "overlays/production", "/history/source/targetRevision" = "v1.42.0" }

[[expect.relations]]
kind = "bijection"
source = { collection = "/services/argocd/resources", matching = { app = "argocd/billing-worker", managed = true, cluster = "https://prod-use1.k8s.lumen.internal" } }
source_field = "/resource_identity"
target = { collection = "/services/argocd/desired_resources", matching = { repoURL = "https://github.com/lumen-retail/billing-worker-deploy.git", path = "overlays/production", revision = "b0826e986c9c73e0088c6ecb2a14458d247d2205" } }
target_field = "/resource_identity"
fields = [{ source_field = "/content_digest", target_field = "/content_digest", kind = "equals" }]

[[expect.relations]]
kind = "numeric_equals"
source = { collection = "/services/argocd/resources", matching = { app = "argocd/billing-worker", kind = "Deployment", namespace = "billing", name = "billing-worker" } }
source_field = "/manifest/metadata/generation"
target = { collection = "/services/argocd/resources", matching = { app = "argocd/billing-worker", kind = "Deployment", namespace = "billing", name = "billing-worker" } }
target_field = "/manifest/status/observedGeneration"

[[expect.relations]]
kind = "count_equals"
source = { collection = "/services/argocd/resources", matching = { app = "argocd/billing-worker", kind = "Pod", namespace = "billing", deleting = false, manifest = { status = { phase = "Running", conditions = [{ type = "Ready", status = "True" }] } } }, references = [{ source_field = "/controller_uid", target_field = "/uid", target = { collection = "/services/argocd/resources", matching = { app = "argocd/billing-worker", kind = "ReplicaSet", namespace = "billing" }, references = [{ source_field = "/controller_uid", target_field = "/uid", target = { collection = "/services/argocd/resources", matching = { app = "argocd/billing-worker", kind = "Deployment", namespace = "billing", name = "billing-worker" } } }, { source_field = "/template_digest", target_field = "/template_digest", target = { collection = "/services/argocd/resources", matching = { app = "argocd/billing-worker", kind = "Deployment", namespace = "billing", name = "billing-worker" } } }] } }] }
source_field = "/uid"
target = { collection = "/services/argocd/resources", matching = { app = "argocd/billing-worker", kind = "Deployment", namespace = "billing", name = "billing-worker" } }
target_field = "/manifest/spec/replicas"

[[expect.relations]]
kind = "foreign_key"
source = { collection = "/services/argocd/resources", matching = { app = "argocd/billing-worker", kind = "Pod", namespace = "billing", deleting = false, manifest = { status = { phase = "Running", conditions = [{ type = "Ready", status = "True" }] } } }, references = [{ source_field = "/controller_uid", target_field = "/uid", target = { collection = "/services/argocd/resources", matching = { app = "argocd/billing-worker", kind = "ReplicaSet", namespace = "billing" }, references = [{ source_field = "/controller_uid", target_field = "/uid", target = { collection = "/services/argocd/resources", matching = { app = "argocd/billing-worker", kind = "Deployment", namespace = "billing", name = "billing-worker" } } }, { source_field = "/template_digest", target_field = "/template_digest", target = { collection = "/services/argocd/resources", matching = { app = "argocd/billing-worker", kind = "Deployment", namespace = "billing", name = "billing-worker" } } }] } }] }
source_field = "/controller_uid"
target = { collection = "/services/argocd/resources", matching = { app = "argocd/billing-worker", kind = "ReplicaSet", namespace = "billing" } }
target_field = "/uid"
fields = [
  { source_field = "/manifest/spec/containers", target_field = "/manifest/spec/template/spec/containers", kind = "equals" },
  { source_field = "/manifest/spec/serviceAccountName", target_field = "/manifest/spec/template/spec/serviceAccountName", kind = "equals" },
  { source_field = "/manifest/metadata/namespace", target_field = "/manifest/metadata/namespace", kind = "equals" },
  { source_field = "/cluster", target_field = "/cluster", kind = "equals" },
]
[[expect.forbidden_calls]]
service = "argocd"
method = "DELETE"

[[expect.forbidden_calls]]
service = "argocd"
method = "PUT"
path_regex = "^/api/v1/applications/billing-(api|worker-staging)(/spec)?$"

