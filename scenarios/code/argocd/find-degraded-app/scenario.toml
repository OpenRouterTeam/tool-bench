[scenario]
id = "code/argocd/find-degraded-app"
title = "Find the Degraded production app in Argo CD and its root cause"
now = "2026-10-29T14:05:00Z"
seed = "code-argocd-find-degraded-app"
services = ["argocd"]
tags = ["single-service", "lookup", "argocd"]
timeout_sec = 900

[scenario.family]
schema_version = 1
primary = "entity_ambiguity"
secondary = []
dependency_depth = 3
rationale = "Two Degraded apps: checkout-web (prod-use1, image tag 2.14.0-rc3 not found) and checkout-web-staging (staging cluster, missing env var); answer must name checkout-web and 2.14.0-rc3."

# The production app is checkout-web: its new ReplicaSet cannot pull the image tag
# 2.14.0-rc3 (the tag does not exist in the registry). checkout-web-staging is also
# Degraded, but on the staging cluster and for a different reason (a missing env var).
[expect]
version = 2
audit_history = true

# The application is the one whose health is Degraded and whose env label is production.
# Its failing pod (the only pod of that application that is not Healthy) supplies the image
# tag it runs and the reason it is waiting. The failing Deployment carries the application's
# own name, so the `app` fact also names the workload.
[expect.answer.record_facts]
requirement = "Name the Argo CD application that is Degraded on production (its failing Deployment has the same name), the image tag its failing pod runs, and why that pod is not starting (the reason it is waiting, or the cause its events give for that reason)."
mode = "statements"
context = ["The old pods are still serving", "pod ${pod_name}", "Why"]
# The failing Deployment carries the application's name and cannot roll out, so these
# negatives are true of the application and do not deny it.
predicates = ["cannot roll out", "can't roll out", "could not roll out"]

[expect.answer.record_facts.selector]
collection = "/services/argocd/applications"
matching = { status = { health = { status = "Degraded" } }, metadata = { labels = { env = "production" } } }

[expect.answer.record_facts.related.pod]
collection = "/services/argocd/resources"
filter = { matching = { "/kind" = "Pod" }, excluding = [{ "/health/status" = "Healthy" }] }
on = { "/manifest/metadata/labels/app.kubernetes.io~1instance" = "/metadata/name" }

[expect.answer.record_facts.facts.app]
field = "/metadata/name"
kind = "text"

[expect.answer.record_facts.facts.image_tag]
record = "pod"
field = "/images/0"
capture = ':([^:/]+)$'
kind = "identifier"

[expect.answer.record_facts.facts.pod_name]
record = "pod"
field = "/name"
kind = "identifier"
optional = true

# The coded source value is the pod's waiting reason; the pod's own health message names
# the same condition. The wordings are bound to that code. The first group are plain
# wordings of it. The second group state its cause as this pod's events give it (the
# registry answers NotFound for the tag): the request asks for the root cause, and a reply
# that gives the cause without the Kubernetes status word has answered it. They restate the
# authored events and need a new review if those change.
[expect.answer.record_facts.facts.reason]
record = "pod"
field = "/manifest/status/containerStatuses/0/state/waiting/reason"
also = ["/health/message"]
kind = "text"

[expect.answer.record_facts.facts.reason.wordings]
ImagePullBackOff = [
  "ErrImagePull",
  "image pull back-off",
  "image pull backoff",
  "cannot pull",
  "can't pull",
  "could not pull",
  "couldn't pull",
  "unable to pull",
  "failed to pull",
  "fails to pull",
  "failing to pull",
  "cannot be pulled",
  "can't be pulled",
  "could not be pulled",
  "couldn't be pulled",

  "not found",
  "NotFound",
  "does not exist",
  "doesn't exist",
  "nonexistent",
  "non-existent",
  "no such image",
  "no such tag",
  "never pushed",
  "never published",
  "not in the registry",
  "isn't in the registry",
  "not present in the registry",
  "missing from the registry",
  "missing from ghcr",
  "missing tag",
  "missing image",
  "tag is missing",
  "image is missing",
  "registry has no",
  "registry does not have",
  "registry doesn't have",
  "cannot be found",
  "can't be found",
  "could not be found",
  "couldn't be found",
]

[[expect.forbidden_calls]]
service = "argocd"
method = "POST"

[[expect.forbidden_calls]]
service = "argocd"
method = "PUT"

[[expect.forbidden_calls]]
service = "argocd"
method = "DELETE"

[[solution.call]]
endpoint = "argocd"
tool = "list_applications"
arguments = {}

[[solution.call]]
endpoint = "argocd"
tool = "get_application_resource_tree"
arguments = { applicationName = "checkout-web" }

[[solution.call]]
endpoint = "argocd"
tool = "get_resource_events"
arguments = { applicationName = "checkout-web", applicationNamespace = "argocd", resourceUID = "0d3df349-e40e-5789-bc1f-b9740a79c8a0", resourceNamespace = "storefront", resourceName = "checkout-web-7f8b9c6d5-q2x7m" }

[solution]
answer = """
Application: checkout-web. Tag: 2.14.0-rc3. Root cause: ImagePullBackOff - the image tag 2.14.0-rc3 was never pushed.
"""
