# Validation evidence for scored scenarios in the `collab` group.
#
# Each entry names tests that exercise the scenario's contract with an independently
# authored valid alternative plan and with deliberately wrong near-miss executions.
# `taskgen` verifies that every file and test function exists and that the file names the
# scenario; it cannot verify what a test means. Scenarios without a valid alternative and at
# least one near-miss keep the `validation_evidence_missing` inventory gap.
# See docs/authoring-admission.md.
schema_version = 1

[[scenario]]
id = "collab/google/mark-northwind-renewed"
valid_alternative = [
  "crates/world/tests/google_write_contracts.rs::a_preserved_full_target_row_rewrite_is_a_legitimate_plan",
  "crates/world/tests/google_write_contracts.rs::separate_precise_cell_updates_are_equivalent",
]

[scenario.near_miss]
collateral_change = [
  "crates/world/tests/google_write_contracts.rs::archive_tab_changes_are_not_authorized",
]
undone_prohibited_change = [
  "crates/world/tests/google_write_contracts.rs::an_incorrect_date_claim_is_not_erased_by_restoration",
]

