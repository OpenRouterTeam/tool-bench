# tool-bench service catalog: the single source of truth for every service.
#
# [[service]]
#   name        mock API / dataset name (crates/services/<name>)
#   group       search | code | ops | cloud | business | collab
#   mode        real      vendor/community server pointed at the world by an env/flag
#               real-tls  same, but the client only talks HTTPS to a fixed hostname
#                         (world serves those hostnames on 443 with its local CA)
#               replica   our replica-mcp serving a captured tool list verbatim
#   world_port  plain-HTTP port of the mock API inside the world container
#   hosts       hostnames the world answers on 443 for this service
#
# [[service.endpoint]]  one MCP server URL given to the agent (http://tools:<mcp_port>/mcp)
#   id          MCP server name the agent sees (Claude Code shows tools as mcp__<id>__<tool>)
#   runtime     npm | pypi | go | cargo | git-npm | git-pypi | replica
#   package / version   exact pin
#   command / args / env  stdio launch inside the tools container
#   snapshot    (replica) captured tool list served verbatim
#   source      (replica) where the captured tool list came from
#
# Placeholders in args/env: {world} = http://world:<world_port>, {world_host} = world:<world_port>,
# {config} = /etc/tool-bench/<service name>.
# Every toolset/feature flag is switched on; options that change the tool list at runtime or
# add non-determinism are pinned off (spec section 4).

# ───────────────────────────── Search & web ─────────────────────────────

[[service]]
name = "firecrawl"
group = "search"
mode = "real-tls"
world_port = 8102
hosts = ["api.firecrawl.dev"]
[[service.endpoint]]
id = "firecrawl"
mcp_port = 7102
runtime = "npm"
package = "firecrawl-mcp"
version = "3.36.0"
command = "firecrawl-mcp"
env = { FIRECRAWL_API_URL = "https://api.firecrawl.dev", FIRECRAWL_API_KEY = "fc-30e8b44f6fa34fb3ac6938ac749c2e58" }
synthetic_replay_headers = { authorization = ["Bearer {env.FIRECRAWL_API_KEY}"] }

[[service]]
name = "brave"
group = "search"
mode = "real-tls"
world_port = 8103
hosts = ["api.search.brave.com"]
[[service.endpoint]]
id = "brave-search"
mcp_port = 7103
runtime = "npm"
package = "@brave/brave-search-mcp-server"
version = "2.1.4"
command = "brave-search-mcp-server"
args = ["--transport", "stdio"]
env = { BRAVE_API_KEY = "BSA-toolbench", BRAVE_MCP_TRANSPORT = "stdio" }
synthetic_replay_headers = { x-subscription-token = ["{env.BRAVE_API_KEY}"] }

[[service]]
name = "exa"
group = "search"
# exa-mcp-server 3.4.2 bundles exa-js with the base URL fixed to https://api.exa.ai and
# never reads EXA_API_BASE_URL, so the world serves that hostname over TLS.
mode = "real-tls"
world_port = 8104
hosts = ["api.exa.ai"]
[[service.endpoint]]
id = "exa"
mcp_port = 7104
runtime = "npm"
package = "exa-mcp-server"
version = "3.4.2"
command = "exa-mcp-server"
env = { EXA_API_KEY = "exa-toolbench", EXA_API_BASE_URL = "{world}", ENABLED_TOOLS = "web_search_exa,web_search_advanced_exa,web_fetch_exa,crawling_exa,deep_search_exa,deep_researcher_start,deep_researcher_check,get_code_context_exa,company_research_exa,linkedin_search_exa,people_search_exa,agent_run" }
synthetic_replay_headers = { x-api-key = ["{env.EXA_API_KEY}"], authorization = ["Bearer {env.EXA_API_KEY}"] }

