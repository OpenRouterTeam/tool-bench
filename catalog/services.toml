name = "tavily"
group = "search"
mode = "real-tls"
world_port = 8105
hosts = ["api.tavily.com"]
[[service.endpoint]]
id = "tavily"
mcp_port = 7105
runtime = "npm"
package = "tavily-mcp"
version = "0.2.22"
command = "tavily-mcp"
env = { TAVILY_API_KEY = "tvly-toolbench" }
synthetic_replay_headers = { authorization = ["Bearer {env.TAVILY_API_KEY}"] }

[[service]]
name = "elasticsearch"
group = "search"
mode = "real"
world_port = 8106
hosts = []
[[service.endpoint]]
id = "elasticsearch"
mcp_port = 7106
runtime = "cargo"
package = "https://github.com/elastic/mcp-server-elasticsearch"
version = "v0.4.6"
command = "elasticsearch-core-mcp-server"
args = ["stdio"]
# rmcp lists tools in HashMap order, which changes between runs.
